  --rose:#C2747A;--roseDk:#9E5A60;--roseL:#F5E8EA;--roseMid:#E8C4C8;
  --gold:#C4A46B;--goldL:#F9F0E0;--goldDk:#8C6B3A;
  --grn:#5A8C6B;--grnL:#E8F5ED;--red:#C25A5A;--redL:#FAEAEA;
  --blu:#5A7AC2;--bluL:#E8EEFA;--pur:#8C5AC2;--purL:#F0E8FA;
  --brown:#6B4C3A;--txt:#2D1F1A;--mut:#7E6860;--bdr:#EAE0D8;
  --bg:#FDFAF8;--bg2:#F7F0EC;--bg3:#F0E8E2;--card:#FFFFFF;
  --shadow:0 2px 16px rgba(180,100,100,0.08);
  --shadow2:0 4px 32px rgba(180,100,100,0.14);
}
*{box-sizing:border-box;margin:0;padding:0;letter-spacing:0.04em;}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--txt);font-size:17px;min-height:100vh;line-height:1.65;}
h1,h2,h3{font-family:'Noto Serif TC',serif;letter-spacing:0.08em;}

/* ── LAYOUT ── */
.app{display:flex;min-height:100vh;}
.sidebar{width:220px;background:linear-gradient(180deg,var(--roseDk) 0%,var(--brown) 100%);padding:14px 0;flex-shrink:0;position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:100;}
.sb-item{display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer;transition:.2s;color:rgba(255,255,255,0.78);font-size:16px;border-left:4px solid transparent;letter-spacing:0.06em;}
.sb-item:hover{background:rgba(255,255,255,0.1);color:#fff;}
.sb-item.active{background:rgba(255,255,255,0.18);color:#fff;border-left-color:var(--gold);font-weight:700;}
.sb-item .ico{font-size:20px;width:26px;text-align:center;}

.main{margin-left:220px;flex:1;display:flex;flex-direction:column;}
/* 客戶簽名沉浸式模式：隱藏側邊欄、頂部欄，全螢幕展示 */
.app.customer-mode{background:linear-gradient(135deg,#fff5e6 0%,#fef3f4 100%);min-height:100vh;}
.main-full{margin-left:0;}
.content-customer{max-width:900px;margin:0 auto;padding:24px 20px;}
.topbar{background:var(--card);border-bottom:1px solid var(--bdr);padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:var(--shadow);}
.tb-ttl{font-family:'Noto Serif TC',serif;font-size:18px;font-weight:700;color:var(--roseDk);letter-spacing:0.08em;}
.tb-right{display:flex;align-items:center;gap:12px;}
.sync-dot{width:10px;height:10px;border-radius:50%;background:var(--grn);}
.sync-dot.syncing{background:var(--gold);animation:pulse 1s infinite;}
.sync-dot.error{background:var(--red);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.btn-out{background:none;border:1.5px solid var(--bdr);border-radius:8px;padding:7px 14px;font-size:14px;cursor:pointer;color:var(--mut);transition:.2s;letter-spacing:0.06em;}
.btn-out:hover{border-color:var(--rose);color:var(--roseDk);}

.content{padding:28px;flex:1;}
.pg-ttl{font-family:'Noto Serif TC',serif;font-size:28px;font-weight:900;color:var(--roseDk);margin-bottom:6px;letter-spacing:0.1em;}
.pg-sub{font-size:14px;color:var(--mut);margin-bottom:24px;letter-spacing:0.08em;}

/* ── CARDS ── */
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden;}
.card-hd{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--bdr);gap:12px;flex-wrap:wrap;}
.card-ttl{font-family:'Noto Serif TC',serif;font-size:17px;font-weight:700;color:var(--brown);letter-spacing:0.08em;}
.card-bd{padding:18px 20px;}

/* ── STAT GRID ── */
.sg{display:grid;gap:14px;margin-bottom:18px;}
.sg2{grid-template-columns:repeat(2,1fr);}
.sg3{grid-template-columns:repeat(3,1fr);}
.sg4{grid-template-columns:repeat(4,1fr);}
.sc{background:var(--card);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);border-top:3px solid var(--bdr);}
.sc.rose{border-top-color:var(--rose);}
.sc.grn{border-top-color:var(--grn);}
.sc.red{border-top-color:var(--red);}
.sc.gold{border-top-color:var(--gold);}
.sc.blu{border-top-color:var(--blu);}
.sc.pur{border-top-color:var(--pur);}
.sl{font-size:14px;color:var(--mut);margin-bottom:8px;font-weight:500;letter-spacing:0.06em;}
.sv{font-family:'Noto Serif TC',serif;font-size:26px;font-weight:700;color:var(--txt);letter-spacing:0.04em;}
.sv.sm{font-size:21px;}
.sv.rose{color:var(--rose);}
.sv.grn{color:var(--grn);}
.sv.red{color:var(--red);}
.sv.gold{color:var(--gold);}
.sv.blu{color:var(--blu);}
.ss{font-size:13px;color:var(--mut);margin-top:5px;letter-spacing:0.04em;}

/* ── TABLES ── */
.tw{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:15px;}
th{background:var(--bg2);padding:12px 14px;text-align:left;font-size:13px;font-weight:700;color:var(--mut);border-bottom:1px solid var(--bdr);white-space:nowrap;letter-spacing:0.08em;}
td{padding:13px 14px;border-bottom:1px solid var(--bdr);vertical-align:middle;letter-spacing:0.04em;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--bg);}

/* ── BADGES ── */

.bdg.rose{background:var(--roseL);color:var(--roseDk);}
.bdg.grn{background:var(--grnL);color:var(--grn);}
.bdg.red{background:var(--redL);color:var(--red);}
.bdg.gold{background:var(--goldL);color:var(--goldDk);}
.bdg.blu{background:var(--bluL);color:var(--blu);}
.bdg.pur{background:var(--purL);color:var(--pur);}
.pill{display:inline-block;padding:3px 12px;border-radius:20px;font-size:13px;font-weight:700;letter-spacing:0.06em;}
.pill.grn{background:var(--grnL);color:var(--grn);}
.pill.red{background:var(--redL);color:var(--red);}
.pill.gold{background:var(--goldL);color:var(--goldDk);}

.btn-g{background:linear-gradient(135deg,var(--grn),#3a6b4c);color:#fff;}
.btn-y{background:linear-gradient(135deg,var(--gold),var(--goldDk));color:#fff;}

.mo-btn.active{background:var(--rose);border-color:var(--rose);color:#fff;font-weight:700;}
.tab-bar{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.tab-p{padding:9px 18px;border-radius:20px;border:1.5px solid var(--bdr);background:var(--card);font-size:14px;cursor:pointer;transition:.2s;color:var(--mut);font-weight:500;letter-spacing:0.06em;}
.tab-p.active{background:var(--rose);border-color:var(--rose);color:#fff;font-weight:700;}
.empty{text-align:center;padding:44px 20px;color:var(--mut);}
.empty-ico{font-size:44px;margin-bottom:14px;}
.tag{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:700;letter-spacing:0.04em;}
.tag-low{background:var(--redL);color:var(--red);}
.tag-ok{background:var(--grnL);color:var(--grn);}
.tag-warn{background:var(--goldL);color:var(--goldDk);}
.run-bal{font-weight:700;font-size:14px;}
.notice{background:var(--roseL);border-left:4px solid var(--rose);border-radius:8px;padding:12px 16px;font-size:14px;color:var(--roseDk);margin-bottom:18px;letter-spacing:0.04em;}
.batch-row{display:grid;grid-template-columns:1.4fr 0.8fr 0.8fr 1fr 1fr 0.4fr;gap:8px;align-items:end;padding:10px;border:1px solid var(--bdr);border-radius:10px;margin-bottom:8px;background:var(--bg);}
.batch-row .fgrp{gap:3px;}
.batch-row .fgrp label{font-size:12px;}
.batch-row .fgrp input,.batch-row .fgrp select{padding:8px 10px;font-size:14px;}
.bdel-row{background:var(--redL);color:var(--red);border:none;border-radius:8px;width:36px;height:36px;font-size:18px;cursor:pointer;align-self:end;}
.bdel-row:hover{background:var(--red);color:#fff;}

// 日期往後推 N 個月（自動處理月底，如 1/31 + 1月 = 2/28）
function addMonthsToDate(dateStr, months){
  const d = dateStr ? new Date(dateStr) : new Date();
  const targetMonth = d.getMonth() + months;
  const result = new Date(d.getFullYear(), targetMonth, d.getDate());
  // 若跨月造成日期溢位（如 1/31→3/3），回退到當月最後一天
  if(result.getMonth() !== ((targetMonth % 12) + 12) % 12){
    result.setDate(0);
  }
  const y = result.getFullYear();
  const m = String(result.getMonth()+1).padStart(2,'0');
  const dd = String(result.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}

// 將紀錄的健康勾選整理成項目清單（新版 healthFlags/healthChecked；無則回傳空陣列）
function pmuHealthItemsOf(r){
  if(!r)return [];
  if(r.healthChecked&&r.healthChecked.length)return r.healthChecked;
  var flags=r.healthFlags||[];
  return flags.map(function(id){var it=PMU_HEALTH_ITEMS.find(function(x){return x.id===id;});return it?{cat:it.cat,label:it.label,reason:it.reason}:{cat:'',label:id,reason:''};});
}
function pmuHasNewHealth(r){return !!(r&&((r.healthFlags&&r.healthFlags.length)||(r.healthChecked&&r.healthChecked.length)||r.healthNote||r.healthDeclare));}
// 身體狀況摘要（HTML，給紀錄檢視）
function pmuHealthSummaryHtml(r){
  if(pmuHasNewHealth(r)){
    var items=pmuHealthItemsOf(r),out='';
    ['red','yellow','allergy','recent'].forEach(function(ck){
      var sub=items.filter(function(x){return x.cat===ck;});if(sub.length===0)return;
      var cat=PMU_HEALTH_CATS[ck]||{t:ck,c:'#555'};
      out+='<div style="margin-top:6px;"><span style="color:'+cat.c+';font-weight:700;">'+cat.t+'</span><br>';
      sub.forEach(function(x){out+='・'+x.label+(x.reason?'<span style="color:#999;font-size:12px;">（'+x.reason+'）</span>':'')+'<br>';});
      out+='</div>';
    });
    var other=items.filter(function(x){return ['red','yellow','allergy','recent'].indexOf(x.cat)<0;});
    other.forEach(function(x){out+='・'+x.label+'<br>';});
    if(items.length===0)out='（未勾選任何狀況）<br>';
    if(r.healthNote)out+='<div style="margin-top:4px;">其他補充：'+r.healthNote+'</div>';
    out+='<div style="margin-top:4px;color:'+(r.healthDeclare?'#16a34a':'#dc2626')+';font-size:12px;">'+(r.healthDeclare?'✓ 已簽真實聲明':'✗ 未簽真實聲明')+'</div>';
    return out;
  }
  var condStr=((r&&r.conditions)||[]).length>0?(r.conditions.join('、')+(r.conditionNote?'；'+r.conditionNote:'')):'無';
  var allergyStr=((r&&r.allergies)||[]).length>0?(r.allergies.join('、')+(r.allergyNote?'；'+r.allergyNote:'')):'無';
  return '痼疾：'+condStr+'<br>過敏：'+allergyStr;
}
// 身體狀況摘要（純文字，給同意書下載）
function pmuHealthSummaryText(r){
  if(pmuHasNewHealth(r)){
    var items=pmuHealthItemsOf(r),lines=[];
    ['red','yellow','allergy','recent'].forEach(function(ck){
      var sub=items.filter(function(x){return x.cat===ck;});if(sub.length===0)return;
      var cat=PMU_HEALTH_CATS[ck]||{t:ck};
      lines.push('【'+cat.t+'】');
      sub.forEach(function(x){lines.push('・'+x.label+(x.reason?'（'+x.reason+'）':''));});
    });
    var other=items.filter(function(x){return ['red','yellow','allergy','recent'].indexOf(x.cat)<0;});
    other.forEach(function(x){lines.push('・'+x.label);});
    if(items.length===0)lines.push('（未勾選任何狀況）');
    if(r.healthNote)lines.push('其他補充：'+r.healthNote);
    lines.push(r.healthDeclare?'✓ 已簽署真實聲明':'✗ 未簽署真實聲明');
    return lines.join('\n');
  }
  var condStr=((r&&r.conditions)||[]).length>0?(r.conditions.join('、')+(r.conditionNote?'；'+r.conditionNote:'')):'無';
  var allergyStr=((r&&r.allergies)||[]).length>0?(r.allergies.join('、')+(r.allergyNote?'；'+r.allergyNote:'')):'無';
  return '痼疾：'+condStr+'\n過敏：'+allergyStr;

let _syncStarted=false;
let _unsubList=[];
function startSync(){
  // 防止重複註冊監聽器（重複註冊會導致同一筆資料顯示成多筆）
  if(_syncStarted){return;}
  _syncStarted=true;
  setSyncing('syncing');
  const mainRef=doc(db,'studios',FID);
  const unsubMain=onSnapshot(mainRef,async snap=>{
    const d=snap.data()||{};
    S.data.services=d.services||[];
    S.data.products=d.products||[];
    S.data.suppliers=d.suppliers||[];
    S.data.staff=d.staff||[];
    S.data.inventory=d.inventory||[];
    S.data.settings=d.settings||{};
    S.data.assets=d.assets||[];
    S.data.equipment=d.equipment||[];  // 設備（每月折舊）
    S.data.serviceCosts=d.serviceCosts||[];
    S.data.trialPacks=d.trialPacks||[];
    S.data.passContracts=d.passContracts||[];
    S.data.pmuRecords=d.pmuRecords||[];
    S.data.pmuDrafts=d.pmuDrafts||[];
    S.data.studyNotes=d.studyNotes||[];
    S.data.noteFolders=d.noteFolders||[];
    S.data.mindNotes=d.mindNotes||[];
    S.data.skinSolutions=d.skinSolutions||[];
    S.data.treatmentRecords=d.treatmentRecords||[];  // 療程紀錄
    S.data.allocation=d.allocation||{risk:15,operation:20,study:15,invest:35,bonus:15,bigPurchaseLimit:30000,monthlyHouseFund:0};
    // 客戶資料：合併主文件和子集合（向下相容）
    if(Array.isArray(d.customers)&&d.customers.length>0){
      // 主文件有 customers → 以主文件為主
      S.data.customers=d.customers;
    }
    // 首次登入時，自動建立預設資料
    if(!d.initialized){
      await initDefaults();
    }
    hydrateMainImages();
    setSyncing('synced');render();
    setTimeout(migrateMainImages,3000);
  },()=>setSyncing('error'));
  _unsubList.push(unsubMain);

  ['sales','expenses','purchases','courses','courseStudents','cashFlow','houseFund','quarterReviews','coolingDecisions','advisorChats','deposits','stockOuts','learnGoals','appointments','pmuPhotos','pmuCases','actionItems'].forEach(col=>{
    const unsub=onSnapshot(collection(db,'studios',FID,col),snap=>{
      S.data[col]=snap.docs.map(d=>({id:d.id,...d.data()}));
      render();
    });
    _unsubList.push(unsub);
  });
  // 簽名／大圖的獨立空間：載入後把主資料裡的編號接回圖片
  const unsubSigs=onSnapshot(collection(db,'studios',FID,'sigs'),snap=>{
    snap.docs.forEach(d=>{const x=d.data();if(x&&x.img)_imgMap[d.id]=x.img;});
    _sigsLoaded=true;
    hydrateMainImages();render();
    setTimeout(migrateMainImages,3000);
  });
  _unsubList.push(unsubSigs);
}

// 停止同步（登出時用，清掉所有監聽器）
function stopSync(){
  _unsubList.forEach(unsub=>{try{unsub();}catch(e){}});
  _unsubList=[];
  _syncStarted=false;
}

// ═══ 圖片搬家：簽名等大圖不放主文件（主文件上限 1MB），改存 sigs 子集合，主文件只留「sig:編號」═══
const _imgMap={};          // 編號 → 圖片
let _sigsLoaded=false,_imgMigrated=false;
function imgHash(s){let h1=0x811c9dc5,h2=0x01000193;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,16777619)>>>0;h2=Math.imul(h2^c,2246822519)>>>0;}return h1.toString(36)+h2.toString(36)+s.length.toString(36);}
function isBigImg(v){return typeof v==='string'&&v.length>4000&&v.slice(0,11)==='data:image/';}
// 存檔前：把大圖搬到子集合，回傳替換後的資料
async function offloadImages(v){
  if(isBigImg(v)){
    const id='img_'+imgHash(v);
    if(!_imgMap[id]){
      try{await setDoc(doc(db,'studios',FID,'sigs',id),{img:v,_at:Date.now()});_imgMap[id]=v;}
      catch(e){console.error('圖片搬家失敗，先保留原圖',e);return v;}
    }
    return 'sig:'+id;
  }
  if(Array.isArray(v)){const out=[];for(const x of v)out.push(await offloadImages(x));return out;}
  if(v&&typeof v==='object'){const o={};for(const k of Object.keys(v))o[k]=await offloadImages(v[k]);return o;}
  return v;
}
// 讀取後：把「sig:編號」接回圖片（畫面與下載都照常用）
function hydrateImages(v){
  if(typeof v==='string'&&v.slice(0,8)==='sig:img_'){const im=_imgMap[v.slice(4)];return im||v;}
  if(Array.isArray(v)){for(let i=0;i<v.length;i++)v[i]=hydrateImages(v[i]);return v;}
  if(v&&typeof v==='object'){for(const k of Object.keys(v))v[k]=hydrateImages(v[k]);return v;}
  return v;
}
const IMG_MAIN_KEYS=['pmuRecords','pmuDrafts','customers','passContracts','treatmentRecords','settings','studyNotes','mindNotes','skinSolutions','equipment','trialPacks'];
function hydrateMainImages(){IMG_MAIN_KEYS.forEach(k=>{if(S.data[k])hydrateImages(S.data[k]);});}
// 一次性：把舊資料裡的大圖搬出主文件
async function migrateMainImages(){
  if(_imgMigrated||!_sigsLoaded||!S.auth)return;
  _imgMigrated=true;
  const upd={};let n=0;
  IMG_MAIN_KEYS.forEach(k=>{const v=S.data[k];if(v&&JSON.stringify(v).indexOf('data:image/')>=0){const cnt=(JSON.stringify(v).match(/data:image\//g)||[]).length;if(cnt){upd[k]=v;n+=cnt;}}});
  if(!n)return;
  const before=mainDocSize();
  const ok=await saveMainSilent(upd);
  if(ok){setTimeout(()=>{const after=mainDocSize();console.log('圖片搬家完成',before,'→',after);},1500);toast('🧹 已把 '+n+' 張簽名／圖片搬到獨立空間，主資料更輕了');}
  else _imgMigrated=false;
}

// Firebase 不接受 undefined：存檔前遞迴清掉（物件欄位刪除、陣列元素改 null）
function fsClean(v){
  if(v===undefined)return undefined;
  if(v===null||typeof v!=='object')return (typeof v==='number'&&!isFinite(v))?0:v;
  if(Array.isArray(v))return v.map(function(x){var c=fsClean(x);return c===undefined?null:c;});
  var o={};Object.keys(v).forEach(function(k){var c=fsClean(v[k]);if(c!==undefined)o[k]=c;});return o;
}
async function saveMain(data){data=await offloadImages(fsClean(data));setSyncing('syncing');try{await setDoc(doc(db,'studios',FID),data,{merge:true});setSyncing('synced');return true;}catch(e){console.error(e);setSyncing('error');toast('儲存失敗：'+(e.message||e));return false;}}
// 靜默版：自動存檔用，失敗不跳訊息（避免每次下一步都打擾使用者）
async function saveMainSilent(data){data=await offloadImages(fsClean(data));try{await setDoc(doc(db,'studios',FID),data,{merge:true});return true;}catch(e){return false;}}
async function addSub(col,data){
  // 不在這裡 push 本地，因為 onSnapshot 的 pendingWrites 已經會更新 S.data[col]
  setSyncing('syncing');
  try{
    const r=await addDoc(collection(db,'studios',FID,col),fsClean({...data,_at:Date.now()}));
    setSyncing('synced');
    return r;
  }catch(e){console.error(e);setSyncing('error');toast('儲存失敗');}
}
async function setSub(col,id,data){
  if(!id){console.error('setSub 缺少 id，取消寫入避免產生重複',col,data);toast('更新失敗：缺少識別碼');return;}
  setSyncing('syncing');
  try{
    // 移除 data 裡的 id 欄位（避免混淆），一律用參數 id 當文件路徑
    const {id:_omit,...clean}=data;
    await setDoc(doc(db,'studios',FID,col,id),fsClean({...clean,_at:Date.now()}));
    // 立即本地更新（避免 onSnapshot 延遲）
    if(!S.data[col])S.data[col]=[];
    const idx=S.data[col].findIndex(x=>x.id===id);
    if(idx>=0){S.data[col][idx]={...clean,id,_at:Date.now()};}
    else{S.data[col].push({...clean,id,_at:Date.now()});}
    setSyncing('synced');
  }catch(e){console.error(e);setSyncing('error');toast('儲存失敗');}
}
async function delSub(col,id){
  setSyncing('syncing');
  try{
    await deleteDoc(doc(db,'studios',FID,col,id));
    // 立即本地移除
    if(S.data[col])S.data[col]=S.data[col].filter(x=>x.id!==id);
    setSyncing('synced');
  }catch(e){console.error(e);setSyncing('error');toast('刪除失敗');}
}

// ── DATA HELPERS ───────────────────────────────────────────
function getSales(mo){const m=mo||S.month;return S.data.sales.filter(s=>s.month===m&&s.year===yr());}
function getExp(mo){const m=mo||S.month;return S.data.expenses.filter(e=>e.month===m&&e.year===yr());}
function getInv(pid){return S.data.inventory.find(i=>i.productId===pid)||{qty:0,minQty:5};}

// ── 加權平均成本（每次進貨自動更新）──
// 取得產品當前的加權平均成本（從 inventory.avgCost 讀，沒有就從 product.cost）
function getAvgCost(pid){
  const inv=getInv(pid);
  if(inv.avgCost!==undefined&&toN(inv.avgCost)>0)return toN(inv.avgCost);
  const p=(S.data.products||[]).find(x=>x.id===pid);
  return toN(p?.cost)||0;
}

// 進貨時更新加權平均成本
// newAvgCost = (現有量 × 現有平均成本 + 新進貨量 × 新單價) ÷ 總量
function calculateNewAvgCost(currentQty,currentAvg,addQty,addUnitCost){
  const cq=toN(currentQty),ca=toN(currentAvg),aq=toN(addQty),au=toN(addUnitCost);
  if(cq+aq===0)return au;
  return Math.round((cq*ca+aq*au)*100)/100;  // 保留 2 位小數
}

// 計算當期出貨成本（用平均成本）
function getStockOutCost(pid,qty){
  return Math.round(getAvgCost(pid)*toN(qty));
}

// 計算產品的有效庫存（進貨總量 - 出貨總量）
function getEffectiveQty(pid){
  const inv=getInv(pid);
  return toN(inv.qty);  // 實際以 inventory.qty 為準
}
function getSvcTotal(mo){return getSales(mo).filter(s=>s.type==='service').reduce((s,r)=>s+toN(r.amount),0);}
function getPrdTotal(mo){return getSales(mo).filter(s=>s.type==='product').reduce((s,r)=>s+toN(r.amount),0);}
function getCrsTotal(mo){return getSales(mo).filter(s=>s.type==='course').reduce((s,r)=>s+toN(r.amount),0);}
function getExpTotal(mo){return getExp(mo).reduce((s,e)=>s+toN(e.amount),0);}
function getRevTotal(mo){return getSales(mo).reduce((s,r)=>s+toN(r.amount),0);}

// ── 真實財務分析（含老師抽成、公司吸收的折讓）──
// 取得單筆銷售的真實財務指標
function getSaleFinancials(s){
  if(!s)return{realRevenue:0,faceAmount:0,commission:0,absorbed:0,companyNet:0};
  const realRevenue=toN(s.amount);  // 實際認列營收（已折扣後）
  // 抽成基準金額：優先用 depositFaceAmount（儲值扣款的原價面額）→ amount（實收）
  const faceAmount=toN(s.depositFaceAmount)||realRevenue;
  // 老師抽成率：每筆可自訂（commissionRate），否則用預設
  const rate=s.commissionRate!==undefined?toN(s.commissionRate):DEFAULT_COMMISSION_RATE;
  // 抽成基準：commissionBase 可指定 'face'（原價面額）或 'real'（實收）
  const base=s.commissionBase==='real'?realRevenue:faceAmount;
  const commission=Math.round(base*rate);
  // 公司吸收的折讓 = 原價面額 - 實際認列營收（如果有儲值折扣）
  const absorbed=Math.max(0,faceAmount-realRevenue);
  // 公司淨收（不含產品成本）= 實際營收 - 老師抽成
  const companyNet=realRevenue-commission;
  return{realRevenue,faceAmount,commission,absorbed,companyNet,rate,base};
}

// 月份的真實財務總計
function getMonthFinancials(mo){
  const sales=getSales(mo);
  let totalRev=0,totalFace=0,totalCommission=0,totalAbsorbed=0,totalCompanyNet=0;
  sales.forEach(s=>{
    const f=getSaleFinancials(s);
    totalRev+=f.realRevenue;
    totalFace+=f.faceAmount;
    totalCommission+=f.commission;
    totalAbsorbed+=f.absorbed;
    totalCompanyNet+=f.companyNet;
  });
  return{totalRev,totalFace,totalCommission,totalAbsorbed,totalCompanyNet,saleCount:sales.length};
}

// ── 客戶儲值相關計算 ──
// 客戶當前儲值餘額 = 累計儲值 - 累計儲值扣款消費
// ─── 客戶儲值與共用 ────────────────────────────────────
// 取得所有客戶名稱（含正式建檔 + 從銷售/儲值紀錄推出的 ghost 客戶）
function getAllCustomerNames(){
  const names=new Set();
  (S.data.customers||[]).forEach(c=>{if(c.name)names.add(c.name);});
  (S.data.sales||[]).forEach(s=>{if(s.customer)names.add(s.customer);});
  (S.data.deposits||[]).forEach(d=>{if(d.customer)names.add(d.customer);});
  return Array.from(names).sort();
}

// 取得某客戶的儲值池餘額（用「面額」計算）
// 入帳：deposits 的 amount（=面額/可消費額度）
// 扣款：sales 的 depositFaceAmount（儲值池實際扣的面額），fallback 用 amount（舊資料相容）
function getCustomerBalance(custName){
  if(!custName)return 0;
  const target=(custName||'').trim();
  const deposits=(S.data.deposits||[]).filter(d=>(d.customer||'').trim()===target).reduce((s,d)=>s+toN(d.amount),0);
  const usedDeposits=(S.data.sales||[]).filter(s=>{
    if(s.payMethod!=='儲值扣款')return false;
    const owner=((s.depositOwner||s.customer)||'').trim();
    return owner===target;
  }).reduce((s,r)=>s+toN(r.depositFaceAmount||r.amount),0);
  return deposits-usedDeposits;
}

// 🎯 取得客戶各筆儲值的明細與餘額（區分限定 vs 通用）
// 回傳：[{depositId, amount, used, balance, scope, allowedServices, monthlyLimit, ...}]
function getCustomerDepositDetails(custName){
  if(!custName)return[];
  const target=(custName||'').trim();
  // 取該客戶所有儲值，按日期排序（先進先出 FIFO）
  const deposits=(S.data.deposits||[])
    .filter(d=>(d.customer||'').trim()===target)
    .sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  // 取所有扣款（用 depositRefId 精確匹配；沒有的話按 FIFO 從通用儲值扣）
  const sales=(S.data.sales||[]).filter(s=>{
    if(s.payMethod!=='儲值扣款')return false;
    const owner=((s.depositOwner||s.customer)||'').trim();
    return owner===target;
  });
  // 用 FIFO 分配扣款到儲值（限定的優先扣自己服務的、通用的隨便扣）
  const result=deposits.map(d=>({
    depositId:d.id,date:d.date,
    amount:toN(d.amount),
    actualReceived:toN(d.actualReceived),
    used:0,
    scope:d.scope||'general',
    allowedServices:d.allowedServices||[],
    monthlyLimit:toN(d.monthlyLimit)||0,
    discountRate:toN(d.discountRate)||1,
    note:d.note||''
  }));
  // 對每筆銷售扣款，按 FIFO 從相符的儲值扣
  for(const s of sales){
    let need=toN(s.depositFaceAmount||s.amount);
    const itemName=(s.item||s.serviceName||'').trim();
    // 優先扣「指定到此筆銷售」的儲值（如果有 depositRefId）
    if(s.depositRefId){
      const r=result.find(x=>x.depositId===s.depositRefId);
      if(r){
        const ded=Math.min(need,r.amount-r.used);
        r.used+=ded;need-=ded;
      }
    }
    if(need<=0)continue;
    // 先扣限定服務的儲值（如果這筆銷售符合限定）
    for(const r of result){
      if(need<=0)break;
      if(r.scope!=='restricted')continue;
      const matchService=r.allowedServices.some(svc=>itemName.includes(svc)||svc.includes(itemName));
      if(!matchService)continue;
      const avail=r.amount-r.used;
      if(avail<=0)continue;
      const ded=Math.min(need,avail);
      r.used+=ded;need-=ded;
    }
    // 剩下的從通用儲值扣
    for(const r of result){
      if(need<=0)break;
      if(r.scope==='restricted')continue;
      const avail=r.amount-r.used;
      if(avail<=0)continue;
      const ded=Math.min(need,avail);
      r.used+=ded;need-=ded;
    }
  }
  // 計算餘額
  result.forEach(r=>{r.balance=r.amount-r.used;});
  return result;
}

// 🎯 檢查指定服務名稱是否可用某筆儲值扣款
// 回傳：{ok:boolean, availableBalance, message}
function checkDepositUsableForService(custName,serviceName){
  const details=getCustomerDepositDetails(custName);
  if(details.length===0)return{ok:false,availableBalance:0,message:'此客戶沒有任何儲值'};
  const svcName=(serviceName||'').trim();
  // 計算可用於此服務的總餘額
  let availableBalance=0;
  const restrictedMatch=[];
  const generalDeposits=[];
  details.forEach(d=>{
    if(d.balance<=0)return;
    if(d.scope==='restricted'){
      const match=d.allowedServices.some(svc=>svcName.includes(svc)||svc.includes(svcName));
      if(match){restrictedMatch.push(d);availableBalance+=d.balance;}
    }else{
      generalDeposits.push(d);availableBalance+=d.balance;
    }
  });
  // 完全沒有可用儲值
  if(availableBalance<=0){
    // 看是否有限定方案但服務不對
    const hasRestrictedOnly=details.some(d=>d.balance>0&&d.scope==='restricted');
    if(hasRestrictedOnly){
      const allowedList=details
        .filter(d=>d.balance>0&&d.scope==='restricted')
        .flatMap(d=>d.allowedServices)
        .filter((v,i,a)=>a.indexOf(v)===i);
      return{
        ok:false,availableBalance:0,
        message:`⚠️ 此客戶的儲值是「限定方案」，只能用於：${allowedList.join('、')}\n但目前服務是「${svcName||'未指定'}」，不在允許範圍內`
      };
    }
    return{ok:false,availableBalance:0,message:'⚠️ 此客戶儲值餘額為 0'};
  }
  return{ok:true,availableBalance,message:`可扣款 $${fmt(availableBalance)}（含 ${restrictedMatch.length} 筆限定+${generalDeposits.length} 筆通用）`};
}

// 取得客戶最後一筆儲值的折扣率
// 例如 deposits = {amount:22000, actualReceived:19800} → discountRate = 0.9
// 若無儲值或未填 actualReceived，回傳 1.0（不打折）
function getCustomerDiscountRate(custName){
  if(!custName)return 1;
  // 取該客戶+共用群組所有 deposits，按日期排序取最後一筆有 actualReceived 的
  const group=getSharedGroup(custName).map(n=>(n||'').trim());
  const deposits=(S.data.deposits||[])
    .filter(d=>group.includes((d.customer||'').trim()))
    .filter(d=>toN(d.actualReceived)>0&&toN(d.amount)>0)
    .sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  if(deposits.length===0)return 1;
  const latest=deposits[0];
  const rate=toN(latest.actualReceived)/toN(latest.amount);
  return rate>0&&rate<=1?rate:1;
}

// 取得共用儲值群組
function getSharedGroup(custName){
  if(!custName)return[custName];
  const target=(custName||'').trim();
  const customers=S.data.customers||[];
  const visited=new Set();
  const queue=[target];
  while(queue.length){
    const cur=queue.shift();
    if(visited.has(cur))continue;
    visited.add(cur);
    // 找到 cur 在 customers 裡的記錄（用 trim 比對）
    const me=customers.find(c=>(c.name||'').trim()===cur);
    if(me&&Array.isArray(me.sharedWith)){
      me.sharedWith.forEach(n=>{
        const tn=(n||'').trim();
        if(tn&&!visited.has(tn))queue.push(tn);
      });
    }
    // 別人 sharedWith 中包含 cur
    customers.forEach(c=>{
      if(Array.isArray(c.sharedWith)&&c.sharedWith.some(n=>(n||'').trim()===cur)){
        const cn=(c.name||'').trim();
        if(cn&&!visited.has(cn))queue.push(cn);
      }
    });
  }
  return Array.from(visited);
}

function getAvailableDepositPool(custName){
  const group=getSharedGroup(custName);
  return group.map(name=>({
    name,
    balance:getCustomerBalance(name),
    rate:getCustomerDiscountRate(name),
    isSelf:name===custName
  })).filter(x=>x.balance>0||x.isSelf).sort((a,b)=>{
    if(a.isSelf)return -1;
    if(b.isSelf)return 1;
    return b.balance-a.balance;
  });
}

// 公司總儲值負債（用面額計算 — 公司承諾要提供的服務金額）
function getTotalDepositLiability(){
  const allCustomers=new Set();
  (S.data.deposits||[]).forEach(d=>{if(d.customer)allCustomers.add(d.customer);});
  let total=0;
  allCustomers.forEach(c=>{total+=getCustomerBalance(c);});
  return total;
}

// 公司實際收到的總儲值現金（actualReceived 加總）
function getTotalDepositCash(){

}

// 累計贈送額度（負債面額 - 實收現金 = 折扣總額）
function getTotalDepositDiscount(){
  const facetotal=(S.data.deposits||[]).reduce((s,d)=>s+toN(d.amount),0);
  const cashTotal=getTotalDepositCash();
  return facetotal-cashTotal;
}

function getCustomerHistory(custName){
  if(!custName)return{services:[],deposits:[],totalSpent:0,visitCount:0};
  const target=normalizeName(custName); // 忽略空格/全半形差異，撈回同一人所有拼法的紀錄
  const services=(S.data.sales||[]).filter(s=>normalizeName(s.customer)===target).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const deposits=(S.data.deposits||[]).filter(d=>normalizeName(d.customer)===target).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const usedByOthers=(S.data.sales||[]).filter(s=>s.payMethod==='儲值扣款'&&normalizeName(s.depositOwner)===target&&normalizeName(s.customer)!==target).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const totalSpent=services.reduce((s,r)=>s+toN(r.amount),0);
  const dates=new Set(services.map(s=>s.date));
  return{services,deposits,usedByOthers,totalSpent,visitCount:dates.size};
}

// ═══════════ 🎯 行動計畫（每月目標 → 每週行動 → 每日必做 → 每件事復盤）═══════════
const ACT_RESULTS={win:{ico:'✅',lbl:'有成果',c:'#16a34a',bg:'#f0fdf4'},wait:{ico:'🌱',lbl:'還在等結果',c:'#d97706',bg:'#fffbeb'},none:{ico:'❌',lbl:'沒效果',c:'#dc2626',bg:'#fef2f2'}};
const ACT_WD=['日','一','二','三','四','五','六'];
function actYmd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function actAddDays(ds,n){const d=new Date(ds+'T00:00:00');d.setDate(d.getDate()+n);return actYmd(d);}
function actWeekStart(ds){const d=new Date(ds+'T00:00:00');const wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd);return actYmd(d);}
function actItems(){return S.data.actionItems||[];}
function actTasks(){return actItems().filter(x=>x.type==='task');}
function actGoals(month){return actItems().filter(x=>x.type==='goal'&&x.month===month).sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||''));}
function actGoalById(id){return actItems().find(x=>x.id===id&&x.type==='goal');}
function actMustToday(ds){return actTasks().filter(t=>t.date===ds&&t.pri==='must');}
function actMonthRevenue(month){return (S.data.sales||[]).filter(s=>(s.date||'').slice(0,7)===month).reduce((a,s)=>a+toN(s.amount),0);}
// 今天要傳給客人的訊息（串聯關懷提醒、補色、滿一年）
function actCustomerMsgs(){
  const out=[];const td=today();
  try{getCareDue().forEach(d=>out.push({kind:'care',title:d.title,who:d.customer,sub:d.service+'・開單後第 '+d.sinceOrder+' 天',btn:'<button class="btn btn-sm" style="background:#db2777;color:#fff;" onclick="careCopyMsg(\''+d.saleId+'\',\''+d.ruleId+'\')">📋 複製</button><button class="btn btn-s btn-sm" onclick="careMarkDone(\''+d.saleId+'\',\''+d.ruleId+'\')">✓ 已傳</button>'}));}catch(e){}
  const d14=actAddDays(td,14);
  (S.data.pmuRecords||[]).forEach(r=>{
    if(r.touchupDate&&!r.touchupDone&&r.touchupDate<=d14){let tp=null;try{tp=getTouchupPrice(r);}catch(e){}
      out.push({kind:'touchup',title:'補色提醒',who:r.customer,sub:(r.serviceType||'')+'・補色日 '+r.touchupDate+(r.touchupDate<td?'（已過期）':'')+(tp?'・<b style="color:'+(tp.isFree?'#16a34a':'#9333ea')+';">'+(tp.isFree?'🎁 免費補色':tp.label+' $'+fmt(tp.price))+'</b>':''),btn:'<button class="btn btn-sm" style="background:#9333ea;color:#fff;" onclick="pmuSendTouchup(\''+r.id+'\')">💬 傳訊</button>'});}
    if(r.oneYearDate&&!r.oneYearReminded&&r.oneYearDate<=td)out.push({kind:'yearly',title:'紋繡滿一年回訪',who:r.customer,sub:(r.serviceType||'')+'・滿一年 '+r.oneYearDate,btn:'<button class="btn btn-sm" style="background:var(--rose);color:#fff;" onclick="pmuSendYearly(\''+r.id+'\')">💬 傳訊</button>'});
  });
  return out;
}
function actFollowUps(){const td=today();return actTasks().filter(t=>t.status==='done'&&t.result==='wait'&&(t.followUpDate||'')<=td);}
function actOverdue(){const td=today();return actTasks().filter(t=>t.status!=='done'&&t.date&&t.date<td);}

// 單一行動列
function actTaskRow(t,opt){
  opt=opt||{};
  const done=t.status==='done';
  const g=t.goalId?actGoalById(t.goalId):null;
  const r=t.result?ACT_RESULTS[t.result]:null;
  return '<div style="display:flex;gap:10px;align-items:flex-start;padding:11px 12px;background:#fff;border:1px solid #f1e7e3;border-radius:12px;'+(done?'opacity:.85;':'')+'">'
    +'<button type="button" onclick="actToggle(\''+t.id+'\')" title="'+(done?'取消完成':'完成')+'" style="flex-shrink:0;width:28px;height:28px;border-radius:50%;border:2px solid '+(done?'#16a34a':'#d6c7c1')+';background:'+(done?'#16a34a':'#fff')+';color:#fff;font-size:15px;cursor:pointer;line-height:1;">'+(done?'✓':'')+'</button>'
    +'<div style="flex:1;min-width:0;cursor:pointer;" onclick="openM(\'actTask\',\''+t.id+'\')">'
    +'<div style="font-size:15px;font-weight:700;line-height:1.5;'+(done?'text-decoration:line-through;color:#9ca3af;':'color:var(--txt);')+'">'+(t.title||'')+'</div>'
    +'<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:3px;font-size:11px;">'
    +(opt.showDate&&t.date?'<span style="background:#f3f4f6;color:#6b7280;padding:1px 7px;border-radius:8px;">'+t.date.slice(5)+' 週'+ACT_WD[new Date(t.date+'T00:00:00').getDay()]+'</span>':'')
    +(t.timebox?'<span style="background:#eff6ff;color:#2563eb;padding:1px 7px;border-radius:8px;">⏱ '+t.timebox+'</span>':'')
    +(g?'<span style="background:#faf5ff;color:#7c3aed;padding:1px 7px;border-radius:8px;">🎯 '+g.title+'</span>':'')
    +(r?'<span style="background:'+r.bg+';color:'+r.c+';padding:1px 7px;border-radius:8px;font-weight:700;">'+r.ico+' '+r.lbl+'</span>':'')
    +'</div>'
    +(t.resultNote?'<div style="font-size:12px;color:#4b5563;margin-top:4px;line-height:1.6;">成果：'+t.resultNote+'</div>':'')
    +'</div>'
    +(opt.extra||'')
    +'</div>';
}
function actSection(title,color,inner,right){
  return '<div style="margin:18px 0 8px;display:flex;align-items:center;gap:8px;"><span style="font-size:16px;font-weight:900;color:'+color+';">'+title+'</span><span style="flex:1;"></span>'+(right||'')+'</div>'+inner;
}

function pgAction(){
  const tab=S.actTab||'today';
  const tabs=[['today','☀️ 今天'],['week','📅 本週'],['month','🎯 本月目標'],['review','📊 成果復盤']];
  let h='<div class="pg-ttl">🎯 行動計畫</div><div class="pg-sub">每月 3 個目標 → 每週行動 → 每天只做最重要的 3 件 → 做完看成果</div>';
  h+='<div style="display:flex;gap:6px;overflow-x:auto;margin:14px 0 4px;padding-bottom:4px;">'+tabs.map(([k,l])=>'<button type="button" onclick="S.actTab=\''+k+'\';actRefresh()" style="flex-shrink:0;padding:10px 16px;border-radius:22px;border:1px solid '+(tab===k?'#7c3aed':'var(--bdr)')+';background:'+(tab===k?'#7c3aed':'var(--card)')+';color:'+(tab===k?'#fff':'var(--txt)')+';font-size:15px;font-weight:800;cursor:pointer;">'+l+'</button>').join('')+'</div>';
  if(tab==='week')h+=actWeekView();
  else if(tab==='month')h+=actMonthView();
  else if(tab==='review')h+=actReviewView();
  else h+=actTodayView();
  return h;
}
function actRefresh(){const c=document.getElementById('pg-content');if(c)c.innerHTML=renderPage();}
window.actRefresh=actRefresh;

function actAddBar(ds,defPri){
  const goals=actGoals(ds.slice(0,7));
  return '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">'
    +'<input type="text" id="act_quick" placeholder="想到要做的事，打在這裡…" style="flex:1;min-width:180px;font-size:15px;" onkeydown="if(event.key===\'Enter\')actQuickAdd(\''+ds+'\',\''+defPri+'\')">'
    +(goals.length?'<select id="act_quick_goal" style="max-width:150px;"><option value="">（不連結目標）</option>'+goals.map(g=>'<option value="'+g.id+'">🎯 '+g.title+'</option>').join('')+'</select>':'')
    +'<button class="btn btn-p" style="background:#dc2626;" onclick="actQuickAdd(\''+ds+'\',\'must\')">🔥 加到必做</button>'
    +'<button class="btn btn-s" onclick="actQuickAdd(\''+ds+'\',\'extra\')">⏳ 有空再做</button>'
    +'</div>';
}
function actTodayView(){
  const td=today();
  const d=new Date(td+'T00:00:00');
  const all=actTasks().filter(t=>t.date===td);
  const must=all.filter(t=>t.pri==='must');
  const extra=all.filter(t=>t.pri!=='must');
  const mustDone=must.filter(t=>t.status==='done').length;
  let h='<div class="card" style="margin-top:10px;background:linear-gradient(135deg,#fff7ed,#fdf2f8);border:none;"><div class="card-bd" style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">'
    +'<div><div style="font-size:13px;color:#9a3412;">'+(d.getMonth()+1)+' 月 '+d.getDate()+' 日・星期'+ACT_WD[d.getDay()]+'</div><div style="font-size:22px;font-weight:900;color:#7c2d12;">今天只做最重要的 3 件事</div></div>'
    +'<span style="flex:1;"></span><div style="text-align:center;"><div style="font-size:30px;font-weight:900;color:#dc2626;">'+mustDone+' / '+Math.max(must.length,0)+'</div><div style="font-size:12px;color:#9a3412;">必做完成</div></div>'
    +'</div></div>';
  // 必做
  let inner='<div style="display:flex;flex-direction:column;gap:8px;">'+must.map(t=>actTaskRow(t)).join('')+'</div>';
  if(must.length===0)inner='<div class="tm" style="padding:12px 14px;background:#fef2f2;border-radius:12px;font-size:14px;">還沒排今天的必做。問自己：<b>今天做完哪 3 件事，就算沒白過？</b></div>';
  else if(must.length<3)inner+='<div class="tm" style="font-size:12px;margin-top:6px;">還可以再加 '+(3-must.length)+' 件必做</div>';
  h+=actSection('🔥 今天必做（最多 3 件）','#dc2626',inner);
  h+=actAddBar(td,'must');
  // 今天要傳的訊息
  const msgs=actCustomerMsgs();
  if(msgs.length){
    let mi='<div style="display:flex;flex-direction:column;gap:8px;">'+msgs.map(m=>'<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fff;border:1px solid #fbcfe8;border-radius:12px;flex-wrap:wrap;"><div style="flex:1;min-width:160px;"><div style="font-size:15px;font-weight:800;color:#9d174d;">'+m.who+'　<span style="font-size:12px;font-weight:600;color:#db2777;">'+m.title+'</span></div><div class="tm" style="font-size:12px;">'+m.sub+'</div></div><div style="display:flex;gap:6px;">'+m.btn+'</div></div>').join('')+'</div>';
    h+=actSection('💌 今天要傳給客人的訊息（'+msgs.length+'）','#db2777',mi);
  }
  // 等待成果追蹤
  const fu=actFollowUps();
  if(fu.length){
    h+=actSection('🌱 該回來看成果了（'+fu.length+'）','#d97706','<div class="tm" style="font-size:12px;margin-bottom:6px;">這些事之前做了、在等結果，現在可以回來補上成果了</div><div style="display:flex;flex-direction:column;gap:8px;">'+fu.map(t=>actTaskRow(t,{showDate:true,extra:'<button class="btn btn-sm" style="background:#d97706;color:#fff;flex-shrink:0;" onclick="openM(\'actReview\',\''+t.id+'\')">補上成果</button>'})).join('')+'</div>');
  }
  // 有空再做
  if(extra.length)h+=actSection('⏳ 有空再做（'+extra.length+'）','#6b7280','<div style="display:flex;flex-direction:column;gap:8px;">'+extra.map(t=>actTaskRow(t,{extra:t.status!=='done'&&must.length<3?'<button class="btn btn-s btn-sm" style="flex-shrink:0;" onclick="actSetPri(\''+t.id+'\',\'must\')">🔥 升必做</button>':''})).join('')+'</div>');
  // 之前沒做完
  const od=actOverdue();
  if(od.length)h+=actSection('⚠️ 之前沒做完（'+od.length+'）','#b45309','<div class="tm" style="font-size:12px;margin-bottom:6px;">每件都要決定：今天做、改天做，還是不做了</div><div style="display:flex;flex-direction:column;gap:8px;">'+od.map(t=>actTaskRow(t,{showDate:true,extra:'<div style="display:flex;flex-direction:column;gap:4px;flex-shrink:0;"><button class="btn btn-s btn-sm" onclick="actMoveToday(\''+t.id+'\')">移到今天</button><button class="btn btn-s btn-sm" onclick="openM(\'actTask\',\''+t.id+'\')">改日期</button><button class="btn btn-s btn-sm" style="color:#9ca3af;" onclick="actDrop(\''+t.id+'\')">不做了</button></div>'})).join('')+'</div>');
  return h;
}
function actWeekView(){
  const td=today();
  const ws=S.actWeek||actWeekStart(td);
  const days=[0,1,2,3,4,5,6].map(i=>actAddDays(ws,i));
  const we=days[6];
  const tasks=actTasks().filter(t=>t.date>=ws&&t.date<=we);
  const done=tasks.filter(t=>t.status==='done');
  const wins=done.filter(t=>t.result==='win').length;
  let h='<div style="display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap;">'
    +'<button class="btn btn-s btn-sm" onclick="S.actWeek=\''+actAddDays(ws,-7)+'\';actRefresh()">‹ 上週</button>'
    +'<b style="font-size:16px;">'+ws.slice(5).replace('-','/')+' – '+we.slice(5).replace('-','/')+'</b>'
    +'<button class="btn btn-s btn-sm" onclick="S.actWeek=\''+actAddDays(ws,7)+'\';actRefresh()">下週 ›</button>'
    +(ws!==actWeekStart(td)?'<button class="btn btn-s btn-sm" onclick="S.actWeek=null;actRefresh()">回本週</button>':'')
    +'<span style="flex:1;"></span><span class="tm" style="font-size:13px;">完成 <b>'+done.length+'</b> / '+tasks.length+'　·　✅ 有成果 <b style="color:#16a34a;">'+wins+'</b></span></div>';
  // 新增
  const goals=actGoals(ws.slice(0,7));
  h+='<div class="card" style="margin-top:10px;"><div class="card-bd"><div style="font-weight:800;margin-bottom:6px;">＋ 安排這週的行動</div><div style="display:flex;gap:6px;flex-wrap:wrap;">'
    +'<input type="text" id="act_wk_title" placeholder="例如：發 2 篇霧眉作品到 IG" style="flex:1;min-width:180px;font-size:15px;">'
    +'<select id="act_wk_day">'+days.map(ds=>'<option value="'+ds+'"'+(ds===td?' selected':'')+'>週'+ACT_WD[new Date(ds+'T00:00:00').getDay()]+' '+ds.slice(5)+'</option>').join('')+'</select>'
    +(goals.length?'<select id="act_wk_goal"><option value="">（不連結目標）</option>'+goals.map(g=>'<option value="'+g.id+'">🎯 '+g.title+'</option>').join('')+'</select>':'')
    +'<button class="btn btn-p" style="background:#7c3aed;" onclick="actWeekAdd()">加入</button></div></div></div>';
  h+='<div style="display:flex;flex-direction:column;gap:10px;margin-top:10px;">';
  days.forEach(ds=>{
    const dt=tasks.filter(t=>t.date===ds).sort((a,b)=>(a.pri==='must'?0:1)-(b.pri==='must'?0:1));
    const isT=ds===td;
    h+='<div style="border-radius:14px;border:'+(isT?'2px solid #7c3aed':'1px solid #f1e7e3')+';background:'+(isT?'#faf5ff':'#fff')+';padding:10px 12px;">'
      +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:'+(dt.length?'8':'0')+'px;"><b style="font-size:15px;color:'+(isT?'#7c3aed':'var(--txt)')+';">週'+ACT_WD[new Date(ds+'T00:00:00').getDay()]+'</b><span class="tm" style="font-size:12px;">'+ds.slice(5).replace('-','/')+(isT?'・今天':'')+'</span><span style="flex:1;"></span><span class="tm" style="font-size:12px;">'+(dt.length?dt.filter(t=>t.status==='done').length+'/'+dt.length:'沒有安排')+'</span></div>'
      +'<div style="display:flex;flex-direction:column;gap:6px;">'+dt.map(t=>actTaskRow(t,{extra:t.pri==='must'?'<span style="font-size:11px;color:#dc2626;flex-shrink:0;">🔥必做</span>':''})).join('')+'</div></div>';
  });
  h+='</div>';
  return h;
}
function actMonthView(){
  const month=S.actMonth||today().slice(0,7);
  const [y,mo]=month.split('-').map(Number);
  const prev=(mo===1?(y-1)+'-12':y+'-'+String(mo-1).padStart(2,'0')),next=(mo===12?(y+1)+'-01':y+'-'+String(mo+1).padStart(2,'0'));
  const goals=actGoals(month);
  let h='<div style="display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap;">'
    +'<button class="btn btn-s btn-sm" onclick="S.actMonth=\''+prev+'\';actRefresh()">‹ 上個月</button>'
    +'<b style="font-size:17px;">'+y+' 年 '+mo+' 月</b>'
    +'<button class="btn btn-s btn-sm" onclick="S.actMonth=\''+next+'\';actRefresh()">下個月 ›</button>'
    +(month!==today().slice(0,7)?'<button class="btn btn-s btn-sm" onclick="S.actMonth=null;actRefresh()">回本月</button>':'')+'</div>';
  h+='<div class="tm" style="font-size:13px;margin:10px 0;line-height:1.7;">一個月<b>最多 3 個目標</b>。目標要寫得出「怎樣算做到」，每週的行動都從這 3 個目標拆出來。</div>';
  h+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;">';
  goals.forEach((g,i)=>{
    const tk=actTasks().filter(t=>t.goalId===g.id);
    const dn=tk.filter(t=>t.status==='done'),wn=dn.filter(t=>t.result==='win').length;
    let prog='';
    if(g.kind==='revenue'&&toN(g.target)>0){
      const act=actMonthRevenue(month),pct=Math.min(100,Math.round(act/toN(g.target)*100));
      prog='<div style="margin-top:10px;"><div style="display:flex;justify-content:space-between;font-size:13px;"><span>實際營收 <b>$'+fmt(act)+'</b></span><span>目標 $'+fmt(g.target)+'</span></div><div style="height:12px;background:#f3f4f6;border-radius:6px;margin-top:4px;overflow:hidden;"><div style="height:100%;width:'+pct+'%;background:'+(pct>=100?'#16a34a':'#7c3aed')+';"></div></div><div style="text-align:right;font-size:12px;font-weight:800;color:'+(pct>=100?'#16a34a':'#7c3aed')+';margin-top:2px;">'+pct+'%</div></div>';
    }
    const rv=g.review?{hit:['🏆','達成','#16a34a'],part:['🌗','部分達成','#d97706'],miss:['⛔','沒達成','#dc2626']}[g.review]:null;
    h+='<div style="background:#fff;border-radius:16px;border:1px solid #ede9fe;border-top:6px solid #7c3aed;padding:14px 16px;">'
      +'<div style="display:flex;align-items:flex-start;gap:8px;"><span style="font-size:22px;font-weight:900;color:#c4b5fd;">'+(i+1)+'</span><div style="flex:1;"><div style="font-size:17px;font-weight:900;color:#4c1d95;line-height:1.4;">'+g.title+'</div>'+(g.measure?'<div style="font-size:13px;color:#6b7280;margin-top:3px;">怎樣算做到：'+g.measure+'</div>':'')+'</div>'
      +'<button class="btn btn-s btn-sm" onclick="openM(\'actGoal\',\''+g.id+'\')">✏️</button></div>'
      +prog
      +'<div style="font-size:13px;margin-top:10px;color:#4b5563;">相關行動 <b>'+tk.length+'</b>　完成 <b>'+dn.length+'</b>　✅ 有成果 <b style="color:#16a34a;">'+wn+'</b></div>'
      +(rv?'<div style="margin-top:10px;padding:8px 10px;border-radius:10px;background:#f9fafb;"><b style="color:'+rv[2]+';">'+rv[0]+' 月底復盤：'+rv[1]+'</b>'+(g.reviewNote?'<div style="font-size:13px;color:#4b5563;margin-top:3px;line-height:1.6;">'+g.reviewNote+'</div>':'')+'</div>'
        :'<button class="btn btn-s btn-sm" style="margin-top:10px;" onclick="openM(\'actGoal\',\''+g.id+'\');S.modal.focusReview=true;">📝 月底復盤</button>')
      +'</div>';
  });
  if(goals.length<3)h+='<div onclick="openM(\'actGoal\',\'__new__\');S.modal.month=\''+month+'\';" style="cursor:pointer;border:2px dashed #c4b5fd;border-radius:16px;min-height:140px;display:flex;align-items:center;justify-content:center;color:#7c3aed;font-size:16px;font-weight:800;">＋ 新增目標（還能加 '+(3-goals.length)+' 個）</div>';
  h+='</div>';
  return h;
}
function actReviewView(){
  const f=S.actReviewF||'all',range=S.actReviewR||'month';
  const mon=today().slice(0,7);
  let list=actTasks().filter(t=>t.status==='done'&&(range==='all'||(t.date||'').slice(0,7)===mon));
  const cnt=k=>list.filter(t=>t.result===k).length;
  const total=list.length;
  let h='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;">'
    +[['month','本月'],['all','全部']].map(([k,l])=>'<button class="btn btn-sm '+(range===k?'btn-p':'btn-s')+'" onclick="S.actReviewR=\''+k+'\';actRefresh()">'+l+'</button>').join('')+'</div>';
  h+='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;">'

  list.forEach(t=>{
    const r=ACT_RESULTS[t.result]||{ico:'📋',lbl:'未填成果',c:'#6b7280',bg:'#f9fafb'};

      +'<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;"><b style="font-size:15px;">'+t.title+'</b><span style="font-size:12px;background:'+r.bg+';color:'+r.c+';padding:1px 8px;border-radius:8px;font-weight:700;">'+r.ico+' '+r.lbl+'</span><span style="flex:1;"></span><span class="tm" style="font-size:12px;">'+(t.date||'')+'</span></div>'
      +(g?'<div style="font-size:12px;color:#7c3aed;margin-top:3px;">🎯 '+g.title+'</div>':'')
      +(t.resultNote?'<div style="font-size:14px;margin-top:6px;line-height:1.7;"><b>成果：</b>'+t.resultNote+'</div>':'')
      +(t.adjust?'<div style="font-size:14px;margin-top:2px;line-height:1.7;color:#7c3aed;"><b>下次調整：</b>'+t.adjust+'</div>':'')
      +'</div>';
  });
  return h+'</div>';
}

// 當月消費 TOP 10 客戶（80/20 VVIP）
function pgOverviewTop10(rev){
  const monthSales=getSales();

    byCust[name].total+=toN(s.amount);
    byCust[name].cnt++;

  html+='</div>';

// 當月獲利診斷（獨立函式，避免模板字串巢狀反引號問題）
function pgOverviewProfitDiagnosis(rev){
  const monthSales=getSales();
  const custSet=[...new Set(monthSales.map(s=>s.customer).filter(x=>x))];
  const avgTicket=custSet.length>0?Math.round(rev/custSet.length):0;
  const cats={'紋繡':0,'做臉':0,'熱蠟':0,'美體':0,'產品':0,'其他':0};
  monthSales.forEach(s=>{
    const it=(s.item||'')+(s.subNote||'');
    const amt=toN(s.amount);
    if(it.includes('霧眉')||it.includes('霧唇')||it.includes('紋繡')||it.includes('補色'))cats['紋繡']+=amt;
    else if(it.includes('做臉')||it.includes('臉部')||it.includes('護膚')||it.includes('清粉刺'))cats['做臉']+=amt;
    else if(it.includes('熱蠟')||it.includes('除毛'))cats['熱蠟']+=amt;
    else if(it.includes('按摩')||it.includes('美體')||it.includes('身體'))cats['美體']+=amt;
    else if(s.type==='product')cats['產品']+=amt;
    else cats['其他']+=amt;
  });
  const catArr=Object.entries(cats).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
  const topCat=catArr.length>0?catArr[0][0]:'';
  const isTech=topCat==='紋繡';
  const depositUsed=monthSales.filter(s=>s.payMethod==='儲值扣款').reduce((a,s)=>a+toN(s.depositFaceAmount||s.amount),0);
  const monthPurchase=getExp().filter(e=>e.category==='進貨成本').reduce((a,e)=>a+toN(e.amount),0);

  let barsHtml='';
  catArr.forEach(pair=>{
    const k=pair[0],v=pair[1];
    const pct=rev>0?Math.round(v/rev*100):0;
    const isT=k==='紋繡';
    barsHtml+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:13px;">'
      +'<span style="width:44px;color:'+(isT?'#9333ea':'#333')+';font-weight:'+(isT?'700':'400')+';">'+k+'</span>'
      +'<div style="flex:1;background:#f1f1f1;border-radius:6px;height:16px;overflow:hidden;"><div style="width:'+pct+'%;height:100%;background:'+(isT?'#9333ea':'#d1a054')+';"></div></div>'
      +'<span style="width:70px;text-align:right;">$'+fmt(v)+'</span>'
      +'<span style="width:36px;text-align:right;color:#999;">'+pct+'%</span></div>';
  });

  const diag1=isTech
    ? '✅ <b style="color:#16a34a;">健康的技術財</b>：這個月利潤主要來自<b>紋繡</b>！<br>💡 下月策略：繼續維持紋繡行銷，這是可長久、高毛利的方向。'
    : '⚠️ <b style="color:#d97706;">高風險的勞力財</b>：這個月利潤主要來自<b>'+topCat+'</b>（勞力密集）。<br>身體總有一天會累垮，這不是長久之計。<br>🎯 下月策略：加快把這群客人<b>轉化成紋繡客</b>——同樣的客人，紋繡賺更多又更省力。';

  const diag2=depositUsed>0
    ? '✓ 這代表你認真在「還清以前的工時債」。櫃檯這個月雖然沒收到這筆新現金，但<b>未來負債變輕了</b>——這叫「隱形獲利」，是良性循環。'
    : '這個月幾乎沒有儲值消耗。如果儲值負債還很高，要提醒客人多來使用，加快消化。';

  const diag3=monthPurchase>0

    : '這個月沒有進貨支出，很好——把現金留著轉型紋繡。';

  return '<div class="card" style="margin-top:18px;background:linear-gradient(135deg,#f0fdf4,#fff);border:2px solid #16a34a;">'

    +'<div class="sc"><div class="sl">最大營收來源</div><div class="sv sm" style="color:'+(isTech?'#16a34a':'#d97706')+';font-size:18px;">'+(topCat||'—')+'</div><div class="ss">'+(catArr.length>0?'$'+fmt(catArr[0][1]):'')+'</div></div>'

    +'<div style="background:#fff;border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.7;">本月進貨花了 <b style="color:#dc2626;">$'+fmt(monthPurchase)+'</b><br>'+diag3+'</div>'
    +'</div></div>';
}

  return t;
}

function quarterStat(q){
  const months=[(q-1)*3+1,(q-1)*3+2,(q-1)*3+3];
  var rev=0,exp=0,pmu=0;
  months.forEach(function(m){rev+=getRevTotal(m);exp+=getExpTotal(m);pmu+=periodPmuRev(m);});

}
function fmtSigned(n){return(n>=0?'+$':'-$')+fmt(Math.abs(n));}
function quarterTransitionText(a,b){

  else{verdict='➡️ 大致持平';vColor='#d97706';}
  var cause='';
  if(dNet<=-500){
    const revDrop=dRev<0,expRise=dExp>0;
    if(revDrop&&expRise)cause='營收少了 $'+fmt(-dRev)+'、費用又多了 $'+fmt(dExp)+'，兩頭夾擊';
    else if(revDrop&&Math.abs(dRev)>=Math.abs(dExp))cause='主要是營收少了 $'+fmt(-dRev)+'（來客變少或單價變低）';
    else if(expRise)cause='主要是費用多了 $'+fmt(dExp)+'（開銷變大，檢查是不是囤貨或雜支）';
    else cause='賺得比上一季少了 $'+fmt(-dNet);
  }else if(dNet>=500){
    const revUp=dRev>0,expCut=dExp<0;
    if(revUp&&expCut)cause='營收多了 $'+fmt(dRev)+'、又省下 $'+fmt(-dExp)+' 費用，雙贏';
    else if(revUp&&Math.abs(dRev)>=Math.abs(dExp))cause='主要靠營收增加 $'+fmt(dRev);
    else if(expCut)cause='主要靠省下 $'+fmt(-dExp)+' 費用';
    else cause='賺得比上一季多了 $'+fmt(dNet);
  }else{
    cause='淨利跟上一季差不多';
  }
  var pmuNote='';
  if(dPmu>=3)pmuNote='；紋繡佔比 '+a.pmuPct+'%→'+b.pmuPct+'%，轉型有進展 👍';
  else if(dPmu<=-3)pmuNote='；紋繡佔比 '+a.pmuPct+'%→'+b.pmuPct+'%，往下掉了要注意 ⚠️';
  return{verdict:verdict,vColor:vColor,text:'第'+a.q+'季 → 第'+b.q+'季：'+verdict+'（淨利 '+fmtSigned(dNet)+'）。'+cause+pmuNote};
}
function renderQuarterCompare(){
  var qs=[1,2,3,4].map(quarterStat);
  var has=qs.filter(function(x){return x.has;});
  if(has.length<2){
    return'<div class="card" style="margin-bottom:16px;background:#f8fafc;border:1px dashed #cbd5e1;"><div class="card-bd"><div style="font-weight:700;color:#475569;margin-bottom:4px;">📊 四季對比分析</div><div class="tm">目前只有 '+has.length+' 季有資料，至少要兩季才能對比。等下一季資料進來，這裡會自動幫你比較進步還退步、並說明原因。</div></div></div>';
  }
  // 對照表
  var cols=has.map(function(x){return'<th style="padding:7px 10px;text-align:right;color:#9333ea;">第'+x.q+'季</th>';}).join('');
  function rowNum(label,key,fmtFn,color){
    var cells=has.map(function(x){var v=x[key];return'<td style="padding:6px 10px;text-align:right;'+(color?('color:'+color(v)+';'):'')+'">'+fmtFn(v)+'</td>';}).join('');
    return'<tr><td style="padding:6px 10px;color:#666;white-space:nowrap;">'+label+'</td>'+cells+'</tr>';
  }
  var table='<div class="tw"><table style="width:100%;border-collapse:collapse;font-size:13px;">';
  table+='<thead><tr style="border-bottom:2px solid #e9d5f5;"><th style="padding:7px 10px;text-align:left;">指標</th>'+cols+'</tr></thead><tbody>';
  table+=rowNum('📈 營收','rev',function(v){return'$'+fmt(v);});
  table+=rowNum('📉 費用','exp',function(v){return'$'+fmt(v);},function(){return'#dc2626';});
  table+='<tr style="border-top:1px solid #eee;background:#faf5ff;">'+'<td style="padding:7px 10px;font-weight:800;white-space:nowrap;">💰 淨利</td>'+has.map(function(x){return'<td style="padding:7px 10px;text-align:right;font-weight:800;color:'+(x.net>=0?'#16a34a':'#dc2626')+';">$'+fmt(x.net)+'</td>';}).join('')+'</tr>';
  table+=rowNum('　淨利率','netPct',function(v){return v+'%';});
  table+=rowNum('🎯 紋繡佔比','pmuPct',function(v){return v+'%';},function(v){return v>=40?'#16a34a':(v>=30?'#d97706':'#9333ea');});
  table+='</tbody></table></div>';
  // 淨利長條圖
  var maxAbs=Math.max.apply(null,has.map(function(x){return Math.abs(x.net);}).concat([1]));
  var bars='<div style="margin:14px 0;">';
  has.forEach(function(x){
    var pct=Math.round(Math.abs(x.net)/maxAbs*100);
    var col=x.net>=0?'#16a34a':'#dc2626';
    bars+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;"><span style="width:46px;font-size:12px;color:#666;">第'+x.q+'季</span><div style="flex:1;background:#f1f5f9;border-radius:6px;height:20px;overflow:hidden;"><div style="width:'+pct+'%;min-width:2px;background:'+col+';height:100%;"></div></div><span style="width:72px;text-align:right;font-weight:700;color:'+col+';font-size:13px;">$'+fmt(x.net)+'</span></div>';
  });
  bars+='</div>';
  // 逐季解讀（相鄰有資料的季）
  var lines='';
  for(var i=1;i<has.length;i++){
    var t=quarterTransitionText(has[i-1],has[i]);
    lines+='<div style="background:#fff;border-left:3px solid '+t.vColor+';border-radius:8px;padding:9px 12px;margin-bottom:8px;font-size:13px;line-height:1.6;color:#444;">'+t.text+'</div>';
  }
  // 整體總評
  var best=has.slice().sort(function(a,b){return b.net-a.net;})[0];
  var worst=has.slice().sort(function(a,b){return a.net-b.net;})[0];
  var first=has[0],last=has[has.length-1];
  var overallNet=last.net-first.net;
  var overallTxt;
  if(overallNet>500)overallTxt='整體來看，從第'+first.q+'季到第'+last.q+'季淨利是往上走的（'+fmtSigned(overallNet)+'），方向正確，保持下去。';
  else if(overallNet<-500)overallTxt='整體來看，從第'+first.q+'季到第'+last.q+'季淨利是往下走的（'+fmtSigned(overallNet)+'）。最賺的是第'+best.q+'季（$'+fmt(best.net)+'），回想那季做對了什麼、把它複製回來。';
  else overallTxt='整體來看幾季淨利差不多。要讓它往上走，關鍵還是把紋繡佔比拉高——那是最省力、最能放大淨利的槓桿。';
  var html='<div class="card" style="margin-bottom:16px;border:1px solid #e9d5f5;">';
  html+='<div class="card-hd" style="background:linear-gradient(135deg,#faf5ff,#fdf2f8);"><span class="card-ttl" style="color:#9333ea;">📊 四季對比分析</span></div>';

  html+='</div></div>';
  return html;
}

function renderBalanceSheet(){
  const curY=yr();
  const bs=(S.data.settings&&S.data.settings.balanceSheet)||{};
  // 系統自動抓的數字
  // 1. 庫存價值 = 各產品 庫存量 × 成本
  var invValue=0;
  (S.data.products||[]).forEach(function(p){
    const inv=getInv(p.id);
    const cost=getAvgCost(p.id);
    invValue+=toN(inv.qty)*toN(cost);
  });
  invValue=Math.round(invValue);
  // 2. 儲值負債
  const liability=getTotalDepositLiability();
  // 3. 今年累積盈餘 = 今年營收 - 今年支出
  var yearRev=0,yearExp=0;
  for(var m=1;m<=12;m++){yearRev+=getRevTotal(m);yearExp+=getExpTotal(m);}
  const yearProfit=yearRev-yearExp;
  // 你填的數字
  const cash=toN(bs.cash);
  const fixedAsset=toN(bs.fixedAsset);
  const intangible=toN(bs.intangible);
  const capital=toN(bs.capital);
  // 資產總計
  const totalAsset=cash+invValue+fixedAsset+intangible;
  // 權益 = 創立資本 + 累積盈餘
  const equity=capital+yearProfit;
  // 負債+權益
  const totalLE=liability+equity;
  // 是否平衡
  const balanced=Math.abs(totalAsset-totalLE)<1;
  const diff=totalAsset-totalLE;

  var html=renderYearSummary();
  html+='<div class="notice" style="background:#faf5ff;border-left-color:#9333ea;color:#7e22ce;font-size:13px;">🏛️ 每年 12/31 結算一次。<b>系統自動抓的</b>直接顯示，<b>你要填的</b>（現金、設備、學費、資本）點「填寫」輸入。會計黃金公式：<b>資產 ＝ 負債 ＋ 權益</b>，兩邊要一樣。</div>';
  html+='<div style="text-align:right;margin:10px 0;"><button class="btn btn-p" style="background:#9333ea;" onclick="openM(\'editBalanceSheet\')">✏️ 填寫／修改我的數字</button></div>';

  // 資產區
  html+='<div class="card" style="margin-bottom:14px;">';
  html+='<div class="card-hd" style="background:#eff6ff;"><span class="card-ttl" style="color:#2563eb;">💎 資產（我擁有的）</span></div>';
  html+='<div class="card-bd"><table style="width:100%;font-size:14px;">';
  html+=blRow('💵 現金與銀行存款',cash,'你填','#2563eb');
  html+=blRow('📦 庫存（產品+材料）',invValue,'系統自動','#16a34a');
  html+=blRow('🛋️ 固定資產（美容床、儀器、裝潢）',fixedAsset,'你填','#2563eb');
  html+=blRow('🎓 無形資產（進修學費）',intangible,'你填','#2563eb');
  html+='<tr style="border-top:3px double #2563eb;background:#eff6ff;"><td style="padding:8px;font-weight:800;">資產總計</td><td style="padding:8px;text-align:right;font-weight:800;font-size:17px;color:#2563eb;">$'+fmt(totalAsset)+'</td><td></td></tr>';
  html+='</table></div></div>';

  // 負債+權益區
  html+='<div class="card" style="margin-bottom:14px;">';
  html+='<div class="card-hd" style="background:#fef2f2;"><span class="card-ttl" style="color:#dc2626;">📋 負債 ＋ 權益（錢從哪來的）</span></div>';
  html+='<div class="card-bd"><table style="width:100%;font-size:14px;">';
  html+='<tr><td colspan="3" style="padding:4px 8px;font-weight:700;color:#dc2626;">負債（欠別人的）</td></tr>';
  html+=blRow('💳 未消耗儲值金（工時債）',liability,'系統自動','#dc2626');
  html+='<tr><td colspan="3" style="padding:8px 8px 4px;font-weight:700;color:#9333ea;">權益（真正屬於你的）</td></tr>';
  html+=blRow('🏦 創立資本（當初自己拿出來的）',capital,'你填','#9333ea');
  html+=blRow('📈 今年累積盈餘',yearProfit,'系統自動','#9333ea');
  html+='<tr style="border-top:3px double #dc2626;background:#fef2f2;"><td style="padding:8px;font-weight:800;">負債＋權益總計</td><td style="padding:8px;text-align:right;font-weight:800;font-size:17px;color:#dc2626;">$'+fmt(totalLE)+'</td><td></td></tr>';
  html+='</table></div></div>';

  // 黃金公式驗證
  if(balanced){
    html+='<div class="card" style="background:#f0fdf4;border:2px solid #16a34a;"><div class="card-bd" style="text-align:center;">';
    html+='<div style="font-size:18px;font-weight:800;color:#16a34a;">✅ 帳目平衡！</div>';
    html+='<div style="font-size:14px;color:#333;margin-top:6px;">資產 $'+fmt(totalAsset)+' ＝ 負債＋權益 $'+fmt(totalLE)+'</div>';
    html+='<div style="font-size:13px;color:#16a34a;margin-top:4px;">會計黃金公式成立，你的帳是正確的 🎉</div>';
    html+='</div></div>';
  }else{
    html+='<div class="card" style="background:#fffbeb;border:2px solid #d97706;"><div class="card-bd">';
    html+='<div style="font-size:16px;font-weight:800;color:#d97706;">⚠️ 兩邊差了 $'+fmt(Math.abs(diff))+'</div>';

    html+='</div></div>';
  }
  return html;
}

}

  const expenses=(S.data.expenses||[]).filter(e=>e.month===m&&e.year===y);
  const cashFlow=(S.data.cashFlow||[]).filter(c=>c.month===m&&c.year===y);
  const deposits=(S.data.deposits||[]).filter(d=>d.month===m&&d.year===y);
  // 上月（用於對比）
  const lastM=m===1?12:m-1;
  const lastY=m===1?y-1:y;
  const lastSales=(S.data.sales||[]).filter(s=>s.month===lastM&&s.year===lastY);
  const lastExp=(S.data.expenses||[]).filter(e=>e.month===lastM&&e.year===lastY);

  // 2. 關鍵數字
  const revenue=sales.reduce((s,r)=>s+toN(r.amount),0);
  const totalExp=expenses.reduce((s,e)=>s+toN(e.amount),0);
  // 從支出中扣除薪資（避免和老師抽成重複），計算真實的「其他支出」
  const salaryExpCalc=expenses.filter(e=>e.category==='薪資').reduce((s,e)=>s+toN(e.amount),0);
  const expExcludingSalary=totalExp-salaryExpCalc;
  // 真實淨利 = 營收 - 其他支出（不含薪資，因為老師抽成已隱含在「公司分到的營收」之中）
  // 這裡為了一致：以支出記帳的薪資為準（你手動記的）
  const profit=revenue-totalExp;  // 認列損益（包含薪資）
  const realProfit=revenue-expExcludingSalary;  // 真實淨利（不含薪資，避免重複扣老師抽成）
  const lastRev=lastSales.reduce((s,r)=>s+toN(r.amount),0);
  const lastExpTotal=lastExp.reduce((s,e)=>s+toN(e.amount),0);
  const revGrowth=lastRev>0?Math.round((revenue-lastRev)/lastRev*100):null;

  // 3. 實際現金流入（排除儲值扣款）
  const cashIn=sales.filter(s=>s.payMethod!=='儲值扣款').reduce((s,r)=>s+toN(r.amount),0);
  const depositIn=deposits.reduce((s,d)=>s+toN(d.actualReceived||d.amount),0);
  const totalCashIn=cashIn+depositIn;

  // 4. 支出分類
  const expByCat={};
  expenses.forEach(e=>{expByCat[e.category]=(expByCat[e.category]||0)+toN(e.amount);});
  const salaryExp=expByCat['薪資']||0;
  const rentExp=expByCat['房租']||0;
  const utilityExp=expByCat['水電']||0;
  const marketingExp=expByCat['行銷廣告']||0;
  const purchaseExp=expByCat['進貨成本']||0;

  // 5. 健康指標計算
  const salaryRatio=revenue>0?salaryExp/revenue*100:0;
  const rentRatio=revenue>0?rentExp/revenue*100:0;
  const marketingRatio=revenue>0?marketingExp/revenue*100:0;
  const purchaseRatio=revenue>0?purchaseExp/revenue*100:0;
  const profitMargin=revenue>0?profit/revenue*100:0;

  // 6. 客戶分析
  const uniqueCustomers=new Set(sales.map(s=>s.customer).filter(c=>c)).size;
  const avgOrder=sales.length>0?revenue/sales.length:0;

  // 7. 損益兩平點計算（簡化版：以固定費用為基礎）
  const fixedCosts=rentExp+utilityExp;  // 房租水電視為相對固定
  const variableExpRatio=revenue>0?(salaryExp+purchaseExp+marketingExp)/revenue:0.6;
  const grossMarginRatio=1-variableExpRatio;
  const breakEven=grossMarginRatio>0?fixedCosts/grossMarginRatio:0;

  // 8. 健康燈號
  const lights={
    profit:profit>=0?'green':profit>-5000?'yellow':'red',
    salary:salaryRatio<45?'green':salaryRatio<55?'yellow':'red',
    marketing:marketingRatio>=5&&marketingRatio<=8?'green':marketingRatio<3?'yellow':marketingRatio>10?'yellow':'green',
    cashflow:totalCashIn>=totalExp?'green':totalCashIn>=totalExp*0.8?'yellow':'red',
    rent:revenue<=0||fixedCosts/revenue*100<=20?'green':fixedCosts/revenue*100<=35?'yellow':'red',
  };

  // 9. 體質診斷
  const allGreen=Object.values(lights).every(l=>l==='green');
  const hasRed=Object.values(lights).some(l=>l==='red');
  const overallHealth=allGreen?'healthy':hasRed?'critical':'warning';

  return{
    m,y,revenue,totalExp,profit,profitMargin,revGrowth,
    cashIn,depositIn,totalCashIn,
    expByCat,salaryExp,rentExp,utilityExp,marketingExp,purchaseExp,
    salaryRatio,rentRatio,marketingRatio,purchaseRatio,
    uniqueCustomers,avgOrder,salesCount:sales.length,
    fixedCosts,breakEven,
    lights,overallHealth,
  };
}

    +'</div></div>';

  if(r.breakEven>0){

    +acts.slice(0,3).map((a,i)=>'<div style="display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:12px 14px;"><div style="flex:1;"><div style="font-size:15px;font-weight:800;">'+(i+1)+'. '+a.t+'</div><div style="font-size:13px;color:#6b7280;margin-top:3px;line-height:1.6;">'+a.d+'</div></div><button class="btn btn-sm" style="background:#7c3aed;color:#fff;flex-shrink:0;" onclick="advAddAction(\''+a.t.replace(/'/g,'').replace(/"/g,'')+'\')">＋ 加到行動計畫</button></div>').join('')
    +'</div></div>';
  // 小辭典
  h+='<details style="margin-top:16px;"><summary style="cursor:pointer;color:#6b7280;font-size:13px;">📖 看不懂的名詞，點這裡</summary><div style="font-size:13px;line-height:1.9;color:#4b5563;margin-top:6px;background:#f9fafb;border-radius:10px;padding:10px 14px;">'
    +'<b>淨賺（淨利）</b>：收入扣掉所有支出後，真正剩下的錢。<br>'
    +'<b>周轉（現金流）</b>：這個月實際收進來、付出去的錢。帳面有賺，不代表手上有錢可以付帳單。<br>'
    +'<b>打平（損益兩平）</b>：收入剛好等於支出、不賺不賠的營收門檻。<br>'
    +'<b>儲值</b>：客人先付錢、之後才來消費。收的時候算現金進來，用的時候才算收入。'
    +'</div></details>';
  h+='</div></div>';
  return h;
}

function pgPriceList(){

  const showAll=S.priceListShowAll||false;

  let prods=showAll?allProds:allProds.filter(p=>p.category==='保養品販售');
  // 搜尋過濾
  if(kw){
    prods=prods.filter(p=>

      (p.series||'').toLowerCase().includes(kw)||
      (p.supplier||'').toLowerCase().includes(kw)
    );
  }
  // 依系列分組
  const groups={};
  prods.forEach(p=>{
    const ser=p.series||'其他';
    if(!groups[ser])groups[ser]=[];
    groups[ser].push(p);
  });
  Object.values(groups).forEach(g=>g.sort((a,b)=>(a.name||'').localeCompare(b.name||'','zh-Hant')));

  const noPriceCount=prods.filter(p=>toN(p.price)<=0&&!(p.specs||[]).some(s=>toN(s.price)>0)).length;

  return`

  <!-- 搜尋列 -->

      style="width:100%;padding:14px 16px;font-size:16px;border:2px solid var(--gold);border-radius:10px;outline:none;background:#fff;">
    <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center;">
      <button class="btn btn-sm ${!showAll?'btn-p':'btn-s'}" onclick="togglePriceListScope(false)">🧴 販售保養品</button>
      <button class="btn btn-sm ${showAll?'btn-p':'btn-s'}" onclick="togglePriceListScope(true)">📦 全部產品</button>
      <span class="tm" style="font-size:12px;margin-left:auto;">共 ${prods.length} 項</span>

          const price=toN(p.price);
          const specs=(p.specs||[]).filter(s=>s.label&&toN(s.price)>0);

          // 有多規格 → 顯示規格表，自動算省多少、打幾折
          if(specs.length>0){
            // 以「最小規格」當基準（specs 已依 units 排序）
            const base=specs[0];
            const baseUnitPrice=toN(base.price)/(toN(base.units)||1);  // 單支等價
            return`<div style="padding:16px;border-bottom:1px solid var(--bdr);">
              <div style="font-size:17px;font-weight:700;color:var(--txt);margin-bottom:2px;">${p.name}</div>
              <div class="tm" style="font-size:12px;margin-bottom:10px;">
                ${p.supplier?`🏪 ${p.supplier}`:''}
                ${hasStock?`　<span style="color:var(--grn);">✓ 有貨 ${inv.qty}</span>`:`　<span style="color:var(--red);">✗ 缺貨</span>`}
              </div>
              <div style="display:flex;flex-direction:column;gap:6px;">
                ${specs.map((sp,idx)=>{
                  const spPrice=toN(sp.price);
                  const spUnits=toN(sp.units)||1;
                  const fullPrice=baseUnitPrice*spUnits;   // 用最小規格單價換算的原價
                  const save=Math.round(fullPrice-spPrice);
                  const discount=fullPrice>0?Math.round(spPrice/fullPrice*100):100;
                  const isBase=idx===0;
                  const isBest=idx===specs.length-1&&specs.length>1;
                  return`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:${isBest?'linear-gradient(90deg,var(--goldL),transparent)':'var(--bg2)'};border-radius:8px;${isBest?'border:1px solid var(--gold);':''}">
                    <div style="flex:1;min-width:0;">
                      <span style="font-weight:700;font-size:15px;color:var(--txt);">${sp.label}</span>
                      ${!isBase&&save>0?`<div class="tm" style="font-size:12px;color:var(--grn);margin-top:2px;">省 $${fmt(save)}　約打 ${(discount/10).toFixed(1)} 折${isBest?'　🔥 最划算':''}</div>`:''}
                    </div>
                    <div style="font-size:20px;font-weight:900;color:var(--gold);white-space:nowrap;margin-left:10px;">$${fmt(spPrice)}</div>
                  </div>`;
                }).join('')}
              </div>
            </div>`;
          }

          // 沒有多規格 → 顯示單一售價（原本的樣子）
          return`<div style="display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--bdr);gap:12px;">
            <div style="flex:1;min-width:0;">
              <div style="font-size:16px;font-weight:700;color:var(--txt);line-height:1.4;">${p.name}</div>
              <div class="tm" style="font-size:12px;margin-top:4px;">
                ${p.supplier?`🏪 ${p.supplier}`:''}
                ${hasStock?`　<span style="color:var(--grn);">✓ 有貨 ${inv.qty}</span>`:`　<span style="color:var(--red);">✗ 缺貨</span>`}
              </div>
            </div>
            <div style="text-align:right;white-space:nowrap;">
              ${price>0?
                `<div style="font-size:22px;font-weight:900;color:var(--gold);">$${fmt(price)}</div>`:
                `<div style="font-size:14px;color:var(--mut);">未定價</div>`
              }
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>
  `).join('')}
  `;
}

window.saveQuickConsume=async function(){
  const qc=S.modal.qc||{};
  const type=document.getElementById('qc_type')?document.getElementById('qc_type').value:'self';
  const typeLabels={self:'工作室自用',sale:'客戶購買',gift:'贈送樣品',damage:'損耗報廢'};
  const items=Object.keys(qc).filter(function(pid){return toN(qc[pid])>0;});
  if(items.length===0){alert('請至少填一個產品的數量');return;}
  setSyncing&&setSyncing('syncing');
  const d=new Date();
  let count=0;
  for(const pid of items){
    const p=(S.data.products||[]).find(function(x){return x.id===pid;});

    const qty=toN(qc[pid]);
    const cost=getAvgCost(pid)*qty;

      const inv=getInv(pid);
      const newInv=(S.data.inventory||[]).map(function(i){return i.productId===pid?Object.assign({},i,{qty:Math.max(0,toN(i.qty)-qty)}):i;});
      if(!newInv.find(function(i){return i.productId===pid;})){newInv.push({productId:pid,qty:0,minQty:toN(inv.minQty)||5});}
      S.data.inventory=newInv;

  }
  setSyncing&&setSyncing('synced');
  S.modal.qc=null;
  toast('✅ 已記錄 '+count+' 項消耗，庫存已扣除');
  closeMod();
  render();

// ═══════════ 💎 客戶資產名單（把熟客量化成資產）═══════════
function calcCustomerAssets(){
  const sales=(S.data.sales||[]).filter(s=>s.customer&&s.type!=='deposit');
  const todayD=new Date();
  const byCust={};
  sales.forEach(s=>{
    const n=s.customer;
    if(!byCust[n])byCust[n]={name:n,total:0,count:0,dates:[]};
    byCust[n].total+=toN(s.amount);
    byCust[n].count++;
    if(s.date)byCust[n].dates.push(s.date);
  });
  const list=Object.values(byCust).map(c=>{
    c.dates.sort();
    const first=c.dates[0]||'';
    const last=c.dates[c.dates.length-1]||'';
    // 多久沒來（天）
    const daysSinceLast=last?Math.floor((todayD-new Date(last))/(1000*60*60*24)):999;
    // 平均回訪間隔（天）
    let avgGap=0;
    if(c.dates.length>=2){
      const span=(new Date(last)-new Date(first))/(1000*60*60*24);
      avgGap=Math.round(span/(c.dates.length-1));
    }
    // 儲值餘額
    const balance=getCustomerBalance(c.name);
    const hasDeposit=balance>0||(S.data.sales||[]).some(s=>s.customer===c.name&&s.payMethod==='儲值扣款');
    // 流失風險：超過「平均間隔×2」或 90 天沒來
    let risk='safe';
    const riskThreshold=avgGap>0?avgGap*2:90;
    if(daysSinceLast>riskThreshold&&daysSinceLast>60)risk='high';
    else if(daysSinceLast>riskThreshold*0.7&&daysSinceLast>45)risk='medium';
    // 資產分級：綜合消費總額、次數、信任
    let tier='一般',tierColor='#9ca3af',tierScore=0;
    tierScore=c.total/1000+c.count*2+(hasDeposit?10:0);
    if(c.total>=30000||(c.count>=8&&hasDeposit))tier='核心資產',tierColor='#9333ea';
    else if(c.total>=12000||c.count>=5)tier='主力客',tierColor='#16a34a';
    else if(c.count>=2)tier='回頭客',tierColor='#0891b2';
    else tier='新客/單次',tierColor='#9ca3af';
    return{...c,first,last,daysSinceLast,avgGap,balance,hasDeposit,risk,tier,tierColor,tierScore};
  });
  list.sort((a,b)=>b.total-a.total);
  return list;
}

function pgCustomers(){
  const customers=S.data.customers||[];
  // 從銷售紀錄自動補齊客戶（防止漏建）— 用 normalize 後的名稱比對
  const allNames=new Set(customers.map(c=>normalizeName(c.name)));
  const salesNames=new Set();
  (S.data.sales||[]).forEach(s=>{if(s.customer)salesNames.add((s.customer||'').trim());});
  (S.data.deposits||[]).forEach(d=>{if(d.customer)salesNames.add((d.customer||'').trim());});
  const ghostCustomers=Array.from(salesNames).filter(n=>n&&!allNames.has(normalizeName(n))).map(n=>({id:'ghost_'+n,name:n,phone:'',note:'',ghost:true}));
  const allCustomers=[...customers,...ghostCustomers];

  // 為每個客戶計算統計
  const customerStats=allCustomers.map(c=>{
    const h=getCustomerHistory(c.name);
    const balance=getCustomerBalance(c.name);
    // 最後造訪：同時看「服務歷史(sales)」與「紋繡紀錄(pmuRecords)」，取較晚者
    const nm=normalizeName(c.name);
    const pmuDates=(S.data.pmuRecords||[]).filter(r=>normalizeName(r.customer)===nm).map(r=>r.date).filter(Boolean);
    const lastSales=h.services.length>0?h.services[0].date:null;
    const lastVisit=[lastSales,...pmuDates].filter(Boolean).sort().slice(-1)[0]||null;
    return{...c,...h,balance,lastVisit};
  }).sort((a,b)=>(b.lastVisit||'').localeCompare(a.lastVisit||''));

  const totalLiability=getTotalDepositLiability();
  const totalCustomers=allCustomers.length;

  // 若有選定客戶，顯示詳細資料
  if(S.selectedCustomer){
    const c=customerStats.find(x=>x.name===S.selectedCustomer);
    if(!c)return pgCustomersList(customerStats,totalLiability,totalCustomers);
    return pgCustomerDetail(c);
  }
  return pgCustomersList(customerStats,totalLiability,totalCustomers);
}

// 補色提醒：複製訊息
// 計算某筆紋繡紀錄「現在補色該收多少」
function getTouchupPrice(r){
  const pricing=(S.data.settings&&S.data.settings.pmuPricing)||DEFAULT_PMU_PRICING;
  const svc=(r.serviceType||'').includes('唇')?'霧唇':'霧眉';
  const p=pricing[svc];
  if(!p)return null;
  const start=new Date(r.date);
  const now=new Date();
  const monthsDiff=(now.getFullYear()-start.getFullYear())*12+(now.getMonth()-start.getMonth());
  const freeMonths=toN(p.freeMonths)||3;
  var price,label,isFree=false,note='';
  if(monthsDiff<freeMonths){
    price=0;isFree=true;label='免費補色';note='（'+freeMonths+'個月內免費一次）';
  }else if(monthsDiff<12){
    price=pmuTierPrice(p,'m4to12');label='回娘家補色';note='（第'+(freeMonths+1)+'~12個月・原價'+Math.round((toN(p.m4to12Discount)||0.4)*10)+'折）';
  }else if(monthsDiff<24){
    price=pmuTierPrice(p,'y1to2');
    label='老客回娘家';note='（第1~2年 原價'+Math.round((toN(p.y1to2Discount)||0.6)*10)+'折）';
  }else{
    price=pmuTierPrice(p,'over2');
    label='久違回娘家';note='（超過2年 原價'+Math.round((toN(p.over2Discount)||0.8)*10)+'折）';
  }
  return {svc:svc,price:price,label:label,isFree:isFree,note:note,monthsDiff:monthsDiff};
}

window.pmuSendTouchup=(id)=>{
  const r=(S.data.pmuRecords||[]).find(x=>x.id===id);
  if(!r)return;
  const tp=getTouchupPrice(r);

// 小重點編輯（path 例："0" = 第1個重點，"0.2" = 它的第3個小重點）
function noteSubEditor(subs,path,depth){
  subs=subs||[];
  let h='<div style="margin-top:8px;'+(depth?'margin-left:14px;':'')+'border-left:3px solid #e9d5ff;padding-left:10px;">';
  subs.forEach((x,j)=>{const pp=path+'.'+j;
    h+='<div style="background:#fff;border:1px solid #f3e8ff;border-radius:8px;padding:8px;margin-bottom:6px;">'
      +'<div style="display:flex;gap:6px;align-items:center;"><span style="color:#9333ea;font-weight:800;">▸</span><input type="text" value="'+(x.label||'').replace(/"/g,'&quot;')+'" placeholder="小重點標題" oninput="noteSubSet(\''+pp+'\',\'label\',this.value)" style="flex:1;font-weight:700;"><button type="button" class="bdel" onclick="noteSubDel(\''+pp+'\')">×</button></div>'
      +'<textarea rows="2" placeholder="內容（可空白）" oninput="noteSubSet(\''+pp+'\',\'text\',this.value)" style="width:100%;margin-top:6px;font-size:14px;line-height:1.7;">'+(x.text||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</textarea>'
      +(depth<3?noteSubEditor(x.subs,pp,depth+1):'')
      +'</div>';
  });
  h+='<button type="button" class="btn btn-s btn-sm" style="font-size:12px;" onclick="noteSubAdd(\''+path+'\')">＋ '+(depth?'再往內加':'加小重點')+'</button></div>';
  return h;
}
function noteSubNode(path){
  const ix=path.split('.').map(Number);
  let o=S.modal.noteDraft.points[ix[0]];
  for(let k=1;k<ix.length&&o;k++)o=(o.subs||[])[ix[k]];

}
function noteSubRedraw(path){const i=Number(path.split('.')[0]);const el=$('note_subs_'+i);if(el)el.innerHTML=noteSubEditor(S.modal.noteDraft.points[i].subs,String(i),0);}
window.noteSubAdd=function(path){if(!S.modal?.noteDraft)return;const o=noteSubNode(path);if(!o)return;o.subs=(o.subs||[]).concat([{label:'',text:'',subs:[]}]);noteSubRedraw(path);};
window.noteSubSet=function(path,f,v){if(!S.modal?.noteDraft)return;const o=noteSubNode(path);if(o)o[f]=v;};
window.noteSubDel=function(path){if(!S.modal?.noteDraft)return;const ix=path.split('.');const j=Number(ix.pop());const par=noteSubNode(ix.join('.'));if(!par||!par.subs)return;const x=par.subs[j];if(x&&((x.label||'').trim()||(x.text||'').trim()||noteSubCount(x))&&!confirm('刪除這個小重點'+(noteSubCount(x)?'（和底下 '+noteSubCount(x)+' 個）':'')+'？'))return;par.subs.splice(j,1);noteSubRedraw(path);};

// ── 筆記畫重點工具列（條列筆記、聯想筆記共用）──
const NOTE_FMT=[
  {m:'==',lbl:'螢光黃',st:'background:#fde047;color:#422006;font-weight:700;'},
  {m:'%%',lbl:'螢光粉',st:'background:#fbcfe8;color:#831843;font-weight:700;'},
  {m:'!!',lbl:'紅字',st:'background:#fff;color:#dc2626;font-weight:800;'},
  {m:'**',lbl:'金字',st:'background:#fff;color:#b45309;font-weight:800;'},
  {m:'@@',lbl:'藍字',st:'background:#fff;color:#2563eb;font-weight:800;'},
  {m:'++',lbl:'粗體',st:'background:#fff;color:#111;font-weight:900;'},
  {m:'~~',lbl:'斜體',st:'background:#fff;color:#111;font-style:italic;'},
  {m:'__',lbl:'底線',st:'background:#fff;color:#111;text-decoration:underline;text-decoration-color:#9333ea;text-decoration-thickness:2px;'}
];
function noteFmtToolbar(taId){
  // onmousedown/ontouchstart 先 preventDefault：點按鈕時不會讓輸入框失焦，選好的字不會跑掉
  let h='<div style="display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px;align-items:center;">';
  h+='<span style="font-size:12px;color:#6b7280;width:100%;">✍️ 先選取文字，再點要的標記：</span>';
  NOTE_FMT.forEach(f=>{
    h+='<button type="button" onmousedown="event.preventDefault()" ontouchstart="noteFmtKeep(\''+taId+'\')" onclick="noteFmt(\''+taId+'\',\''+f.m+'\')" style="'+f.st+'font-size:14px;padding:6px 11px;border:1px solid #e5e7eb;border-radius:8px;cursor:pointer;min-height:36px;">'+f.lbl+'</button>';
  });
  h+='<button type="button" onmousedown="event.preventDefault()" ontouchstart="noteFmtKeep(\''+taId+'\')" onclick="noteFmtClear(\''+taId+'\')" style="font-size:13px;padding:6px 11px;border:1px dashed #9ca3af;background:#f9fafb;color:#6b7280;border-radius:8px;cursor:pointer;min-height:36px;">⌫ 清除標記</button>';
  h+='</div>';
  return h;
}
// 手機：點按鈕前先記住選取範圍（有些手機一碰按鈕就會清掉選取）
const _noteSel={};
window.noteFmtKeep=function(taId){const ta=document.getElementById(taId);if(ta&&ta.selectionStart!==ta.selectionEnd)_noteSel[taId]=[ta.selectionStart,ta.selectionEnd];};
document.addEventListener('selectionchange',function(){const a=document.activeElement;if(a&&a.tagName==='TEXTAREA'&&a.id&&a.selectionStart!==a.selectionEnd)_noteSel[a.id]=[a.selectionStart,a.selectionEnd];});
function noteFmtRange(ta){
  let s=ta.selectionStart,e=ta.selectionEnd;
  if(s===e&&_noteSel[ta.id]){s=_noteSel[ta.id][0];e=_noteSel[ta.id][1];}
  return [s,e];
}
function noteFmtCommit(ta,newVal,selS,selE){
  ta.value=newVal;
  try{ta.focus();ta.setSelectionRange(selS,selE);}catch(e){}
  delete _noteSel[ta.id];
  ta.dispatchEvent(new Event('input',{bubbles:true}));
}
window.noteFmt=function(taId,mark){
  const ta=document.getElementById(taId);if(!ta)return;
  const [s,e]=noteFmtRange(ta);
  if(s===e){toast('請先用手指（或滑鼠）選取要標示的文字');return;}
  const v=ta.value,sel=v.substring(s,e);
  // 已經有同樣標記 → 取消（再點一次可移除）
  if(v.substring(s-mark.length,s)===mark&&v.substring(e,e+mark.length)===mark){
    noteFmtCommit(ta,v.substring(0,s-mark.length)+sel+v.substring(e+mark.length),s-mark.length,e-mark.length);return;
  }
  noteFmtCommit(ta,v.substring(0,s)+mark+sel+mark+v.substring(e),s+mark.length,e+mark.length);
};
window.noteFmtClear=function(taId){
  const ta=document.getElementById(taId);if(!ta)return;
  let [s,e]=noteFmtRange(ta);
  const v=ta.value;
  if(s===e){s=0;e=v.length;if(!confirm('沒有選取文字，要清除這一段全部的標記嗎？'))return;}
  // 往外延伸，把包住選取範圍的標記也一起拿掉
  NOTE_FMT.forEach(f=>{while(s>=f.m.length&&v.substring(s-f.m.length,s)===f.m&&v.substring(e,e+f.m.length)===f.m){s-=f.m.length;e+=f.m.length;}});
  let mid=v.substring(s,e);
  NOTE_FMT.forEach(f=>{mid=mid.split(f.m).join('');});
  noteFmtCommit(ta,v.substring(0,s)+mid+v.substring(e),s,s+mid.length);
};
function notePreviewBox(id,text){
  return '<div style="font-size:11px;color:#9ca3af;margin-top:6px;">👀 預覽（儲存後就長這樣）</div><div id="'+id+'" style="background:#fff;border:1px dashed #e5e7eb;border-radius:8px;padding:8px 10px;font-size:15px;line-height:1.85;white-space:pre-wrap;min-height:28px;color:#333;">'+(renderNoteText(text||'')||'<span style="color:#ccc;">（還沒有內容）</span>')+'</div>';
}
