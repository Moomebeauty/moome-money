// ── 月度盤點：計算單筆差異 + 即時更新摘要 ──
window.calcStockDiff=(input)=>{
  const tr=input.closest('tr');
  if(!tr)return;
  const systemQty=parseFloat(input.dataset.systemqty)||0;
  const actual=input.value===''?null:parseFloat(input.value);
  const diffCell=tr.querySelector('.msc_diff');
  if(actual===null||isNaN(actual)){
    diffCell.textContent='-';
    diffCell.style.color='';
  }else{
    const diff=actual-systemQty;
    if(diff===0){
      diffCell.textContent='✓ 一致';
      diffCell.style.color='var(--grn)';
    }else if(diff>0){
      diffCell.textContent=`+${diff}`;
      diffCell.style.color='var(--blu)';
    }else{
      diffCell.textContent=`${diff}`;
      diffCell.style.color='var(--red)';
    }
  }
  // 更新摘要
  const allRows=document.querySelectorAll('.msc_actual');
  let filled=0,match=0,shortage=0,surplus=0,shortQty=0,surplusQty=0;
  allRows.forEach(el=>{
    if(el.value==='')return;
    filled++;
    const sys=parseFloat(el.dataset.systemqty)||0;
    const act=parseFloat(el.value)||0;
    const d=act-sys;
    if(d===0)match++;
    else if(d<0){shortage++;shortQty+=Math.abs(d);}
    else{surplus++;surplusQty+=d;}
  });
  const summary=$('m_msc_summary');
  const text=$('m_msc_summary_text');
  if(filled>0&&summary&&text){
    summary.style.display='block';
    let html=`已盤點 <b>${filled}</b> 項　`;
    if(match>0)html+=`<span style="color:var(--grn);">✓ ${match} 項一致</span>　`;
    if(shortage>0)html+=`<span style="color:var(--red);">▼ ${shortage} 項短少 (共 -${shortQty})</span>　`;
    if(surplus>0)html+=`<span style="color:var(--blu);">▲ ${surplus} 項盤盈 (共 +${surplusQty})</span>`;
    text.innerHTML=html;
  }else if(summary){
    summary.style.display='none';
  }
};

window.saveMonthStockCheck=async()=>{
  try{
    const date=$('m_msc_date')?.value;
    const by=$('m_msc_by')?.value||'';
    if(!date){alert('請選擇盤點日期');return;}
    const rows=document.querySelectorAll('tr[data-pid]');
    if(rows.length===0){alert('沒有可盤點的產品');return;}
    let updates=[];
    let stats={total:0,match:0,shortage:0,surplus:0,shortQty:0,surplusQty:0};
    rows.forEach(row=>{
      const pid=row.dataset.pid;
      const input=row.querySelector('.msc_actual');
      if(!input||input.value==='')return;
      const actual=parseFloat(input.value);
      if(isNaN(actual))return;
      const systemQty=parseFloat(input.dataset.systemqty)||0;
      const diff=actual-systemQty;
      stats.total++;
      if(diff===0)stats.match++;
      else if(diff<0){stats.shortage++;stats.shortQty+=Math.abs(diff);}
      else{stats.surplus++;stats.surplusQty+=diff;}
      updates.push({pid,actual,systemQty,diff});
    });
    if(updates.length===0){alert('請至少填寫一筆實際庫存');return;}
    let confirmMsg=`確認執行盤點？\n\n盤點日期：${date}\n盤點 ${updates.length} 項`;
    if(stats.match>0)confirmMsg+=`\n✓ ${stats.match} 項一致`;
    if(stats.shortage>0)confirmMsg+=`\n▼ ${stats.shortage} 項短少（共 -${stats.shortQty}）`;
    if(stats.surplus>0)confirmMsg+=`\n▲ ${stats.surplus} 項盤盈（共 +${stats.surplusQty}）`;
    confirmMsg+=`\n\n系統庫存將被覆蓋為實際盤點數量`;
    if(!confirm(confirmMsg))return;
    // 更新庫存 + 為差異建立 stockOuts 紀錄
    const newInv=[...(S.data.inventory||[])];
    const d=new Date(date);
    for(const u of updates){
      const idx=newInv.findIndex(i=>i.productId===u.pid);
      const old=idx>=0?newInv[idx]:{productId:u.pid,qty:0,minQty:1};
      const updated={...old,qty:u.actual};
      if(idx>=0)newInv[idx]=updated;
      else newInv.push(updated);
      // 為差異建立 stockOuts 紀錄（僅當有差異時）
      if(u.diff!==0){
        const prod=(S.data.products||[]).find(p=>p.id===u.pid);
        const type=u.diff<0?'damage':'gift';  // 短少→損耗、盤盈→其他（用 gift 暫代）
        const note=u.diff<0?`【月度盤點短少】${date}　應有 ${u.systemQty} → 實際 ${u.actual}`:`【月度盤點盤盈】${date}　應有 ${u.systemQty} → 實際 ${u.actual}`;
        try{
          await addSub('stockOuts',{
            date,
            type:'check',  // 盤點類型
            productId:u.pid,
            productName:prod?.name||'',
            qty:Math.abs(u.diff),
            unitCost:getAvgCost(u.pid),
            totalCost:Math.abs(u.diff)*getAvgCost(u.pid),
            note,
            checkBy:by,
            isShortage:u.diff<0,
            month:d.getMonth()+1,year:d.getFullYear()
          });
        }catch(e){console.warn('盤點紀錄失敗',e);}
      }
    }
    await saveMain({inventory:newInv});
    toast(`✅ 盤點完成 ${updates.length} 項　${date}`);
    closeMod();
  }catch(err){
    console.error('saveMonthStockCheck 失敗:',err);
    alert('失敗：'+(err.message||err));
  }
};

// 檢查孤兒現金流紀錄（儲值入帳但找不到對應的 deposits 紀錄）
window.findOrphanCashFlows=async()=>{
  const cashFlows=S.data.cashFlow||[];
  const deposits=S.data.deposits||[];
  const orphans=[];
  cashFlows.forEach(c=>{
    if(c.cat!=='儲值入帳')return;
    // 找對應的 deposit
    const noteCustomer=(c.note||'').split(' ')[0]; // 例如 "吃早餐 儲值面額..." → "吃早餐"
    const targetAmount=toN(c.amount);
    const found=deposits.find(d=>
      d.date===c.date&&
      toN(d.actualReceived||d.amount)===targetAmount&&
      ((d.customer||'').trim()===(noteCustomer||'').trim()||(c.note||'').includes(d.customer||''))
    );
    if(!found)orphans.push(c);
  });
  if(orphans.length===0){
    alert('✅ 沒有孤兒紀錄，現金流資料一致！');
    return;
  }
  const list=orphans.map(o=>`• ${o.date}　$${fmt(o.amount)}　${o.note||''}`).join('\n');
  if(!confirm(`找到 ${orphans.length} 筆孤兒紀錄（已刪除儲值但紀錄還在）：\n\n${list}\n\n是否一鍵清除？`))return;
  for(const o of orphans){await delSub('cashFlow',o.id);}
  toast(`✅ 已清除 ${orphans.length} 筆孤兒紀錄`);
  render();
};

// ─── 🔄 老師改名工具（把舊紀錄的老師名字整批改成新名字）───
window.renameStaff=async()=>{
  const oldName=prompt('請輸入「舊的老師名字」（要被改掉的，例如：珞熙）：');
  if(!oldName||!oldName.trim())return;
  const newName=prompt(`請輸入「新的老師名字」（例如：于蜜）：\n\n將把所有紀錄中的「${oldName.trim()}」改成新名字`);
  if(!newName||!newName.trim())return;
  const o=oldName.trim(),nn=newName.trim();
  if(o===nn){alert('新舊名字一樣，不用改');return;}

  // 先掃描有多少筆會被影響
  const sales=(S.data.sales||[]).filter(s=>s.staff===o);
  const courses=(S.data.courses||[]).filter(c=>c.instructor===o);
  const serviceRecords=(S.data.serviceRecords||[]).filter(r=>r.staff===o);
  const deposits=(S.data.deposits||[]).filter(d=>d.staff===o);
  const total=sales.length+courses.length+serviceRecords.length+deposits.length;

  if(total===0){
    alert(`找不到任何「${o}」的紀錄。\n\n可能名字打錯了，或這位老師本來就沒有紀錄。`);
    return;
  }

  if(!confirm(`即將把以下紀錄的老師名字從「${o}」改成「${nn}」：\n\n• 業績/收入：${sales.length} 筆\n• 課程：${courses.length} 筆\n• 服務紀錄：${serviceRecords.length} 筆\n• 儲值：${deposits.length} 筆\n────────\n共 ${total} 筆\n\n改完後「${o}」的舊業績會全部併到「${nn}」名下。\n\n確定要執行嗎？`))return;

  setSyncing('syncing');
  let done=0;
  try{
    // 1. sales（子集合）
    for(const s of sales){
      await setSub('sales',s.id,{...s,staff:nn});
      const idx=(S.data.sales||[]).findIndex(x=>x.id===s.id);
      if(idx>=0)S.data.sales[idx].staff=nn;
      done++;
    }
    // 2. courses（子集合）
    for(const c of courses){
      await setSub('courses',c.id,{...c,instructor:nn});
      const idx=(S.data.courses||[]).findIndex(x=>x.id===c.id);
      if(idx>=0)S.data.courses[idx].instructor=nn;
      done++;
    }
    // 3. serviceRecords（子集合，如果有）
    for(const r of serviceRecords){
      await setSub('serviceRecords',r.id,{...r,staff:nn});
      const idx=(S.data.serviceRecords||[]).findIndex(x=>x.id===r.id);
      if(idx>=0)S.data.serviceRecords[idx].staff=nn;
      done++;
    }
    // 4. deposits（子集合）
    for(const d of deposits){
      await setSub('deposits',d.id,{...d,staff:nn});
      const idx=(S.data.deposits||[]).findIndex(x=>x.id===d.id);
      if(idx>=0)S.data.deposits[idx].staff=nn;
      done++;
    }
    setSyncing('synced');
    alert(`✅ 完成！已把 ${done} 筆紀錄的「${o}」改成「${nn}」。\n\n現在「${nn}」的業績已包含原本「${o}」的所有紀錄。`);
    render();
  }catch(err){
    setSyncing('error');
    console.error('老師改名失敗',err);
    alert(`改名過程發生錯誤（已完成 ${done}/${total} 筆）：\n${err.message||err}\n\n可以再點一次按鈕，會繼續處理剩下的。`);
  }
};

window.recalcAvgCost=async()=>{
  const purchases=S.data.purchases||[];
  const products=S.data.products||[];
  if(purchases.length===0){
    alert('沒有進貨紀錄，無法重算。');
    return;
  }
  // 依產品彙總：總成本 ÷ 總數量
  const agg={};
  purchases.forEach(p=>{
    const pid=p.productId;
    if(!pid)return;
    if(!agg[pid])agg[pid]={qty:0,cost:0,count:0};
    agg[pid].qty+=toN(p.qty);
    agg[pid].cost+=toN(p.totalCost);
    agg[pid].count++;
  });

  // 算出新舊差異
  const changes=[];
  Object.entries(agg).forEach(([pid,a])=>{
    if(a.qty<=0)return;
    const newAvg=Math.round(a.cost/a.qty*100)/100;
    const oldAvg=Math.round(toN(getInv(pid).avgCost)*100)/100;
    if(Math.abs(newAvg-oldAvg)>=0.01){
      const p=products.find(x=>x.id===pid);
      changes.push({pid,name:p?.name||'(未知產品)',oldAvg,newAvg,count:a.count});
    }
  });

  if(changes.length===0){
    alert('✅ 所有產品的加權平均成本都已經是正確的，不需要重算。');
    return;
  }

  const preview=changes.slice(0,12).map(c=>
    `• ${c.name}：$${c.oldAvg} → $${c.newAvg}（${c.count} 筆進貨）`
  ).join('\n');
  const more=changes.length>12?`\n...還有 ${changes.length-12} 項`:'';

  if(!confirm(`即將重算 ${changes.length} 個產品的加權平均成本：\n\n${preview}${more}\n\n算法：該產品所有進貨的總成本 ÷ 總數量\n\n⚠️ 這會覆蓋你手動改過的成本，確定要重算嗎？`))return;

  setSyncing('syncing');
  try{
    let newInv=[...(S.data.inventory||[])];
    changes.forEach(c=>{
      const idx=newInv.findIndex(i=>i.productId===c.pid);
      if(idx>=0){
        newInv[idx]={...newInv[idx],avgCost:c.newAvg};
      }else{
        newInv.push({productId:c.pid,qty:0,minQty:1,avgCost:c.newAvg});
      }
    });
    await saveMain({inventory:newInv});
    setSyncing('synced');
    alert(`✅ 已重算 ${changes.length} 個產品的加權平均成本。\n\n服務成本卡、定價規劃器的數字也會跟著更新。`);
    render();
  }catch(err){
    setSyncing('error');
    console.error('重算成本失敗',err);
    alert('重算失敗：'+(err.message||err));
  }
};

// ─── 🔧 從進貨紀錄重建產品清單與庫存 ───
window.rebuildInventoryFromPurchases=async()=>{
  const purchases=S.data.purchases||[];
  if(purchases.length===0){
    alert('沒有進貨紀錄，無法重建。\n\n如果你確定有進貨資料，可能還在同步中，請稍等幾秒再試。');
    return;
  }
  const existingProducts=S.data.products||[];
  const existingIds=new Set(existingProducts.map(p=>p.id));
  const existingNames=new Set(existingProducts.map(p=>(p.name||'').trim()));

  // 從進貨紀錄彙整出所有產品（依 productId 分組）
  const productMap={};  // productId -> 產品資訊 + 累計進貨
  purchases.forEach(pur=>{
    const pid=pur.productId;
    if(!pid)return;
    if(!productMap[pid]){
      productMap[pid]={
        id:pid,
        name:pur.productName||'未命名產品',
        category:pur.category||'其他',
        supplier:pur.supplier||'',
        series:pur.series||'',
        totalQty:0,
        totalCost:0,
        lastUnitCost:0
      };
    }
    productMap[pid].totalQty+=toN(pur.qty);
    productMap[pid].totalCost+=toN(pur.totalCost);
    if(toN(pur.unitCost)>0)productMap[pid].lastUnitCost=toN(pur.unitCost);
  });

  // 扣掉出貨耗用的數量
  const stockOuts=S.data.stockOuts||[];
  stockOuts.forEach(so=>{
    const pid=so.productId;
    if(pid&&productMap[pid]){
      productMap[pid].totalQty-=toN(so.qty);
    }
  });

  const rebuildProducts=Object.values(productMap);
  const newCount=rebuildProducts.filter(p=>!existingIds.has(p.id)).length;

  if(newCount===0){
    alert(`診斷：進貨紀錄裡的 ${rebuildProducts.length} 個產品，系統裡都已經存在了。\n\n所以不需要重建。如果庫存盤點還是空白，請強制重新整理（Cmd+Shift+R）看看。`);
    return;
  }

  if(!confirm(`即將從進貨紀錄重建產品和庫存：\n\n• 進貨中的產品總數：${rebuildProducts.length} 種\n• 系統現有：${existingProducts.length} 種\n• 需要補回：${newCount} 種\n\n重建方式：\n- 產品名稱、類別、廠商 → 從進貨紀錄取得\n- 庫存數量 → 進貨總量 減 出貨耗用量\n- 平均成本 → 進貨總成本 ÷ 進貨總量\n\n（已存在的產品不會被覆蓋）\n\n確定要重建嗎？`))return;

  setSyncing('syncing');
  try{
    // 合併：保留現有產品，補上缺的
    const mergedProducts=[...existingProducts];
    const mergedInventory=[...(S.data.inventory||[])];
    const existInvIds=new Set(mergedInventory.map(i=>i.productId));

    rebuildProducts.forEach(rp=>{
      const avgCost=rp.totalQty>0?Math.round(rp.totalCost/(rp.totalQty+ (stockOuts.filter(s=>s.productId===rp.id).reduce((a,s)=>a+toN(s.qty),0)) )):rp.lastUnitCost;
      // 補產品
      if(!existingIds.has(rp.id)){
        mergedProducts.push({
          id:rp.id,
          name:rp.name,
          category:rp.category,
          supplier:rp.supplier,
          series:rp.series,
          price:0,  // 售價進貨紀錄沒有，先設0，之後手動補
          cost:rp.lastUnitCost||avgCost
        });
      }
      // 補庫存
      if(!existInvIds.has(rp.id)){
        mergedInventory.push({
          productId:rp.id,
          qty:Math.max(0,rp.totalQty),
          minQty:1,
          avgCost:rp.lastUnitCost||avgCost,
          totalPurchaseCost:rp.totalCost
        });
      }
    });

    await saveMain({products:mergedProducts,inventory:mergedInventory});
    setSyncing('synced');
    alert(`✅ 重建完成！\n\n• 產品清單：現在有 ${mergedProducts.length} 種\n• 庫存紀錄：現在有 ${mergedInventory.length} 筆\n\n請到「庫存盤點」查看。\n\n注意：重建的產品「售價」會是 0，請到產品清單手動補上售價。庫存數量是用「進貨減出貨」算的，如果之前有手動調整過庫存，可能要再核對一下。`);
    render();
  }catch(err){
    setSyncing('error');
    console.error('重建庫存失敗',err);
    alert('重建失敗：'+(err.message||err));
  }
};

window.depositHealthCheck=async()=>{
  const deposits=S.data.deposits||[];
  const sales=S.data.sales||[];
  const customers=S.data.customers||[];
  const cashFlow=S.data.cashFlow||[];

  // 1. 基本數字
  const totalFaceAmount=deposits.reduce((s,d)=>s+toN(d.amount),0);
  const totalCashReceived=deposits.reduce((s,d)=>s+toN(d.actualReceived||d.amount),0);
  const totalDiscount=totalFaceAmount-totalCashReceived;

  // 2. 已使用的儲值（從 sales 統計）
  const depositSales=sales.filter(s=>s.payMethod==='儲值扣款');
  const totalUsed=depositSales.reduce((s,r)=>s+toN(r.depositFaceAmount||r.amount),0);

  // 3. 理論餘額 = 累計儲值 - 累計扣款
  const theoreticalBalance=totalFaceAmount-totalUsed;

  // 4. 系統顯示的負債餘額（透過每個客戶加總）
  const systemDisplayBalance=getTotalDepositLiability();

  // 5. 差異
  const diff=theoreticalBalance-systemDisplayBalance;

  // 6. 各客戶餘額明細
  const custBalances={};
  deposits.forEach(d=>{
    const name=(d.customer||'').trim();
    if(!name)return;
    custBalances[name]=(custBalances[name]||0)+toN(d.amount);
  });
  depositSales.forEach(s=>{
    const owner=((s.depositOwner||s.customer)||'').trim();
    if(!owner)return;
    custBalances[owner]=(custBalances[owner]||0)-toN(s.depositFaceAmount||s.amount);
  });

  // 7. 偵測問題
  const issues=[];

  // 問題 A：負餘額（扣超過儲值）
  const negativeBalances=Object.entries(custBalances).filter(([n,b])=>b<-1);// 容許 $1 誤差
  if(negativeBalances.length>0){
    issues.push({
      type:'negative',
      severity:'high',
      title:`${negativeBalances.length} 位客戶餘額為負`,
      detail:negativeBalances.map(([n,b])=>`• ${n}: $${fmt(b)}`).join('\n'),
      action:'這代表扣款超過儲值。請檢查是否誤扣，或補登儲值紀錄。'
    });
  }

  // 問題 B：無歸屬扣款（payMethod=儲值扣款 但無 customer 或 depositOwner）
  const orphanedSales=depositSales.filter(s=>{
    const owner=((s.depositOwner||s.customer)||'').trim();
    return !owner;
  });
  if(orphanedSales.length>0){
    issues.push({
      type:'orphan_sale',
      severity:'high',
      title:`${orphanedSales.length} 筆儲值扣款沒有歸屬客戶`,
      detail:orphanedSales.slice(0,5).map(s=>`• ${s.date} $${fmt(s.amount)} - ${s.serviceName||'未填'}`).join('\n')+(orphanedSales.length>5?`\n... 還有 ${orphanedSales.length-5} 筆`:''),
      action:'這些扣款沒有從任何客戶餘額扣，會造成系統負債餘額虛高。需要編輯這些銷售紀錄，指定客戶。'
    });
  }

  // 問題 C：儲值客戶不存在於客戶名單
  const depositCustomers=new Set(deposits.map(d=>(d.customer||'').trim()).filter(n=>n));
  const customerNames=new Set(customers.map(c=>(c.name||'').trim()).filter(n=>n));
  const ghostCustomers=Array.from(depositCustomers).filter(n=>!customerNames.has(n));
  if(ghostCustomers.length>0){
    issues.push({
      type:'ghost',
      severity:'low',
      title:`${ghostCustomers.length} 位儲值客戶未正式建檔`,
      detail:ghostCustomers.map(n=>`• ${n}`).join('\n'),
      action:'這些客戶有儲值但沒在「客戶管理」建檔。不影響餘額計算，建議到客戶管理頁正式建檔。'
    });
  }

  // 問題 D：deposit 缺 actualReceived（無法計算折扣率）
  const missingActual=deposits.filter(d=>!toN(d.actualReceived)&&toN(d.amount)>0);
  if(missingActual.length>0){
    issues.push({
      type:'missing_cash',
      severity:'medium',
      title:`${missingActual.length} 筆儲值未填「實收金額」`,
      detail:missingActual.slice(0,5).map(d=>`• ${d.date} ${d.customer} 面額 $${fmt(d.amount)}`).join('\n')+(missingActual.length>5?`\n... 還有 ${missingActual.length-5} 筆`:''),
      action:'未填實收金額會導致折扣率無法計算（預設 100% 無折扣）。請編輯這些紀錄補填。'
    });
  }

  // 問題 E：系統餘額 vs 理論餘額不一致
  if(Math.abs(diff)>1){
    issues.push({
      type:'balance_mismatch',
      severity:'high',
      title:`總負債餘額不一致（差 $${fmt(Math.abs(diff))}）`,
      detail:`理論餘額（總儲值面額 - 總使用面額）= $${fmt(theoreticalBalance)}\n系統顯示負債餘額 = $${fmt(systemDisplayBalance)}\n差距 = $${fmt(diff)}`,
      action:diff>0?'系統顯示餘額比理論少（可能有客戶被刪除但儲值還在計算中，或有歸屬錯誤）':'系統顯示餘額比理論多（可能有重複的儲值紀錄）'
    });
  }

  // 問題 F：儲值有對應的現金流嗎？
  const depositsWithoutFlow=deposits.filter(d=>{
    if(!toN(d.actualReceived))return false;// 沒實收金額不需要現金流
    const hasFlow=cashFlow.some(f=>f.depositRefId===d.id||(f.note||'').includes(`儲值-${d.customer}`));
    return !hasFlow;
  });
  if(depositsWithoutFlow.length>0&&depositsWithoutFlow.length<deposits.length){// 全部沒有就不是 bug
    issues.push({
      type:'no_cashflow',
      severity:'low',
      title:`${depositsWithoutFlow.length} 筆儲值沒有對應現金流紀錄`,
      detail:depositsWithoutFlow.slice(0,3).map(d=>`• ${d.date} ${d.customer} $${fmt(d.actualReceived)}`).join('\n'),
      action:'這些儲值收到的錢沒寫入現金流水帳，會影響現金流分析。可手動補登或從現金流頁面新增。'
    });
  }

  // 顯示報告
  const reportHTML=`<div class="mttl">🩺 儲值資料健檢報告</div>
    <div style="max-height:60vh;overflow-y:auto;padding:4px;">

      <!-- 一、總覽 -->
      <div style="background:linear-gradient(135deg,var(--goldL),#fff);padding:14px;border-radius:8px;margin-bottom:14px;">
        <div style="font-weight:700;color:var(--gold);margin-bottom:10px;font-size:15px;">📊 整體儲值狀況</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;font-size:13px;">
          <div style="background:#fff;padding:8px 10px;border-radius:6px;">
            <div class="tm" style="font-size:11px;">儲值筆數</div>
            <div style="font-weight:700;color:var(--gold);font-size:16px;">${deposits.length} 筆</div>
          </div>
          <div style="background:#fff;padding:8px 10px;border-radius:6px;">
            <div class="tm" style="font-size:11px;">累計儲值面額</div>
            <div style="font-weight:700;color:var(--rose);font-size:16px;">$${fmt(totalFaceAmount)}</div>
          </div>
          <div style="background:#fff;padding:8px 10px;border-radius:6px;">
            <div class="tm" style="font-size:11px;">累計實收現金</div>
            <div style="font-weight:700;color:var(--grn);font-size:16px;">$${fmt(totalCashReceived)}</div>
          </div>
          <div style="background:#fff;padding:8px 10px;border-radius:6px;">
            <div class="tm" style="font-size:11px;">累計折扣讓利</div>
            <div style="font-weight:700;color:var(--red);font-size:16px;">$${fmt(totalDiscount)}</div>
          </div>
          <div style="background:#fff;padding:8px 10px;border-radius:6px;">
            <div class="tm" style="font-size:11px;">已使用面額</div>
            <div style="font-weight:700;color:var(--blu);font-size:16px;">$${fmt(totalUsed)}</div>
          </div>
          <div style="background:#fff;padding:8px 10px;border-radius:6px;">
            <div class="tm" style="font-size:11px;">剩餘負債</div>
            <div style="font-weight:700;color:var(--pur);font-size:16px;">$${fmt(systemDisplayBalance)}</div>
          </div>
        </div>
        <div style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--bdr);font-size:12px;color:var(--mut);">
          理論餘額：$${fmt(theoreticalBalance)}（總儲值 $${fmt(totalFaceAmount)} - 已使用 $${fmt(totalUsed)}）<br>
          系統顯示：$${fmt(systemDisplayBalance)}<br>
          差距：${Math.abs(diff)<=1?'<b style="color:var(--grn);">✅ 一致</b>':`<b style="color:var(--red);">⚠️ $${fmt(Math.abs(diff))}</b>`}
        </div>
      </div>

      <!-- 二、客戶餘額明細 -->
      <div style="margin-bottom:14px;">
        <div style="font-weight:700;color:var(--pur);margin-bottom:8px;font-size:14px;">📋 各客戶儲值餘額明細</div>
        <div style="background:var(--bg2);border-radius:8px;padding:8px;">
          ${Object.entries(custBalances).filter(([n,b])=>b!==0).sort((a,b)=>b[1]-a[1]).map(([n,b])=>{
            const color=b<0?'var(--red)':b===0?'var(--mut)':'var(--gold)';
            return`<div style="display:flex;justify-content:space-between;padding:4px 8px;border-bottom:1px solid var(--bdr);font-size:13px;">
              <span>${n}</span>
              <b style="color:${color};">$${fmt(b)}</b>
            </div>`;
          }).join('')}
        </div>

      <!-- 三、發現的問題 -->
      ${issues.length===0?`<div style="background:var(--grnL);padding:14px;border-radius:8px;border-left:4px solid var(--grn);text-align:center;">
        <div style="font-size:30px;margin-bottom:6px;">✅</div>
        <div style="font-weight:700;color:var(--grn);font-size:15px;">資料完美！沒發現任何問題</div>
        <div class="tm" style="font-size:12px;margin-top:4px;">所有儲值的扣款、餘額、客戶歸屬都正確</div>
      </div>`:`<div>
        <div style="font-weight:700;color:var(--red);margin-bottom:8px;font-size:14px;">⚠️ 發現 ${issues.length} 個需要注意的問題</div>
        ${issues.map((iss,i)=>{
          const color=iss.severity==='high'?'var(--red)':iss.severity==='medium'?'#d97706':'var(--blu)';
          const bg=iss.severity==='high'?'var(--redL)':iss.severity==='medium'?'#fef3c7':'var(--bluL)';
          const emoji=iss.severity==='high'?'🔴':iss.severity==='medium'?'🟡':'🔵';
          return`<div style="border-left:3px solid ${color};background:${bg};padding:10px 12px;border-radius:6px;margin-bottom:8px;">
            <div style="font-weight:700;color:${color};font-size:13px;">${emoji} ${iss.title}</div>
            <pre style="margin:6px 0;padding:6px;background:#fff;border-radius:4px;font-size:11px;white-space:pre-wrap;font-family:inherit;color:var(--txt);">${iss.detail}</pre>

    <div class="mbtns"><button class="btn btn-p" onclick="closeMod()">關閉</button></div>`;

  // 把 HTML 包裝在 S.modal 裡

// ─── 找出重複的進貨紀錄 ───
window.findDuplicatePurchases=async()=>{
  const purchases=S.data.purchases||[];
  // 用「日期+產品名+金額+數量」做指紋，找出重複
  const groups={};
  purchases.forEach(p=>{
    const fp=`${p.date||''}_${(p.productName||'').trim()}_${p.qty||0}_${p.totalCost||0}`;
    if(!groups[fp])groups[fp]=[];
    groups[fp].push(p);
  });
  const dupGroups=Object.entries(groups).filter(([_,arr])=>arr.length>1);
  if(dupGroups.length===0){
    alert('✅ 沒有發現重複的進貨紀錄，資料是乾淨的！');
    return;
  }
  // 統計
  const totalDups=dupGroups.reduce((s,[_,arr])=>s+(arr.length-1),0);
  const dupAmount=dupGroups.reduce((s,[_,arr])=>{
    return s+arr.slice(1).reduce((ss,p)=>ss+toN(p.totalCost),0);
  },0);
  // 顯示報告
  const html=`<div class="mttl">🔍 重複進貨檢測報告</div>
    <div style="max-height:60vh;overflow-y:auto;padding:4px;">
      <div style="background:var(--redL);padding:12px;border-radius:8px;border-left:4px solid var(--red);margin-bottom:14px;">
        <div style="font-weight:700;color:var(--red);font-size:15px;">⚠️ 發現 ${dupGroups.length} 組重複進貨</div>
        <div style="font-size:13px;margin-top:6px;color:var(--txt);">
          • 共 <b>${totalDups}</b> 筆多餘紀錄<br>
          • 金額重複合計 <b>$${fmt(dupAmount)}</b><br>
          • 建議：保留每組第一筆，刪除其餘
        </div>
      </div>

      ${dupGroups.map(([fp,arr],i)=>{
        const sample=arr[0];
        return`<div style="border:1px solid var(--bdr);border-radius:8px;padding:10px 12px;margin-bottom:10px;">
          <div style="font-weight:700;color:var(--pur);font-size:14px;margin-bottom:8px;">
            🔁 第 ${i+1} 組：${sample.productName||'未填'} （${sample.date}）
            <span class="bdg" style="background:var(--red);color:#fff;">${arr.length} 筆</span>
          </div>
          <div style="font-size:12px;color:var(--mut);margin-bottom:8px;">
            數量 ${sample.qty} × $${fmt(sample.unitCost)} = $${fmt(sample.totalCost)}
          </div>
          <div style="background:var(--bg2);padding:8px;border-radius:6px;font-size:12px;">
            ${arr.map((p,idx)=>{
              const isPaid=p.paid||p.paidToExpense;
              const isKeep=idx===0;
              return`<div style="padding:6px 8px;background:${isKeep?'var(--grnL)':'var(--redL)'};border-radius:4px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
                <div>
                  <b style="color:${isKeep?'var(--grn)':'var(--red)'};">${isKeep?'✓ 保留':'✗ 建議刪除'}</b>
                  <span style="font-family:monospace;font-size:10px;color:var(--mut);">　ID:${(p.id||'').substring(0,8)}</span>
                  ${isPaid?`<span class="bdg" style="background:var(--grn);color:#fff;font-size:10px;">已付款 ${p.paidDate||''}</span>`:'<span class="bdg" style="background:#aaa;color:#fff;font-size:10px;">未付款</span>'}
                </div>
                ${!isKeep?`<button class="btn btn-sm" style="background:var(--red);color:#fff;font-size:11px;padding:2px 8px;" onclick="deleteDupePurchase('${p.id}')">🗑️ 刪除這筆</button>`:''}
              </div>`;
            }).join('')}
          </div>
        </div>`;
      }).join('')}

      <div style="margin-top:14px;padding:12px;background:var(--bluL);border-radius:8px;border-left:4px solid var(--blu);font-size:13px;color:var(--blu);">
        💡 <b>建議操作步驟：</b><br>
        1. 上方每組保留<b>第一筆（綠色）</b>，刪除<b>其餘（紅色）</b><br>
        2. 點各筆右側「🗑️ 刪除這筆」按鈕逐筆清理<br>
        3. 或下方一鍵清除全部重複（保留每組第一筆）
      </div>
    </div>
    <div class="mbtns">
      <button class="btn btn-s" onclick="closeMod()">關閉</button>
      <button class="btn" style="background:var(--red);color:#fff;" onclick="cleanupAllDuplicatePurchases()">🧹 一鍵清除全部重複</button>
    </div>`;

  S.modal={t:'duplicatePurchaseReport',html};
  const bg=$('modal-bg'),inn=$('modal-inner');
  if(bg&&inn){
    inn.innerHTML=html;
    bg.className='modal-bg open';
    inn.className='modal lg';
  }
};

// 刪除單筆重複進貨（不還原庫存，因為已經是重複輸入的）
window.deleteDupePurchase=async(id)=>{
  if(!confirm('確認刪除這筆重複的進貨？\n\n注意：不會還原庫存（因為這是重複輸入的多餘紀錄，原本就不該存在）\n但會刪除對應的支出和現金流。'))return;
  const p=(S.data.purchases||[]).find(x=>x.id===id);
  if(!p)return;
  // 刪除對應的支出（如果有）
  if(p.expenseId){
    try{await delSub('expenses',p.expenseId);}catch(e){console.warn(e);}
  }
  const exps=(S.data.expenses||[]).filter(e=>(e.fromPurchase||e.fromPurchaseId)&&(e.purchaseRefId===id||e.fromPurchaseId===id));
  for(const e of exps){try{await delSub('expenses',e.id);}catch(err){console.warn(err);}}
  // 刪除對應的現金流（如果有）
  if(p.cashFlowId){
    try{await delSub('cashFlow',p.cashFlowId);}catch(e){console.warn(e);}
  }
  const flows=(S.data.cashFlow||[]).filter(f=>(f.fromPurchase||f.fromPurchaseId)&&(f.purchaseRefId===id||f.fromPurchaseId===id));
  for(const f of flows){try{await delSub('cashFlow',f.id);}catch(err){console.warn(err);}}
  // 還要扣減被多算的庫存
  if(p.productId){
    try{
      const inv=getInv(p.productId);
      const newQty=Math.max(0,toN(inv.qty)-toN(p.qty));
      const newInv=[...(S.data.inventory||[]).filter(i=>i.productId!==p.productId),{...inv,productId:p.productId,qty:newQty}];
      await saveMain({inventory:newInv});
    }catch(e){console.warn(e);}
  }
  // 刪除進貨紀錄本身
  await delSub('purchases',id);
  toast(`✅ 已刪除重複進貨，並扣減重複的庫存 ${p.qty} 個`);
  // 重新打開檢測報告
  setTimeout(()=>{findDuplicatePurchases();},500);
};

// 一鍵清除所有重複
window.cleanupAllDuplicatePurchases=async()=>{
  const purchases=S.data.purchases||[];
  const groups={};
  purchases.forEach(p=>{
    const fp=`${p.date||''}_${(p.productName||'').trim()}_${p.qty||0}_${p.totalCost||0}`;
    if(!groups[fp])groups[fp]=[];
    groups[fp].push(p);
  });
  const toDelete=[];
  Object.values(groups).forEach(arr=>{
    if(arr.length>1)toDelete.push(...arr.slice(1));// 保留第一筆
  });
  if(toDelete.length===0){alert('沒有需要清除的重複資料');return;}
  if(!confirm(`⚠️ 確認一鍵清除？\n\n將刪除 ${toDelete.length} 筆重複進貨，並：\n• 刪除對應的支出/現金流紀錄\n• 扣減重複多算的庫存\n\n此操作無法復原！`))return;
  // 統計庫存調整
  const invAdj={};
  for(const p of toDelete){
    if(p.productId){
      invAdj[p.productId]=(invAdj[p.productId]||0)+toN(p.qty);
    }
    // 刪除對應的支出
    if(p.expenseId){try{await delSub('expenses',p.expenseId);}catch(e){console.warn(e);}}
    const exps=(S.data.expenses||[]).filter(e=>(e.fromPurchase||e.fromPurchaseId)&&(e.purchaseRefId===p.id||e.fromPurchaseId===p.id));
    for(const e of exps){try{await delSub('expenses',e.id);}catch(err){console.warn(err);}}
    // 刪除對應的現金流
    if(p.cashFlowId){try{await delSub('cashFlow',p.cashFlowId);}catch(e){console.warn(e);}}
    const flows=(S.data.cashFlow||[]).filter(f=>(f.fromPurchase||f.fromPurchaseId)&&(f.purchaseRefId===p.id||f.fromPurchaseId===p.id));
    for(const f of flows){try{await delSub('cashFlow',f.id);}catch(err){console.warn(err);}}
    // 刪除進貨本身
    try{await delSub('purchases',p.id);}catch(e){console.warn(e);}
  }
  // 統一扣減庫存
  let newInv=[...(S.data.inventory||[])];
  Object.entries(invAdj).forEach(([pid,qty])=>{
    const inv=newInv.find(i=>i.productId===pid)||{productId:pid,qty:0};
    const newQty=Math.max(0,toN(inv.qty)-qty);
    newInv=newInv.filter(i=>i.productId!==pid);
    newInv.push({...inv,productId:pid,qty:newQty});
  });
  await saveMain({inventory:newInv});
  toast(`✅ 已清除 ${toDelete.length} 筆重複進貨並調整庫存`);
  closeMod();
  render();
};

// ─── 檢查進貨紀錄的產品名稱對應 ───
window.checkProductNames=async()=>{
  const purchases=S.data.purchases||[];
  const products=S.data.products||[];
  // 找出進貨紀錄中 productName 與實際產品名稱不一致的
  const mismatches=[];
  purchases.forEach(p=>{
    if(!p.productId)return;// 沒有 productId 跳過
    const realProd=products.find(prod=>prod.id===p.productId);
    if(!realProd)return;// 找不到對應產品
    const recordedName=(p.productName||'').trim();
    const realName=(realProd.name||'').trim();
    if(recordedName!==realName){
      mismatches.push({
        purchase:p,
        recordedName,
        realName,
        productId:p.productId
      });
    }
  });

  if(mismatches.length===0){
    alert('✅ 所有進貨紀錄的產品名稱都與產品設定一致，沒有問題！');
    return;
  }

  // 顯示報告
  const html=`<div class="mttl">🏷️ 進貨產品名稱對應檢查</div>
    <div style="max-height:60vh;overflow-y:auto;padding:4px;">
      <div style="background:var(--redL);padding:12px;border-radius:8px;border-left:4px solid var(--red);margin-bottom:14px;">
        <div style="font-weight:700;color:var(--red);font-size:15px;">⚠️ 發現 ${mismatches.length} 筆名稱不一致</div>
        <div style="font-size:13px;margin-top:6px;color:var(--txt);">
          進貨紀錄上顯示的產品名稱，跟產品設定裡的名稱不同。<br>
          這通常是「批次進貨時下拉選了 A 但輸入框是 B」造成的。<br>
          <b>修復後：進貨紀錄會顯示正確的產品名稱</b>（庫存不受影響）
        </div>
      </div>

// 一鍵修正所有名稱不一致的進貨紀錄
window.fixProductNameMismatches=async()=>{
  const purchases=S.data.purchases||[];
  const products=S.data.products||[];
  const toFix=[];
  purchases.forEach(p=>{
    if(!p.productId)return;
    const realProd=products.find(prod=>prod.id===p.productId);
    if(!realProd)return;
    const recordedName=(p.productName||'').trim();
    const realName=(realProd.name||'').trim();
    if(recordedName!==realName){
      toFix.push({purchase:p,realName,realProd});
    }
  });
  if(toFix.length===0){alert('沒有需要修正的');return;}
  if(!confirm(`確認一鍵修正 ${toFix.length} 筆進貨紀錄的產品名稱？\n\n會將每筆 productName 改為正確的產品名稱。\n庫存、支出、成本不受影響。`))return;
  for(const item of toFix){
    const p=item.purchase;
    try{
      await setSub('purchases',p.id,{...p,productName:item.realName,category:item.realProd.category||p.category});
      // 同時修正對應的支出記帳
      if(p.expenseId){
        const exp=(S.data.expenses||[]).find(e=>e.id===p.expenseId);
        if(exp){
          const newNote=`【進貨】${item.realName}　${p.supplier||''}　數量 ${p.qty||0}`;
          try{await setSub('expenses',p.expenseId,{...exp,note:newNote});}catch(e){console.warn(e);}
        }
      }
      // 同時修正對應的現金流
      if(p.cashFlowId){
        const flow=(S.data.cashFlow||[]).find(f=>f.id===p.cashFlowId);
        if(flow){
          const newNote=`【進貨】${item.realName} × ${p.qty||0}${p.supplier?'（'+p.supplier+'）':''}（${p.payMethod||p.paidMethod||''}）`;
          try{await setSub('cashFlow',p.cashFlowId,{...flow,note:newNote});}catch(e){console.warn(e);}
        }
      }
    }catch(err){console.warn(err);}
  }
  toast(`✅ 已修正 ${toFix.length} 筆進貨紀錄的產品名稱`);
  closeMod();
  render();
};

window.cashLevelHealthCheck=()=>{
  // 取得系統啟用日期（若無則用所有資料）
  const startDateStr=S.data.settings?.cashFlowStartDate||'';
  const startDate=startDateStr?new Date(startDateStr):null;
  const inRange=(dateStr)=>{
    if(!startDate)return true;
    if(!dateStr)return false;
    return new Date(dateStr)>=startDate;
  };
  const sales=(S.data.sales||[]).filter(s=>inRange(s.date));
  const expenses=(S.data.expenses||[]).filter(e=>inRange(e.date));
  const cashFlow=(S.data.cashFlow||[]).filter(c=>inRange(c.date));
  const deposits=(S.data.deposits||[]).filter(d=>inRange(d.date));

  const cashSales=sales.filter(s=>s.payMethod==='現金'||s.payMethod==='轉帳').reduce((s,r)=>s+toN(r.amount),0);
  const depositCash=deposits.reduce((s,d)=>s+toN(d.actualReceived||d.amount),0);
  const otherCashIn=cashFlow.filter(c=>toN(c.amount)>0&&!c.fromPurchase&&!c.depositRefId&&c.cat!=='儲值入帳').reduce((s,c)=>s+toN(c.amount),0);
  const totalCashIn=cashSales+depositCash+otherCashIn;
  const totalCashOut=expenses.reduce((s,e)=>s+toN(e.amount),0);
  const theoreticalBalance=totalCashIn-totalCashOut;
  const totalDepositLiability=getTotalDepositLiability?getTotalDepositLiability():0;

  const rentExp=expenses.filter(e=>e.category==='房租').reduce((s,e)=>s+toN(e.amount),0);
  const utilExp=expenses.filter(e=>e.category==='水電').reduce((s,e)=>s+toN(e.amount),0);
  let monthCount=1;
  if(startDate){
    const now=new Date();
    monthCount=Math.max(1,(now.getFullYear()-startDate.getFullYear())*12+now.getMonth()-startDate.getMonth()+1);
  }else{
    const allDates=[...sales,...expenses].map(x=>x.date).filter(d=>d);
    if(allDates.length>0){
      const dates=allDates.map(d=>new Date(d)).filter(d=>!isNaN(d));
      if(dates.length>0){
        const min=new Date(Math.min(...dates));
        const max=new Date(Math.max(...dates));
        monthCount=Math.max(1,(max.getFullYear()-min.getFullYear())*12+max.getMonth()-min.getMonth()+1);
      }
    }

  const avgRent=monthCount>0?rentExp/monthCount:0;

  const monthlyFixed=avgRent+avgUtil;
  const minSafe=monthlyFixed*1;

      </div>`:`<div style="background:#fef3c7;padding:10px 12px;border-radius:6px;margin-bottom:12px;font-size:12px;color:#92400e;">
        ⚠️ 尚未設定系統啟用日期，目前統計所有歷史資料（${monthCount} 個月）<br>

      </div>
    </div>

// 收集 sharedWith 勾選結果
function collectSharedWith(){
  const checks=document.querySelectorAll('input[name="cu_share"]:checked');
  return Array.from(checks).map(c=>c.value);
}

// 雙向同步共用關係：A 把 B 加進來時，B 那邊也要把 A 加進來
// 名稱比對都用 trim 後的值
function syncSharedTwoWay(customers, myName, mySharedWith){
  const myNameT=(myName||'').trim();
  const mySharedT=new Set((mySharedWith||[]).map(n=>(n||'').trim()).filter(Boolean));
  return customers.map(c=>{
    const cNameT=(c.name||'').trim();
    if(cNameT===myNameT)return c;
    const cShared=Array.isArray(c.sharedWith)?[...c.sharedWith]:[];
    const cSharedT=cShared.map(n=>(n||'').trim());
    const has=cSharedT.includes(myNameT);
    if(mySharedT.has(cNameT)&&!has){
      cShared.push(myNameT);
      return{...c,sharedWith:cShared};
    }else if(!mySharedT.has(cNameT)&&has){
      return{...c,sharedWith:cShared.filter(n=>(n||'').trim()!==myNameT)};
    }
    return c;
  });
}

window.saveCustomer=async()=>{
  try{
    const name=$('m_cu0')?.value?.trim();
    if(!name){alert('請填客戶姓名');return;}
    // 用 trim 後的名稱比對，避免空白問題
    const dup=(S.data.customers||[]).find(c=>(c.name||'').trim()===name);
    if(dup){
      alert(`「${name}」已經建檔過了，請改用編輯功能`);return;
    }
    const sharedWithRaw=collectSharedWith();
    const sharedWith=Array.from(new Set(sharedWithRaw.map(n=>(n||'').trim()).filter(Boolean)));
    let customers=[...(S.data.customers||[])];
    // 主客戶
    customers.push({
      id:uid(),name,
      phone:$('m_cu1')?.value||'',
      birthday:$('m_cu2')?.value||'',
      source:$('m_cu3')?.value||'',
      note:$('m_cu4')?.value||'',
      sharedWith,
      createdAt:today()
    });
    // 自動為勾選的 ghost 共用成員建檔（用 trim 後比對）
    let autoCreated=0;
    for(const sName of sharedWith){
      if(!customers.find(c=>(c.name||'').trim()===sName)){
        customers.push({
          id:uid(),name:sName,
          phone:'',birthday:'',source:'',note:'(由共用儲值自動建檔)',
          sharedWith:[name],
          createdAt:today()
        });
        autoCreated++;
      }
    }
    // 雙向同步
    customers=syncSharedTwoWay(customers,name,sharedWith);
    await saveMain({customers});
    let msg=`✅ ${name} 已建檔`;
    if(sharedWith.length>0)msg+=`（與 ${sharedWith.length} 位共用儲值）`;
    if(autoCreated>0)msg+=`，自動建檔 ${autoCreated} 位共用成員`;

window.updCustomer=async(id)=>{
  try{
    const old=(S.data.customers||[]).find(c=>c.id===id);
    if(!old){alert('找不到客戶');return;}
    const newName=$('m_cu0')?.value?.trim()||(old.name||'').trim();
    if(!newName){alert('客戶姓名不可空白');return;}
    const oldNameT=(old.name||'').trim();
    const sharedWithRaw=collectSharedWith();
    const sharedWith=Array.from(new Set(sharedWithRaw.map(n=>(n||'').trim()).filter(Boolean)));
    // 如果改名了，要把所有別人 sharedWith 中的舊名換成新名
    let customers=(S.data.customers||[]).map(c=>{
      if(c.id===id)return{
        ...c,
        name:newName,
        phone:$('m_cu1')?.value||'',
        birthday:$('m_cu2')?.value||'',
        source:$('m_cu3')?.value||'',
        note:$('m_cu4')?.value||'',
        sharedWith
      };
      if(Array.isArray(c.sharedWith)&&oldNameT!==newName){
        const hasOld=c.sharedWith.some(n=>(n||'').trim()===oldNameT);
        if(hasOld){
          return{...c,sharedWith:c.sharedWith.map(n=>(n||'').trim()===oldNameT?newName:n)};
        }
      }
      return c;
    });
    // 自動為勾選的 ghost 共用成員建檔
    let autoCreated=0;
    for(const sName of sharedWith){
      if(!customers.find(c=>(c.name||'').trim()===sName)){
        customers.push({
          id:uid(),name:sName,
          phone:'',birthday:'',source:'',note:'(由共用儲值自動建檔)',
          sharedWith:[newName],
          createdAt:today()
        });
        autoCreated++;
      }
    }
    // 雙向同步
    customers=syncSharedTwoWay(customers,newName,sharedWith);
    await saveMain({customers});
    let msg='✅ 已更新';
    if(autoCreated>0)msg+=`，自動建檔 ${autoCreated} 位共用成員`;
    toast(msg);
    closeMod();
  }catch(err){
    console.error('updCustomer 失敗:',err);
    alert('更新失敗：'+(err.message||err));
  }
};

window.repairCustomerNames=async()=>{
  if(!confirm('確認執行資料修復？\n\n會把所有客戶、銷售紀錄、儲值紀錄中的姓名空白清除，並合併重複的客戶。\n\n此操作不會刪除任何資料。'))return;
  let fixedCustomers=0,fixedSales=0,fixedDeposits=0,mergedDup=0;
  // 1. 清理 customers 名稱、合併重複（用 trim 後的名字當 key）
  const customerMap=new Map();  // trim名 -> 客戶記錄
  (S.data.customers||[]).forEach(c=>{
    const newName=(c.name||'').trim().replace(/[\u3000\s]+/g,'');
    if(!newName)return;
    if((c.name||'')!==newName)fixedCustomers++;
    if(customerMap.has(newName)){
      // 合併：把 sharedWith 合併
      const existed=customerMap.get(newName);
      const merged=new Set([...(existed.sharedWith||[]),...(c.sharedWith||[])]);
      existed.sharedWith=Array.from(merged).map(n=>(n||'').trim().replace(/[\u3000\s]+/g,'')).filter(Boolean);
      mergedDup++;
    }else{
      customerMap.set(newName,{
        ...c,
        name:newName,
        sharedWith:Array.isArray(c.sharedWith)
          ?Array.from(new Set(c.sharedWith.map(n=>(n||'').trim().replace(/[\u3000\s]+/g,'')).filter(Boolean)))
          :[]
      });
    }
  });
  const newCustomers=Array.from(customerMap.values());
  // 2. 清理 sales 中的 customer 欄位 + depositOwner
  const cleanedSales=(S.data.sales||[]).map(s=>{
    const newCustomer=(s.customer||'').trim().replace(/[\u3000\s]+/g,'');
    const newOwner=(s.depositOwner||'').trim().replace(/[\u3000\s]+/g,'');
    if(s.customer!==newCustomer||s.depositOwner!==newOwner)fixedSales++;
    return{...s,customer:newCustomer,depositOwner:newOwner||undefined};
  });
  // 3. 清理 deposits
  const cleanedDeposits=(S.data.deposits||[]).map(d=>{
    const newCustomer=(d.customer||'').trim().replace(/[\u3000\s]+/g,'');
    if(d.customer!==newCustomer)fixedDeposits++;
    return{...d,customer:newCustomer};
  });
  // 寫回
  try{
    await saveMain({customers:newCustomers});
    // 寫回 sales
    for(const s of cleanedSales){
      await setSub('sales',s.id,s);
    }
    for(const d of cleanedDeposits){
      await setSub('deposits',d.id,d);
    }
    alert(`✅ 修復完成！\n\n• 客戶名稱清理：${fixedCustomers} 筆\n• 銷售紀錄清理：${fixedSales} 筆\n• 儲值紀錄清理：${fixedDeposits} 筆\n• 合併重複客戶：${mergedDup} 筆`);
  }catch(err){
    console.error('repair 失敗:',err);
    alert('修復失敗：'+(err.message||err));
  }
};

// ── 修復「儲值扣款」舊紀錄的 depositFaceAmount 欄位 ──
// 問題：舊紀錄只存了 amount（折扣後營收），沒存 depositFaceAmount（面額）
// 修復：找出每筆儲值扣款，用同期儲值的折扣率反推面額
window.repairDepositFaceAmount=async()=>{
  const sales=S.data.sales||[];
  const targets=sales.filter(s=>s.payMethod==='儲值扣款'&&!s.depositFaceAmount);
  if(targets.length===0){alert('沒有需要修復的紀錄');return;}
  // 預覽
  let preview=`找到 ${targets.length} 筆「儲值扣款」紀錄沒有面額資料。\n\n會用客戶當時的折扣率反推面額：\n面額 = 認列營收 ÷ 折扣率\n\n範例（前 5 筆）：\n`;
  for(let i=0;i<Math.min(5,targets.length);i++){
    const s=targets[i];
    const owner=(s.depositOwner||s.customer||'').trim();
    // 找該客戶在 s.date 之前最近一次儲值的折扣率
    const rate=findHistoricalDiscountRate(owner,s.date);
    const facade=Math.round(toN(s.amount)/rate);
    preview+=`• ${s.date} ${s.item} ${owner}：認列 $${fmt(s.amount)} ÷ ${(rate*10).toFixed(1)}折 = 面額 $${fmt(facade)}\n`;
  }
  preview+=`\n確認執行？`;
  if(!confirm(preview))return;
  let fixed=0;
  for(const s of targets){
    const owner=(s.depositOwner||s.customer||'').trim();
    const rate=findHistoricalDiscountRate(owner,s.date);
    const facade=Math.round(toN(s.amount)/rate);
    try{
      await setSub('sales',s.id,{...s,depositFaceAmount:facade});
      fixed++;
    }catch(e){console.warn('修復失敗:',s.id,e);}
  }
  alert(`✅ 完成！修復 ${fixed} 筆儲值扣款紀錄的面額`);
};

// 找客戶在指定日期「之前或當天」最近一次儲值的折扣率
function findHistoricalDiscountRate(custName,saleDate){
  if(!custName)return 1;
  const group=getSharedGroup(custName).map(n=>(n||'').trim());
  const deposits=(S.data.deposits||[])
    .filter(d=>group.includes((d.customer||'').trim()))
    .filter(d=>(d.date||'')<=saleDate)
    .filter(d=>toN(d.actualReceived)>0&&toN(d.amount)>0)
    .sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  if(deposits.length===0)return 1;
  const rate=toN(deposits[0].actualReceived)/toN(deposits[0].amount);
  return rate>0&&rate<=1?rate:1;
}

window.saveDeposit=async()=>{

    const note=$('m_dp4')?.value||'';
    const d=new Date(date);
    const discountRate=actualReceived/amount;
    // 🎯 收集限定服務設定

    const allowedServices=isRestricted?Array.from(document.querySelectorAll('.m_dp_svc_chk:checked')).map(cb=>cb.value):[];

      date,customer,
      amount,                  // 面額（公司負債）
      actualReceived,          // 實收現金
      discountRate,            // 折扣率
      payMethod,note,
      scope:isRestricted?'restricted':'general',
      allowedServices,         // 限定的服務名稱陣列
      monthlyLimit,            // 每月可用次數限制（0 = 不限）
      month:d.getMonth()+1,year:d.getFullYear()
    });
    // 現金流只記實收金額
    await addSub('cashFlow',{
      date,amount:actualReceived,
      cat:'儲值入帳',
      note:`${customer} 儲值面額$${fmt(amount)} 實收$${fmt(actualReceived)}${isRestricted?` 🎯限定：${allowedServices.join('/')}`:''}${note?' ('+note+')':''}`,

window.finalizeDepositSign=async()=>{
  try{
    const t=S.treatment;
    if(!t||!t.depositData){alert('找不到儲值資料');return;}
    if(!t.depositAgreed){alert('⚠️ 請勾選「已詳閱並同意上述儲值方案內容」');return;}
    if(!_sigCanvas||!_sigHasContent){alert('⚠️ 請先簽名');return;}
    const dataURL=_sigCanvas.toDataURL('image/png');
    // 取條款快照
    const dp=t.depositData;
    const termsTemplate=S.data.settings?.depositTerms||DEFAULT_DEPOSIT_TERMS;
    const usagePeriodStr=S.data.settings?.depositUsagePeriod||'無使用期限';
    const transferableStr=S.data.settings?.depositTransferable===true?'得轉讓予他人使用':'限本人使用，不可轉讓予他人';
    const discountRateVal=dp.amount?Math.round(dp.actualReceived/dp.amount*100):0;
    const termsSnapshot=termsTemplate
      .replace(/\$\{actualReceived\}/g,fmt(dp.actualReceived||0))
      .replace(/\$\{amount\}/g,fmt(dp.amount||0))
      .replace(/\$\{bonus\}/g,fmt((dp.amount||0)-(dp.actualReceived||0)))
      .replace(/\$\{discountRate\}/g,(100-discountRateVal).toString())
      .replace(/<usage_period>/g,usagePeriodStr)
      .replace(/<transferable>/g,transferableStr);
    await finalizeDeposit({
      ...dp,
      signature:dataURL,
      termsSnapshot,
      signed:true
    });
    // 把這次契約資料暫存，供「下載/複製」用
    S.lastDepositContract={
      customer:dp.customer,
      date:dp.date,
      actualReceived:dp.actualReceived,
      amount:dp.amount,
      termsSnapshot,
      signature:dataURL,
      signedAt:nowLocal()
    };
    S.treatment=null;
    S.depositPending=null;
    // 顯示完成畫面（含下載/複製契約按鈕）
    showDepositContractDone();
  }catch(err){
    console.error('finalizeDepositSign 失敗:',err);
    alert('失敗：'+(err.message||err));
  }
};

// 把契約+簽名畫成一張圖片下載
window.downloadDepositContractImage=()=>{
  const c=S.lastDepositContract;
  if(!c)return;
  try{
    const lines=c.termsSnapshot.split('\n');
    // 計算畫布大小
    const lineHeight=22;
    const padding=40;
    const headerH=70;
    const sigH=140;
    const width=720;
    const textH=lines.length*lineHeight;
    const height=headerH+textH+sigH+padding*2;
    const canvas=document.createElement('canvas');
    const scale=2; // 高解析度
    canvas.width=width*scale;
    canvas.height=height*scale;
    const ctx=canvas.getContext('2d');
    ctx.scale(scale,scale);
    // 背景
    ctx.fillStyle='#fffaf3';
    ctx.fillRect(0,0,width,height);
    // 標題列
    ctx.fillStyle='#b5838d';
    ctx.fillRect(0,0,width,headerH);
    ctx.fillStyle='#fff';
    ctx.font='bold 24px "Noto Serif TC",serif';
    ctx.textAlign='center';
    ctx.fillText('沐蜜美學・儲值契約',width/2,44);
    // 內文
    ctx.fillStyle='#333';
    ctx.font='14px sans-serif';
    ctx.textAlign='left';
    let y=headerH+padding;
    lines.forEach(line=>{
      // 過長的行自動截斷（簡單處理）
      ctx.fillText(line.substring(0,46),padding,y);
      y+=lineHeight;
    });
    // 簽名區
    y+=10;
    ctx.strokeStyle='#d99a57';
    ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(padding,y);ctx.lineTo(width-padding,y);ctx.stroke();
    y+=24;
    ctx.fillStyle='#666';
    ctx.font='13px sans-serif';
    ctx.fillText(`客戶：${c.customer}　簽署時間：${c.signedAt}`,padding,y);
    y+=10;
    // 畫簽名圖
    const sigImg=new Image();
    sigImg.onload=()=>{
      ctx.drawImage(sigImg,padding,y,200,70);
      ctx.fillStyle='#999';
      ctx.font='12px sans-serif';
      ctx.fillText('（客戶簽名）',padding+210,y+40);
      // 觸發下載
      const link=document.createElement('a');
      link.download=`沐蜜儲值契約_${c.customer}_${c.date}.png`;
      link.href=canvas.toDataURL('image/png');
      link.click();
      toast('✅ 契約圖已下載，請從相簿傳 LINE 給客人');
    };
    sigImg.onerror=()=>{
      // 簽名載入失敗也先下載文字部分
      const link=document.createElement('a');
      link.download=`沐蜜儲值契約_${c.customer}_${c.date}.png`;
      link.href=canvas.toDataURL('image/png');
      link.click();
      toast('✅ 契約圖已下載');
    };
    sigImg.src=c.signature;
  }catch(err){
    console.error('產生契約圖失敗',err);
    alert('產生契約圖失敗，請改用「複製契約全文」傳給客人');
  }
};

window.finalizeDeposit=async(data)=>{
  const {customer,date,amount,actualReceived,payMethod,note,signature,termsSnapshot,signed,scope,allowedServices,monthlyLimit}=data;
  const d=new Date(date);
  const discountRate=actualReceived/amount;
  await addSub('deposits',{
    date,customer,amount,actualReceived,discountRate,payMethod,note,
    // 簽名相關（如果有）
    signature:signature||null,
    signedAt:signature?nowLocal():null,
    termsSnapshot:termsSnapshot||null,
    signed:signed===true,
    // 🎯 限定服務相關
    scope:scope||'general',
    allowedServices:allowedServices||[],
    monthlyLimit:monthlyLimit||0,
    month:d.getMonth()+1,year:d.getFullYear()
  });
  const restrictedNote=(scope==='restricted'&&allowedServices?.length)?` 🎯限定：${allowedServices.join('/')}`:'';
  await addSub('cashFlow',{
    date,amount:actualReceived,cat:'儲值入帳',
    note:`${customer} 儲值面額$${fmt(amount)} 實收$${fmt(actualReceived)}${restrictedNote}${note?' ('+note+')':''}`,
    month:d.getMonth()+1,year:d.getFullYear()
  });
  toast(`✅ 已為 ${customer} 儲值面額 $${fmt(amount)}（實收 $${fmt(actualReceived)}）${signed?' ✍️ 已簽名':''}${restrictedNote}`);
};

    <div><span class="lbl">儲值日期：</span>${d.date}</div>
    <div><span class="lbl">儲值面額：</span>$${fmt(d.amount)}</div>
    <div><span class="lbl">實際支付：</span>$${fmt(d.actualReceived||d.amount)}</div>
    <div><span class="lbl">付款方式：</span>${d.payMethod||''}</div>
    <div><span class="lbl">簽名時間：</span>${d.signedAt||'-'}</div>
  </div>
  <h3 style="color:#a05a2c;">📜 簽名當下的條款內容</h3>
  <pre>${(d.termsSnapshot||'無條款快照').replace(/</g,'&lt;')}</pre>
  <h3 style="color:#a05a2c;margin-top:20px;">✍️ 客戶簽名</h3>
  ${d.signature?`<img class="sig" src="${d.signature}">`:'<div style="color:#999;">無簽名圖</div>'}
  </body></html>`);
  w.document.close();
};

window.delDeposit=async id=>{
  if(!confirm('確認刪除這筆儲值紀錄？\n（會一併刪除現金流中的對應入帳紀錄）'))return;
  const dep=(S.data.deposits||[]).find(x=>x.id===id);
  await delSub('deposits',id);
  // 同步刪除 cashFlow 中對應的儲值入帳（依日期 + 客戶 + 金額比對）
  if(dep){
    const targetAmount=toN(dep.actualReceived||dep.amount);
    const related=(S.data.cashFlow||[]).filter(c=>
      c.cat==='儲值入帳'&&
      c.date===dep.date&&
      toN(c.amount)===targetAmount&&
      (c.note||'').includes(dep.customer||'')
    );
    for(const r of related){await delSub('cashFlow',r.id);}
  }
  toast('已刪除');
  render();
};

window.updDeposit=async(id)=>{
  try{
    const old=(S.data.deposits||[]).find(x=>x.id===id);
    if(!old){alert('找不到該筆儲值');return;}
    const date=$('m_dp0')?.value||old.date;
    const amount=parseFloat($('m_dp2')?.value)||0;
    const actualReceived=parseFloat($('m_dp_actual')?.value)||amount;
    if(!date||!amount){alert('請填日期和儲值面額');return;}
    if(actualReceived<=0){alert('請填實收金額');return;}
    const payMethod=$('m_dp3')?.value||old.payMethod||'轉帳';
    const note=$('m_dp4')?.value||'';
    const d=new Date(date);
    const discountRate=actualReceived/amount;
    await setSub('deposits',id,{
      ...old,
      date,amount,actualReceived,discountRate,payMethod,note,
      month:d.getMonth()+1,year:d.getFullYear()
    });
    toast(`✅ 已更新 ${old.customer} 的儲值紀錄`);
    closeMod();
  }catch(err){
    console.error('updDeposit 失敗:',err);
    alert('更新失敗：'+(err.message||err));
  }
};

// ── 銷售開單時即時顯示客戶儲值餘額 ──
// 可搜尋客戶輸入框：打字或選擇後更新餘額提示
window.onCustomerPick=(prefix)=>{
  updateBalanceHint(prefix);

window.updateBalanceHint=(prefix)=>{
  const sel=$('m_'+prefix+'4')||$('m_'+prefix+'5');
  const newInput=$('m_'+prefix+'4_new')||$('m_'+prefix+'5_new');
  const hint=$('m_'+prefix+'_hint');
  const paySel=$('m_'+prefix+'6')||$('m_'+prefix+'7');
  const ownerWrap=$('m_'+prefix+'_owner_wrap');
  const ownerSel=$('m_'+prefix+'_owner');
  if(sel&&newInput){
    newInput.style.display=sel.value==='__new__'?'block':'none';
  }
  // 預設隱藏 owner 選擇器
  if(ownerWrap)ownerWrap.style.display='none';

  if(hint&&sel){
    const name=sel.value;
    if(name&&name!=='__new__'&&name!==''){
      const bal=getCustomerBalance(name);
      const payMethod=paySel?.value||'';
      const amount=parseFloat($('m_'+prefix+'3')?.value)||parseFloat($('m_'+prefix+'4')?.value)||0;
      if(payMethod==='儲值扣款'){
        // 取得整個儲值池（自己＋共用成員）
        const pool=getAvailableDepositPool(name);
        const totalPool=pool.reduce((s,p)=>s+p.balance,0);
        const sharedMembers=pool.filter(p=>!p.isSelf&&p.balance>0);
        if(totalPool>0){
          let html=`💳 自己餘額 <b style="color:${bal>0?'var(--gold)':'var(--red)'};">$${fmt(bal)}</b>`;
          if(sharedMembers.length>0){
            html+=`　｜共用成員可扣：${sharedMembers.map(p=>`<b>${p.name}</b> $${fmt(p.balance)}`).join('、')}`;
            html+=`<br>📊 群組總可動用：<b style="color:var(--pur);">$${fmt(totalPool)}</b>`;
          }
          // 顯示折扣率（依預設 owner）
          let defaultOwner=name;
          if(bal<=0&&sharedMembers.length>0)defaultOwner=sharedMembers[0].name;
          const rate=getCustomerDiscountRate(defaultOwner);
          if(rate<1){
            const ratePercent=Math.round(rate*1000)/10;
            html+=`<br>💰 ${defaultOwner} 的儲值折扣 <b style="color:var(--rose);">${ratePercent}% (${(rate*10).toFixed(1)}折)</b>`;
            if(amount>0){
              const realRev=Math.round(amount*rate);
              html+=`　扣 $${fmt(amount)} → 認列營收 <b style="color:var(--grn);">$${fmt(realRev)}</b>`;
            }
          }
          if(amount>totalPool){
            html+=`<br><span style="color:var(--red);">⚠️ 群組總餘額不足以扣款 $${fmt(amount)}</span>`;
          }
          hint.innerHTML=html;
        }else{
          hint.innerHTML=`<span style="color:var(--red);">⚠️ 此客戶與共用群組都沒有儲值餘額</span>`;
        }
        // 顯示 owner 選擇器
        if(ownerWrap&&ownerSel&&pool.length>0){
          ownerWrap.style.display='flex';
          let defaultOwner=name;
          if(bal<=0&&sharedMembers.length>0){
            defaultOwner=sharedMembers[0].name;
          }
          ownerSel.innerHTML=pool.map(p=>{
            const r=getCustomerDiscountRate(p.name);
            const rateText=r<1?`　${(r*10).toFixed(1)}折`:'';
            const lbl=p.isSelf?`${p.name}（自己）餘額 $${fmt(p.balance)}${rateText}`:`${p.name}（共用）餘額 $${fmt(p.balance)}${rateText}`;
            const sel=p.name===defaultOwner?' selected':'';
            const dis=p.balance<=0?' disabled':'';
            return`<option value="${p.name}"${sel}${dis}>${lbl}</option>`;
          }).join('');
          // 切換 owner 時也要重新計算
          ownerSel.onchange=()=>updateBalanceHint(prefix);
        }
      }else{
        // 非儲值扣款，只顯示餘額提示
        const pool=getAvailableDepositPool(name);
        const sharedMembers=pool.filter(p=>!p.isSelf&&p.balance>0);
        let html=bal>0?`💳 此客戶儲值餘額：<b>$${fmt(bal)}</b>`:'';
        if(sharedMembers.length>0){
          html+=html?'　':'';
          html+=`<span style="color:var(--pur);">🔗 共用：${sharedMembers.map(p=>`${p.name} $${fmt(p.balance)}`).join('、')}</span>`;
        }
        hint.innerHTML=html;
      }
    }else{
      hint.innerHTML='';
    }
  }
};

window.doLogin=async()=>{
  const pw=$('m_pw')?.value||'';
  const errEl=$('pw_err');
  if(!pw){if(errEl)errEl.textContent='請輸入密碼';return;}
  const btn=$('m_login_btn');if(btn){btn.disabled=true;btn.textContent='登入中…';}
  try{
    await setPersistence(auth,$('m_remember')?.checked?browserLocalPersistence:browserSessionPersistence);
    await signInWithEmailAndPassword(auth,BACKEND_EMAIL,pw);
    // onAuthStateChanged 會接手：開始同步並進入系統
    toast('✅ 歡迎進入沐蜜系統');
  }catch(e){
    console.error('登入失敗',e);
    const code=(e&&e.code)||'';
    let msg='❌ 登入失敗，請再試一次';
    if(/wrong-password|invalid-credential|invalid-login|user-not-found/.test(code))msg='❌ 密碼錯誤，請重新輸入';
    else if(/too-many-requests/.test(code))msg='⏳ 嘗試太多次，請稍等幾分鐘再試';
    else if(/network/.test(code))msg='📶 網路連不上，請確認網路後再試';
    if(errEl)errEl.textContent=msg;
    if($('m_pw')){$('m_pw').value='';$('m_pw').focus();}
    if(btn){btn.disabled=false;btn.textContent='進入系統';}
  }
};
window.doOut=async()=>{
  if(!confirm('確定登出？下次打開要重新輸入密碼。'))return;
  stopSync();
  S.auth=false;
  S.sync='idle';
  try{await signOut(auth);}catch(e){}
  render();
};

window.exportXLSX=()=>{
  if(typeof XLSX==='undefined'){toast('⏳ 載入中請稍候');return;}
  const wb=XLSX.utils.book_new();
  const ds=today();
  const salesRows=[['日期','類型','項目','細項備註','金額','付款','老師','客戶'],...S.data.sales.map(s=>[s.date,s.type==='service'?'服務':s.type==='product'?'產品':'課程',s.item,s.subNote||'',s.amount,s.payMethod,s.staff,s.customer])];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(salesRows),'銷售記錄');
  const expRows=[['日期','類別','金額','付款','備註'],...S.data.expenses.map(e=>[e.date,e.category,e.amount,e.payMethod,e.note])];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(expRows),'支出記錄');
  const invRows=[['產品名稱','類別','現有庫存','最低庫存','售價','成本','庫存價值'],...(S.data.products||[]).map(p=>{const i=getInv(p.id);return[p.name,p.category,i.qty,i.minQty||1,p.price,p.cost||0,toN(i.qty)*toN(p.cost||0)];})];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(invRows),'庫存清單');
  const purRows=[['日期','產品','類別','數量','單價','總成本','供應商'],...S.data.purchases.map(p=>[p.date,p.productName,p.category,p.qty,p.unitCost,p.totalCost,p.supplier])];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(purRows),'進貨記錄');
  const cfRows=[['日期','金額','類別','說明'],...S.data.cashFlow.map(c=>[c.date,c.amount,c.cat,c.note])];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(cfRows),'現金流水帳');
  // 客戶資料
  const custRows=[['姓名','電話','生日','來源','儲值餘額','累計消費','消費次數','備註'],...(S.data.customers||[]).map(c=>{
    const h=getCustomerHistory(c.name);
    return[c.name,c.phone||'',c.birthday||'',c.source||'',getCustomerBalance(c.name),h.totalSpent,h.visitCount,c.note||''];
  })];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(custRows),'客戶資料');
  // 儲值紀錄
  const dpRows=[['日期','客戶','儲值金額','實際收款方式','備註'],...(S.data.deposits||[]).map(d=>[d.date,d.customer,d.amount,d.payMethod,d.note])];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(dpRows),'儲值入帳');
  XLSX.writeFile(wb,`沐蜜財務_${ds}.xlsx`);
  toast('✅ Excel 已下載');
};
