  if($('note_folder'))d.folderId=$('note_folder').value;
  if(!d.title?.trim()){alert('請填主標題');return;}
  const cleanSubs=a=>(a||[]).map(x=>({label:x.label||'',text:x.text||'',subs:cleanSubs(x.subs)})).filter(x=>x.label.trim()||x.text.trim()||x.subs.length);

function careFillMsg(tmpl,customer,service,days){
  return String(tmpl||'')
    .replace(/\{客戶\}/g,customer||'')
    .replace(/\{服務\}/g,service||'')
    .replace(/\{天數\}/g,String(days==null?'':days));
}
// 算出目前所有「到期待關懷」的提醒（掃 sales × careRules）
function getCareDue(){
  const rules=(S.data.settings?.careRules||DEFAULT_CARE_RULES).filter(r=>r.enabled!==false);
  if(rules.length===0)return[];
  const done=S.data.settings?.careDone||{};
  const doneByCust=S.data.settings?.careDoneByCust||{};
  const todayStr=today();
  const now=new Date(todayStr+'T00:00:00');
  const WINDOW=45; // 回看窗：到期後 45 天內仍提醒，避免首次設定時舊單灌爆
  const out=[];
  (S.data.sales||[]).forEach(s=>{
    if(!s.customer||!s.date)return;
    const item=((s.item||'')+(s.subNote||''));
    rules.forEach(r=>{
      if(r.keyword&&!item.includes(r.keyword))return;
      const base=new Date(s.date+'T00:00:00');
      if(isNaN(base.getTime()))return;
      const due=new Date(base.getTime());due.setDate(due.getDate()+(toN(r.days)||0));
      const diffDue=Math.round((now-due)/86400000); // >=0 代表已到期
      if(diffDue<0)return;              // 還沒到提醒日
      if(diffDue>WINDOW)return;         // 太舊，不再提醒
      const key=s.id+'__'+r.id;
      if(done[key])return;              // 已關懷過
      if(doneByCust[normalizeName(s.customer)+'__'+s.date+'__'+r.id])return; // 紋繡完成頁已複製過
      const sinceOrder=Math.round((now-base)/86400000);
      out.push({saleId:s.id,ruleId:r.id,customer:(s.customer||'').trim(),service:(s.item||'').trim(),
        title:r.title||'關懷提醒',days:toN(r.days)||0,sinceOrder,overdueDays:diffDue,
        msg:r.msg||'',orderDate:s.date});
    });
  });
  // 越早開單（越久沒關懷）排越前面
  out.sort((a,b)=>b.overdueDays-a.overdueDays);
  return out;
}
window.careCopyMsg=(saleId,ruleId)=>{

window.uploadPmuDefaultBg=function(key,input){
  var file=input.files&&input.files[0];
  if(!file)return;
  toast('處理圖片中...');
  var reader=new FileReader();
  reader.onload=function(ev){
    // 先載入圖片，壓縮到合理大小（避免超過 Firebase 限制）
    var img=new Image();
    img.onload=async function(){
      try{
        // 壓縮：最長邊限制 800px，轉 JPEG 品質 0.75
        var maxSide=800;
        var w=img.width,h=img.height;
        if(w>maxSide||h>maxSide){
          var r=Math.min(maxSide/w,maxSide/h);
          w=Math.round(w*r);h=Math.round(h*r);
        }
        var canvas=document.createElement('canvas');
        canvas.width=w;canvas.height=h;
        var ctx=canvas.getContext('2d');
        ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        var compressed=canvas.toDataURL('image/jpeg',0.75);
        // 檢查大小（base64 約為實際的 1.33 倍，Firebase 單欄位建議 <900KB）
        var sizeKB=Math.round(compressed.length/1024);
        if(sizeKB>900){
          // 再壓一次
          compressed=canvas.toDataURL('image/jpeg',0.5);
          sizeKB=Math.round(compressed.length/1024);
        }
        if(sizeKB>950){
          alert('圖片太大（'+sizeKB+'KB），壓縮後仍超過限制。\n請用小一點的圖，或先用手機/電腦把圖片縮小再上傳。');
          return;
        }
        var settingKey=key==='face'?'pmuFaceBg':'pmuAnatomyBg';
        var settings=Object.assign({},S.data.settings||{});
        settings[settingKey]=compressed;
        var ok=await saveMain({settings});
        if(ok){
          S.data.settings=settings;
          toast('✅ 底圖已儲存（'+sizeKB+'KB），以後做紋繡會自動帶入');
          openM('pmuSettings');
        }else{
          alert('雲端儲存失敗，圖片可能還是太大。\n請換一張更小的圖再試。');
        }
      }catch(err){
        alert('儲存失敗：'+(err.message||err)+'\n可能是圖片太大，請換小一點的圖。');
      }
    };
    img.onerror=function(){alert('圖片讀取失敗，請換一張圖試試');};
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
};

window.slimMainDoc=async function(){
  const sizeOf=function(obj){try{return JSON.stringify(obj||'').length;}catch(e){return 0;}};
  const parts=[
    {key:'pmuRecords',label:'紋繡紀錄',size:sizeOf(S.data.pmuRecords)},
    {key:'pmuDrafts',label:'紋繡草稿',size:sizeOf(S.data.pmuDrafts)},
    {key:'faceBg',label:'面診底圖(設定)',size:sizeOf(S.data.settings&&S.data.settings.pmuFaceBg)+sizeOf(S.data.settings&&S.data.settings.pmuAnatomyBg)},
    {key:'customers',label:'客戶',size:sizeOf(S.data.customers)},
    {key:'products',label:'產品',size:sizeOf(S.data.products)},
    {key:'inventory',label:'庫存',size:sizeOf(S.data.inventory)},
    {key:'studyNotes',label:'備課筆記',size:sizeOf(S.data.studyNotes)},
    {key:'mindNotes',label:'聯想筆記',size:sizeOf(S.data.mindNotes)},
    {key:'serviceCosts',label:'成本卡',size:sizeOf(S.data.serviceCosts)},
    {key:'passContracts',label:'除毛合約',size:sizeOf(S.data.passContracts)},
    {key:'trialPacks',label:'試用包',size:sizeOf(S.data.trialPacks)}
  ];
  const total=mainDocSize();
  parts.sort(function(a,b){return b.size-a.size;});
  let msg='【主文件體檢】目前約 '+(total/1048576).toFixed(2)+' MB（上限 1 MB）\n（照片是分開存的，不算在這裡）\n\n各部分大小：\n';
  parts.forEach(function(p){
    if(p.size>1000)msg+='・'+p.label+'：'+(p.size/1024).toFixed(0)+' KB\n';
  });
  // 找出最大的建議處理
  const biggest=parts[0];
  msg+='\n最大的是「'+biggest.label+'」。\n\n';

  if(biggest.key==='faceBg'){
    msg+='面診底圖太大！要移除面診底圖嗎？（移除後紋繡面診會用內建線稿，你的圈記紀錄不受影響）';
    if(confirm(msg)){
      const settings=Object.assign({},S.data.settings||{});
      delete settings.pmuFaceBg;delete settings.pmuAnatomyBg;
      S.data.settings=settings;
      await saveMain({settings});
      alert('✅ 已移除面診底圖，釋放了 '+(biggest.size/1024).toFixed(0)+' KB');
      render();
    }
    return;
  }
  if(biggest.key==='pmuRecords'){
    msg+='紋繡紀錄太大（通常是面診圈記圖）。要「精簡圈記圖」嗎？（移除舊紀錄的面診圈記圖，文字紀錄保留）';
    if(confirm(msg)){
      const recs=(S.data.pmuRecords||[]).map(function(r){return Object.assign({},r,{faceMarkup:'',anatomyMarkup:''});});
      S.data.pmuRecords=recs;
      await saveMain({pmuRecords:recs});
      alert('✅ 已精簡圈記圖，釋放空間');
      render();
    }
    return;
  }
  if(biggest.key==='pmuDrafts'){
    msg+='要清掉所有紋繡草稿嗎？（不影響已完成的紀錄）';
    if(confirm(msg)){
      S.data.pmuDrafts=[];
      await saveMain({pmuDrafts:[]});
      alert('✅ 已清掉草稿');
      render();
    }
    return;
  }
  alert(msg+'這部分是正常營運資料，建議不要刪。如果真的太大再找我。');
};

window.pmuSaveResign=async(id)=>{
  if(!_sigCanvas||(!_sigHasContent&&!pmuCanvasHasInk(_sigCanvas))){alert('請先在框內簽名');return;}
  const sig=sigToJpeg(_sigCanvas,0.7);
  const at=nowLocal();
  const pmuRecords=(S.data.pmuRecords||[]).map(x=>x.id===id?{...x,consentSignature:sig,resignedAt:at}:x);
  S.data.pmuRecords=pmuRecords;
  const ok=await saveMain({pmuRecords});
  if(ok){toast('✅ 補簽已儲存');viewPmuSignature(id);}
};

window.delPmuRecord=async(id)=>{
  const r=(S.data.pmuRecords||[]).find(x=>x.id===id);
  if(!r)return;
  if(!confirm(`確定刪除 ${r.customer} 的紋繡紀錄（${r.date}）？\n⚠️ 含同意書簽名，刪除後無法復原。`))return;
  const pmuRecords=(S.data.pmuRecords||[]).filter(x=>x.id!==id);
  // 立刻更新本地（戰情數字才會馬上連動）
  S.data.pmuRecords=pmuRecords;
  // 順便清掉這筆的照片（pmuPhotos 子集合裡）
  const relatedPhotos=(S.data.pmuPhotos||[]).filter(p=>p.recordId===id);
  await saveMain({pmuRecords});
  // 刪照片子集合
  for(const ph of relatedPhotos){
    if(ph.id){try{await delSub('pmuPhotos',ph.id);}catch(e){}}
  }
  toast('已刪除');
  render();
};

window.depositPassContract=async(id)=>{
  const p=(S.data.passContracts||[]).find(x=>x.id===id);
  if(!p){alert('找不到合約');return;}
  if(p.deposited){alert('這筆已經入帳過了');return;}
  const perUse=p.perUse||(p.months>0?Math.round(p.price/p.months):p.price);
  if(!confirm(`確定為「${p.customer}」的 ${p.planName} 補入帳？\n\n金額 $${fmt(p.price)} 會：\n• 加進儲值餘額\n• 記進現金流收入\n\n每次除毛扣 $${fmt(perUse)}（${p.months}次）`))return;
  try{
    await finalizeDeposit({
      customer:p.customer,
      date:p.startDate,
      amount:p.price,
      actualReceived:p.price,
      payMethod:p.payMethod||'現金',
      note:`${p.planName}（補入帳，每次扣$${fmt(perUse)}，${p.months}次到期${p.endDate}）`,
      signature:p.signature,
      termsSnapshot:p.contractText,
      signed:true,
      scope:'restricted',
      allowedServices:['熱蠟除毛'],
      monthlyLimit:0
    });
    // 標記已入帳
    const passContracts=(S.data.passContracts||[]).map(x=>x.id===id?{...x,deposited:true,perUse}:x);
    await saveMain({passContracts});
    toast(`✅ 已為 ${p.customer} 補入帳 $${fmt(p.price)}`);
    render();
  }catch(e){alert('補入帳失敗：'+e.message);}
};

function pgExpenses(){
  const exps=getExp().sort((a,b)=>(b.date||'').localeCompare(a.date||''));

          <td class="an">$${fmt(e.amount)}</td>

// ⚡ JIT 補貨建議（維持 1-1.5 個月庫存）
function jitRestock(){
  const products=S.data.products||[];
  const allOuts=S.data.stockOuts||[];
  const todayD=new Date();
  // 算每個產品最近 3 個月的平均月消耗
  const results=[];
  products.forEach(function(p){
    const inv=getInv(p.id);
    const curQty=toN(inv.qty);
    // 近 90 天的消耗
    const recentOuts=allOuts.filter(function(o){
      if(o.productId!==p.id||!o.date)return false;
      const days=(todayD-new Date(o.date))/(1000*60*60*24);
      return days<=90&&days>=0;
    });
    const totalConsumed=recentOuts.reduce(function(s,o){return s+toN(o.qty);},0);
    if(totalConsumed===0)return; // 沒消耗資料，不建議
    const monthlyUse=totalConsumed/3; // 平均月消耗
    const safetyStock=monthlyUse*1.5; // 1.5 個月安全庫存
    const reorderPoint=monthlyUse; // 低於 1 個月就該補
    const monthsLeft=monthlyUse>0?curQty/monthlyUse:99;
    if(curQty<=reorderPoint){
      // 要補，補到 1.5 個月
      const suggestQty=Math.ceil(safetyStock-curQty);
      results.push({name:p.name,curQty:curQty,monthlyUse:Math.round(monthlyUse*10)/10,monthsLeft:Math.round(monthsLeft*10)/10,suggestQty:suggestQty,urgent:curQty<=monthlyUse*0.5});
    }
  });
  results.sort(function(a,b){return a.monthsLeft-b.monthsLeft;});

  if(results.length===0){
    // 看有沒有任何消耗資料
    const hasData=allOuts.length>0;
    if(!hasData){
      return '<div class="notice" style="background:var(--goldL);border-left-color:var(--gold);color:var(--goldDk);font-size:13px;margin-bottom:12px;">⚡ <b>JIT 補貨提醒</b>：目前沒有消耗紀錄，無法計算該補什麼。到「📤 出貨耗用 → ⚡快速記消耗」記下每次用掉的材料，累積 1-2 週後這裡就會自動提醒你補貨。</div>';
    }
    return '<div class="notice" style="background:#f0fdf4;border-left-color:#16a34a;color:#15803d;font-size:13px;margin-bottom:12px;">✅ <b>JIT 庫存健康</b>：目前所有產品庫存都還夠（1 個月以上），不需進貨。維持 1-1.5 個月庫存即可，別囤太多。</div>';
  }

  var html='<div class="card" style="margin-bottom:14px;border:2px solid #16a34a;"><div class="card-hd" style="background:#f0fdf4;"><span class="card-ttl" style="color:#16a34a;">⚡ JIT 補貨建議（維持 1.5 個月庫存）</span></div><div class="card-bd">';
  html+='<div class="tm" style="font-size:12px;margin-bottom:10px;">依最近 3 個月消耗算出來。庫存低於 1 個月量的，建議補到 1.5 個月就好，不多囤。</div>';
  html+='<div class="tw"><table style="width:100%;font-size:13px;"><thead><tr style="border-bottom:2px solid #16a34a;"><th style="padding:6px;text-align:left;">產品</th><th style="padding:6px;">現有</th><th style="padding:6px;">月用量</th><th style="padding:6px;">還能撐</th><th style="padding:6px;">建議補</th></tr></thead><tbody>';
  results.forEach(function(r){
    html+='<tr style="border-bottom:1px solid var(--bdr);'+(r.urgent?'background:#fef2f2;':'')+'">';
    html+='<td style="padding:6px;"><b>'+r.name+'</b>'+(r.urgent?' <span style="font-size:10px;background:#dc2626;color:#fff;padding:1px 5px;border-radius:6px;">急</span>':'')+'</td>';
    html+='<td style="padding:6px;text-align:center;">'+fmt(r.curQty)+'</td>';
    html+='<td style="padding:6px;text-align:center;">'+r.monthlyUse+'</td>';
    html+='<td style="padding:6px;text-align:center;color:'+(r.urgent?'#dc2626':'#d97706')+';">'+r.monthsLeft+' 月</td>';
    html+='<td style="padding:6px;text-align:center;font-weight:700;color:#16a34a;">+'+r.suggestQty+'</td>';
    html+='</tr>';
  });
  html+='</tbody></table></div></div></div>';
  return html;
}

// ─── 設備折舊 ─────────────────────────────────────────────// ═══════════ 💰 設備重置基金（機器自己幫自己存「退休金＋繼承者基金」）═══════════
function eqAddYears(ds,y){if(!ds)return '';const d=new Date(ds+'T00:00:00');d.setMonth(d.getMonth()+Math.round(toN(y)*12));return actYmd(d);}
function eqMonthsBetween(a,b){const d1=new Date(a+'T00:00:00'),d2=new Date(b+'T00:00:00');return (d2.getFullYear()-d1.getFullYear())*12+(d2.getMonth()-d1.getMonth());}
function eqFund(e){
  const per=toN(e.fundPerUse)||30;
  const kws=String(e.fundKeyword||'').split(/[,，、\s]+/).map(s=>s.trim()).filter(Boolean);
  const start=e.fundStart||e.purchaseDate||'';
  const td=today(),d30=actAddDays(td,-30),mon=td.slice(0,7);
  const hit=s=>kws.length&&kws.some(k=>((s.item||'')+(s.subNote||'')).includes(k));
  const sales=(S.data.sales||[]).filter(s=>s.date&&(!start||s.date>=start)&&hit(s));
  const uses=sales.length;
  const accrued=uses*per;
  const spent=(e.fundSpends||[]).reduce((a,x)=>a+toN(x.amount),0);
  const added=(e.fundAdds||[]).reduce((a,x)=>a+toN(x.amount),0);
  const balance=accrued+added-spent;
  const last30=sales.filter(s=>s.date>=d30).length;
  const monthUses=sales.filter(s=>s.date.slice(0,7)===mon).length;
  const pace=last30*per; // 每月大約可存
  const replaceDate=eqAddYears(e.purchaseDate,e.years||3);
  const goldenDate=eqAddYears(e.purchaseDate,e.goldenYears||2);
  const monthsLeft=replaceDate?Math.max(0,eqMonthsBetween(td,replaceDate)):0;
  const projected=balance+pace*monthsLeft;
  const target=toN(e.fundTarget)||toN(e.cost);
  return {per,kws,start,uses,accrued,spent,balance,last30,monthUses,monthAmt:monthUses*per,pace,replaceDate,goldenDate,monthsLeft,projected,target,mon};
}

function assetCheckInventoryAndDecor(){
  const products=S.data.products||[];
  const decor=(S.data.settings&&S.data.settings.decorAssets)||[];
  const todayStr=today();
  const invItems=products.map(function(p){
    const inv=getInv(p.id);
    const qty=toN(inv.qty);
    const value=qty*toN(getAvgCost(p.id));
    const outs=(S.data.stockOuts||[]).filter(function(s){return s.productId===p.id;});
    const lastOut=outs.length>0?outs.map(function(s){return s.date;}).sort().pop():'';
    const daysSinceOut=lastOut?Math.floor((new Date(todayStr)-new Date(lastOut))/(1000*60*60*24)):999;

// 計算服務成本卡的財務數據
// ─── 計算單位成本（每 1g/1ml/1片的成本）──
// 邏輯：產品「整瓶/整盒」的進貨成本 ÷ 內含容量 = 單位成本
function getUnitCost(productId){
  const p=(S.data.products||[]).find(x=>x.id===productId);
  if(!p)return 0;
  const totalCost=getAvgCost(productId);  // 整瓶/整個的成本
  const capacity=toN(p.capacity);  // 內含容量（如 400ml）
  if(capacity>0)return totalCost/capacity;  // 每 1ml/1g 多少錢
  return totalCost;  // 沒填容量 → 整瓶當一個單位
}

// ── 標準成本（合約價）：用於定價，比較保守安全 ──
// 優先用手動填的 product.cost（＝跟廠商簽的合約價，如售價五折）
// 沒填的話，退回實際加權平均成本
function getStdCost(pid){
  const p=(S.data.products||[]).find(x=>x.id===pid);
  const std=toN(p?.cost);
  if(std>0)return std;
  return getAvgCost(pid);  // 沒填標準成本 → 用實際成本
}

// 標準成本的每單位（每 ml / 每 g）成本
function getStdUnitCost(productId){
  const p=(S.data.products||[]).find(x=>x.id===productId);
  if(!p)return 0;
  const totalCost=getStdCost(productId);
  const capacity=toN(p.capacity);
  if(capacity>0)return totalCost/capacity;
  return totalCost;
}

// 採購效益：標準成本 vs 實際成本的差（正數＝你買得比合約便宜）
function getPurchaseBenefit(pid){
  const std=getStdCost(pid);
  const act=getAvgCost(pid);
  if(std<=0||act<=0)return{diff:0,pct:0,hasBoth:false};
  const diff=std-act;
  const pct=Math.round(diff/std*1000)/10;
  return{diff,pct,std,act,hasBoth:true};
}

function calcServiceCardFinancials(card,fixedPerSvc,costMode){
  const products=S.data.products||[];
  // 成本模式：預設跟定價規劃器一致，用「標準成本（合約價）」
  const mode=costMode||S.cardCostMode||'std';
  const costFn=mode==='std'?getStdUnitCost:getUnitCost;
  // 材料成本：用「單位成本」× 用量（最後才四捨五入，避免累積誤差）
  const materialCostRaw=(card.items||[]).reduce((s,it)=>{
    return s+costFn(it.productId)*toN(it.qty);
  },0);
  const materialCost=Math.round(materialCostRaw*100)/100;
  const price=toN(card.price);
  const commRate=card.commissionRate!==undefined?toN(card.commissionRate):0.6;
  const commission=Math.round(price*commRate);
  // 固定攤分：優先順序
  // 1. 服務卡自訂金額（card.fixedOverride）
  // 2. 床位每小時成本 × 服務時長
  // 3. fallback fixedPerSvc（房租÷月服務數，舊邏輯）
  let fixed=0;
  let fixedSource='';
  if(card.fixedOverride!==undefined&&card.fixedOverride!==''){
    fixed=toN(card.fixedOverride);
    fixedSource='custom';
  }else if(toN(card.duration)>0){
    const hourlyRate=toN(S.data.settings?.bedHourlyRate);
    if(hourlyRate>0){
      fixed=Math.round(hourlyRate*toN(card.duration)/60);
      fixedSource='hourly';
    }else{
      fixed=toN(fixedPerSvc);
      fixedSource='fallback';
    }
  }else{
    fixed=toN(fixedPerSvc);
    fixedSource='fallback';
  }
  const totalCost=materialCost+commission+fixed;
  const companyNet=price-totalCost;
  const netMargin=price>0?Math.round(companyNet/price*100):0;
  const denominator30=1-commRate-0.30;
  const suggestedPrice30=denominator30>0?Math.ceil((materialCost+fixed)/denominator30/100)*100:0;
  const denominator20=1-commRate-0.20;
  const suggestedPrice20=denominator20>0?Math.ceil((materialCost+fixed)/denominator20/100)*100:0;
  return{materialCost,commission,fixed,fixedSource,totalCost,companyNet,netMargin,suggestedPrice30,suggestedPrice20};
}

  {id:'design',label:'眉型設計',icon:'✏️'},
  {id:'operation',label:'操作紀錄',icon:'🎨'},
  {id:'finish',label:'完成',icon:'✅'}
];

function pmuStageIndex(id){for(var i=0;i<PMU_STAGES.length;i++){if(PMU_STAGES[i].id===id)return i;}return 0;}

function pgPmuView(t){
  if(t.pmuSubmitted)return pmuDoneView(t);

  var curIdx=pmuStageIndex(t.pmuStage);
  var stage=t.pmuStage;

  // 頂部進度導覽
  var nav='<div style="display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap;">';
  PMU_STAGES.forEach(function(s,i){
    var active=s.id===stage;
    var done=i<curIdx;
    var bg=active?'#9333ea':done?'#e9d5f5':'#fff';
    var col=active?'#fff':done?'#7e22ce':'var(--mut)';
    nav+='<button type="button" onclick="pmuGoStage(&quot;'+s.id+'&quot;)" style="flex:1;min-width:52px;padding:8px 3px;border-radius:8px;border:2px solid '+(active?'#9333ea':'#e5d5f5')+';background:'+bg+';color:'+col+';cursor:pointer;font-size:11px;font-weight:'+(active?'700':'400')+';">'+s.icon+'<br>'+(i+1)+'.'+s.label+'</button>';
  });
  nav+='</div>';

  // 內容
  var body='';
  if(stage==='consent')body=pmuConsentStage(t);
  else if(stage==='design')body=pmuDesignStage(t);
  else if(stage==='operation')body=pmuOperationStage(t);
  else if(stage==='finish')body=pmuFinishStage(t);

  // 底部上一步/下一步
  var navBtns='<div style="display:flex;gap:10px;margin-top:20px;">';
  if(curIdx>0){
    navBtns+='<button type="button" class="btn btn-s" style="flex:1;padding:14px;" onclick="pmuPrevStage()">← 上一步</button>';
  }
  if(curIdx<PMU_STAGES.length-1){
    navBtns+='<button type="button" class="btn btn-p" style="flex:2;padding:14px;background:#9333ea;" onclick="pmuNextStage()">下一步 →</button>';
  }
  navBtns+='</div>';

  return '<button type="button" onclick="cancelPmu()" title="離開" style="position:fixed;top:14px;right:14px;z-index:100;background:rgba(255,255,255,0.7);border:1px solid var(--bdr);color:var(--mut);padding:6px 12px;border-radius:20px;font-size:11px;cursor:pointer;opacity:0.6;">離開</button>'
    +'<div style="max-width:680px;margin:0 auto;padding:20px 16px 60px;">'
    +'<div class="pg-ttl" style="color:#9333ea;">🎨 紋繡服務'+(t.customer?'：'+t.customer:'')+'</div>'
    +'<div style="display:flex;align-items:center;gap:6px;margin-bottom:12px;"><span style="font-size:11px;color:#16a34a;">☁️ 自動儲存中</span></div>'
    +nav+body+navBtns
    +'</div>';
}

// 上一步/下一步（含自動存檔）
window.pmuPrevStage=function(){
  var idx=pmuStageIndex(S.treatment.pmuStage);
  if(idx>0){pmuSaveInputs();pmuAutoSave();pmuGoStage(PMU_STAGES[idx-1].id);}
};
window.pmuNextStage=function(){
  var idx=pmuStageIndex(S.treatment.pmuStage);
  // 諮詢階段：若畫布有簽名但還沒按確認，自動確認
  if(S.treatment.pmuStage==='consent'&&!S.treatment.consentSignature){
    // 嘗試自動抓取簽名
    if(_sigCanvas&&pmuCanvasHasInk(_sigCanvas)){
      var nm=document.getElementById('pmu_customer');
      if(nm&&nm.value.trim())S.treatment.customer=nm.value.trim();
      var agree=document.getElementById('pmu_consent_agree');
      if(agree&&agree.checked)S.treatment.consentAgreed=true;
      if(!S.treatment.customer){alert('請填客戶姓名');return;}
      if(!S.treatment.consentAgreed){alert('請勾選「我已詳閱並同意」');return;}
      S.treatment.consentSignature=sigToJpeg(_sigCanvas,0.7);
      S.treatment.consentSignedAt=nowLocal();
    }else{
      alert('請先讓客人簽名，再進行下一步');
      return;
    }
  }
  if(idx<PMU_STAGES.length-1){pmuSaveInputs();pmuAutoSave();pmuGoStage(PMU_STAGES[idx+1].id);}
};

// 檢查畫布上是否有筆跡（讀像素，比 _sigHasContent 可靠）
// 簽名板背景是透明的，直接轉 JPEG 會變全黑；先鋪白底再轉
function sigToJpeg(canvas,q){
  try{
    var c=document.createElement('canvas');c.width=canvas.width;c.height=canvas.height;
    var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(canvas,0,0);
    return c.toDataURL('image/jpeg',q||0.7);
  }catch(e){return canvas.toDataURL('image/png');}
}
function pmuCanvasHasInk(canvas){
  try{
    var ctx=canvas.getContext('2d');
    var data=ctx.getImageData(0,0,canvas.width,canvas.height).data;
    // 掃描：只要有非透明、非全白的像素就算有簽
    for(var i=0;i<data.length;i+=40){ // 每隔幾個像素抽查，加快速度
      var alpha=data[i+3];
      if(alpha>10){
        var r=data[i],g=data[i+1],b=data[i+2];
        // 非接近白色
        if(r<240||g<240||b<240)return true;
      }
    }
    return false;
  }catch(e){return _sigHasContent;}
}

// 自動存檔到雲端（存成「進行中」的紋繡紀錄，避免跳出頁面遺失）
window.pmuAutoSave=async function(){
  var t=S.treatment;
  if(!t||t.mode!=='pmu')return;
  if(!t.draftId)t.draftId=uid();
  pmuSaveInputs();
  // 存「整份流程」的所有欄位（含眉型設計新欄位），只排除照片與大圖（避免超過 Firebase 1MB 限制）
  var EXCL={photosBefore:1,photosAfter:1,consentSignature:1,faceMarkup:1,_sigTemp:1,pmuSubmitted:1};
  var draft={};
  Object.keys(t).forEach(function(k){if(!EXCL[k])draft[k]=t[k];});
  draft.id=t.draftId;draft.isDraft=true;draft.updatedAt=nowLocal();draft.mode='pmu';
  draft.photosBeforeCount=(t.photosBefore||[]).length;
  draft.photosAfterCount=(t.photosAfter||[]).length;
  draft.hasConsentSign=!!t.consentSignature;draft.hasFaceMarkup=!!t.faceMarkup;
  // 已簽的簽名縮小後一起存（約幾 KB），繼續流程時不用重簽
  if(t.consentSignature){try{draft.consentSignatureSmall=await pmuShrinkImage(t.consentSignature,360,0.6);}catch(e){}}
  var drafts=(S.data.pmuDrafts||[]).filter(function(d){return d.id!==t.draftId;});
  drafts.push(draft);
  S.data.pmuDrafts=drafts;
  // 自動存檔：用靜默版，失敗不跳訊息（不影響流程，下一步不依賴它）
  try{await saveMainSilent({pmuDrafts:drafts});}catch(e){}
};


// 把簽名圖縮小（草稿用，節省空間）
function pmuShrinkImage(src,maxW,q){
  return new Promise(function(res,rej){
    var img=new Image();
    img.onload=function(){try{var w=Math.min(maxW,img.width||maxW),hh=Math.round((img.height||1)*w/(img.width||1));var c=document.createElement('canvas');c.width=w;c.height=hh;var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,hh);x.drawImage(img,0,0,w,hh);res(c.toDataURL('image/jpeg',q||0.6));}catch(e){rej(e);}};
    img.onerror=rej;img.src=src;
  });
}

window.pmuResumeDraft=function(id){
  var d=(S.data.pmuDrafts||[]).find(function(x){return x.id===id;});
  if(!d){toast('找不到這筆草稿');return;}
  var t=JSON.parse(JSON.stringify(d));
  delete t.isDraft;delete t.updatedAt;delete t.photosBeforeCount;delete t.photosAfterCount;delete t.hasConsentSign;delete t.hasFaceMarkup;
  t.mode='pmu';t.draftId=d.id;t.pmuSubmitted=false;
  t.photosBefore=[];t.photosAfter=[];
  t.consentSignature=d.consentSignatureSmall||null;delete t.consentSignatureSmall;
  if(!t.consentSignature){t.consentSignedAt='';}
  ['tools','pigments','conditions','allergies','healthFlags','painPoints'].forEach(function(k){if(!Array.isArray(t[k]))t[k]=[];});
  if(!t.faceAnswers)t.faceAnswers={};
  if(!t.pmuStage)t.pmuStage='consent';
  S.treatment=t;S.page='treatment';
  render();
  toast('▶ 已接續 '+(t.customer||'')+' 的紋繡流程');
};
window.pmuDeleteDraft=async function(id){
  var d=(S.data.pmuDrafts||[]).find(function(x){return x.id===id;});
  if(!confirm('確定刪除「'+((d&&d.customer)||'未填姓名')+'」這筆未完成的紋繡流程？'))return;
  var drafts=(S.data.pmuDrafts||[]).filter(function(x){return x.id!==id;});
  S.data.pmuDrafts=drafts;

};

window.pmuUploadPhoto=function(when,input){
  var files=input.files;
  if(!files||files.length===0)return;
  var photosKey=when==='before'?'photosBefore':'photosAfter';
  if(!S.treatment[photosKey])S.treatment[photosKey]=[];
  if(S.treatment[photosKey].length>=3){alert('每種照片最多 3 張，已達上限。');return;}
  var canAdd=3-S.treatment[photosKey].length;
  var toProcess=Array.prototype.slice.call(files,0,canAdd);
  var remaining=toProcess.length;
  toast('處理照片中...');
  toProcess.forEach(function(file){
    var reader=new FileReader();
    reader.onload=function(ev){
      var img=new Image();
      img.onload=function(){
        var maxSide=500;var w=img.width,h=img.height;
        if(w>maxSide||h>maxSide){var r=Math.min(maxSide/w,maxSide/h);w=Math.round(w*r);h=Math.round(h*r);}
        var canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
        var ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);
        var compressed=canvas.toDataURL('image/jpeg',0.55);
        if(Math.round(compressed.length/1024)>200)compressed=canvas.toDataURL('image/jpeg',0.4);
        S.treatment[photosKey].push(compressed);
        remaining--;
        if(remaining===0){pmuAutoSave();var c=$('pg-content');if(c)c.innerHTML=renderPage();toast('✅ 照片已加入');}
      };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);
  });
};

// 事後補照片到已完成的紋繡紀錄（存 pmuPhotos 子集合）
window.addPhotoToPmuRecord=function(recId,input){
  var files=input.files;
  if(!files||files.length===0)return;
  var rec=(S.data.pmuRecords||[]).find(function(x){return x.id===recId;});
  if(!rec){alert('找不到紀錄');return;}
  var existing=(S.data.pmuPhotos||[]).filter(function(p){return p.recordId===recId;}).length;
  var canAdd=Math.max(0,8-existing);
  if(canAdd===0){alert('這筆紀錄照片已達上限（8張）');return;}
  var toProcess=Array.prototype.slice.call(files,0,canAdd);
  var remaining=toProcess.length;
  toast('處理照片中...');
  toProcess.forEach(function(file){
    var reader=new FileReader();
    reader.onload=function(ev){
      var img=new Image();
      img.onload=async function(){
        var maxSide=500;var w=img.width,h=img.height;
        if(w>maxSide||h>maxSide){var r2=Math.min(maxSide/w,maxSide/h);w=Math.round(w*r2);h=Math.round(h*r2);}
        var canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
        var ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);
        var compressed=canvas.toDataURL('image/jpeg',0.55);
        if(Math.round(compressed.length/1024)>200)compressed=canvas.toDataURL('image/jpeg',0.4);
        try{
          await addSub('pmuPhotos',{recordId:recId,customer:rec.customer,type:'after',img:compressed});
        }catch(e){alert('照片存檔失敗：'+e.message);}
        remaining--;
        if(remaining===0){toast('✅ 照片已補上');render();}
      };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);
  });
};

window.pmuDelPhoto=function(when,i){
  var photosKey=when==='before'?'photosBefore':'photosAfter';
  if(S.treatment[photosKey]){S.treatment[photosKey].splice(i,1);pmuAutoSave();var c=$('pg-content');if(c)c.innerHTML=renderPage();}
};

// 依色系＋效果＋毛色，取出建議方案
function pmuColorOptions(t){
  const line=PMU_COLOR_LINES.find(l=>l.label===t.colorLine);if(!line)return null;
  const eff=line.effects.find(e=>e.label===t.colorEffect);if(!eff)return {line,eff:null,opts:[]};
  let opts=eff.opts.map(o=>Object.assign({},o));
  // 特例：咖色、喜歡淡淡的，但原生毛很濃
  if(line.key==='brown'&&eff.label==='淡淡的感覺'&&t.browHairTone==='很濃/偏黑'){
    opts=[{arr:'一排一排刷，全部不做到眉脊、不加強眉脊',mix:'全部 00',tip:'原生毛很濃：後續可用染眉膏或染眉的方式銜接，呈現淡淡的柔和感。',special:true}].concat(opts);
  }
  return {line,eff,opts};
}
function pmuColorPickKey(t,i){return (t.colorLine||'')+'|'+(t.colorEffect||'')+'|'+(t.browHairTone==='很濃/偏黑'?'thick':'n')+'|'+i;}
function pmuColorRecipeText(t){
  const r=pmuColorOptions(t);if(!r||!r.eff)return '';
  let pick=null;
  r.opts.forEach((o,i)=>{if(t.colorPick===pmuColorPickKey(t,i))pick=o;});
  if(!pick&&r.opts.length===1)pick=r.opts[0];
  return r.line.label+'｜'+r.eff.label+(pick?'｜'+pick.arr+'｜'+pick.mix:'');
}
function pmuNeedHints(t){
  const hints=[];
  if(t.makeupHabit==='平常素顏')hints.push('素顏無違和 → 建議走「淡淡的感覺」');
  else if(t.makeupHabit)hints.push('想讓日常上妝更輕鬆 → 眉形要完整（建議「有眉型／眉型完整」）');
  if((t.painPoints||[]).indexOf(PMU_LASTING_POINT)>=0)hints.push('想要很持久、不要一直補 → <b>顏色要選深一點</b>');
  return hints;
}

  // ③ 髮色

  h+='<div>'+PMU_HAIR_TONES.map(o=>chip('hairTone',o,t.hairTone===o,'#7c3aed')).join('')+'</div>';

  // 建議方案

  h+='<div style="font-size:15px;font-weight:800;color:#be185d;margin-bottom:8px;">🎯 建議的排列與選色</div>';

window.pmuToggle=(field,val)=>{
  if(!S.treatment)return;
  if(!Array.isArray(S.treatment[field]))S.treatment[field]=[];
  const arr=S.treatment[field];
  const i=arr.indexOf(val);
  if(i>=0)arr.splice(i,1);else arr.push(val);
  if(window.event&&window.event.target){
    const el=window.event.target.closest('label')||window.event.target;
    const on=arr.includes(val);
    const color=field==='conditions'?'var(--red)':field==='allergies'?'var(--gold)':'var(--pur)';
    el.style.background=on?color:'var(--bg2)';
    el.style.color=on?'#fff':'var(--txt)';
    el.textContent=(on?'✓ ':'')+val;
  }
  var adv=document.getElementById('pmu_color_advisor');
  if(adv&&(field==='painPoints'||field==='motivations'))adv.innerHTML=pmuColorAdvisorHtml(S.treatment);
};

// 取這位客人的「初次施作日期」（最早一筆紋繡紀錄；優先新客首次）
// 初次施作日期 → 間隔與免費期判斷（只更新這一小塊，不重繪整頁）
function pmuFirstDateVerdictHtml(t){
  var f=t.firstPmuDate||'',d=t.date||today();
  if(!f)return '';
  var d1=new Date(f+'T00:00:00'),d2=new Date(d+'T00:00:00');
  if(isNaN(d1.getTime())||isNaN(d2.getTime()))return '';
  var days=Math.round((d2-d1)/86400000);
  if(days<0)return '<div class="notice" style="background:#fef2f2;border-left-color:#dc2626;color:#991b1b;font-size:13px;margin-top:8px;">⚠️ 初次施作日期晚於今天，請再確認</div>';
  var months=(d2.getFullYear()-d1.getFullYear())*12+(d2.getMonth()-d1.getMonth());
  var verdict='';
  if(t.pmuServiceType==='free'){
    var pr=(S.data.settings&&S.data.settings.pmuPricing&&S.data.settings.pmuPricing['霧眉'])||DEFAULT_PMU_PRICING['霧眉'];
    var fm=toN(pr.freeMonths)||3;
    verdict=(days<=fm*31)?'<span style="color:#16a34a;font-weight:800;">✓ 仍在 '+fm+' 個月免費補色期內</span>':'<span style="color:#dc2626;font-weight:800;">⚠️ 已超過 '+fm+' 個月免費期（建議改回娘家付費補色）</span>';
  }
  return '<div class="notice" style="background:#fffbeb;border-left-color:#d97706;color:#92400e;font-size:13px;margin-top:8px;">距初次施作約 '+months+' 個月（'+days+' 天）　'+verdict+'</div>';
}
window.pmuFirstDateChanged=function(v){
  if(!S.treatment)return;
  S.treatment.firstPmuDate=v||'';
  var el=document.getElementById('pmu_firstDate_verdict');
  if(el)el.innerHTML=pmuFirstDateVerdictHtml(S.treatment);
};
function getFirstPmuDate(name){
  if(!name)return '';
  const nm=normalizeName(name);
  const recs=(S.data.pmuRecords||[]).filter(function(r){return normalizeName(r.customer)===nm&&r.date;}).sort(function(a,b){return(a.date||'').localeCompare(b.date||'');});
  if(recs.length===0)return '';
  const firstNew=recs.find(function(r){return r.pmuServiceType==='new'||!r.pmuServiceType;});
  return (firstNew&&firstNew.date)||recs[0].date||'';
}

// 確認簽署（存簽名，不跳階段，讓使用者自己按下一步）
window.pmuConfirmConsent=function(){
  var t=S.treatment;if(!t)return;
  if(!t.customer||(document.getElementById('pmu_customer')&&!document.getElementById('pmu_customer').value.trim())){
    if(document.getElementById('pmu_customer'))t.customer=document.getElementById('pmu_customer').value.trim();
  }
  if(!t.customer){alert('請填客戶姓名');return;}
  // 讀取各勾選狀態
  var gp=document.getElementById('pmu_agree_privacy');if(gp)t.agreePrivacy=gp.checked;
  var gn=document.getElementById('pmu_agree_notice');if(gn)t.agreeNotice=gn.checked;
  var gm=document.getElementById('pmu_agree_media');if(gm)t.agreeMedia=gm.checked;
  var ca=document.getElementById('pmu_consent_agree');if(ca)t.consentAgreed=ca.checked;
  var fd=document.getElementById('pmu_firstDate');if(fd&&fd.value)t.firstPmuDate=fd.value;
  // 身體狀況：捕捉補充文字與真實聲明
  var hn=document.getElementById('pmu_healthNote');if(hn)t.healthNote=hn.value;
  var hd=document.getElementById('pmu_health_declare');if(hd)t.healthDeclare=hd.checked;
  if(!t.agreePrivacy){alert('請勾選「我已閱讀並同意個人資料之蒐集與使用」');return;}
  if(!t.agreeNotice){alert('請勾選「已閱讀並理解服務說明與術後照護須知」');return;}
  if(!t.consentAgreed){alert('請勾選最下方「同意服務與退費同意書」');return;}
  // 身體狀況紅燈/黃燈提醒（不硬性阻擋，但簽署前再確認一次）
  var _hf=t.healthFlags||[];
  var _red=PMU_HEALTH_ITEMS.filter(function(it){return it.cat==='red'&&_hf.indexOf(it.id)>=0;});
  var _yel=PMU_HEALTH_ITEMS.filter(function(it){return it.cat==='yellow'&&_hf.indexOf(it.id)>=0;});
  if(_red.length>0){
    if(!confirm('🔴 偵測到紅燈狀況：'+_red.map(function(x){return x.label;}).join('、')+'\n\n原則上不予施作、建議退單。確定仍要繼續簽署？'))return;
  }else if(_yel.length>0){
    if(!confirm('🟡 偵測到黃燈狀況：'+_yel.map(function(x){return x.label;}).join('、')+'\n\n屬高風險，請確認已向客人說明並加簽特殊評估免責。確定繼續簽署？'))return;
  }
  if(!_sigCanvas||(!_sigHasContent&&!pmuCanvasHasInk(_sigCanvas))){alert('請在下方簽名');return;}
  t.consentSignature=sigToJpeg(_sigCanvas,0.7);
  t.consentSignedAt=nowLocal();
  t.consentAgreed=true;
  pmuAutoSave();
  toast('✅ 同意書已簽署，可以按「下一步」');
  var c=$('pg-content');if(c)c.innerHTML=renderPage();
};

window.fqSetType=function(qi,type){if(S.modal&&S.modal.fqDraft&&S.modal.fqDraft[qi]){S.modal.fqDraft[qi].type=type;if(type==='choice'&&!S.modal.fqDraft[qi].options)S.modal.fqDraft[qi].options=[''];fqRerender();}};

window.fqMoveUp=function(qi){if(S.modal&&S.modal.fqDraft&&qi>0){var arr=S.modal.fqDraft;var tmp=arr[qi-1];arr[qi-1]=arr[qi];arr[qi]=tmp;fqRerender();}};
function fqRerender(){var el=document.getElementById('fq_list');if(el&&S.modal&&S.modal.fqDraft)el.innerHTML=S.modal.fqDraft.map(function(q,qi){return renderFaceQEditor(q,qi);}).join('');}

window.fqAddOption=function(qi){if(S.modal&&S.modal.fqDraft&&S.modal.fqDraft[qi]){if(!S.modal.fqDraft[qi].options)S.modal.fqDraft[qi].options=[];S.modal.fqDraft[qi].options.push('');fqRerender();}};
window.fqDelQuestion=function(qi){if(S.modal&&S.modal.fqDraft){if(!confirm('刪除整個題目「'+(S.modal.fqDraft[qi].label||'')+'」？'))return;S.modal.fqDraft.splice(qi,1);fqRerender();}};
window.fqAddQuestion=function(type){if(!S.modal)return;if(!S.modal.fqDraft)S.modal.fqDraft=[];if(type==='text'){S.modal.fqDraft.push({key:'q_'+uid(),type:'text',label:'',placeholder:''});}else{S.modal.fqDraft.push({key:'q_'+uid(),type:'choice',label:'',options:['']});}fqRerender();};
window.fqReset=function(){if(!confirm('還原成預設題目？'))return;S.modal.fqDraft=JSON.parse(JSON.stringify(DEFAULT_PMU_FACE_QUESTIONS));fqRerender();};
window.saveFaceQuestions=async function(){
  var qs=(S.modal.fqDraft||[]).filter(function(q){return (q.label||'').trim();}).map(function(q){
    var type=q.type||'choice';
    if(type==='text'){
      return {key:q.key||('q_'+uid()),type:'text',label:q.label.trim(),placeholder:q.placeholder||''};
    }
    return {key:q.key||('q_'+uid()),type:'choice',label:q.label.trim(),options:(q.options||[]).map(function(o){return (o||'').trim();}).filter(function(o){return o;})};

// ── 全臉面診圈記畫布 ──
var _faceCanvas=null,_faceCtx=null,_faceDrawing=false,_faceHasContent=false;
function drawFaceTemplate(ctx,w,h){
  ctx.clearRect(0,0,w,h);
  var cx=w/2, cy=h*0.5;
  // 底色柔和漸層（營造立體感）
  var grad=ctx.createRadialGradient(cx,cy*0.9,w*0.05,cx,cy,w*0.42);
  grad.addColorStop(0,'#fffdfe');
  grad.addColorStop(1,'#f6eefc');

  // ===== 臉型（鵝蛋臉，含下顎立體線）=====
  ctx.beginPath();
  ctx.moveTo(cx,h*0.10);
  // 右臉頰→下顎
  ctx.bezierCurveTo(cx+w*0.22,h*0.11, cx+w*0.30,h*0.34, cx+w*0.27,h*0.52);
  ctx.bezierCurveTo(cx+w*0.25,h*0.68, cx+w*0.15,h*0.82, cx,h*0.90);
  // 左臉頰
  ctx.bezierCurveTo(cx-w*0.15,h*0.82, cx-w*0.25,h*0.68, cx-w*0.27,h*0.52);
  ctx.bezierCurveTo(cx-w*0.30,h*0.34, cx-w*0.22,h*0.11, cx,h*0.10);
  ctx.closePath();
  ctx.fillStyle=grad;ctx.fill();
  ctx.strokeStyle='#b89dd4';ctx.lineWidth=2.2;ctx.stroke();

  // 臉頰立體陰影線（顴骨）
  ctx.strokeStyle='#e3d3f0';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(cx-w*0.20,h*0.42);ctx.quadraticCurveTo(cx-w*0.17,h*0.52,cx-w*0.13,h*0.60);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx+w*0.20,h*0.42);ctx.quadraticCurveTo(cx+w*0.17,h*0.52,cx+w*0.13,h*0.60);ctx.stroke();

  // 髮際線
  ctx.strokeStyle='#cbb8e0';ctx.lineWidth=1.8;
  ctx.beginPath();ctx.moveTo(cx-w*0.20,h*0.20);ctx.quadraticCurveTo(cx,h*0.09,cx+w*0.20,h*0.20);ctx.stroke();

  // ===== 眉毛（有毛流感的雙線）=====
  ctx.strokeStyle='#9333ea';ctx.lineWidth=2.6;ctx.lineCap='round';
  // 左眉（上緣）
  ctx.beginPath();ctx.moveTo(cx-w*0.20,h*0.345);
  ctx.bezierCurveTo(cx-w*0.15,h*0.30, cx-w*0.09,h*0.305, cx-w*0.035,h*0.335);ctx.stroke();
  // 左眉（下緣，較細，做出厚度）
  ctx.lineWidth=1.4;
  ctx.beginPath();ctx.moveTo(cx-w*0.19,h*0.365);
  ctx.quadraticCurveTo(cx-w*0.12,h*0.345,cx-w*0.04,h*0.355);ctx.stroke();
  // 右眉（上緣）
  ctx.lineWidth=2.6;
  ctx.beginPath();ctx.moveTo(cx+w*0.035,h*0.335);
  ctx.bezierCurveTo(cx+w*0.09,h*0.305, cx+w*0.15,h*0.30, cx+w*0.20,h*0.345);ctx.stroke();
  // 右眉（下緣）
  ctx.lineWidth=1.4;
  ctx.beginPath();ctx.moveTo(cx+w*0.04,h*0.355);
  ctx.quadraticCurveTo(cx+w*0.12,h*0.345,cx+w*0.19,h*0.365);ctx.stroke();
  // 眉標籤
  ctx.fillStyle='#9333ea';ctx.font='bold 12px sans-serif';ctx.textAlign='center';
  ctx.fillText('左眉',cx-w*0.115,h*0.28);
  ctx.fillText('右眉',cx+w*0.115,h*0.28);

  // ===== 眼睛（含雙眼皮、眼神光，有立體度）=====
  ctx.strokeStyle='#a98fc7';ctx.lineWidth=2;
  // 左眼輪廓（杏眼）
  ctx.beginPath();
  ctx.moveTo(cx-w*0.165,h*0.44);
  ctx.quadraticCurveTo(cx-w*0.11,h*0.415,cx-w*0.055,h*0.44);
  ctx.quadraticCurveTo(cx-w*0.11,h*0.475,cx-w*0.165,h*0.44);
  ctx.stroke();
  // 左雙眼皮
  ctx.lineWidth=1.2;ctx.strokeStyle='#c9b3e0';
  ctx.beginPath();ctx.moveTo(cx-w*0.15,h*0.428);ctx.quadraticCurveTo(cx-w*0.11,h*0.412,cx-w*0.07,h*0.428);ctx.stroke();
  // 右眼輪廓
  ctx.lineWidth=2;ctx.strokeStyle='#a98fc7';
  ctx.beginPath();
  ctx.moveTo(cx+w*0.055,h*0.44);
  ctx.quadraticCurveTo(cx+w*0.11,h*0.415,cx+w*0.165,h*0.44);
  ctx.quadraticCurveTo(cx+w*0.11,h*0.475,cx+w*0.055,h*0.44);
  ctx.stroke();
  // 右雙眼皮
  ctx.lineWidth=1.2;ctx.strokeStyle='#c9b3e0';
  ctx.beginPath();ctx.moveTo(cx+w*0.07,h*0.428);ctx.quadraticCurveTo(cx+w*0.11,h*0.412,cx+w*0.15,h*0.428);ctx.stroke();
  // 眼珠（含眼神光立體）
  ctx.fillStyle='#8b6fb0';
  ctx.beginPath();ctx.arc(cx-w*0.11,h*0.445,w*0.022,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(cx+w*0.11,h*0.445,w*0.022,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(cx-w*0.105,h*0.44,w*0.007,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(cx+w*0.115,h*0.44,w*0.007,0,Math.PI*2);ctx.fill();

  // ===== 鼻子（立體鼻樑+鼻頭）=====
  ctx.strokeStyle='#c9b3e0';ctx.lineWidth=1.5;
  // 鼻樑（左右兩條，做出立體）
  ctx.beginPath();ctx.moveTo(cx-w*0.02,h*0.44);ctx.lineTo(cx-w*0.03,h*0.565);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx+w*0.02,h*0.44);ctx.lineTo(cx+w*0.03,h*0.565);ctx.stroke();
  // 鼻頭
  ctx.strokeStyle='#b89dd4';ctx.lineWidth=1.8;
  ctx.beginPath();ctx.arc(cx,h*0.575,w*0.035,Math.PI*0.15,Math.PI*0.85,false);ctx.stroke();
  // 鼻翼
  ctx.lineWidth=1.5;ctx.strokeStyle='#c9b3e0';
  ctx.beginPath();ctx.arc(cx-w*0.045,h*0.575,w*0.018,Math.PI*0.6,Math.PI*1.5,false);ctx.stroke();
  ctx.beginPath();ctx.arc(cx+w*0.045,h*0.575,w*0.018,Math.PI*1.5,Math.PI*2.4,false);ctx.stroke();

  // ===== 嘴唇（立體唇形）=====
  ctx.strokeStyle='#c99bb5';ctx.lineWidth=2;
  // 上唇（M型）
  ctx.beginPath();
  ctx.moveTo(cx-w*0.075,h*0.685);
  ctx.quadraticCurveTo(cx-w*0.04,h*0.665,cx,h*0.678);
  ctx.quadraticCurveTo(cx+w*0.04,h*0.665,cx+w*0.075,h*0.685);
  ctx.stroke();
  // 下唇（飽滿）
  ctx.beginPath();
  ctx.moveTo(cx-w*0.075,h*0.685);
  ctx.quadraticCurveTo(cx,h*0.725,cx+w*0.075,h*0.685);
  ctx.stroke();
  // 唇中線
  ctx.lineWidth=1.2;ctx.strokeStyle='#d9b3c5';
  ctx.beginPath();ctx.moveTo(cx-w*0.07,h*0.687);ctx.quadraticCurveTo(cx,h*0.695,cx+w*0.07,h*0.687);ctx.stroke();
  // 人中
  ctx.beginPath();ctx.moveTo(cx-w*0.012,h*0.62);ctx.lineTo(cx-w*0.012,h*0.665);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx+w*0.012,h*0.62);ctx.lineTo(cx+w*0.012,h*0.665);ctx.stroke();

  // 下巴立體線
  ctx.strokeStyle='#e3d3f0';ctx.lineWidth=1.3;
  ctx.beginPath();ctx.arc(cx,h*0.80,w*0.06,Math.PI*0.2,Math.PI*0.8,false);ctx.stroke();
}
// 兩個面診畫布的狀態
var _faceCanvases={face:{canvas:null,ctx:null,drawing:false,bg:null},anatomy:{canvas:null,ctx:null,drawing:false,bg:null}};

function initOneFaceCanvas(key,canvasId,useTemplate){
  var canvas=document.getElementById(canvasId);
  if(!canvas)return;
  var ctx=canvas.getContext('2d');
  var st=_faceCanvases[key];
  st.canvas=canvas;st.ctx=ctx;st.drawing=false;
  // 決定底圖：優先用已存的上傳圖，其次已存的圈記，其次線稿模板
  var markupKey=key==='face'?'faceMarkup':'anatomyMarkup';
  var bgKey=key==='face'?'faceBg':'anatomyBg';
  function redraw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    var bg=S.treatment&&S.treatment[bgKey];
    if(bg){
      // 用上傳的底圖
      var img=new Image();
      img.onload=function(){
        // 等比置中鋪滿
        var r=Math.min(canvas.width/img.width,canvas.height/img.height);
        var iw=img.width*r,ih=img.height*r;
        ctx.drawImage(img,(canvas.width-iw)/2,(canvas.height-ih)/2,iw,ih);
        loadMarkup();
      };
      img.src=bg;
    }else if(useTemplate&&key==='face'){
      drawFaceTemplate(ctx,canvas.width,canvas.height);
      loadMarkup();
    }else{
      // 骨骼肌肉沒底圖 → 提示文字
      ctx.fillStyle='#f8fbfc';ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle='#9bbcc5';ctx.font='16px sans-serif';ctx.textAlign='center';
      ctx.fillText('請點「📷 上傳底圖」放入骨骼肌肉對照圖',canvas.width/2,canvas.height/2-10);
      ctx.font='13px sans-serif';
      ctx.fillText('（用你的 AI 生成圖）',canvas.width/2,canvas.height/2+16);
      loadMarkup();
    }
  }
  function loadMarkup(){
    var mk=S.treatment&&S.treatment[markupKey];
    if(mk){var mi=new Image();mi.onload=function(){ctx.drawImage(mi,0,0,canvas.width,canvas.height);};mi.src=mk;}
  }
  st.redraw=redraw;
  st.history=st.history||[];
  redraw();
  ctx.lineCap='round';ctx.lineJoin='round';
  function getPos(e){var rect=canvas.getBoundingClientRect();var sx=canvas.width/rect.width,sy=canvas.height/rect.height;var x=(e.touches?e.touches[0].clientX:e.clientX)-rect.left;var y=(e.touches?e.touches[0].clientY:e.clientY)-rect.top;return{x:x*sx,y:y*sy};}
  function start(e){
    e.preventDefault();
    // 下筆前，先把目前畫面存進歷史（供復原）
    try{st.history.push(canvas.toDataURL('image/png'));if(st.history.length>20)st.history.shift();}catch(err){}
    st.drawing=true;var p=getPos(e);ctx.strokeStyle='#dc2626';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(p.x,p.y);
  }
  function move(e){if(!st.drawing)return;e.preventDefault();var p=getPos(e);ctx.lineTo(p.x,p.y);ctx.stroke();}
  function end(){if(st.drawing){st.drawing=false;if(S.treatment)S.treatment[markupKey]=canvas.toDataURL('image/jpeg',0.7);}}
  canvas.onmousedown=start;canvas.onmousemove=move;canvas.onmouseup=end;canvas.onmouseleave=end;
  canvas.ontouchstart=start;canvas.ontouchmove=move;canvas.ontouchend=end;
}

// 復原上一筆
window.undoFaceCanvas=function(key){
  key=key||'face';
  var st=_faceCanvases[key];
  if(!st||!st.canvas||!st.history||st.history.length===0){toast('沒有可復原的筆跡');return;}
  var prev=st.history.pop();
  var markupKey=key==='face'?'faceMarkup':'anatomyMarkup';
  var img=new Image();
  img.onload=function(){
    st.ctx.clearRect(0,0,st.canvas.width,st.canvas.height);
    st.ctx.drawImage(img,0,0,st.canvas.width,st.canvas.height);
    if(S.treatment)S.treatment[markupKey]=st.canvas.toDataURL('image/jpeg',0.7);
  };
  img.src=prev;
};

window.initFaceCanvas=function(){
  initOneFaceCanvas('face','pmu_face_canvas',true);
  initOneFaceCanvas('anatomy','pmu_anatomy_canvas',false);

window.uploadFaceBg=function(key,input){
  var file=input.files&&input.files[0];
  if(!file){return;}
  toast('處理圖片中...');
  var reader=new FileReader();
  reader.onload=function(ev){
    var img=new Image();
    img.onload=function(){
      var maxSide=800;var w=img.width,h=img.height;
      if(w>maxSide||h>maxSide){var r=Math.min(maxSide/w,maxSide/h);w=Math.round(w*r);h=Math.round(h*r);}
      var canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
      var ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
      var compressed=canvas.toDataURL('image/jpeg',0.75);
      if(Math.round(compressed.length/1024)>900)compressed=canvas.toDataURL('image/jpeg',0.5);
      var bgKey=key==='face'?'faceBg':'anatomyBg';
      var markupKey=key==='face'?'faceMarkup':'anatomyMarkup';
      if(S.treatment){S.treatment[bgKey]=compressed;S.treatment[markupKey]='';}
      var canvasId=key==='face'?'pmu_face_canvas':'pmu_anatomy_canvas';
      initOneFaceCanvas(key,canvasId,true);
      toast('✅ 底圖已上傳，可以開始圈記');
    };
    img.onerror=function(){alert('圖片讀取失敗，請換一張');};
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
};

window.clearFaceCanvas=function(key){
  key=key||'face';
  var st=_faceCanvases[key];
  if(!st||!st.redraw)return;
  var markupKey=key==='face'?'faceMarkup':'anatomyMarkup';
  if(S.treatment)S.treatment[markupKey]='';
  st.redraw();
};

// 完成頁：串聯「關懷提醒」設定裡符合這次服務的「當天」訊息
function pmuCareRulesFor(t){
  const svc=(t.serviceType||'')+(t.pmuServiceType?(' '+(PMU_STAGE_LABELS[t.pmuServiceType]||'')):'');
  const rules=(S.data.settings?.careRules||DEFAULT_CARE_RULES).filter(r=>r.enabled!==false&&r.keyword&&svc.includes(r.keyword));
  const sameDay=rules.filter(r=>(toN(r.days)||0)===0);
  return sameDay;
}
function pmuDoneCareButtons(t){
  const rules=pmuCareRulesFor(t);
  if(rules.length===0){
    return '<div style="font-size:12px;color:var(--mut);background:#f8fafc;border-radius:10px;padding:10px 12px;line-height:1.7;">💡 還沒有「'+(t.serviceType||'')+'」當天的關懷訊息。<br>到「基本設定 → 關懷提醒」新增一則（關鍵字填「'+(t.serviceType||'霧眉')+'」、天數填 0），之後這裡就會出現複製按鈕。</div>';
  }
  const done=S.data.settings?.careDoneByCust||{};
  return rules.map(r=>{
    const key=normalizeName(t.customer)+'__'+(t.date||'')+'__'+r.id;
    const isDone=!!done[key];
    return '<button class="btn btn-y" onclick="pmuCopyCareMsg(&quot;'+r.id+'&quot;)" style="padding:12px;">💬 複製「'+(r.title||'當天關懷')+'」訊息'+(isDone?'　✓':'')+'</button>';
  }).join('');
}
window.pmuCopyCareMsg=async(ruleId)=>{
  const t=S.treatment;if(!t)return;
  const r=(S.data.settings?.careRules||DEFAULT_CARE_RULES).find(x=>x.id===ruleId);
  if(!r){toast('找不到這則關懷訊息');return;}
  const text=careFillMsg(r.msg,t.customer,t.serviceType,0);
  let ok=false;
  try{await navigator.clipboard.writeText(text);ok=true;}catch(e){
    const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();
    try{ok=document.execCommand('copy');}catch(e2){}ta.remove();
  }
  if(!ok){alert(text);return;}
  toast('✅ 已複製，貼到 LINE 傳給 '+t.customer);
  // 記為已關懷：總覽就不會再跳同一則提醒
  const key=normalizeName(t.customer)+'__'+(t.date||'')+'__'+r.id;
  const done={...(S.data.settings?.careDoneByCust||{}),[key]:today()};
  const settings={...(S.data.settings||{}),careDoneByCust:done};
  S.data.settings=settings;
  await saveMainSilent({settings});
  const c=$('pg-content');if(c)c.innerHTML=renderPage();
};

    conditions:t.conditions,conditionNote:t.conditionNote,
    allergies:t.allergies,allergyNote:t.allergyNote,source:t.source,
    healthFlags:t.healthFlags||[],healthNote:t.healthNote||'',healthDeclare:!!t.healthDeclare,
    healthChecked:(t.healthFlags||[]).map(function(id){var it=PMU_HEALTH_ITEMS.find(function(x){return x.id===id;});return it?{cat:it.cat,label:it.label,reason:it.reason}:{cat:'',label:id,reason:''};}),
    startTime:t.startTime,endTime:t.endTime,
    numbCream:t.numbCream,numbTime:t.numbTime,
    tools:t.tools,pigments:t.pigments,operationNote:t.operationNote,
    consentSignature:t.consentSignature,consentSignedAt:t.consentSignedAt,
    agreePrivacy:t.agreePrivacy,agreeNotice:t.agreeNotice,agreeMedia:t.agreeMedia,
    firstPmuDate:t.firstPmuDate||'',
    cardSigned:t.cardSigned,carePackGiven:t.carePackGiven,
    aftercareGiven:t.aftercareGiven,photoAfterDone:t.photoAfterDone,
    touchupDate,oneYearDate,
    touchupDone:false,oneYearReminded:false,
    createdAt:nowLocal()
  };
  const pmuRecords=[...(S.data.pmuRecords||[]),record];

  let updates={pmuRecords};
  if(t.customer&&!(S.data.customers||[]).find(c=>normalizeName(c.name)===normalizeName(t.customer))){
    updates.customers=[...(S.data.customers||[]),{id:uid(),name:t.customer,phone:t.phone||'',createdAt:today()}];
  }

  // 先備份本地，失敗時還原（避免重按產生重複紀錄）
  const _bkRecords=S.data.pmuRecords,_bkCustomers=S.data.customers,_bkDrafts=S.data.pmuDrafts;
  S.data.pmuRecords=pmuRecords;
  if(updates.customers)S.data.customers=updates.customers;
  // 清草稿
  if(t.draftId){
    const drafts=(S.data.pmuDrafts||[]).filter(d=>d.id!==t.draftId);
    S.data.pmuDrafts=drafts;
    updates.pmuDrafts=drafts;
  }

  // 存主紀錄（不含照片）
  const ok=await saveMain(updates);
  if(!ok){
    S.data.pmuRecords=_bkRecords;S.data.customers=_bkCustomers;S.data.pmuDrafts=_bkDrafts;
    const _kb=Math.round(mainDocSize()/1024);
    alert('❌ 儲存失敗，資料還在畫面上沒有遺失，可以直接再按一次。\n\n目前主資料約 '+_kb+' KB / 上限約 1000 KB。'+(_kb>900?'\n空間偏滿，請到「基本設定→資料修復」瘦身後再試。':'\n空間足夠，多半是網路不穩，請確認連線後再按一次。'));
    return;
  }

  // 照片各自存成 pmuPhotos 子集合一筆（每張獨立，不擠在主文件）
  try{
    const allPhotos=[];
    (t.photosBefore||[]).forEach(p=>allPhotos.push({recordId:record.id,customer:t.customer,type:'before',img:p}));
    (t.photosAfter||[]).forEach(p=>allPhotos.push({recordId:record.id,customer:t.customer,type:'after',img:p}));
    for(const ph of allPhotos){await addSub('pmuPhotos',ph);}
  }catch(e){console.warn('照片存檔部分失敗',e);}

  S.lastPmuRecord=record;
  t.pmuSubmitted=true;
  render();
};

window.downloadPmuConsent=()=>{
  const r=S.lastPmuRecord;
  if(!r){alert('找不到紀錄');return;}
  const S2=S.data.settings||{};
  const terms=S2.pmuTerms||DEFAULT_PMU_TERMS;
  const notice=S2.pmuNotice||DEFAULT_PMU_NOTICE;
  const condStr=(r.conditions||[]).length>0?(r.conditions.join('、')+(r.conditionNote?'；'+r.conditionNote:'')):'無';
  const allergyStr=(r.allergies||[]).length>0?(r.allergies.join('、')+(r.allergyNote?'；'+r.allergyNote:'')):'無';
  // 組合完整文字
  const fullText=`【沐蜜美學・紋繡服務同意書】

顧客姓名：${r.customer}　電話：${r.phone||''}
服務項目：${r.serviceType}　日期：${r.date}
${(r.pmuServiceType&&r.pmuServiceType!=='new'&&r.firstPmuDate)?`初次施作日期：${r.firstPmuDate}　本次補色日期：${r.date}${(function(){try{var a=new Date(r.firstPmuDate+'T00:00:00'),b=new Date(r.date+'T00:00:00');var dd=Math.round((b-a)/86400000);var mm=(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth());return '　（間隔約 '+mm+' 個月 / '+dd+' 天'+(r.pmuServiceType==='free'?'，屬3個月內免費補色':'')+'）';}catch(e){return '';}})()}\n`:''}【健康狀況誠實告知】
${pmuHealthSummaryText(r)}
${r.isMinor?`未成年，法定代理人：${r.guardianName||''}\n`:''}
${notice}

${terms.privacy}

${terms.serviceDesc}

${terms.consent}

${terms.media}
${(r.stageTermsSnapshot||(r.pmuServiceType&&pmuStageTermsFor(r.pmuServiceType)))?('\n━━━━━━━━━━━━━━━━━━━\n【本次專屬條款 — '+(PMU_STAGE_LABELS[r.pmuServiceType]||'')+'】\n'+(r.stageTermsSnapshot||pmuStageTermsFor(r.pmuServiceType))+'\n'):''}
${terms.closing}

━━━━━━━━━━━━━━━━━━━
顧客簽名：（見下方）
簽署時間：${r.consentSignedAt}`;

  try{
    const lines=[];
    fullText.split('\n').forEach(para=>{
      if(para.length<=30)lines.push(para);
      else{for(let i=0;i<para.length;i+=30)lines.push(para.substring(i,i+30));}
    });
    const lineH=20,pad=36,headH=64,sigH=170,width=680;
    const height=headH+lines.length*lineH+sigH+pad*2;
    const canvas=document.createElement('canvas');
    const scale=2;canvas.width=width*scale;canvas.height=height*scale;
    const ctx=canvas.getContext('2d');ctx.scale(scale,scale);
    ctx.fillStyle='#faf5ff';ctx.fillRect(0,0,width,height);
    ctx.fillStyle='#9333ea';ctx.fillRect(0,0,width,headH);
    ctx.fillStyle='#fff';ctx.font='bold 20px "Noto Serif TC",serif';ctx.textAlign='center';
    ctx.fillText('沐蜜美學・紋繡服務同意書',width/2,40);
    ctx.fillStyle='#333';ctx.font='13px sans-serif';ctx.textAlign='left';
    let y=headH+pad;
    lines.forEach(l=>{ctx.fillText(l,pad,y);y+=lineH;});
    ctx.fillStyle='#666';ctx.font='13px sans-serif';
    ctx.fillText('顧客簽名：',pad,y+16);
    if(r.consentSignature){
      const img=new Image();
      img.onload=()=>{
        ctx.drawImage(img,pad+80,y,200,70);
        ctx.fillStyle='#999';ctx.font='11px sans-serif';
        ctx.fillText(`簽署時間：${r.consentSignedAt}`,pad,y+96);
        canvas.toBlob(blob=>{
          const url=URL.createObjectURL(blob);
          const a=document.createElement('a');
          a.href=url;a.download=`${r.customer}_紋繡同意書.png`;a.click();
          setTimeout(()=>URL.revokeObjectURL(url),1000);
        });
      };
      img.src=r.consentSignature;
    }
  }catch(e){alert('產生同意書圖失敗：'+e.message);}
};

      </div>

      <div class="card" style="margin-bottom:16px;">
        <div class="card-hd" style="background:var(--roseL);"><span class="card-ttl" style="color:var(--roseDk);">👤 客戶</span></div>
        <div class="card-bd">
          <div class="fgrp"><label>客戶姓名 *</label>
            <input type="text" id="ds_customer" list="ds_custlist" value="${(t.customer||'').replace(/"/g,'&quot;')}" placeholder="輸入或選擇客戶" style="font-size:16px;" oninput="depositSignSetCustomer(this.value)">
            <datalist id="ds_custlist">${custList.map(n=>`<option value="${n}">`).join('')}</datalist>
          </div>
        </div>
      </div>

      <div class="card" style="margin-bottom:16px;">
        <div class="card-hd" style="background:var(--goldL);"><span class="card-ttl" style="color:var(--goldDk);">💳 選擇儲值方案</span></div>
        <div class="card-bd">
          <div style="display:flex;flex-direction:column;gap:10px;">
            ${plans.map(p=>{
              const sel=t.actualReceived===p.actualReceived&&t.amount===p.amount;
              return`<button onclick="depositSignChoosePlan(${p.actualReceived},${p.amount})" style="text-align:left;padding:14px;border-radius:12px;border:2px solid ${sel?'var(--gold)':'var(--bdr)'};background:${sel?'var(--goldL)':'#fff'};cursor:pointer;">
                <div style="font-size:16px;font-weight:700;color:var(--txt);">${sel?'✓ ':''}${p.name}</div>

            }).join('')}
          </div>
          <div class="fgrp" style="margin-top:14px;">
            <label>或自訂金額</label>
            <div style="display:flex;gap:8px;">
              <input type="number" id="ds_actual" placeholder="實收" value="${t.actualReceived||''}" style="flex:1;" oninput="S.treatment.actualReceived=parseFloat(this.value)||0;">
              <input type="number" id="ds_face" placeholder="可用面額" value="${t.amount||''}" style="flex:1;" oninput="S.treatment.amount=parseFloat(this.value)||0;">
            </div>
          </div>
          <div class="fgrp" style="margin-top:10px;"><label>付款方式</label>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              ${['轉帳','現金','信用卡'].map(m=>`<label style="padding:8px 16px;background:${t.payMethod===m?'var(--blu)':'var(--bg2)'};color:${t.payMethod===m?'#fff':'var(--txt)'};border-radius:16px;cursor:pointer;font-size:14px;" onclick="depositSignSetPay('${m}')">${m}</label>`).join('')}
            </div>
          </div>
        </div>
      </div>

      <button class="btn btn-p" style="width:100%;background:linear-gradient(135deg,var(--blu),var(--pur));color:#fff;font-size:17px;font-weight:700;padding:16px;border-radius:30px;" onclick="depositSignToSignStage()">
        交給客人簽名 →
      </button>
    </div>`;
  }

  // 階段二：客人簽名（看不到財務）
  const bonus=(t.amount||0)-(t.actualReceived||0);
  const discountRate=t.amount?Math.round(t.actualReceived/t.amount*100):0;
  const termsTemplate=S.data.settings?.depositTerms||DEFAULT_DEPOSIT_TERMS;
  const usagePeriodStr=S.data.settings?.depositUsagePeriod||'無使用期限';
  const transferableStr=S.data.settings?.depositTransferable===true?'得轉讓予他人使用':'限本人使用，不可轉讓予他人';
  const termsContent=termsTemplate
    .replace(/\$\{actualReceived\}/g,fmt(t.actualReceived||0))
    .replace(/\$\{amount\}/g,fmt(t.amount||0))
    .replace(/\$\{bonus\}/g,fmt(bonus))
    .replace(/\$\{discountRate\}/g,(100-discountRate).toString())
    .replace(/<usage_period>/g,usagePeriodStr)
    .replace(/<transferable>/g,transferableStr);

  return`
  <button onclick="depositSignBack()" title="返回" style="position:fixed;top:14px;left:14px;z-index:100;background:rgba(255,255,255,0.6);border:1px solid var(--bdr);color:var(--mut);padding:6px 12px;border-radius:20px;font-size:11px;cursor:pointer;opacity:0.5;">← 老師改方案</button>

    </div>

    <div class="card" style="margin-bottom:16px;">
      <div class="card-hd" style="background:var(--goldL);"><span class="card-ttl" style="color:var(--goldDk);">📜 服務儲值定型化契約</span></div>
      <div class="card-bd">
        <div style="background:var(--bg2);padding:14px;border-radius:10px;font-size:13px;line-height:1.9;white-space:pre-wrap;max-height:340px;overflow-y:auto;">${termsContent}</div>
        <label style="display:flex;align-items:flex-start;gap:8px;margin-top:14px;cursor:pointer;padding:12px;background:var(--goldL);border-radius:10px;">
          <input type="checkbox" id="ds_agree" style="margin-top:3px;transform:scale(1.3);" ${t.depositAgreed?'checked':''} onchange="S.treatment.depositAgreed=this.checked;">
          <span style="font-size:14px;font-weight:700;color:var(--goldDk);">本人 ${t.customer} 已詳閱並同意上述儲值方案全部內容</span>
        </label>
      </div>
    </div>

    <div class="card" style="margin-bottom:16px;">
      <div class="card-hd" style="background:var(--purL);"><span class="card-ttl" style="color:var(--pur);">✍️ 簽名</span></div>
      <div class="card-bd">
        <div class="tm" style="text-align:center;margin-bottom:8px;font-size:13px;">請在下方簽名確認</div>
        <div style="background:#fff;border:3px dashed var(--gold);border-radius:12px;padding:10px;">
          <canvas id="t_guest_sign_canvas" width="600" height="180" style="width:100%;height:180px;cursor:crosshair;touch-action:none;display:block;background:#fff;border-radius:8px;"></canvas>
        </div>

          <button class="btn btn-y" onclick="clearSignature()">🗑️ 清除重簽</button>
        </div>

    </div>

    <div style="text-align:center;margin:24px 0;">
      <button class="btn btn-p" style="background:linear-gradient(135deg,var(--blu),var(--pur));color:#fff;font-size:18px;font-weight:700;padding:16px 44px;border-radius:30px;" onclick="submitDepositSign()">
        ✓ 確認簽署完成儲值 ✨
      </button>
    </div>
  </div>`;
}

// ───── 🌸 接待新客人：純客戶填寫畫面（無任何財務資料）─────
function pgGuestIntakeView(t){
  const studioName='沐蜜美學';
  const healthQuestions=S.data.settings?.healthQuestions||DEFAULT_HEALTH_QUESTIONS;
  const termsMap=S.data.settings?.termsMap||{};
  // 依老師選的服務分類，配對對應的專屬同意書（沒選或沒對應才用通用版）
  const chosenCats=t.guestServiceCats||[];
  const matchedTermsList=[];
  chosenCats.forEach(cat=>{
    // 先找完全同名的，再找關鍵字包含的
    let key=null;
    if(termsMap[cat])key=cat;
    else{
      for(const k of Object.keys(termsMap)){
        if(k==='預設（通用）')continue;
        const kw=k.substring(0,2);
        if(cat.includes(kw)||k.includes(cat.substring(0,2))){key=k;break;}
      }
    }
    if(key&&termsMap[key]&&!matchedTermsList.find(m=>m.key===key)){
      matchedTermsList.push({key,content:termsMap[key]});
    }
  });
  // 都沒對應到 → 用通用版
  if(matchedTermsList.length===0){
    matchedTermsList.push({key:'服務同意',content:termsMap['預設（通用）']||DEFAULT_HEALTH_QUESTIONS_DECLARATION});
  }
  const done=t.guestSubmitted;

  // 完成畫面
  if(done){
    return`
    <button onclick="switchTreatmentMode('staff')" title="返回" style="position:fixed;top:14px;right:14px;z-index:100;background:rgba(255,255,255,0.6);backdrop-filter:blur(8px);border:1px solid var(--bdr);color:var(--mut);padding:6px 12px;border-radius:20px;font-size:11px;cursor:pointer;opacity:0.4;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.4">老師返回</button>
    <div style="min-height:90vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#fff5f0,#fff);padding:20px;">

        <div style="font-size:56px;margin-bottom:14px;">🌸</div>
        <div style="font-size:22px;font-weight:700;color:var(--roseDk);margin-bottom:10px;">謝謝您，${t.guestName} ♡</div>
        <div style="color:var(--mut);font-size:15px;line-height:1.8;">
          資料已經填寫完成囉！<br>
          接下來我會依您的膚況與需求，<br>為您規劃最適合的保養～<br><br>
          現在請把裝置交回給美容師 🌸
        </div>
      </div>

  return`
  <button onclick="cancelGuestIntake()" title="取消" style="position:fixed;top:14px;right:14px;z-index:100;background:rgba(255,255,255,0.6);backdrop-filter:blur(8px);border:1px solid var(--bdr);color:var(--mut);padding:6px 12px;border-radius:20px;font-size:11px;cursor:pointer;opacity:0.35;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.35">取消</button>

  <div style="max-width:640px;margin:0 auto;padding:20px 16px 60px;">
    <!-- 老師先選這次服務（交給客人前先點好）-->
    <div style="background:var(--goldL);border:2px dashed var(--gold);border-radius:12px;padding:12px;margin-bottom:16px;">
      <div style="font-size:13px;font-weight:700;color:var(--goldDk);margin-bottom:8px;">👩‍💼 美容師：先選這次要做的服務（交給客人前點好）</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;">
        ${(() => {
          const cats=Object.keys(S.data.settings?.serviceHealthQuestions||{});
          const allCats=cats.length>0?cats:['美容做臉','熱蠟除毛','霧眉霧唇','美體按摩'];
          const chosen=t.guestServiceCats||[];
          return allCats.map(cat=>`
            <label style="padding:8px 14px;background:${chosen.includes(cat)?'var(--gold)':'#fff'};color:${chosen.includes(cat)?'#fff':'var(--txt)'};border:1px solid var(--gold);border-radius:16px;cursor:pointer;font-size:13px;font-weight:${chosen.includes(cat)?'700':'400'};" onclick="toggleGuestServiceCat('${cat}')">
              ${chosen.includes(cat)?'✓ ':''}${cat}
            </label>`).join('');
        })()}
      </div>
      <div class="tm" style="font-size:11px;margin-top:6px;">選了哪個，下面就會出現那項服務的專屬健康確認題目</div>
    </div>

    <!-- 歡迎 -->
    <div style="text-align:center;margin-bottom:24px;">
      <div style="font-family:'Noto Serif TC',serif;font-size:28px;font-weight:900;color:var(--roseDk);letter-spacing:0.1em;">${studioName}</div>
      <div style="color:var(--mut);font-size:15px;margin-top:8px;">歡迎您 🌸 初次見面，先讓我更認識您</div>

    <!-- 健康問卷 -->
    <div class="card" style="margin-bottom:16px;">
      <div class="card-hd" style="background:var(--bluL);"><span class="card-ttl" style="color:var(--blu);">📋 健康小問卷</span></div>
      <div class="card-bd">
        <div class="tm" style="font-size:13px;margin-bottom:14px;">這些幫助我避開可能讓您不適的狀況，讓服務更安全 ♡</div>
        ${healthQuestions.map(q=>renderGuestQuestion(q,t)).join('')}
      </div>
    </div>

    <!-- 服務專屬健康確認（依老師選的服務顯示）-->
    ${(() => {
      const svcQs=S.data.settings?.serviceHealthQuestions||{};
      const chosen=t.guestServiceCats||[];
      const blocks=chosen.filter(cat=>svcQs[cat]&&svcQs[cat].length>0).map(cat=>`

      <div class="card-bd">
        ${matchedTermsList.map(mt=>`
          ${matchedTermsList.length>1?`<div style="font-weight:700;color:var(--goldDk);font-size:14px;margin-bottom:6px;">◆ ${mt.key}</div>`:''}

        `).join('')}
        <label style="display:flex;align-items:flex-start;gap:8px;margin-top:6px;cursor:pointer;padding:12px;background:var(--goldL);border-radius:10px;">
          <input type="checkbox" id="g_agree" style="margin-top:3px;transform:scale(1.3);" ${t.healthAgreed?'checked':''} onchange="S.treatment.healthAgreed=this.checked;">
          <span style="font-size:14px;font-weight:700;color:var(--goldDk);">我已詳閱並同意上述${matchedTermsList.length>1?'各項':''}內容，所填資料屬實</span>
        </label>

    <!-- 簽名 -->
    <div class="card" style="margin-bottom:16px;">
      <div class="card-hd" style="background:var(--purL);"><span class="card-ttl" style="color:var(--pur);">✍️ 簽名</span></div>
      <div class="card-bd">
        <div class="tm" style="text-align:center;margin-bottom:8px;font-size:13px;">請在下方簽名確認</div>
        <div style="background:linear-gradient(180deg,#fff 0%,#fffaf3 100%);border:3px dashed var(--gold);border-radius:12px;padding:10px;">
          <canvas id="t_guest_sign_canvas" width="600" height="180" style="width:100%;height:180px;cursor:crosshair;touch-action:none;display:block;background:#fff;border-radius:8px;"></canvas>
        </div>
        <div style="display:flex;justify-content:center;margin-top:10px;">
          <button class="btn btn-y" onclick="clearSignature()">🗑️ 清除重簽</button>

// 渲染單一問卷題目（客戶填寫用）
function renderGuestQuestion(q,t){
  if(q.type==='section'){
    return`<div style="font-weight:700;color:var(--roseDk);font-size:15px;margin:18px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--roseL);">${q.label}</div>`;
  }
  const v=t.healthForm?.[q.key];
  if(q.type==='text'){
    return`<div class="fgrp" style="margin-bottom:10px;"><label>${q.label}</label>
      <input type="text" value="${(v||'').replace(/"/g,'&quot;')}" placeholder="${q.placeholder||''}" oninput="setGuestForm('${q.key}',this.value)"></div>`;
  }
  if(q.type==='textarea'){
    return`<div class="fgrp" style="margin-bottom:10px;"><label>${q.label}</label>
      <textarea rows="2" placeholder="${q.placeholder||''}" oninput="setGuestForm('${q.key}',this.value)">${v||''}</textarea></div>`;
  }
  if(q.type==='radio'){
    return`<div class="fgrp" style="margin-bottom:10px;"><label>${q.label}</label>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;">
        ${(q.options||[]).map(o=>`<label style="padding:8px 16px;background:${v===o?'var(--rose)':'var(--bg2)'};color:${v===o?'#fff':'var(--txt)'};border-radius:16px;cursor:pointer;font-size:14px;font-weight:${v===o?'700':'400'};" onclick="pickGuestRadio('${q.key}','${o.replace(/'/g,"\\'")}')">${o}</label>`).join('')}
      </div></div>`;
  }
  if(q.type==='checkbox_group'){
    const arr=Array.isArray(v)?v:[];
    return`<div class="fgrp" style="margin-bottom:10px;"><label>${q.label}</label>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;">
        ${(q.options||[]).map(o=>`<label style="padding:6px 12px;background:${arr.includes(o)?'var(--blu)':'var(--bg2)'};color:${arr.includes(o)?'#fff':'var(--txt)'};border-radius:16px;cursor:pointer;font-size:13px;">
          <input type="checkbox" style="display:none;" ${arr.includes(o)?'checked':''} onchange="toggleGuestCheck('${q.key}','${o.replace(/'/g,"\\'")}')">${o}</label>`).join('')}
      </div></div>`;
  }
  return'';
}

window.setGuestForm=(key,val)=>{
  if(!S.treatment)return;
  if(!S.treatment.healthForm)S.treatment.healthForm={};
  S.treatment.healthForm[key]=val;
};

// 老師選這次的服務類別（會帶出對應專屬確認題目）
window.toggleGuestServiceCat=(cat)=>{
  if(!S.treatment)return;
  // 重繪前先保住已填的名字電話
  const nm=$('g_name'),ph=$('g_phone');
  if(nm)S.treatment.guestName=nm.value;
  if(ph)S.treatment.guestPhone=ph.value;
  if(!S.treatment.guestServiceCats)S.treatment.guestServiceCats=[];
  const arr=S.treatment.guestServiceCats;
  const i=arr.indexOf(cat);
  if(i>=0)arr.splice(i,1);else arr.push(cat);
  const c=$('pg-content');if(c)c.innerHTML=renderPage();
  setTimeout(()=>{initSignatureCanvasInline('t_guest_sign_canvas');},100);
};

// 渲染單一「服務專屬確認」題目
function renderGuestServiceQuestion(cat,q,i,t){
  const key=`svc_${cat}_${q.key||i}`;
  const v=t.serviceHealthAnswers&&t.serviceHealthAnswers[key];
  if(q.type==='radio'){
    return`<div class="fgrp" style="margin-bottom:10px;"><label>${q.label}</label>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;">
        ${(q.options||['否','是']).map(o=>`<label style="padding:8px 16px;background:${v===o?'var(--rose)':'var(--bg2)'};color:${v===o?'#fff':'var(--txt)'};border-radius:16px;cursor:pointer;font-size:14px;font-weight:${v===o?'700':'400'};" onclick="pickGuestServiceAns('${key}','${o.replace(/'/g,"\\'")}')">${o}</label>`).join('')}
      </div></div>`;
  }
  if(q.type==='checkbox'||q.type==='checkbox_group'){
    const arr=Array.isArray(v)?v:[];

];

// 內文重點標示：**字**→金色粗體、!!字!!→紅色粗體、__字__→底線
function renderNoteText(text){
  if(!text)return'';
  // 先跳脫 HTML 特殊字元，避免破版
  let s=text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  // !!字!! → 紅色粗體（超重點）
  s=s.replace(/!!([^!]+)!!/g,'<span style="color:#dc2626;font-weight:800;">$1</span>');
  // **字** → 金色粗體（重點）
  s=s.replace(/\*\*([^*]+)\*\*/g,'<span style="color:#b45309;font-weight:800;">$1</span>');
  // __字__ → 底線
  s=s.replace(/__([^_]+)__/g,'<span style="text-decoration:underline;text-decoration-color:#9333ea;text-decoration-thickness:2px;">$1</span>');
  // ==字== → 黃色螢光
  s=s.replace(/==([^=]+)==/g,'<span style="background:#fde047;color:#422006;font-weight:700;padding:0 3px;border-radius:3px;">$1</span>');
  // %%字%% → 粉色螢光
  s=s.replace(/%%([^%]+)%%/g,'<span style="background:#fbcfe8;color:#831843;font-weight:700;padding:0 3px;border-radius:3px;">$1</span>');
  // @@字@@ → 藍色粗體
  s=s.replace(/@@([^@]+)@@/g,'<span style="color:#2563eb;font-weight:800;">$1</span>');
  // ++字++ → 粗體
  s=s.replace(/\+\+([^+]+)\+\+/g,'<b style="font-weight:900;">$1</b>');
  // ~~字~~ → 斜體
  s=s.replace(/~~([^~]+)~~/g,'<i style="font-style:italic;">$1</i>');
  return s;
}


// ═══════════ 🧪 成分標籤（產品 ↔ 膚況對策 配對用）═══════════
// 同一種成分的不同叫法，配對時當成同一個（第一個是顯示名稱）
const ING_SYNONYMS=[
  ['菸鹼醯胺','維他命B3','維生素B3','煙醯胺','Niacinamide'],
  ['玻尿酸','透明質酸','玻尿酸鈉','Hyaluronic Acid','Sodium Hyaluronate'],
  ['傳明酸','凝血酸','Tranexamic Acid'],
  ['維他命C','維生素C','抗壞血酸','Vitamin C','Ascorbic Acid'],
  ['A醇','視黃醇','Retinol'],
  ['水楊酸','BHA','Salicylic Acid'],
  ['果酸','AHA'],
  ['杏仁酸','Mandelic Acid'],
  ['神經醯胺','Ceramide'],
  ['積雪草','CICA','Centella Asiatica'],
  ['泛醇','維他命B5','維生素B5','B5','Panthenol'],
  ['胜肽','Peptide'],
  ['熊果素','Arbutin'],
  ['角鯊烷','Squalane'],
  ['壬二酸','杜鵑花酸','Azelaic Acid'],
  ['尿囊素','Allantoin'],
  ['茶樹','茶樹精油','Tea Tree']
];
function ingNorm(s){return String(s||'').toLowerCase().replace(/[\s　·・\-_]/g,'');}
function ingCanon(s){
  const k=ingNorm(s);if(!k)return '';
  const g=ING_SYNONYMS.find(gr=>gr.some(x=>ingNorm(x)===k));
  return g?g[0]:String(s).trim();
}
function ingKey(s){return ingNorm(ingCanon(s));}
function ingAllKnown(){
  const set=new Set(ING_SYNONYMS.map(g=>g[0]));
  (S.data.products||[]).forEach(p=>(p.ingredients||[]).forEach(i=>set.add(ingCanon(i))));
  (S.data.skinSolutions||[]).forEach(s=>(s.want||[]).concat(s.avoid||[]).forEach(i=>set.add(ingCanon(i))));
  return [...set].filter(Boolean).sort();
}
window._ing=window._ing||{};
function ingInit(key,list){window._ing[key]=(list||[]).map(ingCanon).filter(Boolean);return '';}
function ingEditorInner(key,color,ph){
  const list=window._ing[key]||[];
  return '<div style="display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 6px;">'
    +(list.length?list.map((x,i)=>'<span style="display:inline-flex;align-items:center;gap:4px;background:'+color+';color:#fff;padding:4px 6px 4px 11px;border-radius:14px;font-size:13px;font-weight:700;">'+x+'<button type="button" onclick="ingRemove(\''+key+'\','+i+',\''+color+'\',\''+(ph||'').replace(/'/g,'')+'\')" style="border:none;background:rgba(255,255,255,.3);color:#fff;border-radius:50%;width:18px;height:18px;cursor:pointer;font-size:12px;line-height:1;">×</button></span>').join('')
      :'<span class="tm" style="font-size:12px;">還沒有成分</span>')
    +'</div><div style="display:flex;gap:6px;"><input type="text" id="ing_in_'+key+'" list="ing_dl" placeholder="'+(ph||'輸入成分，例如：菸鹼醯胺')+'" style="flex:1;" onkeydown="if(event.key===\'Enter\'){event.preventDefault();ingAdd(\''+key+'\',\''+color+'\',\''+(ph||'').replace(/'/g,'')+'\');}">'
    +'<button type="button" class="btn btn-s" onclick="ingAdd(\''+key+'\',\''+color+'\',\''+(ph||'').replace(/'/g,'')+'\')">＋ 加入</button></div>';
}
function ingEditorHtml(key,color,ph){
  return '<datalist id="ing_dl">'+ingAllKnown().map(x=>'<option value="'+x+'">').join('')+'</datalist><div id="ing_wrap_'+key+'">'+ingEditorInner(key,color,ph)+'</div>';
}
window.ingAdd=function(key,color,ph){
  const el=document.getElementById('ing_in_'+key);if(!el)return;
  const parts=el.value.split(/[,，、;；\/]/).map(ingCanon).filter(Boolean);
  if(!parts.length)return;
  const cur=window._ing[key]||[];
  parts.forEach(x=>{if(!cur.some(c=>ingKey(c)===ingKey(x)))cur.push(x);});
  window._ing[key]=cur;
  const w=document.getElementById('ing_wrap_'+key);if(w)w.innerHTML=ingEditorInner(key,color,ph);
  const n=document.getElementById('ing_in_'+key);if(n)n.focus();
};
window.ingRemove=function(key,i,color,ph){
  (window._ing[key]||[]).splice(i,1);
  const w=document.getElementById('ing_wrap_'+key);if(w)w.innerHTML=ingEditorInner(key,color,ph);
};
function ingChips(list,color,bg,hiKeys){
  return (list||[]).map(x=>{const hi=hiKeys&&hiKeys.has(ingKey(x));return '<span style="display:inline-block;margin:2px;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:700;background:'+(hi?color:bg)+';color:'+(hi?'#fff':color)+';">'+ingCanon(x)+'</span>';}).join('');
}
// 依膚況對策，找出店裡可用的產品
function skinMatchProducts(sol){
  const want=new Set((sol.want||[]).map(ingKey)),avoid=new Set((sol.avoid||[]).map(ingKey));
  const out=[];
  (S.data.products||[]).forEach(p=>{
    const keys=(p.ingredients||[]).map(ingKey);
    const hit=keys.filter(k=>want.has(k)),bad=keys.filter(k=>avoid.has(k));
    if(hit.length)out.push({p,hit:new Set(hit),bad:new Set(bad),score:hit.length});
  });
  out.sort((a,b)=>(a.bad.size?1:0)-(b.bad.size?1:0)||b.score-a.score||(a.p.name||'').localeCompare(b.p.name||''));
  return out;
}
// 反查：這個產品能處理哪些膚況
function productSolutions(p){
  const keys=new Set((p.ingredients||[]).map(ingKey));
  return (S.data.skinSolutions||[]).filter(s=>(s.want||[]).some(w=>keys.has(ingKey(w))));
}

window.saveSkin=async function(id){
  const isNew=id==='__new__';
  const title=(document.getElementById('skin_title').value||'').trim();
  if(!title){alert('請填膚況問題');return;}
  const old=isNew?{id:'skin_'+uid(),createdAt:nowLocal()}:((S.data.skinSolutions||[]).find(x=>x.id===id)||{id});
  const item=Object.assign({},old,{title,folderId:document.getElementById('skin_folder').value,want:(window._ing.want||[]).slice(),avoid:(window._ing.avoid||[]).slice(),note:document.getElementById('skin_note').value,updatedAt:nowLocal()});
  let list=(S.data.skinSolutions||[]).slice();
  if(isNew)list.push(item);else list=list.map(x=>x.id===id?item:x);
  S.data.skinSolutions=list;
  await saveMain({skinSolutions:list});
  closeMod();toast('✅ 已儲存');
  S.skinView=item.id;noteRefresh();
};
window.delSkin=async function(id){
  if(!confirm('刪除這則膚況對策？'))return;
  const list=(S.data.skinSolutions||[]).filter(x=>x.id!==id);
  S.data.skinSolutions=list;await saveMain({skinSolutions:list});
  closeMod();S.skinView=null;noteRefresh();
};

// 聯想筆記（關鍵字樹）→ 筆記本：主題＝一篇筆記、第一層關鍵字＝重點、更深的＝小重點
async function mergeMindIntoNotes(){
  const roots=S.data.mindNotes||[];
  const conv=n=>({label:n.keyword||'',text:n.detail||'',subs:(n.children||[]).map(conv)});
  const colors=['red','gold','green','blue','purple'];
  const now=nowLocal();
  const add=roots.map(r=>{
    const pts=[];
    if((r.detail||'').trim())pts.push({label:'說明',text:r.detail,color:'gray',subs:[]});
    (r.children||[]).forEach((c,i)=>{const p=conv(c);p.color=colors[i%colors.length];pts.push(p);});
    return {id:uid(),title:r.keyword||'（未命名）',subtitle:'',folderId:r.folderId||'',tier:'often',fromMind:true,points:pts,createdAt:now,updatedAt:now};
  });
  const notes=(S.data.studyNotes||[]).concat(add);
  const settings=Object.assign({},S.data.settings||{},{mindMerged:true});
  S.data.studyNotes=notes;S.data.settings=settings;
  try{await saveMain({studyNotes:notes,settings});if(add.length)toast('🌳 已把 '+add.length+' 個聯想筆記搬進筆記本');}catch(e){}
  noteRefresh();
}

    +'<input type="text" id="note_search" placeholder="🔍 搜尋全部筆記..." value="'+search.replace(/"/g,'&quot;')+'" oninput="if(!event.isComposing)noteSearchGo(this.value)" oncompositionend="noteSearchGo(this.value)" style="flex:1;min-width:180px;">'

// ═══════════ 🧮 開課利潤試算（學費 − 耗材 − 固定成本分攤 − 我的時間與技術成本）═══════════
function cpNew(){return {id:'cp_'+uid(),name:'',price:0,students:2,days:3,hoursPerDay:6,prepHours:0,hourlyRate:500,
  matPer:[{name:'',cost:0}],matProd:[],matClass:[],
  fixedPerDay:[{name:'場地折舊',cost:0},{name:'電費',cost:0},{name:'冷氣費',cost:0},{name:'換洗費',cost:0}],note:''};}
window.cpNew=cpNew;
function cpProdUnit(pid){const p=(S.data.products||[]).find(x=>x.id===pid);return p?(toN(p.capacity)>0?(p.capacityUnit||'單位'):'瓶'):'';}
function cpCalc(d,n){
  n=n==null?toN(d.students):n;
  const prodPer=(d.matProd||[]).reduce((a,x)=>a+getUnitCost(x.pid)*toN(x.qty),0);
  const varPer=(d.matPer||[]).reduce((a,x)=>a+toN(x.cost),0)+prodPer;
  const varClass=(d.matClass||[]).reduce((a,x)=>a+toN(x.cost),0);
  const fixedDay=(d.fixedPerDay||[]).reduce((a,x)=>a+toN(x.cost),0);
  const days=toN(d.days),hours=days*toN(d.hoursPerDay),allHours=hours+toN(d.prepHours);
  const rev=toN(d.price)*n,variable=varPer*n+varClass,fixed=fixedDay*days,time=toN(d.hourlyRate)*allHours;
  const cost=variable+fixed+time,profit=rev-cost;
  const margin=rev>0?profit/rev:0;
  const realHourly=allHours>0?(profit+time)/allHours:0;
  const unit=toN(d.price)-varPer;
  const breakeven=unit>0?Math.ceil((varClass+fixed+time)/unit):null;
  return {n,rev,varPer,prodPer,varClass,variable,fixedDay,fixed,hours,allHours,time,cost,profit,margin,realHourly,breakeven};
}
function cpEquipDailyDep(){
  const td=today();
  return Math.round((S.data.equipment||[]).reduce((a,e)=>{if(!e.purchaseDate||!toN(e.years))return a;if(eqMonthsBetween(e.purchaseDate,td)>=toN(e.years)*12)return a;return a+toN(e.cost)/(toN(e.years)*12);},0)/30);
}

    +rows.map(x=>'<tr style="'+(x.n===toN(d.students)?'background:#faf5ff;font-weight:800;':'')+'"><td>'+x.n+' 人'+(x.n===toN(d.students)?' ◀':'')+'</td><td>$'+fmt(x.rev)+'</td><td>$'+fmt(Math.round(x.cost))+'</td><td style="color:'+(x.profit>=0?'#16a34a':'#dc2626')+';font-weight:800;">$'+fmt(Math.round(x.profit))+'</td><td>'+Math.round(x.margin*100)+'%</td><td>$'+fmt(Math.round(x.realHourly))+'</td></tr>').join('')

window.cpSave=async function(){
  const d=S.cpDraft;if(!d)return;
  if(!(d.name||'').trim()){alert('請填課程名稱');return;}
  d.updatedAt=nowLocal();
  let plans=((S.data.settings&&S.data.settings.coursePlans)||[]).slice();
  if(plans.some(x=>x.id===d.id))plans=plans.map(x=>x.id===d.id?JSON.parse(JSON.stringify(d)):x);else plans.push(JSON.parse(JSON.stringify(d)));
  const settings=Object.assign({},S.data.settings||{},{coursePlans:plans});
  S.data.settings=settings;await saveMain({settings});toast('✅ 試算已儲存');
};
window.cpRemove=async function(id){
  if(!confirm('刪除這個試算？'))return;
  const plans=((S.data.settings&&S.data.settings.coursePlans)||[]).filter(x=>x.id!==id);
  const settings=Object.assign({},S.data.settings||{},{coursePlans:plans});
  S.data.settings=settings;await saveMain({settings});S.cpDraft=null;actRefresh();
};
