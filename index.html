// 🧹 清理重複的進貨紀錄（同一筆進貨變成兩行：一未付款一已付款）
window.cleanDuplicatePurchase=async()=>{
  const purchases=S.data.purchases||[];
  // 找重複：同產品+同日期+同金額+同數量，視為同一筆
  const seen={};
  const dups=[];
  purchases.forEach(p=>{
    const key=`${p.productName}|${p.date}|${p.totalCost}|${p.qty}`;
    if(!seen[key]){
      seen[key]=[p];
    }else{
      seen[key].push(p);
    }
  });
  // 每組若有多筆，保留「已付款」那筆（或第一筆），刪其餘
  Object.values(seen).forEach(list=>{
    if(list.length>1){
      // 優先保留已付款的
      const keep=list.find(x=>x.paid||x.paidToExpense)||list[0];
      list.forEach(x=>{if(x.id!==keep.id)dups.push(x);});
    }
  });

  if(dups.length===0){
    alert('✅ 沒有發現重複的進貨紀錄。');
    return;
  }
  const preview=dups.slice(0,10).map(p=>`• ${p.date} ${p.productName} $${fmt(p.totalCost)}（${p.paid?'已付款':'未付款'}）`).join('\n');
  if(!confirm(`發現 ${dups.length} 筆重複進貨（同產品/日期/金額）：\n\n${preview}${dups.length>10?'\n...':''}\n\n每組保留一筆（優先保留已付款的），刪除其餘重複。\n確定清理嗎？`))return;

  setSyncing&&setSyncing('syncing');
  let ok=0;
  for(const p of dups){
    try{
      // 刪重複進貨時，也刪掉它可能產生的重複支出/現金流
      const exps=(S.data.expenses||[]).filter(e=>e.fromPurchase&&(e.purchaseRefId===p.id||e.fromPurchaseId===p.id));
      const flows=(S.data.cashFlow||[]).filter(f=>f.fromPurchase&&(f.purchaseRefId===p.id||f.fromPurchaseId===p.id));
      for(const e of exps){try{await delSub('expenses',e.id);}catch(err){}}
      for(const f of flows){try{await delSub('cashFlow',f.id);}catch(err){}}
      await delSub('purchases',p.id);
      ok++;
    }catch(err){console.error(err);}
  }
  setSyncing&&setSyncing('synced');
  alert(`✅ 已清理 ${ok} 筆重複進貨，以及它們產生的重複支出/現金流。\n\n建議接著點「💰 重算加權平均成本」讓成本回正。`);
  render();
};

// 🧹 清理重複的進貨支出（同一筆進貨被記多次支出/現金流）
window.cleanDuplicatePurchaseExpense=async()=>{
  const exps=(S.data.expenses||[]).filter(e=>e.fromPurchase);
  const flows=(S.data.cashFlow||[]).filter(f=>f.fromPurchase);
  // 依 purchaseRefId 分組，找出同一筆進貨被記多次的
  const groupBy=(arr)=>{
    const g={};
    arr.forEach(x=>{
      const rid=x.purchaseRefId||x.fromPurchaseId||'no_ref';
      if(!g[rid])g[rid]=[];
      g[rid].push(x);
    });
    return g;
  };
  const expG=groupBy(exps),flowG=groupBy(flows);
  const dupExps=[],dupFlows=[];
  // 每組保留第一筆，其餘標為重複
  Object.values(expG).forEach(list=>{if(list.length>1)dupExps.push(...list.slice(1));});
  Object.values(flowG).forEach(list=>{if(list.length>1)dupFlows.push(...list.slice(1));});

  if(dupExps.length===0&&dupFlows.length===0){
    alert('✅ 沒有發現重複的進貨支出，帳目是乾淨的。');
    return;
  }
  const dupAmount=dupExps.reduce((s,e)=>s+toN(e.amount),0);
  const preview=dupExps.slice(0,8).map(e=>`• ${e.date} ${(e.note||'').substring(0,20)} $${fmt(e.amount)}`).join('\n');
  if(!confirm(`發現重複記帳：\n\n支出重複 ${dupExps.length} 筆（共 $${fmt(dupAmount)}）\n現金流重複 ${dupFlows.length} 筆\n\n${preview}${dupExps.length>8?'\n...':''}\n\n每組保留一筆、刪掉多餘的。確定清理嗎？\n（不會動到進貨紀錄本身）`))return;

  setSyncing&&setSyncing('syncing');
  let ok=0;
  for(const e of dupExps){try{await delSub('expenses',e.id);ok++;}catch(err){console.error(err);}}
  for(const f of dupFlows){try{await delSub('cashFlow',f.id);}catch(err){console.error(err);}}
  setSyncing&&setSyncing('synced');
  alert(`✅ 清理完成，刪除了 ${dupExps.length} 筆重複支出、${dupFlows.length} 筆重複現金流。\n\n進貨成本統計現在應該正確了。`);
  render();
};

window.payPurchase=async(id)=>{
  const p=(S.data.purchases||[]).find(x=>x.id===id);
  if(!p){toast('找不到進貨記錄');return;}
  if(p.paidToExpense||p.paid){toast('已付款過');return;}
  // 🛡️ 防重複：檢查這筆進貨是否已經有對應的支出紀錄（避免重複記帳）
  const existingExp=(S.data.expenses||[]).find(e=>e.fromPurchase&&(e.purchaseRefId===id||e.fromPurchaseId===id));
  if(existingExp){
    // 已經有支出紀錄了，只補標記進貨為已付款，不再新增
    await setSub('purchases',id,{...p,paidToExpense:true,paid:true,paidDate:existingExp.date||today(),paidMethod:existingExp.payMethod||'轉帳',payMethod:existingExp.payMethod||'轉帳',expenseId:existingExp.id});
    toast('✅ 已標記付款（此筆先前已記過支出，未重複記帳）');
    closeMod();
    render();
    return;
  }
  const paidDate=$('m_pay0')?.value||today();
  const paidMethod=$('m_pay1')?.value||'轉帳';
  const payNote=$('m_pay2')?.value||'';
  const d=new Date(paidDate);
  // 1. 寫入支出記帳
  const expenseRef=await addSub('expenses',{
    date:paidDate,
    category:'進貨成本',
    amount:toN(p.totalCost),
    payMethod:paidMethod,
    note:`【進貨】${p.productName||''}　${p.supplier||''}　數量 ${p.qty||0}${payNote?'　'+payNote:''}`,
    fromPurchase:true,
    fromPurchaseId:id,
    purchaseRefId:id,
    month:d.getMonth()+1,year:d.getFullYear()
  });
  // 2. 寫入現金流水帳
  const flowRef=await addSub('cashFlow',{
    date:paidDate,
    amount:-toN(p.totalCost),
    cat:'進貨支出',
    note:`【進貨】${p.productName||''} × ${p.qty||0}${p.supplier?'（'+p.supplier+'）':''}（${paidMethod}）`,
    fromPurchase:true,
    fromPurchaseId:id,
    purchaseRefId:id,
    month:d.getMonth()+1,year:d.getFullYear()
  });
  // 3. 標記進貨已付款
  await setSub('purchases',id,{...p,paidToExpense:true,paid:true,paidDate,paidMethod,payMethod:paidMethod,payNote,expenseId:expenseRef?.id||'',cashFlowId:flowRef?.id||''});
  toast(`✅ 已標記付款，自動記入 ${d.getMonth()+1} 月支出 $${fmt(p.totalCost)}`);
  closeMod();
  render();
};
window.unpayPurchase=async(id)=>{
  if(!confirm('取消付款？\n會同時刪除「支出記帳」和「現金流水帳」中對應的紀錄'))return;
  const p=(S.data.purchases||[]).find(x=>x.id===id);
  if(!p)return;
  // 1. 刪除對應的支出（用兩種方式查找，相容新舊版）
  if(p.expenseId){
    try{await delSub('expenses',p.expenseId);}catch(e){console.warn('刪除支出失敗',e);}
  }
  // 也刪除所有 fromPurchase/purchaseRefId 對應的支出（防漏）
  const exps=(S.data.expenses||[]).filter(e=>(e.fromPurchase||e.fromPurchaseId)&&(e.purchaseRefId===id||e.fromPurchaseId===id));

  // 2. 刪除對應的現金流
  if(p.cashFlowId){
    try{await delSub('cashFlow',p.cashFlowId);}catch(e){console.warn('刪除現金流失敗',e);}
  }
  const flows=(S.data.cashFlow||[]).filter(f=>(f.fromPurchase||f.fromPurchaseId)&&(f.purchaseRefId===id||f.fromPurchaseId===id));
  for(const f of flows){try{await delSub('cashFlow',f.id);}catch(err){console.warn(err);}}
  // 3. 還原進貨狀態
  await setSub('purchases',id,{...p,paidToExpense:false,paid:false,paidDate:'',paidMethod:'',payMethod:'',payNote:'',expenseId:'',cashFlowId:''});

// 整組進貨：自動計算各品項成本
window.recalcGroupCosts=()=>{
  if(!S.modal||S.modal.t!=='batchPurchase'||!S.modal.groupMode)return;
  const groupTotal=parseFloat($('m_bpGroupTotal')?.value)||0;
  const splitMode=$('m_bpSplitMode')?.value||'price';
  const rowEls=document.querySelectorAll('.batch-row');
  // 收集每列的數量、售價
  const items=Array.from(rowEls).map(el=>({
    qty:parseFloat(el.querySelector('.bp_qty')?.value)||0,
    price:parseFloat(el.querySelector('.bp_price')?.value)||0,
    el
  }));
  let hint='';
  if(groupTotal<=0){
    items.forEach(it=>{if(it.el.querySelector('.bp_unit'))it.el.querySelector('.bp_unit').value='';});
    hint='請先填整組總成本';
  }else if(splitMode==='even'){
    // 平均：總成本 / 總件數（含數量）
    const totalQty=items.reduce((s,it)=>s+it.qty,0);
    if(totalQty<=0){
      items.forEach(it=>{if(it.el.querySelector('.bp_unit'))it.el.querySelector('.bp_unit').value='';});
      hint='請先填數量';
    }else{
      const avgUnit=Math.round(groupTotal/totalQty*100)/100;
      items.forEach(it=>{if(it.el.querySelector('.bp_unit'))it.el.querySelector('.bp_unit').value=avgUnit;});
      const totalSale=items.reduce((s,it)=>s+it.qty*it.price,0);
      const margin=totalSale>0?Math.round((totalSale-groupTotal)/totalSale*100):0;
      hint=`平均單價 $${fmt(avgUnit)}/件 ｜ 預計售價總和 $${fmt(totalSale)} ｜ 整組毛利率 ${margin}%`;
    }
  }else{
    // 按售價比例
    const totalSale=items.reduce((s,it)=>s+it.qty*it.price,0);
    if(totalSale<=0){
      items.forEach(it=>{if(it.el.querySelector('.bp_unit'))it.el.querySelector('.bp_unit').value='';});
      hint='請先填各品項的售價';
    }else{
      let allocated=0;
      items.forEach((it,i)=>{
        if(it.qty<=0||it.price<=0){
          if(it.el.querySelector('.bp_unit'))it.el.querySelector('.bp_unit').value='';
          return;
        }
        const itemSaleTotal=it.qty*it.price;
        // 該品項分到的成本比例
        const allocatedCost=i===items.length-1?groupTotal-allocated:Math.round(itemSaleTotal/totalSale*groupTotal);
        const unitCost=Math.round(allocatedCost/it.qty*100)/100;
        if(it.el.querySelector('.bp_unit'))it.el.querySelector('.bp_unit').value=unitCost;
        allocated+=allocatedCost;
      });
      const margin=Math.round((totalSale-groupTotal)/totalSale*100);
      hint=`售價總和 $${fmt(totalSale)} ｜ 整組成本 $${fmt(groupTotal)} ｜ 整組毛利率 <b>${margin}%</b>`;
    }
  }
  if($('m_bpGroupHint'))$('m_bpGroupHint').innerHTML=hint;
};

window.saveBatchPurchase=async()=>{
  const date=$('m_bpDate')?.value||today();
  const supSel=$('m_bpSup')?.value;
  const supplier=supSel==='其他手動輸入廠商'?($('m_bpSupC')?.value||'').trim():supSel;
  collectBatchRows();
  const validRows=S.modal.rows.filter(r=>(r.productId||r.name)&&toN(r.qty)>0);
  if(validRows.length===0){alert('請至少填寫一筆有效資料（選擇現有產品或填寫名稱+數量）');return;}
  const isGroup=S.modal.groupMode||false;
  const groupTotal=parseFloat($('m_bpGroupTotal')?.value)||0;
  if(isGroup&&groupTotal<=0){alert('請填整組總成本');return;}
  // 整批付款狀態
  const paidStatus=document.querySelector('input[name="m_bpPaid"]:checked')?.value||'paid';
  const payMethod=$('m_bpPayMethod')?.value||'轉帳';
  const paid=paidStatus==='paid';
  const d=new Date(date);
  let count=0;
  let totalAllCost=0;
  let groupNote=isGroup?`整組 $${fmt(groupTotal)}`:'';
  for(const r of validRows){
    const qty=toN(r.qty);
    const unitCost=toN(r.unit);
    const sellPrice=toN(r.price);
    const totalCost=qty*unitCost;
    totalAllCost+=totalCost;
    // 優先：用 productId 直接找產品（避免名稱比對問題）
    let prod=null;
    if(r.productId){
      prod=(S.data.products||[]).find(p=>p.id===r.productId);
    }
    // 次選：用名稱+類別比對（兩邊 trim 並去除空白避免重複建立）
    if(!prod&&r.name){
      const tName=r.name.trim().replace(/[\u3000\s]+/g,'');
      prod=(S.data.products||[]).find(p=>(p.name||'').trim().replace(/[\u3000\s]+/g,'')===tName&&p.category===r.cat);
    }
    let pid;
    if(!prod){
      pid=uid();
      const newProd={id:pid,name:r.name.trim(),category:r.cat,price:sellPrice,cost:unitCost,supplier};
      S.data.products=[...(S.data.products||[]),newProd];
      S.data.inventory=[...S.data.inventory,{productId:pid,qty,minQty:1,avgCost:unitCost,totalPurchaseCost:totalCost}];
    }else{
      pid=prod.id;
      const inv=getInv(pid);
      const oldQty=toN(inv.qty);
      const oldAvg=toN(inv.avgCost)||toN(prod.cost)||0;
      const newAvg=calculateNewAvgCost(oldQty,oldAvg,qty,unitCost);
      const newTotalCost=toN(inv.totalPurchaseCost||0)+totalCost;
      S.data.inventory=[...S.data.inventory.filter(i=>i.productId!==pid),
                       {productId:pid,qty:oldQty+qty,minQty:inv.minQty||1,avgCost:newAvg,totalPurchaseCost:newTotalCost}];
      S.data.products=(S.data.products||[]).map(p=>p.id===pid?{
        ...p,
        cost:toN(p.cost)>0?p.cost:unitCost,  // 標準成本鎖定，只有從沒填過才給預設
        supplier:p.supplier||supplier,
        price:p.price||sellPrice
      }:p);
    }
    const purchaseId=uid();
    // 名稱優先順序：選了現有產品時 → 用該產品名稱（避免下拉顯示 vs 儲存不一致）
    //              沒選現有產品時 → 用輸入框名稱（新建產品）
    const finalProductName=prod?(prod.name||''):(r.name?r.name.trim():'');
    const purchaseData={
      id:purchaseId,
      date,productId:pid,productName:finalProductName,
      category:r.cat,qty,unitCost,totalCost,supplier,
      paid,payMethod,paidDate:paid?date:null,
      note:groupNote,
      month:d.getMonth()+1,year:d.getFullYear()
    };
    await addSub('purchases',purchaseData);
    if(paid){
      const expNote=`【進貨】${purchaseData.productName} × ${qty}${supplier?'（'+supplier+'）':''}`;
      await addSub('expenses',{
        date,category:'進貨成本',amount:totalCost,
        payMethod,note:expNote,
        fromPurchase:true,purchaseRefId:purchaseId,
        month:d.getMonth()+1,year:d.getFullYear()
      });
      await addSub('cashFlow',{
        date,amount:-totalCost,cat:'進貨支出',
        note:expNote+`（${payMethod}）`,
        fromPurchase:true,purchaseRefId:purchaseId,
        month:d.getMonth()+1,year:d.getFullYear()
      });
    }
    count++;
  }
  await saveMain({products:S.data.products,inventory:S.data.inventory});
  toast(`✅ 已批次新增 ${count} 筆進貨，總成本 $${fmt(totalAllCost)}${paid?'（已記支出）':'（未付款，待結算）'}`);
  closeMod();
};

// ── 月度盤點：計算單筆差異 + 即時更新摘要 ──
window.calcStockDiff=(input)=>{
  const tr=input.closest('tr');
  if(!tr)return;
  const systemQty=parseFloat(input.dataset.systemqty)||0;
  const actual=input.value===''?null:parseFloat(input.value);
  const diffCell=tr.querySelector('.msc_diff');
  if(actual===null||isNaN(actual)){
    diffCell.textContent='-';
    diffCell.style.color='';
  }else{
    const diff=actual-systemQty;
    if(diff===0){
      diffCell.textContent='✓ 一致';
      diffCell.style.color='var(--grn)';
    }else if(diff>0){
      diffCell.textContent=`+${diff}`;
      diffCell.style.color='var(--blu)';
    }else{
      diffCell.textContent=`${diff}`;
      diffCell.style.color='var(--red)';
    }
  }
  // 更新摘要
  const allRows=document.querySelectorAll('.msc_actual');
  let filled=0,match=0,shortage=0,surplus=0,shortQty=0,surplusQty=0;
  allRows.forEach(el=>{
    if(el.value==='')return;
    filled++;
    const sys=parseFloat(el.dataset.systemqty)||0;
    const act=parseFloat(el.value)||0;
    const d=act-sys;
    if(d===0)match++;
    else if(d<0){shortage++;shortQty+=Math.abs(d);}
    else{surplus++;surplusQty+=d;}
  });
  const summary=$('m_msc_summary');
  const text=$('m_msc_summary_text');
  if(filled>0&&summary&&text){
    summary.style.display='block';
    let html=`已盤點 <b>${filled}</b> 項　`;
    if(match>0)html+=`<span style="color:var(--grn);">✓ ${match} 項一致</span>　`;
    if(shortage>0)html+=`<span style="color:var(--red);">▼ ${shortage} 項短少 (共 -${shortQty})</span>　`;
    if(surplus>0)html+=`<span style="color:var(--blu);">▲ ${surplus} 項盤盈 (共 +${surplusQty})</span>`;
    text.innerHTML=html;
  }else if(summary){
    summary.style.display='none';
  }
};

window.saveMonthStockCheck=async()=>{
  try{
    const date=$('m_msc_date')?.value;
    const by=$('m_msc_by')?.value||'';
    if(!date){alert('請選擇盤點日期');return;}
    const rows=document.querySelectorAll('tr[data-pid]');
    if(rows.length===0){alert('沒有可盤點的產品');return;}
    let updates=[];
    let stats={total:0,match:0,shortage:0,surplus:0,shortQty:0,surplusQty:0};
    rows.forEach(row=>{
      const pid=row.dataset.pid;
      const input=row.querySelector('.msc_actual');
      if(!input||input.value==='')return;
      const actual=parseFloat(input.value);
      if(isNaN(actual))return;
      const systemQty=parseFloat(input.dataset.systemqty)||0;
      const diff=actual-systemQty;
      stats.total++;
      if(diff===0)stats.match++;
      else if(diff<0){stats.shortage++;stats.shortQty+=Math.abs(diff);}
      else{stats.surplus++;stats.surplusQty+=diff;}
      updates.push({pid,actual,systemQty,diff});
    });
    if(updates.length===0){alert('請至少填寫一筆實際庫存');return;}
    let confirmMsg=`確認執行盤點？\n\n盤點日期：${date}\n盤點 ${updates.length} 項`;
    if(stats.match>0)confirmMsg+=`\n✓ ${stats.match} 項一致`;
    if(stats.shortage>0)confirmMsg+=`\n▼ ${stats.shortage} 項短少（共 -${stats.shortQty}）`;
    if(stats.surplus>0)confirmMsg+=`\n▲ ${stats.surplus} 項盤盈（共 +${stats.surplusQty}）`;
    confirmMsg+=`\n\n系統庫存將被覆蓋為實際盤點數量`;
    if(!confirm(confirmMsg))return;
    // 更新庫存 + 為差異建立 stockOuts 紀錄
    const newInv=[...(S.data.inventory||[])];
    const d=new Date(date);
    for(const u of updates){
      const idx=newInv.findIndex(i=>i.productId===u.pid);
      const old=idx>=0?newInv[idx]:{productId:u.pid,qty:0,minQty:1};
      const updated={...old,qty:u.actual};
      if(idx>=0)newInv[idx]=updated;
      else newInv.push(updated);
      // 為差異建立 stockOuts 紀錄（僅當有差異時）
      if(u.diff!==0){
        const prod=(S.data.products||[]).find(p=>p.id===u.pid);
        const type=u.diff<0?'damage':'gift';  // 短少→損耗、盤盈→其他（用 gift 暫代）
        const note=u.diff<0?`【月度盤點短少】${date}　應有 ${u.systemQty} → 實際 ${u.actual}`:`【月度盤點盤盈】${date}　應有 ${u.systemQty} → 實際 ${u.actual}`;
        try{
          await addSub('stockOuts',{
            date,
            type:'check',  // 盤點類型
            productId:u.pid,
            productName:prod?.name||'',
            qty:Math.abs(u.diff),
            unitCost:getAvgCost(u.pid),
            totalCost:Math.abs(u.diff)*getAvgCost(u.pid),
            note,
            checkBy:by,
            isShortage:u.diff<0,
            month:d.getMonth()+1,year:d.getFullYear()
          });
        }catch(e){console.warn('盤點紀錄失敗',e);}
      }
    }
    await saveMain({inventory:newInv});
    toast(`✅ 盤點完成 ${updates.length} 項　${date}`);
    closeMod();
  }catch(err){
    console.error('saveMonthStockCheck 失敗:',err);
    alert('失敗：'+(err.message||err));
  }
};

// 檢查孤兒現金流紀錄（儲值入帳但找不到對應的 deposits 紀錄）
window.findOrphanCashFlows=async()=>{
  const cashFlows=S.data.cashFlow||[];
  const deposits=S.data.deposits||[];
  const orphans=[];
  cashFlows.forEach(c=>{
    if(c.cat!=='儲值入帳')return;
    // 找對應的 deposit
    const noteCustomer=(c.note||'').split(' ')[0]; // 例如 "吃早餐 儲值面額..." → "吃早餐"
    const targetAmount=toN(c.amount);
    const found=deposits.find(d=>
      d.date===c.date&&
      toN(d.actualReceived||d.amount)===targetAmount&&
      ((d.customer||'').trim()===(noteCustomer||'').trim()||(c.note||'').includes(d.customer||''))
    );
    if(!found)orphans.push(c);
  });
  if(orphans.length===0){
    alert('✅ 沒有孤兒紀錄，現金流資料一致！');
    return;
  }
  const list=orphans.map(o=>`• ${o.date}　$${fmt(o.amount)}　${o.note||''}`).join('\n');
  if(!confirm(`找到 ${orphans.length} 筆孤兒紀錄（已刪除儲值但紀錄還在）：\n\n${list}\n\n是否一鍵清除？`))return;
  for(const o of orphans){await delSub('cashFlow',o.id);}
  toast(`✅ 已清除 ${orphans.length} 筆孤兒紀錄`);
  render();
};

// 確認並刪除測試客戶（預覽 → 確認）
window.confirmDeleteTestCustomer=async()=>{
  const name=$('m_delc')?.value?.trim();

  const sales=(S.data.sales||[]).filter(s=>(s.customer||'').trim()===name);

  const cashFlows=(S.data.cashFlow||[]).filter(c=>(c.note||'').includes(name));
  const customer=(S.data.customers||[]).find(c=>(c.name||'').trim()===name);
  const total=sales.length+deposits.length+records.length+stockOuts.length+cashFlows.length+(customer?1:0);
  if(total===0){
    alert(`找不到客戶「${name}」的任何紀錄`);

  }
  const summary=`【找到以下紀錄】\n`+
    `• 銷售紀錄：${sales.length} 筆\n`+
    `• 儲值紀錄：${deposits.length} 筆\n`+
    `• 療程紀錄：${records.length} 筆\n`+
    `• 出貨耗用：${stockOuts.length} 筆\n`+
    `• 現金流：${cashFlows.length} 筆\n`+
    `• 客戶建檔：${customer?'1 筆':'0 筆'}\n\n`+
    `⚠️ 確認刪除「${name}」的全部 ${total} 筆紀錄嗎？\n此操作無法復原！`;
  if(!confirm(summary))return;

// ─── 🔄 老師改名工具（把舊紀錄的老師名字整批改成新名字）───
window.renameStaff=async()=>{
  const oldName=prompt('請輸入「舊的老師名字」（要被改掉的，例如：珞熙）：');
  if(!oldName||!oldName.trim())return;
  const newName=prompt(`請輸入「新的老師名字」（例如：于蜜）：\n\n將把所有紀錄中的「${oldName.trim()}」改成新名字`);
  if(!newName||!newName.trim())return;
  const o=oldName.trim(),nn=newName.trim();
  if(o===nn){alert('新舊名字一樣，不用改');return;}

  // 先掃描有多少筆會被影響
  const sales=(S.data.sales||[]).filter(s=>s.staff===o);
  const courses=(S.data.courses||[]).filter(c=>c.instructor===o);
  const serviceRecords=(S.data.serviceRecords||[]).filter(r=>r.staff===o);
  const deposits=(S.data.deposits||[]).filter(d=>d.staff===o);
  const total=sales.length+courses.length+serviceRecords.length+deposits.length;

  if(total===0){
    alert(`找不到任何「${o}」的紀錄。\n\n可能名字打錯了，或這位老師本來就沒有紀錄。`);
    return;
  }

  if(!confirm(`即將把以下紀錄的老師名字從「${o}」改成「${nn}」：\n\n• 業績/收入：${sales.length} 筆\n• 課程：${courses.length} 筆\n• 服務紀錄：${serviceRecords.length} 筆\n• 儲值：${deposits.length} 筆\n────────\n共 ${total} 筆\n\n改完後「${o}」的舊業績會全部併到「${nn}」名下。\n\n確定要執行嗎？`))return;

  setSyncing('syncing');
  let done=0;
  try{
    // 1. sales（子集合）
    for(const s of sales){
      await setSub('sales',s.id,{...s,staff:nn});
      const idx=(S.data.sales||[]).findIndex(x=>x.id===s.id);
      if(idx>=0)S.data.sales[idx].staff=nn;
      done++;
    }
    // 2. courses（子集合）
    for(const c of courses){
      await setSub('courses',c.id,{...c,instructor:nn});
      const idx=(S.data.courses||[]).findIndex(x=>x.id===c.id);
      if(idx>=0)S.data.courses[idx].instructor=nn;
      done++;
    }
    // 3. serviceRecords（子集合，如果有）
    for(const r of serviceRecords){
      await setSub('serviceRecords',r.id,{...r,staff:nn});
      const idx=(S.data.serviceRecords||[]).findIndex(x=>x.id===r.id);
      if(idx>=0)S.data.serviceRecords[idx].staff=nn;
      done++;
    }
    // 4. deposits（子集合）
    for(const d of deposits){
      await setSub('deposits',d.id,{...d,staff:nn});
      const idx=(S.data.deposits||[]).findIndex(x=>x.id===d.id);
      if(idx>=0)S.data.deposits[idx].staff=nn;
      done++;
    }
    setSyncing('synced');
    alert(`✅ 完成！已把 ${done} 筆紀錄的「${o}」改成「${nn}」。\n\n現在「${nn}」的業績已包含原本「${o}」的所有紀錄。`);
    render();
  }catch(err){
    setSyncing('error');
    console.error('老師改名失敗',err);
    alert(`改名過程發生錯誤（已完成 ${done}/${total} 筆）：\n${err.message||err}\n\n可以再點一次按鈕，會繼續處理剩下的。`);
  }
};

// 把使用方式的多行轉成「1 洗臉 2 化妝水」的橫式寫法
function inlineSteps(usage){
  return (usage||'').split('\n').map(s=>s.trim()).filter(s=>s)
    .map(s=>s.replace(/^(\d+)[\.、\)]\s*/,'$1 '))
    .join('　');
}

// 依勾選數量，動態生成「試用包區塊」的排版指示
function buildTrialPackSection(packs){
  if(packs.length===0)return'（這次沒有給試用包，這一區可以省略）';
  const names=packs.map(p=>p.name).join('、');
  const contents=packs.map(p=>`${p.name} ${(p.contents||'').replace(/\n/g,' ')}`).join('、');
  const days=packs.map(p=>`${p.name}：${p.days||'依需求使用'}`).join('；');
  const notes=[...new Set(packs.flatMap(p=>(p.note||'').split(/[、，,；;]/).map(s=>s.trim()).filter(s=>s)))].join('／');

  let cards='';
  if(packs.length===1){
    const p=packs[0];
    cards=`• 一張圓角卡片：怎麼用｜${p.name} → ${inlineSteps(p.usage)}`;
  }else if(packs.length===2){
    cards=`• 左右兩欄並排的圓角卡片：
  • 左：怎麼用｜${packs[0].name} → ${inlineSteps(packs[0].usage)}
  • 右：怎麼用｜${packs[1].name} → ${inlineSteps(packs[1].usage)}`;
  }else{
    cards=`• 依序排列的圓角卡片（每個試用包一張，上下堆疊）：
${packs.map((p,i)=>`  • 卡片${i+1}：怎麼用｜${p.name} → ${inlineSteps(p.usage)}`).join('\n')}`;
  }

  return `• 副標：${names}
• 內容物：${contents}
${cards}
• 用多久：${days}
• 小提醒：${notes||'依個人膚況調整'}`;
}

// 把資料填入模板
function fillTrialPackTemplate(tmpl,packs,aftercareText){
  const arr=Array.isArray(packs)?packs:[packs];
  const first=arr[0]||{};
  return tmpl
    .replace(/\{護膚叮嚀\}/g,aftercareText||'（這次不需要護膚叮嚀，這一區可以省略）')
    .replace(/\{試用包區塊\}/g,buildTrialPackSection(arr))
    .replace(/\{名稱\}/g,arr.map(p=>p.name).join('、'))
    .replace(/\{適用\}/g,[...new Set(arr.map(p=>p.target).filter(x=>x))].join('、')||'一般膚質')
    .replace(/\{內容物\}/g,arr.map(p=>`【${p.name}】${p.contents||''}`).join('\n'))
    .replace(/\{使用方式\}/g,arr.map(p=>`【${p.name}】\n${p.usage||''}`).join('\n\n'))
    .replace(/\{功效\}/g,arr.map(p=>p.benefits||'').filter(x=>x).join('\n'))
    .replace(/\{天數\}/g,arr.map(p=>`${p.name}：${p.days||'依需求'}`).join('；'))
    .replace(/\{注意\}/g,[...new Set(arr.map(p=>p.note).filter(x=>x))].join('／')||'無特殊注意事項');
}

// 產生 GPT 指令（叮嚀卡 + 試用包卡，各自獨立避免圖太長）
window.genTrialPackPrompt=(ids,aftercareId)=>{
  const idArr=Array.isArray(ids)?ids:[ids];
  const packs=idArr.map(id=>(S.data.trialPacks||[]).find(x=>x.id===id)).filter(x=>x);
  const cares=S.data.settings?.aftercareTemplates||DEFAULT_AFTERCARE;
  if(aftercareId===undefined&&cares.length>0){
    showAftercarePicker(idArr,cares);
    return;
  }
  const care=cares.find(x=>x.id===aftercareId);
  const careText=care?care.text:'';
  const sections=[];

  // 第一張：護膚叮嚀卡
  if(careText){
    const tmpl=S.data.settings?.trialPackPrompt||DEFAULT_TRIALPACK_PROMPT;
    sections.push({
      name:`① 護膚叮嚀卡（${care.name}）`,
      text:fillTrialPackTemplate(tmpl,packs,careText),
      isMerged:true
    });
  }

  // 第二張：試用包說明卡
  if(packs.length>0){
    const tpTmpl=S.data.settings?.trialPackCardPrompt||DEFAULT_TRIALPACK_CARD_PROMPT;
    sections.push({
      name:`② 試用包說明卡（${packs.map(p=>p.name).join('、')}）`,
      text:fillTrialPackTemplate(tpTmpl,packs,careText)
    });
  }

  if(sections.length===0){alert('沒有可產生的內容');return;}
  showTrialPackPromptModal('🤖 生圖指令（分兩張，各自精簡好讀）',sections);
};

    <div class="notice" style="background:var(--grnL);border-left-color:var(--grn);color:var(--grn);font-size:13px;">
      ${sections.length>1?
        '可以選「合併成一張」做一張大卡，或分別產生各自的圖卡。複製後貼到 ChatGPT 即可生圖 🌸':
        '複製下面的指令，貼到 ChatGPT 就能生成圖卡，再傳給客人 🌸'}
    </div>
    <div style="max-height:58vh;overflow-y:auto;margin-top:12px;">
      ${sections.map((s,i)=>`
        <div style="margin-bottom:14px;${s.isMerged?'padding:10px;background:var(--goldL);border-radius:8px;border:1px solid var(--gold);':''}">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;">
            <b style="font-size:14px;color:${s.isMerged?'var(--goldDk)':'var(--pur)'};">${s.name}</b>
            <button class="btn btn-sm ${s.isMerged?'btn-p':'btn-s'}" onclick="copyPromptSection(${i})">📋 複製</button>
          </div>
          <textarea id="m_tpg_text_${i}" rows="8" readonly style="width:100%;font-family:monospace;font-size:12px;line-height:1.6;background:#fff;">${s.text}</textarea>
        </div>`).join('')}
    </div>
    <div class="mbtns"><button class="btn btn-s" onclick="openM('trialPackMgr')">返回</button></div>`;
  S.modal={t:'trialPackGen',html,lg:true};
  const bg=$('modal-bg'),inn=$('modal-inner');
  if(bg&&inn){inn.innerHTML=html;bg.className='modal-bg open';inn.className='modal lg';}
}

window.copyPromptSection=(i)=>{
  const ta=$(`m_tpg_text_${i}`);
  if(!ta)return;
  try{
    navigator.clipboard.writeText(ta.value);
    toast('✅ 指令已複製，貼到 ChatGPT 即可生圖');
  }catch(e){
    ta.select();
    try{document.execCommand('copy');toast('✅ 已複製');}catch(e2){alert('複製失敗，請手動選取');}
  }
};

// ═══ 📖 課程步驟 ═══
window.toggleStepEdit=(on)=>{
  if(!S.modal)return;
  S.modal.stepEdit=on;
  if(!on)S.modal.stepDraft=null;
  const inn=$('modal-inner');
  if(inn){
    inn.innerHTML=renderModal();
    if(on)setTimeout(renderStepRows,30);
  }
};

window.addStepRow=()=>{
  if(!S.modal)return;
  if(!S.modal.stepDraft)S.modal.stepDraft=[];
  S.modal.stepDraft.push({title:'',note:'',key:'',minutes:0});
  renderStepRows();
};

window.removeStepRow=(i)=>{
  if(!S.modal||!S.modal.stepDraft)return;
  S.modal.stepDraft.splice(i,1);
  renderStepRows();
};

window.moveStepRow=(i,dir)=>{
  if(!S.modal||!S.modal.stepDraft)return;
  const arr=S.modal.stepDraft;
  const j=i+dir;
  if(j<0||j>=arr.length)return;
  [arr[i],arr[j]]=[arr[j],arr[i]];
  renderStepRows();
};

window.updateStepField=(i,field,val)=>{
  if(!S.modal||!S.modal.stepDraft||!S.modal.stepDraft[i])return;
  S.modal.stepDraft[i][field]=field==='minutes'?(parseFloat(val)||0):val;
};

window.renderStepRows=()=>{
  const wrap=$('m_step_list');
  if(!wrap||!S.modal)return;
  const arr=S.modal.stepDraft||[];
  if(arr.length===0){
    wrap.innerHTML=`<div class="empty" style="padding:20px;"><p class="tm">點「＋新增步驟」開始建立流程</p></div>`;
    return;
  }
  wrap.innerHTML=arr.map((st,i)=>`
    <div style="background:var(--bg2);padding:10px;border-radius:8px;margin-bottom:8px;">
      <div style="display:flex;gap:6px;align-items:center;margin-bottom:6px;">
        <span style="flex-shrink:0;width:24px;height:24px;background:var(--pur);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;">${i+1}</span>
        <input type="text" value="${(st.title||'').replace(/"/g,'&quot;')}" placeholder="步驟名稱（如：卸妝清潔）"
          onchange="updateStepField(${i},'title',this.value)" style="flex:1;font-size:14px;font-weight:700;">
        <input type="number" value="${st.minutes||''}" placeholder="分"
          onchange="updateStepField(${i},'minutes',this.value)" style="width:56px;font-size:13px;">
        <button class="bdel" onclick="moveStepRow(${i},-1)" title="上移" ${i===0?'style="opacity:.3;"':''}>↑</button>
        <button class="bdel" onclick="moveStepRow(${i},1)" title="下移" ${i===arr.length-1?'style="opacity:.3;"':''}>↓</button>
        <button class="bdel" onclick="removeStepRow(${i})">×</button>
      </div>
      <textarea placeholder="操作說明（選填）" rows="2"
        onchange="updateStepField(${i},'note',this.value)"
        style="width:100%;font-size:13px;margin-bottom:6px;">${st.note||''}</textarea>
      <input type="text" value="${(st.key||'').replace(/"/g,'&quot;')}" placeholder="💡 重點提醒（選填，會用金色標示）"
        onchange="updateStepField(${i},'key',this.value)" style="width:100%;font-size:13px;">
    </div>
  `).join('');
};

window.saveCourseSteps=async(cardId)=>{

  const cards=(S.data.serviceCosts||[]).map(c=>

window.autoFillDepreciation=()=>{
  const eq=S.data.equipment||[];
  if(eq.length===0){
    alert('設備清單是空的。\n\n你可以到「🛋️ 設備折舊」頁面新增設備，或直接手動填每月折舊金額。\n\n算法：購入價 ÷（使用年限 × 12）');
    return;
  }
  const total=eq.reduce((s,e)=>{
    const price=toN(e.price||e.cost||e.amount);
    const years=toN(e.years||e.usefulLife)||5;
    return s+price/(years*12);
  },0);
  const inp=$('m_fc_equip');
  if(inp){inp.value=Math.round(total);calcFixedCost();}
  const note=$('m_fc_equipNote');
  if(note)note.innerHTML=`已從 ${eq.length} 項設備算出每月折舊 $${fmt(Math.round(total))}`;
};

  S.modal.fcHours=hours;

    const mm=toN(it.months)||1;
    return s+toN(it.amount)/mm;
  },0);
  const monthlyTotal=monthlyBase+equip;

        <span style="font-size:26px;font-weight:900;color:var(--gold);">$${fmt(Math.round(monthlyTotal))}</span>
      </div>
      <div class="tm" style="font-size:12px;">
        固定支出 $${fmt(Math.round(monthlyBase))}${equip>0?` ＋ 設備折舊 $${fmt(equip)}`:''}
      </div>
    </div>

    <div class="sg sg2" style="margin-top:12px;">
      <div class="sc gold">
        <div class="sl">每堂課要攤</div>
        <div class="sv gold sm">$${fmt(Math.round(perService))}</div>
        <div class="ss">${monthlyTotal.toFixed(0)} ÷ ${count} 堂</div>
      </div>
      <div class="sc">
        <div class="sl">床位每小時成本</div>
        <div class="sv sm" style="color:var(--blu);">$${fmt(Math.round(perHour))}</div>
        <div class="ss">${monthlyTotal.toFixed(0)} ÷ ${hours} 小時</div>
      </div>

    <div style="background:var(--bg2);padding:12px;border-radius:8px;margin-top:12px;">
      <div style="font-weight:700;font-size:13px;margin-bottom:6px;">📊 不同時長的固定攤分</div>
      <table style="width:100%;font-size:13px;">
        <tbody>
          ${[60,90,120].map(d=>`<tr>
            <td style="padding:4px 0;">${d} 分鐘服務</td>
            <td style="text-align:right;font-weight:700;color:var(--gold);">$${fmt(Math.round(perHour*d/60))}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>

    <div class="notice" style="background:var(--grnL);border-left-color:var(--grn);color:var(--grn);font-size:12px;margin-top:12px;">

window.saveFixedCost=async()=>{
  if(!S.modal)return;
  const items=(S.modal.fcItems||[]).filter(it=>it.name&&toN(it.amount)>0);
  const equip=parseFloat($('m_fc_equip')?.value)||0;

// ─── 💰 從進貨紀錄重算加權平均成本 ───
window.recalcAvgCost=async()=>{
  const purchases=S.data.purchases||[];
  const products=S.data.products||[];
  if(purchases.length===0){
    alert('沒有進貨紀錄，無法重算。');
    return;
  }
  // 依產品彙總：總成本 ÷ 總數量
  const agg={};
  purchases.forEach(p=>{
    const pid=p.productId;
    if(!pid)return;
    if(!agg[pid])agg[pid]={qty:0,cost:0,count:0};
    agg[pid].qty+=toN(p.qty);
    agg[pid].cost+=toN(p.totalCost);
    agg[pid].count++;
  });

  // 算出新舊差異
  const changes=[];
  Object.entries(agg).forEach(([pid,a])=>{
    if(a.qty<=0)return;
    const newAvg=Math.round(a.cost/a.qty*100)/100;
    const oldAvg=Math.round(toN(getInv(pid).avgCost)*100)/100;
    if(Math.abs(newAvg-oldAvg)>=0.01){
      const p=products.find(x=>x.id===pid);
      changes.push({pid,name:p?.name||'(未知產品)',oldAvg,newAvg,count:a.count});
    }
  });

  if(changes.length===0){
    alert('✅ 所有產品的加權平均成本都已經是正確的，不需要重算。');
    return;
  }

  const preview=changes.slice(0,12).map(c=>
    `• ${c.name}：$${c.oldAvg} → $${c.newAvg}（${c.count} 筆進貨）`
  ).join('\n');
  const more=changes.length>12?`\n...還有 ${changes.length-12} 項`:'';

  if(!confirm(`即將重算 ${changes.length} 個產品的加權平均成本：\n\n${preview}${more}\n\n算法：該產品所有進貨的總成本 ÷ 總數量\n\n⚠️ 這會覆蓋你手動改過的成本，確定要重算嗎？`))return;

  setSyncing('syncing');
  try{
    let newInv=[...(S.data.inventory||[])];
    changes.forEach(c=>{
      const idx=newInv.findIndex(i=>i.productId===c.pid);
      if(idx>=0){
        newInv[idx]={...newInv[idx],avgCost:c.newAvg};
      }else{
        newInv.push({productId:c.pid,qty:0,minQty:1,avgCost:c.newAvg});
      }
    });
    await saveMain({inventory:newInv});
    setSyncing('synced');
    alert(`✅ 已重算 ${changes.length} 個產品的加權平均成本。\n\n服務成本卡、定價規劃器的數字也會跟著更新。`);
    render();
  }catch(err){
    setSyncing('error');
    console.error('重算成本失敗',err);
    alert('重算失敗：'+(err.message||err));
  }
};

  const purchaseProductNames=new Set(purchases.map(p=>p.productName).filter(x=>x));
  const msg=`📊 庫存資料診斷報告
────────────────────
【目前系統載入的資料】
• 產品清單：${products.length} 筆
• 庫存紀錄：${inventory.length} 筆
• 進貨紀錄：${purchases.length} 筆
• 出貨耗用：${stockOuts.length} 筆

【從進貨紀錄推算】
• 進貨中出現過的不同產品：${purchaseProductIds.size} 種（依編號）
• 進貨中出現過的產品名稱：${purchaseProductNames.size} 種（依名稱）
────────────────────
${products.length===0&&purchases.length>0?
'⚠️ 診斷結果：產品清單是空的，但進貨紀錄還在！\n\n這代表產品資料沒載入或被清空，但可以用進貨紀錄重建。\n\n👉 請點「🔧 從進貨重建庫存」按鈕來復原。':
products.length>0?
'✅ 診斷結果：產品清單有資料（'+products.length+'筆），資料正常。\n\n如果庫存盤點頁還是空白，可能是顯示問題，請強制重新整理（Cmd+Shift+R）。':
'⚠️ 產品和進貨都是空的，可能資料還在同步中，請稍等幾秒再點一次診斷。'}`;

// ─── 🔧 從進貨紀錄重建產品清單與庫存 ───
window.rebuildInventoryFromPurchases=async()=>{
  const purchases=S.data.purchases||[];
  if(purchases.length===0){
    alert('沒有進貨紀錄，無法重建。\n\n如果你確定有進貨資料，可能還在同步中，請稍等幾秒再試。');
    return;
  }
  const existingProducts=S.data.products||[];
  const existingIds=new Set(existingProducts.map(p=>p.id));
  const existingNames=new Set(existingProducts.map(p=>(p.name||'').trim()));

  // 從進貨紀錄彙整出所有產品（依 productId 分組）
  const productMap={};  // productId -> 產品資訊 + 累計進貨
  purchases.forEach(pur=>{
    const pid=pur.productId;
    if(!pid)return;
    if(!productMap[pid]){
      productMap[pid]={
        id:pid,
        name:pur.productName||'未命名產品',
        category:pur.category||'其他',
        supplier:pur.supplier||'',
        series:pur.series||'',
        totalQty:0,
        totalCost:0,
        lastUnitCost:0
      };
    }
    productMap[pid].totalQty+=toN(pur.qty);
    productMap[pid].totalCost+=toN(pur.totalCost);
    if(toN(pur.unitCost)>0)productMap[pid].lastUnitCost=toN(pur.unitCost);
  });

  // 扣掉出貨耗用的數量
  const stockOuts=S.data.stockOuts||[];
  stockOuts.forEach(so=>{
    const pid=so.productId;
    if(pid&&productMap[pid]){
      productMap[pid].totalQty-=toN(so.qty);
    }
  });

  const rebuildProducts=Object.values(productMap);
  const newCount=rebuildProducts.filter(p=>!existingIds.has(p.id)).length;

  if(newCount===0){
    alert(`診斷：進貨紀錄裡的 ${rebuildProducts.length} 個產品，系統裡都已經存在了。\n\n所以不需要重建。如果庫存盤點還是空白，請強制重新整理（Cmd+Shift+R）看看。`);
    return;
  }

  if(!confirm(`即將從進貨紀錄重建產品和庫存：\n\n• 進貨中的產品總數：${rebuildProducts.length} 種\n• 系統現有：${existingProducts.length} 種\n• 需要補回：${newCount} 種\n\n重建方式：\n- 產品名稱、類別、廠商 → 從進貨紀錄取得\n- 庫存數量 → 進貨總量 減 出貨耗用量\n- 平均成本 → 進貨總成本 ÷ 進貨總量\n\n（已存在的產品不會被覆蓋）\n\n確定要重建嗎？`))return;

  setSyncing('syncing');
  try{
    // 合併：保留現有產品，補上缺的
    const mergedProducts=[...existingProducts];
    const mergedInventory=[...(S.data.inventory||[])];
    const existInvIds=new Set(mergedInventory.map(i=>i.productId));

    rebuildProducts.forEach(rp=>{
      const avgCost=rp.totalQty>0?Math.round(rp.totalCost/(rp.totalQty+ (stockOuts.filter(s=>s.productId===rp.id).reduce((a,s)=>a+toN(s.qty),0)) )):rp.lastUnitCost;
      // 補產品
      if(!existingIds.has(rp.id)){
        mergedProducts.push({
          id:rp.id,
          name:rp.name,
          category:rp.category,
          supplier:rp.supplier,
          series:rp.series,
          price:0,  // 售價進貨紀錄沒有，先設0，之後手動補
          cost:rp.lastUnitCost||avgCost
        });
      }
      // 補庫存
      if(!existInvIds.has(rp.id)){
        mergedInventory.push({
          productId:rp.id,
          qty:Math.max(0,rp.totalQty),
          minQty:1,
          avgCost:rp.lastUnitCost||avgCost,
          totalPurchaseCost:rp.totalCost
        });
      }
    });

    await saveMain({products:mergedProducts,inventory:mergedInventory});
    setSyncing('synced');
    alert(`✅ 重建完成！\n\n• 產品清單：現在有 ${mergedProducts.length} 種\n• 庫存紀錄：現在有 ${mergedInventory.length} 筆\n\n請到「庫存盤點」查看。\n\n注意：重建的產品「售價」會是 0，請到產品清單手動補上售價。庫存數量是用「進貨減出貨」算的，如果之前有手動調整過庫存，可能要再核對一下。`);
    render();
  }catch(err){
    setSyncing('error');
    console.error('重建庫存失敗',err);
    alert('重建失敗：'+(err.message||err));
  }
};

window.depositHealthCheck=async()=>{
  const deposits=S.data.deposits||[];
  const sales=S.data.sales||[];
  const customers=S.data.customers||[];
  const cashFlow=S.data.cashFlow||[];

  // 1. 基本數字
  const totalFaceAmount=deposits.reduce((s,d)=>s+toN(d.amount),0);
  const totalCashReceived=deposits.reduce((s,d)=>s+toN(d.actualReceived||d.amount),0);
  const totalDiscount=totalFaceAmount-totalCashReceived;

  // 2. 已使用的儲值（從 sales 統計）
  const depositSales=sales.filter(s=>s.payMethod==='儲值扣款');
  const totalUsed=depositSales.reduce((s,r)=>s+toN(r.depositFaceAmount||r.amount),0);

  // 3. 理論餘額 = 累計儲值 - 累計扣款
  const theoreticalBalance=totalFaceAmount-totalUsed;

  // 4. 系統顯示的負債餘額（透過每個客戶加總）
  const systemDisplayBalance=getTotalDepositLiability();

  // 5. 差異
  const diff=theoreticalBalance-systemDisplayBalance;

  // 6. 各客戶餘額明細
  const custBalances={};
  deposits.forEach(d=>{
    const name=(d.customer||'').trim();
    if(!name)return;
    custBalances[name]=(custBalances[name]||0)+toN(d.amount);
  });
  depositSales.forEach(s=>{
    const owner=((s.depositOwner||s.customer)||'').trim();
    if(!owner)return;
    custBalances[owner]=(custBalances[owner]||0)-toN(s.depositFaceAmount||s.amount);
  });

  // 7. 偵測問題
  const issues=[];

  // 問題 A：負餘額（扣超過儲值）
  const negativeBalances=Object.entries(custBalances).filter(([n,b])=>b<-1);// 容許 $1 誤差
  if(negativeBalances.length>0){
    issues.push({
      type:'negative',
      severity:'high',
      title:`${negativeBalances.length} 位客戶餘額為負`,
      detail:negativeBalances.map(([n,b])=>`• ${n}: $${fmt(b)}`).join('\n'),
      action:'這代表扣款超過儲值。請檢查是否誤扣，或補登儲值紀錄。'
    });
  }

  // 問題 B：無歸屬扣款（payMethod=儲值扣款 但無 customer 或 depositOwner）
  const orphanedSales=depositSales.filter(s=>{
    const owner=((s.depositOwner||s.customer)||'').trim();
    return !owner;
  });
  if(orphanedSales.length>0){
    issues.push({
      type:'orphan_sale',
      severity:'high',
      title:`${orphanedSales.length} 筆儲值扣款沒有歸屬客戶`,
      detail:orphanedSales.slice(0,5).map(s=>`• ${s.date} $${fmt(s.amount)} - ${s.serviceName||'未填'}`).join('\n')+(orphanedSales.length>5?`\n... 還有 ${orphanedSales.length-5} 筆`:''),
      action:'這些扣款沒有從任何客戶餘額扣，會造成系統負債餘額虛高。需要編輯這些銷售紀錄，指定客戶。'
    });
  }

  // 問題 C：儲值客戶不存在於客戶名單
  const depositCustomers=new Set(deposits.map(d=>(d.customer||'').trim()).filter(n=>n));
  const customerNames=new Set(customers.map(c=>(c.name||'').trim()).filter(n=>n));
  const ghostCustomers=Array.from(depositCustomers).filter(n=>!customerNames.has(n));
  if(ghostCustomers.length>0){
    issues.push({
      type:'ghost',
      severity:'low',
      title:`${ghostCustomers.length} 位儲值客戶未正式建檔`,
      detail:ghostCustomers.map(n=>`• ${n}`).join('\n'),
      action:'這些客戶有儲值但沒在「客戶管理」建檔。不影響餘額計算，建議到客戶管理頁正式建檔。'
    });
  }

  // 問題 D：deposit 缺 actualReceived（無法計算折扣率）
  const missingActual=deposits.filter(d=>!toN(d.actualReceived)&&toN(d.amount)>0);
  if(missingActual.length>0){
    issues.push({
      type:'missing_cash',
      severity:'medium',
      title:`${missingActual.length} 筆儲值未填「實收金額」`,
      detail:missingActual.slice(0,5).map(d=>`• ${d.date} ${d.customer} 面額 $${fmt(d.amount)}`).join('\n')+(missingActual.length>5?`\n... 還有 ${missingActual.length-5} 筆`:''),
      action:'未填實收金額會導致折扣率無法計算（預設 100% 無折扣）。請編輯這些紀錄補填。'
    });
  }

  // 問題 E：系統餘額 vs 理論餘額不一致
  if(Math.abs(diff)>1){
    issues.push({
      type:'balance_mismatch',
      severity:'high',
      title:`總負債餘額不一致（差 $${fmt(Math.abs(diff))}）`,
      detail:`理論餘額（總儲值面額 - 總使用面額）= $${fmt(theoreticalBalance)}\n系統顯示負債餘額 = $${fmt(systemDisplayBalance)}\n差距 = $${fmt(diff)}`,
      action:diff>0?'系統顯示餘額比理論少（可能有客戶被刪除但儲值還在計算中，或有歸屬錯誤）':'系統顯示餘額比理論多（可能有重複的儲值紀錄）'
    });
  }

  // 問題 F：儲值有對應的現金流嗎？
  const depositsWithoutFlow=deposits.filter(d=>{
    if(!toN(d.actualReceived))return false;// 沒實收金額不需要現金流
    const hasFlow=cashFlow.some(f=>f.depositRefId===d.id||(f.note||'').includes(`儲值-${d.customer}`));
    return !hasFlow;
  });
  if(depositsWithoutFlow.length>0&&depositsWithoutFlow.length<deposits.length){// 全部沒有就不是 bug
    issues.push({
      type:'no_cashflow',
      severity:'low',
      title:`${depositsWithoutFlow.length} 筆儲值沒有對應現金流紀錄`,
      detail:depositsWithoutFlow.slice(0,3).map(d=>`• ${d.date} ${d.customer} $${fmt(d.actualReceived)}`).join('\n'),
      action:'這些儲值收到的錢沒寫入現金流水帳，會影響現金流分析。可手動補登或從現金流頁面新增。'
    });
  }

  // 顯示報告
  const reportHTML=`<div class="mttl">🩺 儲值資料健檢報告</div>
    <div style="max-height:60vh;overflow-y:auto;padding:4px;">

      <!-- 一、總覽 -->
      <div style="background:linear-gradient(135deg,var(--goldL),#fff);padding:14px;border-radius:8px;margin-bottom:14px;">
        <div style="font-weight:700;color:var(--gold);margin-bottom:10px;font-size:15px;">📊 整體儲值狀況</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;font-size:13px;">
          <div style="background:#fff;padding:8px 10px;border-radius:6px;">
            <div class="tm" style="font-size:11px;">儲值筆數</div>
            <div style="font-weight:700;color:var(--gold);font-size:16px;">${deposits.length} 筆</div>
          </div>
          <div style="background:#fff;padding:8px 10px;border-radius:6px;">
            <div class="tm" style="font-size:11px;">累計儲值面額</div>
            <div style="font-weight:700;color:var(--rose);font-size:16px;">$${fmt(totalFaceAmount)}</div>
          </div>
          <div style="background:#fff;padding:8px 10px;border-radius:6px;">
            <div class="tm" style="font-size:11px;">累計實收現金</div>
            <div style="font-weight:700;color:var(--grn);font-size:16px;">$${fmt(totalCashReceived)}</div>
          </div>
          <div style="background:#fff;padding:8px 10px;border-radius:6px;">
            <div class="tm" style="font-size:11px;">累計折扣讓利</div>
            <div style="font-weight:700;color:var(--red);font-size:16px;">$${fmt(totalDiscount)}</div>
          </div>
          <div style="background:#fff;padding:8px 10px;border-radius:6px;">
            <div class="tm" style="font-size:11px;">已使用面額</div>
            <div style="font-weight:700;color:var(--blu);font-size:16px;">$${fmt(totalUsed)}</div>
          </div>
          <div style="background:#fff;padding:8px 10px;border-radius:6px;">
            <div class="tm" style="font-size:11px;">剩餘負債</div>
            <div style="font-weight:700;color:var(--pur);font-size:16px;">$${fmt(systemDisplayBalance)}</div>
          </div>
        </div>
        <div style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--bdr);font-size:12px;color:var(--mut);">
          理論餘額：$${fmt(theoreticalBalance)}（總儲值 $${fmt(totalFaceAmount)} - 已使用 $${fmt(totalUsed)}）<br>
          系統顯示：$${fmt(systemDisplayBalance)}<br>
          差距：${Math.abs(diff)<=1?'<b style="color:var(--grn);">✅ 一致</b>':`<b style="color:var(--red);">⚠️ $${fmt(Math.abs(diff))}</b>`}
        </div>
      </div>

      <!-- 二、客戶餘額明細 -->
      <div style="margin-bottom:14px;">
        <div style="font-weight:700;color:var(--pur);margin-bottom:8px;font-size:14px;">📋 各客戶儲值餘額明細</div>
        <div style="background:var(--bg2);border-radius:8px;padding:8px;">
          ${Object.entries(custBalances).filter(([n,b])=>b!==0).sort((a,b)=>b[1]-a[1]).map(([n,b])=>{
            const color=b<0?'var(--red)':b===0?'var(--mut)':'var(--gold)';
            return`<div style="display:flex;justify-content:space-between;padding:4px 8px;border-bottom:1px solid var(--bdr);font-size:13px;">
              <span>${n}</span>
              <b style="color:${color};">$${fmt(b)}</b>
            </div>`;
          }).join('')}
        </div>
      </div>

      <!-- 三、發現的問題 -->
      ${issues.length===0?`<div style="background:var(--grnL);padding:14px;border-radius:8px;border-left:4px solid var(--grn);text-align:center;">
        <div style="font-size:30px;margin-bottom:6px;">✅</div>
        <div style="font-weight:700;color:var(--grn);font-size:15px;">資料完美！沒發現任何問題</div>
        <div class="tm" style="font-size:12px;margin-top:4px;">所有儲值的扣款、餘額、客戶歸屬都正確</div>
      </div>`:`<div>
        <div style="font-weight:700;color:var(--red);margin-bottom:8px;font-size:14px;">⚠️ 發現 ${issues.length} 個需要注意的問題</div>
        ${issues.map((iss,i)=>{
          const color=iss.severity==='high'?'var(--red)':iss.severity==='medium'?'#d97706':'var(--blu)';
          const bg=iss.severity==='high'?'var(--redL)':iss.severity==='medium'?'#fef3c7':'var(--bluL)';
          const emoji=iss.severity==='high'?'🔴':iss.severity==='medium'?'🟡':'🔵';
          return`<div style="border-left:3px solid ${color};background:${bg};padding:10px 12px;border-radius:6px;margin-bottom:8px;">
            <div style="font-weight:700;color:${color};font-size:13px;">${emoji} ${iss.title}</div>
            <pre style="margin:6px 0;padding:6px;background:#fff;border-radius:4px;font-size:11px;white-space:pre-wrap;font-family:inherit;color:var(--txt);">${iss.detail}</pre>
            <div style="font-size:12px;color:var(--txt);"><b>💡 建議：</b>${iss.action}</div>
          </div>`;
        }).join('')}
      </div>`}
    </div>
    <div class="mbtns"><button class="btn btn-p" onclick="closeMod()">關閉</button></div>`;

  // 把 HTML 包裝在 S.modal 裡
  S.modal={t:'depositHealthReport',html:reportHTML};
  const bg=$('modal-bg'),inn=$('modal-inner');
  if(bg&&inn){
    inn.innerHTML=reportHTML;
    bg.className='modal-bg open';
    inn.className='modal lg';
  }
};

// ─── 找出重複的進貨紀錄 ───
window.findDuplicatePurchases=async()=>{
  const purchases=S.data.purchases||[];
  // 用「日期+產品名+金額+數量」做指紋，找出重複
  const groups={};
  purchases.forEach(p=>{
    const fp=`${p.date||''}_${(p.productName||'').trim()}_${p.qty||0}_${p.totalCost||0}`;
    if(!groups[fp])groups[fp]=[];
    groups[fp].push(p);
  });
  const dupGroups=Object.entries(groups).filter(([_,arr])=>arr.length>1);
  if(dupGroups.length===0){
    alert('✅ 沒有發現重複的進貨紀錄，資料是乾淨的！');
    return;
  }
  // 統計
  const totalDups=dupGroups.reduce((s,[_,arr])=>s+(arr.length-1),0);
  const dupAmount=dupGroups.reduce((s,[_,arr])=>{
    return s+arr.slice(1).reduce((ss,p)=>ss+toN(p.totalCost),0);
  },0);
  // 顯示報告
  const html=`<div class="mttl">🔍 重複進貨檢測報告</div>
    <div style="max-height:60vh;overflow-y:auto;padding:4px;">
      <div style="background:var(--redL);padding:12px;border-radius:8px;border-left:4px solid var(--red);margin-bottom:14px;">
        <div style="font-weight:700;color:var(--red);font-size:15px;">⚠️ 發現 ${dupGroups.length} 組重複進貨</div>
        <div style="font-size:13px;margin-top:6px;color:var(--txt);">
          • 共 <b>${totalDups}</b> 筆多餘紀錄<br>
          • 金額重複合計 <b>$${fmt(dupAmount)}</b><br>
          • 建議：保留每組第一筆，刪除其餘
        </div>
      </div>

      ${dupGroups.map(([fp,arr],i)=>{
        const sample=arr[0];
        return`<div style="border:1px solid var(--bdr);border-radius:8px;padding:10px 12px;margin-bottom:10px;">
          <div style="font-weight:700;color:var(--pur);font-size:14px;margin-bottom:8px;">
            🔁 第 ${i+1} 組：${sample.productName||'未填'} （${sample.date}）
            <span class="bdg" style="background:var(--red);color:#fff;">${arr.length} 筆</span>
          </div>
          <div style="font-size:12px;color:var(--mut);margin-bottom:8px;">
            數量 ${sample.qty} × $${fmt(sample.unitCost)} = $${fmt(sample.totalCost)}
          </div>
          <div style="background:var(--bg2);padding:8px;border-radius:6px;font-size:12px;">
            ${arr.map((p,idx)=>{
              const isPaid=p.paid||p.paidToExpense;
              const isKeep=idx===0;
              return`<div style="padding:6px 8px;background:${isKeep?'var(--grnL)':'var(--redL)'};border-radius:4px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
                <div>
                  <b style="color:${isKeep?'var(--grn)':'var(--red)'};">${isKeep?'✓ 保留':'✗ 建議刪除'}</b>
                  <span style="font-family:monospace;font-size:10px;color:var(--mut);">　ID:${(p.id||'').substring(0,8)}</span>
                  ${isPaid?`<span class="bdg" style="background:var(--grn);color:#fff;font-size:10px;">已付款 ${p.paidDate||''}</span>`:'<span class="bdg" style="background:#aaa;color:#fff;font-size:10px;">未付款</span>'}
                </div>
                ${!isKeep?`<button class="btn btn-sm" style="background:var(--red);color:#fff;font-size:11px;padding:2px 8px;" onclick="deleteDupePurchase('${p.id}')">🗑️ 刪除這筆</button>`:''}
              </div>`;
            }).join('')}
          </div>
        </div>`;
      }).join('')}

      <div style="margin-top:14px;padding:12px;background:var(--bluL);border-radius:8px;border-left:4px solid var(--blu);font-size:13px;color:var(--blu);">
        💡 <b>建議操作步驟：</b><br>
        1. 上方每組保留<b>第一筆（綠色）</b>，刪除<b>其餘（紅色）</b><br>
        2. 點各筆右側「🗑️ 刪除這筆」按鈕逐筆清理<br>
        3. 或下方一鍵清除全部重複（保留每組第一筆）
      </div>
    </div>
    <div class="mbtns">
      <button class="btn btn-s" onclick="closeMod()">關閉</button>
      <button class="btn" style="background:var(--red);color:#fff;" onclick="cleanupAllDuplicatePurchases()">🧹 一鍵清除全部重複</button>
    </div>`;

  S.modal={t:'duplicatePurchaseReport',html};
  const bg=$('modal-bg'),inn=$('modal-inner');
  if(bg&&inn){
    inn.innerHTML=html;
    bg.className='modal-bg open';
    inn.className='modal lg';
  }
};

// 刪除單筆重複進貨（不還原庫存，因為已經是重複輸入的）
window.deleteDupePurchase=async(id)=>{
  if(!confirm('確認刪除這筆重複的進貨？\n\n注意：不會還原庫存（因為這是重複輸入的多餘紀錄，原本就不該存在）\n但會刪除對應的支出和現金流。'))return;
  const p=(S.data.purchases||[]).find(x=>x.id===id);
  if(!p)return;
  // 刪除對應的支出（如果有）
  if(p.expenseId){
    try{await delSub('expenses',p.expenseId);}catch(e){console.warn(e);}
  }
  const exps=(S.data.expenses||[]).filter(e=>(e.fromPurchase||e.fromPurchaseId)&&(e.purchaseRefId===id||e.fromPurchaseId===id));
  for(const e of exps){try{await delSub('expenses',e.id);}catch(err){console.warn(err);}}
  // 刪除對應的現金流（如果有）
  if(p.cashFlowId){
    try{await delSub('cashFlow',p.cashFlowId);}catch(e){console.warn(e);}
  }
  const flows=(S.data.cashFlow||[]).filter(f=>(f.fromPurchase||f.fromPurchaseId)&&(f.purchaseRefId===id||f.fromPurchaseId===id));
  for(const f of flows){try{await delSub('cashFlow',f.id);}catch(err){console.warn(err);}}
  // 還要扣減被多算的庫存
  if(p.productId){
    try{
      const inv=getInv(p.productId);
      const newQty=Math.max(0,toN(inv.qty)-toN(p.qty));
      const newInv=[...(S.data.inventory||[]).filter(i=>i.productId!==p.productId),{...inv,productId:p.productId,qty:newQty}];
      await saveMain({inventory:newInv});
    }catch(e){console.warn(e);}
  }
  // 刪除進貨紀錄本身
  await delSub('purchases',id);
  toast(`✅ 已刪除重複進貨，並扣減重複的庫存 ${p.qty} 個`);
  // 重新打開檢測報告
  setTimeout(()=>{findDuplicatePurchases();},500);
};

// 一鍵清除所有重複
window.cleanupAllDuplicatePurchases=async()=>{
  const purchases=S.data.purchases||[];
  const groups={};
  purchases.forEach(p=>{
    const fp=`${p.date||''}_${(p.productName||'').trim()}_${p.qty||0}_${p.totalCost||0}`;
    if(!groups[fp])groups[fp]=[];
    groups[fp].push(p);
  });
  const toDelete=[];
  Object.values(groups).forEach(arr=>{
    if(arr.length>1)toDelete.push(...arr.slice(1));// 保留第一筆
  });
  if(toDelete.length===0){alert('沒有需要清除的重複資料');return;}
  if(!confirm(`⚠️ 確認一鍵清除？\n\n將刪除 ${toDelete.length} 筆重複進貨，並：\n• 刪除對應的支出/現金流紀錄\n• 扣減重複多算的庫存\n\n此操作無法復原！`))return;
  // 統計庫存調整
  const invAdj={};
  for(const p of toDelete){
    if(p.productId){
      invAdj[p.productId]=(invAdj[p.productId]||0)+toN(p.qty);
    }
    // 刪除對應的支出
    if(p.expenseId){try{await delSub('expenses',p.expenseId);}catch(e){console.warn(e);}}
    const exps=(S.data.expenses||[]).filter(e=>(e.fromPurchase||e.fromPurchaseId)&&(e.purchaseRefId===p.id||e.fromPurchaseId===p.id));
    for(const e of exps){try{await delSub('expenses',e.id);}catch(err){console.warn(err);}}
    // 刪除對應的現金流
    if(p.cashFlowId){try{await delSub('cashFlow',p.cashFlowId);}catch(e){console.warn(e);}}
    const flows=(S.data.cashFlow||[]).filter(f=>(f.fromPurchase||f.fromPurchaseId)&&(f.purchaseRefId===p.id||f.fromPurchaseId===p.id));
    for(const f of flows){try{await delSub('cashFlow',f.id);}catch(err){console.warn(err);}}
    // 刪除進貨本身
    try{await delSub('purchases',p.id);}catch(e){console.warn(e);}
  }
  // 統一扣減庫存
  let newInv=[...(S.data.inventory||[])];
  Object.entries(invAdj).forEach(([pid,qty])=>{
    const inv=newInv.find(i=>i.productId===pid)||{productId:pid,qty:0};
    const newQty=Math.max(0,toN(inv.qty)-qty);
    newInv=newInv.filter(i=>i.productId!==pid);
    newInv.push({...inv,productId:pid,qty:newQty});
  });
  await saveMain({inventory:newInv});
  toast(`✅ 已清除 ${toDelete.length} 筆重複進貨並調整庫存`);
  closeMod();
  render();
};

// 一鍵修正所有名稱不一致的進貨紀錄
window.fixProductNameMismatches=async()=>{
  const purchases=S.data.purchases||[];
  const products=S.data.products||[];
  const toFix=[];
  purchases.forEach(p=>{
    if(!p.productId)return;
    const realProd=products.find(prod=>prod.id===p.productId);
    if(!realProd)return;
    const recordedName=(p.productName||'').trim();
    const realName=(realProd.name||'').trim();
    if(recordedName!==realName){
      toFix.push({purchase:p,realName,realProd});
    }
  });
  if(toFix.length===0){alert('沒有需要修正的');return;}
  if(!confirm(`確認一鍵修正 ${toFix.length} 筆進貨紀錄的產品名稱？\n\n會將每筆 productName 改為正確的產品名稱。\n庫存、支出、成本不受影響。`))return;
  for(const item of toFix){
    const p=item.purchase;
    try{
      await setSub('purchases',p.id,{...p,productName:item.realName,category:item.realProd.category||p.category});
      // 同時修正對應的支出記帳
      if(p.expenseId){
        const exp=(S.data.expenses||[]).find(e=>e.id===p.expenseId);
        if(exp){
          const newNote=`【進貨】${item.realName}　${p.supplier||''}　數量 ${p.qty||0}`;
          try{await setSub('expenses',p.expenseId,{...exp,note:newNote});}catch(e){console.warn(e);}
        }
      }
      // 同時修正對應的現金流
      if(p.cashFlowId){
        const flow=(S.data.cashFlow||[]).find(f=>f.id===p.cashFlowId);
        if(flow){
          const newNote=`【進貨】${item.realName} × ${p.qty||0}${p.supplier?'（'+p.supplier+'）':''}（${p.payMethod||p.paidMethod||''}）`;
          try{await setSub('cashFlow',p.cashFlowId,{...flow,note:newNote});}catch(e){console.warn(e);}
        }
      }
    }catch(err){console.warn(err);}
  }
  toast(`✅ 已修正 ${toFix.length} 筆進貨紀錄的產品名稱`);
  closeMod();
  render();
};

// ─── 現金水位健檢（公司應有現金分析）───
window.cashLevelHealthCheck=()=>{
  // 取得系統啟用日期（若無則用所有資料）
  const startDateStr=S.data.settings?.cashFlowStartDate||'';
  const startDate=startDateStr?new Date(startDateStr):null;
  const inRange=(dateStr)=>{
    if(!startDate)return true;
    if(!dateStr)return false;
    return new Date(dateStr)>=startDate;
  };
  const sales=(S.data.sales||[]).filter(s=>inRange(s.date));
  const expenses=(S.data.expenses||[]).filter(e=>inRange(e.date));
  const cashFlow=(S.data.cashFlow||[]).filter(c=>inRange(c.date));
  const deposits=(S.data.deposits||[]).filter(d=>inRange(d.date));

  const cashSales=sales.filter(s=>s.payMethod==='現金'||s.payMethod==='轉帳').reduce((s,r)=>s+toN(r.amount),0);
  const depositCash=deposits.reduce((s,d)=>s+toN(d.actualReceived||d.amount),0);
  const otherCashIn=cashFlow.filter(c=>toN(c.amount)>0&&!c.fromPurchase&&!c.depositRefId&&c.cat!=='儲值入帳').reduce((s,c)=>s+toN(c.amount),0);
  const totalCashIn=cashSales+depositCash+otherCashIn;
  const totalCashOut=expenses.reduce((s,e)=>s+toN(e.amount),0);
  const theoreticalBalance=totalCashIn-totalCashOut;
  const totalDepositLiability=getTotalDepositLiability?getTotalDepositLiability():0;

  const rentExp=expenses.filter(e=>e.category==='房租').reduce((s,e)=>s+toN(e.amount),0);
  const utilExp=expenses.filter(e=>e.category==='水電').reduce((s,e)=>s+toN(e.amount),0);
  let monthCount=1;
  if(startDate){
    const now=new Date();
    monthCount=Math.max(1,(now.getFullYear()-startDate.getFullYear())*12+now.getMonth()-startDate.getMonth()+1);
  }else{
    const allDates=[...sales,...expenses].map(x=>x.date).filter(d=>d);
    if(allDates.length>0){
      const dates=allDates.map(d=>new Date(d)).filter(d=>!isNaN(d));
      if(dates.length>0){
        const min=new Date(Math.min(...dates));
        const max=new Date(Math.max(...dates));
        monthCount=Math.max(1,(max.getFullYear()-min.getFullYear())*12+max.getMonth()-min.getMonth()+1);
      }
    }
  }
  const avgRent=monthCount>0?rentExp/monthCount:0;
  const avgUtil=monthCount>0?utilExp/monthCount:0;
  const monthlyFixed=avgRent+avgUtil;
  const minSafe=monthlyFixed*1;
  const warnSafe=monthlyFixed*3;
  const healthSafe=monthlyFixed*6;
  const finalMin=minSafe+totalDepositLiability;
  const finalWarn=warnSafe+totalDepositLiability;
  const finalHealth=healthSafe+totalDepositLiability;

  const html=`<div class="mttl">💰 沐蜜帳戶應有現金健檢</div>
    <div style="max-height:65vh;overflow-y:auto;padding:4px;">
      ${startDateStr?`<div style="background:var(--bluL);padding:10px 12px;border-radius:6px;margin-bottom:12px;font-size:12px;color:var(--blu);">
        📅 統計範圍：<b>${startDateStr}</b> 起算（${monthCount} 個月）— 已排除啟用前的舊資料
      </div>`:`<div style="background:#fef3c7;padding:10px 12px;border-radius:6px;margin-bottom:12px;font-size:12px;color:#92400e;">
        ⚠️ 尚未設定系統啟用日期，目前統計所有歷史資料（${monthCount} 個月）<br>
        建議到「🏦 現金流水帳」頁設定起算日（例如 2026-04-01）
      </div>`}
      <div style="background:linear-gradient(135deg,var(--bluL),#fff);padding:14px;border-radius:8px;margin-bottom:14px;border-left:4px solid var(--blu);">
        <div style="font-weight:700;color:var(--blu);font-size:15px;margin-bottom:10px;">📊 理論帳戶餘額計算</div>
        <div style="font-size:13px;line-height:2;">
          📥 累計現金流入：<b style="color:var(--grn);">$${fmt(totalCashIn)}</b><br>
          &nbsp;&nbsp;&nbsp;• 現金/轉帳銷售：$${fmt(cashSales)}<br>
          &nbsp;&nbsp;&nbsp;• 儲值實收現金：$${fmt(depositCash)}<br>
          &nbsp;&nbsp;&nbsp;• 其他收入：$${fmt(otherCashIn)}<br>
          📤 累計支出：<b style="color:var(--red);">−$${fmt(totalCashOut)}</b><br>
          ─────────────<br>
          💼 帳上理論現金：<b style="color:${theoreticalBalance>=0?'var(--grn)':'var(--red)'};font-size:18px;">$${fmt(theoreticalBalance)}</b>
        </div>
      </div>
      ${totalDepositLiability>0?`<div style="background:var(--redL);padding:14px;border-radius:8px;margin-bottom:14px;border-left:4px solid var(--red);">
        <div style="font-weight:700;color:var(--red);font-size:15px;margin-bottom:8px;">⚠️ 客戶儲值負債</div>
        <div style="font-size:13px;line-height:1.8;">
          客戶儲值但尚未消費的面額：<b style="color:var(--red);font-size:16px;">$${fmt(totalDepositLiability)}</b><br>
          <span class="tm">這是客戶「借給你的錢」，客戶要退費時必須能立刻拿出來！</span>
        </div>
      </div>`:''}
      <div style="margin-bottom:14px;">
        <div style="font-weight:700;color:var(--pur);font-size:15px;margin-bottom:10px;">🎯 沐蜜帳戶應該有多少錢？</div>
        <div style="display:grid;gap:8px;">
          <div style="background:var(--redL);padding:12px;border-radius:8px;border-left:4px solid var(--red);">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <span style="font-weight:700;color:var(--red);">🚨 緊急水位</span>
              <b style="color:var(--red);font-size:18px;">$${fmt(finalMin)}</b>
            </div>
            <div class="tm" style="font-size:12px;margin-top:4px;">
              1 個月固定費用 $${fmt(monthlyFixed)} + 儲值負債 $${fmt(totalDepositLiability)}
            </div>
          </div>
          <div style="background:#fef3c7;padding:12px;border-radius:8px;border-left:4px solid #d97706;">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <span style="font-weight:700;color:#92400e;">⚠️ 警戒水位</span>
              <b style="color:#92400e;font-size:18px;">$${fmt(finalWarn)}</b>
            </div>
            <div class="tm" style="font-size:12px;margin-top:4px;">
              3 個月固定費用 $${fmt(monthlyFixed*3)} + 儲值負債 $${fmt(totalDepositLiability)}
            </div>
          </div>
          <div style="background:var(--grnL);padding:12px;border-radius:8px;border-left:4px solid var(--grn);">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <span style="font-weight:700;color:var(--grn);">🟢 健康水位（推薦）</span>
              <b style="color:var(--grn);font-size:18px;">$${fmt(finalHealth)}</b>
            </div>
            <div class="tm" style="font-size:12px;margin-top:4px;">
              6 個月固定費用 $${fmt(monthlyFixed*6)} + 儲值負債 $${fmt(totalDepositLiability)}
            </div>
          </div>
        </div>
      </div>
      <div class="tm" style="font-size:11px;margin-top:10px;color:var(--mut);padding:8px;background:var(--bg2);border-radius:6px;">
        📐 計算依據：<br>
        • 統計期間：${monthCount} 個月（${startDateStr||'全部歷史資料'}）<br>
        • 平均月房租：$${fmt(avgRent)}<br>
        • 平均月水電：$${fmt(avgUtil)}<br>
        • 固定費用月均：$${fmt(monthlyFixed)}
      </div>
    </div>
    <div class="mbtns"><button class="btn btn-p" onclick="closeMod()">關閉</button></div>`;

  S.modal={t:'cashLevelReport',html};
  const bg=$('modal-bg'),inn=$('modal-inner');
  if(bg&&inn){
    inn.innerHTML=html;
    bg.className='modal-bg open';
    inn.className='modal lg';
  }
};

// 從表單收集規格資料
function collectSpecs(){
  const rows=document.querySelectorAll('#m_prSpecList .spec-row');
  const specs=[];
  rows.forEach(row=>{
    const label=row.querySelector('[data-spec-f="label"]')?.value?.trim();
    const price=parseFloat(row.querySelector('[data-spec-f="price"]')?.value)||0;
    const units=parseFloat(row.querySelector('[data-spec-f="units"]')?.value)||0;
    if(label&&price>0){
      specs.push({label,price,units:units||1});
    }
  });
  // 依「等於幾支」排序（小到大）
  specs.sort((a,b)=>a.units-b.units);
  return specs;
}

// 收集 sharedWith 勾選結果
function collectSharedWith(){
  const checks=document.querySelectorAll('input[name="cu_share"]:checked');
  return Array.from(checks).map(c=>c.value);
}

// 雙向同步共用關係：A 把 B 加進來時，B 那邊也要把 A 加進來
// 名稱比對都用 trim 後的值
function syncSharedTwoWay(customers, myName, mySharedWith){
  const myNameT=(myName||'').trim();
  const mySharedT=new Set((mySharedWith||[]).map(n=>(n||'').trim()).filter(Boolean));
  return customers.map(c=>{
    const cNameT=(c.name||'').trim();
    if(cNameT===myNameT)return c;
    const cShared=Array.isArray(c.sharedWith)?[...c.sharedWith]:[];
    const cSharedT=cShared.map(n=>(n||'').trim());
    const has=cSharedT.includes(myNameT);
    if(mySharedT.has(cNameT)&&!has){
      cShared.push(myNameT);
      return{...c,sharedWith:cShared};
    }else if(!mySharedT.has(cNameT)&&has){
      return{...c,sharedWith:cShared.filter(n=>(n||'').trim()!==myNameT)};
    }
    return c;
  });
}

window.saveCustomer=async()=>{
  try{
    const name=$('m_cu0')?.value?.trim();
    if(!name){alert('請填客戶姓名');return;}
    // 用 trim 後的名稱比對，避免空白問題
    const dup=(S.data.customers||[]).find(c=>(c.name||'').trim()===name);
    if(dup){
      alert(`「${name}」已經建檔過了，請改用編輯功能`);return;
    }
    const sharedWithRaw=collectSharedWith();
    const sharedWith=Array.from(new Set(sharedWithRaw.map(n=>(n||'').trim()).filter(Boolean)));
    let customers=[...(S.data.customers||[])];
    // 主客戶
    customers.push({
      id:uid(),name,
      phone:$('m_cu1')?.value||'',
      birthday:$('m_cu2')?.value||'',
      source:$('m_cu3')?.value||'',
      note:$('m_cu4')?.value||'',
      sharedWith,
      createdAt:today()
    });
    // 自動為勾選的 ghost 共用成員建檔（用 trim 後比對）
    let autoCreated=0;
    for(const sName of sharedWith){
      if(!customers.find(c=>(c.name||'').trim()===sName)){
        customers.push({
          id:uid(),name:sName,
          phone:'',birthday:'',source:'',note:'(由共用儲值自動建檔)',
          sharedWith:[name],
          createdAt:today()
        });
        autoCreated++;
      }
    }
    // 雙向同步
    customers=syncSharedTwoWay(customers,name,sharedWith);
    await saveMain({customers});
    let msg=`✅ ${name} 已建檔`;
    if(sharedWith.length>0)msg+=`（與 ${sharedWith.length} 位共用儲值）`;
    if(autoCreated>0)msg+=`，自動建檔 ${autoCreated} 位共用成員`;
    toast(msg);
    closeMod();
  }catch(err){
    console.error('saveCustomer 失敗:',err);
    alert('建檔失敗：'+(err.message||err));
  }
};

window.updCustomer=async(id)=>{
  try{
    const old=(S.data.customers||[]).find(c=>c.id===id);
    if(!old){alert('找不到客戶');return;}
    const newName=$('m_cu0')?.value?.trim()||(old.name||'').trim();
    if(!newName){alert('客戶姓名不可空白');return;}
    const oldNameT=(old.name||'').trim();
    const sharedWithRaw=collectSharedWith();
    const sharedWith=Array.from(new Set(sharedWithRaw.map(n=>(n||'').trim()).filter(Boolean)));
    // 如果改名了，要把所有別人 sharedWith 中的舊名換成新名
    let customers=(S.data.customers||[]).map(c=>{
      if(c.id===id)return{
        ...c,
        name:newName,
        phone:$('m_cu1')?.value||'',
        birthday:$('m_cu2')?.value||'',
        source:$('m_cu3')?.value||'',
        note:$('m_cu4')?.value||'',
        sharedWith
      };
      if(Array.isArray(c.sharedWith)&&oldNameT!==newName){
        const hasOld=c.sharedWith.some(n=>(n||'').trim()===oldNameT);
        if(hasOld){
          return{...c,sharedWith:c.sharedWith.map(n=>(n||'').trim()===oldNameT?newName:n)};
        }
      }
      return c;
    });
    // 自動為勾選的 ghost 共用成員建檔
    let autoCreated=0;
    for(const sName of sharedWith){
      if(!customers.find(c=>(c.name||'').trim()===sName)){
        customers.push({
          id:uid(),name:sName,
          phone:'',birthday:'',source:'',note:'(由共用儲值自動建檔)',
          sharedWith:[newName],
          createdAt:today()
        });
        autoCreated++;
      }
    }
    // 雙向同步
    customers=syncSharedTwoWay(customers,newName,sharedWith);
    await saveMain({customers});
    let msg='✅ 已更新';
    if(autoCreated>0)msg+=`，自動建檔 ${autoCreated} 位共用成員`;
    toast(msg);
    closeMod();
  }catch(err){
    console.error('updCustomer 失敗:',err);
    alert('更新失敗：'+(err.message||err));
  }
};

window.saveBatchEditProducts=async()=>{
  try{
    const rows=document.querySelectorAll('tr[data-pid]');
    if(rows.length===0){alert('沒有可儲存的資料');return;}
    let updated=0;
    const newProds=(S.data.products||[]).map(p=>p);  // copy
    rows.forEach(row=>{
      const pid=row.dataset.pid;
      const cat=row.querySelector('.bep_cat')?.value;
      const supSel=row.querySelector('.bep_sup')?.value;
      const supC=row.querySelector('.bep_supC')?.value?.trim()||'';
      const series=row.querySelector('.bep_series')?.value?.trim()||'';
      const supplier=supSel==='__custom__'?supC:(supSel||'');
      const idx=newProds.findIndex(p=>p.id===pid);
      if(idx<0)return;
      const old=newProds[idx];
      if(old.category!==cat||old.supplier!==supplier||old.series!==series){
        newProds[idx]={...old,category:cat,supplier,series};
        updated++;
      }
    });
    if(updated===0){toast('沒有變更');closeMod();return;}
    await saveMain({products:newProds});
    toast(`✅ 已更新 ${updated} 項產品`);
    closeMod();
  }catch(err){
    console.error('saveBatchEditProducts 失敗:',err);
    alert('失敗：'+(err.message||err));
  }
};

window.batchSetCommission=async()=>{
  try{
    const rate=parseFloat($('m_bc_rate')?.value)/100;
    const base=$('m_bc_base')?.value||'face';
    if(isNaN(rate)||rate<0||rate>1){alert('抽成率必須在 0~100 之間');return;}
    const targets=(S.data.sales||[]).filter(s=>s.commissionRate===undefined);
    if(targets.length===0){alert('沒有需要設定的紀錄');return;}
    if(!confirm(`確認為 ${targets.length} 筆紀錄套用：\n抽成率 ${Math.round(rate*100)}%\n基準：${base==='face'?'原價面額':'認列營收'}`))return;
    let done=0;
    for(const s of targets){
      try{
        const updated={...s,commissionRate:rate,commissionBase:base};
        await setSub('sales',s.id,updated);
        done++;
      }catch(e){console.warn('更新失敗',s.id,e);}
    }
    toast(`✅ 已為 ${done} 筆紀錄套用抽成設定`);
    closeMod();
  }catch(err){
    console.error('batchSetCommission 失敗:',err);
    alert('失敗：'+(err.message||err));
  }
};

window.repairCustomerNames=async()=>{
  if(!confirm('確認執行資料修復？\n\n會把所有客戶、銷售紀錄、儲值紀錄中的姓名空白清除，並合併重複的客戶。\n\n此操作不會刪除任何資料。'))return;
  let fixedCustomers=0,fixedSales=0,fixedDeposits=0,mergedDup=0;
  // 1. 清理 customers 名稱、合併重複（用 trim 後的名字當 key）
  const customerMap=new Map();  // trim名 -> 客戶記錄
  (S.data.customers||[]).forEach(c=>{
    const newName=(c.name||'').trim().replace(/[\u3000\s]+/g,'');
    if(!newName)return;
    if((c.name||'')!==newName)fixedCustomers++;
    if(customerMap.has(newName)){
      // 合併：把 sharedWith 合併
      const existed=customerMap.get(newName);
      const merged=new Set([...(existed.sharedWith||[]),...(c.sharedWith||[])]);
      existed.sharedWith=Array.from(merged).map(n=>(n||'').trim().replace(/[\u3000\s]+/g,'')).filter(Boolean);
      mergedDup++;
    }else{
      customerMap.set(newName,{
        ...c,
        name:newName,
        sharedWith:Array.isArray(c.sharedWith)
          ?Array.from(new Set(c.sharedWith.map(n=>(n||'').trim().replace(/[\u3000\s]+/g,'')).filter(Boolean)))
          :[]
      });
    }
  });
  const newCustomers=Array.from(customerMap.values());
  // 2. 清理 sales 中的 customer 欄位 + depositOwner
  const cleanedSales=(S.data.sales||[]).map(s=>{
    const newCustomer=(s.customer||'').trim().replace(/[\u3000\s]+/g,'');
    const newOwner=(s.depositOwner||'').trim().replace(/[\u3000\s]+/g,'');
    if(s.customer!==newCustomer||s.depositOwner!==newOwner)fixedSales++;
    return{...s,customer:newCustomer,depositOwner:newOwner||undefined};
  });
  // 3. 清理 deposits
  const cleanedDeposits=(S.data.deposits||[]).map(d=>{
    const newCustomer=(d.customer||'').trim().replace(/[\u3000\s]+/g,'');
    if(d.customer!==newCustomer)fixedDeposits++;
    return{...d,customer:newCustomer};
  });
  // 寫回
  try{
    await saveMain({customers:newCustomers});
    // 寫回 sales
    for(const s of cleanedSales){
      await setSub('sales',s.id,s);
    }
    for(const d of cleanedDeposits){
      await setSub('deposits',d.id,d);
    }
    alert(`✅ 修復完成！\n\n• 客戶名稱清理：${fixedCustomers} 筆\n• 銷售紀錄清理：${fixedSales} 筆\n• 儲值紀錄清理：${fixedDeposits} 筆\n• 合併重複客戶：${mergedDup} 筆`);
  }catch(err){
    console.error('repair 失敗:',err);
    alert('修復失敗：'+(err.message||err));
  }
};

// ── 修復「儲值扣款」舊紀錄的 depositFaceAmount 欄位 ──
// 問題：舊紀錄只存了 amount（折扣後營收），沒存 depositFaceAmount（面額）
// 修復：找出每筆儲值扣款，用同期儲值的折扣率反推面額
window.repairDepositFaceAmount=async()=>{
  const sales=S.data.sales||[];
  const targets=sales.filter(s=>s.payMethod==='儲值扣款'&&!s.depositFaceAmount);
  if(targets.length===0){alert('沒有需要修復的紀錄');return;}
  // 預覽
  let preview=`找到 ${targets.length} 筆「儲值扣款」紀錄沒有面額資料。\n\n會用客戶當時的折扣率反推面額：\n面額 = 認列營收 ÷ 折扣率\n\n範例（前 5 筆）：\n`;
  for(let i=0;i<Math.min(5,targets.length);i++){
    const s=targets[i];
    const owner=(s.depositOwner||s.customer||'').trim();
    // 找該客戶在 s.date 之前最近一次儲值的折扣率
    const rate=findHistoricalDiscountRate(owner,s.date);
    const facade=Math.round(toN(s.amount)/rate);
    preview+=`• ${s.date} ${s.item} ${owner}：認列 $${fmt(s.amount)} ÷ ${(rate*10).toFixed(1)}折 = 面額 $${fmt(facade)}\n`;
  }
  preview+=`\n確認執行？`;
  if(!confirm(preview))return;
  let fixed=0;
  for(const s of targets){
    const owner=(s.depositOwner||s.customer||'').trim();
    const rate=findHistoricalDiscountRate(owner,s.date);
    const facade=Math.round(toN(s.amount)/rate);
    try{
      await setSub('sales',s.id,{...s,depositFaceAmount:facade});
      fixed++;
    }catch(e){console.warn('修復失敗:',s.id,e);}
  }
  alert(`✅ 完成！修復 ${fixed} 筆儲值扣款紀錄的面額`);
};

// 找客戶在指定日期「之前或當天」最近一次儲值的折扣率
function findHistoricalDiscountRate(custName,saleDate){
  if(!custName)return 1;
  const group=getSharedGroup(custName).map(n=>(n||'').trim());
  const deposits=(S.data.deposits||[])
    .filter(d=>group.includes((d.customer||'').trim()))
    .filter(d=>(d.date||'')<=saleDate)
    .filter(d=>toN(d.actualReceived)>0&&toN(d.amount)>0)
    .sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  if(deposits.length===0)return 1;
  const rate=toN(deposits[0].actualReceived)/toN(deposits[0].amount);
  return rate>0&&rate<=1?rate:1;
}

// 刪除「未建檔」客戶（同時刪除所有相關銷售與儲值紀錄）
window.delGhostCustomer=async(name)=>{
  if(!name)return;
  const sales=(S.data.sales||[]).filter(s=>s.customer===name);
  const deposits=(S.data.deposits||[]).filter(d=>d.customer===name);
  const totalRecords=sales.length+deposits.length;
  if(totalRecords===0){toast('沒有要刪除的紀錄');return;}
  if(!confirm(`⚠️ 確認從紀錄中清除「${name}」？\n\n會一併刪除：\n• ${sales.length} 筆銷售紀錄\n• ${deposits.length} 筆儲值紀錄\n\n此操作無法復原`))return;
  // 刪除所有相關銷售
  for(const s of sales){
    try{await delSub('sales',s.id);}catch(e){console.warn('刪除銷售失敗',e);}
  }
  // 刪除所有相關儲值
  for(const d of deposits){
    try{await delSub('deposits',d.id);}catch(e){console.warn('刪除儲值失敗',e);}
  }
  toast(`✅ 已清除「${name}」的 ${totalRecords} 筆紀錄`);
};

window.setDepositPlan=(actual,face)=>{
  if($('m_dp_actual'))$('m_dp_actual').value=actual||'';
  if($('m_dp2'))$('m_dp2').value=face||'';
  // 對應方案備註
  if($('m_dp4')&&actual&&face){
    const r=Math.round(actual/face*100);
    $('m_dp4').value=`儲值方案 (${r/10}折)`;
  }
  calcDiscountRate();
};

window.calcDiscountRate=()=>{
  const actual=parseFloat($('m_dp_actual')?.value)||0;
  const face=parseFloat($('m_dp2')?.value)||0;
  const rateEl=$('m_dp_rate');
  const bonusEl=$('m_dp_bonus');
  if(!rateEl||!bonusEl)return;
  if(actual>0&&face>0){
    const rate=actual/face;
    const bonus=face-actual;
    const ratePercent=Math.round(rate*1000)/10;
    rateEl.textContent=`${ratePercent}%（${(rate*10).toFixed(1)}折）`;
    bonusEl.textContent=`$${fmt(bonus)}`;
    if(rate>1){
      rateEl.style.color='var(--red)';
      rateEl.textContent+=' ⚠️ 實收>面額';
    }else{
      rateEl.style.color='var(--rose)';
    }
  }else{
    rateEl.textContent='--';
    bonusEl.textContent='$0';
  }
};

window.saveDeposit=async()=>{
  try{
    let customer=$('m_dp1')?.value?.trim()||'';
    const date=$('m_dp0')?.value;
    const amount=parseFloat($('m_dp2')?.value)||0;
    const actualReceived=parseFloat($('m_dp_actual')?.value)||amount;
    if(!customer){alert('請選擇或輸入客戶');return;}
    if(!date||!amount){alert('請填日期和儲值面額');return;}
    if(actualReceived<=0){alert('請填實收金額');return;}
    const payMethod=$('m_dp3')?.value||'轉帳';
    const note=$('m_dp4')?.value||'';
    const d=new Date(date);
    const discountRate=actualReceived/amount;
    // 🎯 收集限定服務設定
    const isRestricted=$('m_dp_restricted')?.checked||false;
    const allowedServices=isRestricted?Array.from(document.querySelectorAll('.m_dp_svc_chk:checked')).map(cb=>cb.value):[];
    const monthlyLimit=isRestricted?(parseInt($('m_dp_monthly_limit')?.value)||0):0;
    if(isRestricted&&allowedServices.length===0){
      alert('已勾選「限定特定服務」，請至少選一個允許使用的服務');return;
    }
    // 儲值紀錄存「面額」+「實收」+「折扣率」+ 限定服務
    await addSub('deposits',{
      date,customer,
      amount,                  // 面額（公司負債）
      actualReceived,          // 實收現金
      discountRate,            // 折扣率
      payMethod,note,
      scope:isRestricted?'restricted':'general',
      allowedServices,         // 限定的服務名稱陣列
      monthlyLimit,            // 每月可用次數限制（0 = 不限）
      month:d.getMonth()+1,year:d.getFullYear()
    });
    // 現金流只記實收金額
    await addSub('cashFlow',{
      date,amount:actualReceived,
      cat:'儲值入帳',
      note:`${customer} 儲值面額$${fmt(amount)} 實收$${fmt(actualReceived)}${isRestricted?` 🎯限定：${allowedServices.join('/')}`:''}${note?' ('+note+')':''}`,
      month:d.getMonth()+1,year:d.getFullYear()
    });
    if(!(S.data.customers||[]).find(c=>c.name===customer)){
      const customers=[...(S.data.customers||[]),{id:uid(),name:customer,phone:'',createdAt:today()}];
      await saveMain({customers});
    }
    const bonus=amount-actualReceived;
    toast(`✅ 儲值入帳　實收 $${fmt(actualReceived)}　面額 $${fmt(amount)}${bonus>0?`（贈 $${fmt(bonus)}）`:''}${isRestricted?` 🎯 限定 ${allowedServices.length} 個服務`:''}`);
    closeMod();
  }catch(err){
    console.error('saveDeposit 失敗:',err);
    alert('儲值失敗：'+(err.message||err));
  }
};

window.saveDepositFor=async(customer)=>{
  try{
    const date=$('m_dp0')?.value;
    const amount=parseFloat($('m_dp2')?.value)||0;
    const actualReceived=parseFloat($('m_dp_actual')?.value)||amount;
    if(!date||!amount){alert('請填日期和儲值面額');return;}
    if(actualReceived<=0){alert('請填實收金額');return;}
    const payMethod=$('m_dp3')?.value||'轉帳';
    const note=$('m_dp4')?.value||'';
    // 🎯 收集限定服務設定
    const isRestricted=$('m_dp_restricted')?.checked||false;
    const allowedServices=isRestricted?Array.from(document.querySelectorAll('.m_dp_svc_chk:checked')).map(cb=>cb.value):[];
    const monthlyLimit=isRestricted?(parseInt($('m_dp_monthly_limit')?.value)||0):0;
    if(isRestricted&&allowedServices.length===0){
      alert('已勾選「限定特定服務」，請至少選一個允許使用的服務');return;
    }
    const scope=isRestricted?'restricted':'general';
    // 判斷是否需要簽名（依儲值門檻）
    const threshold=S.data.settings?.depositSignThreshold??DEFAULT_DEPOSIT_SIGN_THRESHOLD;
    if(actualReceived>=threshold){
      // 跳客戶儲值簽名模式（不直接寫入，存進 S.depositPending）
      S.depositPending={customer,date,amount,actualReceived,payMethod,note,scope,allowedServices,monthlyLimit};
      closeMod();
      // 切到服務確認頁的儲值簽名模式
      S.page='treatment';
      S.treatment={mode:'depositCustomer',depositData:S.depositPending};
      render();
      setTimeout(initSignatureCanvasInline,100);
    }else{
      // 金額未達門檻，直接寫入
      await finalizeDeposit({customer,date,amount,actualReceived,payMethod,note,scope,allowedServices,monthlyLimit,signed:false});
    }
  }catch(err){
    console.error('saveDepositFor 失敗:',err);
    alert('儲值失敗：'+(err.message||err));
  }
};

// 儲值簽名 — 完成
window.finalizeDepositSign=async()=>{
  try{
    const t=S.treatment;
    if(!t||!t.depositData){alert('找不到儲值資料');return;}
    if(!t.depositAgreed){alert('⚠️ 請勾選「已詳閱並同意上述儲值方案內容」');return;}
    if(!_sigCanvas||!_sigHasContent){alert('⚠️ 請先簽名');return;}
    const dataURL=_sigCanvas.toDataURL('image/png');
    // 取條款快照
    const dp=t.depositData;
    const termsTemplate=S.data.settings?.depositTerms||DEFAULT_DEPOSIT_TERMS;
    const usagePeriodStr=S.data.settings?.depositUsagePeriod||'無使用期限';
    const transferableStr=S.data.settings?.depositTransferable===true?'得轉讓予他人使用':'限本人使用，不可轉讓予他人';
    const discountRateVal=dp.amount?Math.round(dp.actualReceived/dp.amount*100):0;
    const termsSnapshot=termsTemplate
      .replace(/\$\{actualReceived\}/g,fmt(dp.actualReceived||0))
      .replace(/\$\{amount\}/g,fmt(dp.amount||0))
      .replace(/\$\{bonus\}/g,fmt((dp.amount||0)-(dp.actualReceived||0)))
      .replace(/\$\{discountRate\}/g,(100-discountRateVal).toString())
      .replace(/<usage_period>/g,usagePeriodStr)
      .replace(/<transferable>/g,transferableStr);
    await finalizeDeposit({
      ...dp,
      signature:dataURL,
      termsSnapshot,
      signed:true
    });
    // 把這次契約資料暫存，供「下載/複製」用
    S.lastDepositContract={
      customer:dp.customer,
      date:dp.date,
      actualReceived:dp.actualReceived,
      amount:dp.amount,
      termsSnapshot,
      signature:dataURL,
      signedAt:nowLocal()
    };
    S.treatment=null;
    S.depositPending=null;
    // 顯示完成畫面（含下載/複製契約按鈕）
    showDepositContractDone();
  }catch(err){
    console.error('finalizeDepositSign 失敗:',err);
    alert('失敗：'+(err.message||err));
  }
};
