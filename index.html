// ─── 退費計算機（依消保法、定型化契約、單堂原價計算）───
function pgRefundCalculator(){
  const customers=getAllCustomerNames();
  const sel=S.refundCalc?.customer||'';
  // 從客戶儲值紀錄抓最新一筆有簽名的
  const cDeposits=sel?(S.data.deposits||[]).filter(d=>d.customer===sel):[];
  const latest=cDeposits.length>0?cDeposits[cDeposits.length-1]:null;
  // 預設值
  const actual=S.refundCalc?.actual||(latest?toN(latest.actualReceived):0);
  const usable=S.refundCalc?.usable||(latest?toN(latest.amount):0);
  // 服務原價列表
  const priceList=S.data.settings?.servicePriceList||DEFAULT_SERVICE_PRICES;
  // 已使用次數（手動輸入）
  const usedItems=S.refundCalc?.usedItems||[];
  // 計算
  const usedAmount=usedItems.reduce((s,it)=>s+toN(it.price)*toN(it.qty),0);
  const remainUsable=usable-usedAmount;
  const ratio=usable>0?actual/usable:1;
  const remainActual=Math.round(remainUsable*ratio);
  // 解約原因（影響手續費）
  const reason=S.refundCalc?.reason||'customer_change_mind';  // customer_change_mind / customer_pregnant / studio_close / cooling_off
  let feeRate=0.1;  // 預設 10%（消保法上限）
  let feeNote='';
  if(reason==='cooling_off'){feeRate=0;feeNote='七日鑑賞期內未使用，全額退費';}
  else if(reason==='studio_close'){feeRate=0;feeNote='可歸責於工作室，不扣手續費';}
  else if(reason==='customer_pregnant'){feeRate=0;feeNote='不可歸責雙方（懷孕/重病等），不扣手續費';}
  else if(reason==='unused_full'){feeRate=0.05;feeNote='未開始使用，扣 5% 手續費';}
  else{feeRate=0.1;feeNote='已開始使用，扣 10% 手續費';}
  const fee=Math.round((reason==='unused_full'?actual:remainActual)*feeRate);
  let refund=0;
  if(reason==='cooling_off')refund=actual;
  else if(reason==='unused_full')refund=actual-fee;
  else refund=remainActual-fee;
  return`
  <div class="pg-ttl">⚖️ 退費計算機（依消保法 + 定型化契約）</div>
  <div class="pg-sub">客人來退費時，先用這個算清楚，再給客人選擇</div>

  <div class="notice" style="background:var(--goldL);border-left-color:var(--gold);color:var(--goldDk);">
    🎯 <b>使用流程：</b><br>
    1. 選客戶、輸入儲值方案金額<br>
    2. 輸入客戶已使用的服務次數（按「服務項目原價」計算）<br>
    3. 選擇退費原因（影響手續費%）<br>
    4. 系統自動算出應退金額 → 列印給客人簽名
  </div>

  <!-- Step 1: 選客戶 + 方案 -->
  <div class="card">
    <div class="card-hd"><span class="card-ttl">📋 Step 1：客戶與儲值方案</span></div>
    <div class="card-bd">
      <div class="fg fg2">
        <div class="fgrp"><label>客戶</label>
          <select onchange="setRefundCustomer(this.value)">
            <option value="">— 請選擇 —</option>
            ${customers.map(n=>`<option value="${n}"${sel===n?' selected':''}>${n}</option>`).join('')}
          </select>
        </div>
        <div class="fgrp"><label>客人實付金額（退費比例計算基礎）*</label>
          <input type="number" value="${actual}" oninput="setRefundField('actual',this.value)" placeholder="例：19800">
        </div>
        <div class="fgrp"><label>可使用金額（含優惠）*</label>
          <input type="number" value="${usable}" oninput="setRefundField('usable',this.value)" placeholder="例：22000">
        </div>
        <div class="fgrp" style="background:var(--bg2);padding:10px;border-radius:8px;">
          <div class="tm" style="font-size:12px;">優惠金額（自動計算）</div>
          <div style="font-size:18px;font-weight:700;color:var(--rose);">$${fmt(usable-actual)}</div>
          <div class="tm" style="font-size:11px;">折扣率：${usable>0?Math.round((1-actual/usable)*100):0}%</div>
        </div>
      </div>
      ${latest?`<div class="tm" style="font-size:12px;color:var(--blu);margin-top:6px;">📌 已自動帶入最新一筆儲值紀錄（${latest.date}）</div>`:''}
    </div>
  </div>

  <!-- Step 2: 已使用服務 -->
  <div class="card">
    <div class="card-hd">
      <span class="card-ttl">📋 Step 2：客戶已使用的服務（按單次原價計算）</span>
      <button class="btn btn-y btn-sm" onclick="addRefundUsedItem()">＋ 新增使用紀錄</button>
    </div>
    <div class="card-bd">
      <div class="tm" style="margin-bottom:10px;font-size:12px;">⚠️ 重要：依定型化契約，已使用部分按「單次原價」計算，請逐項輸入</div>
      ${usedItems.length===0?`<div class="empty"><p>尚未新增使用紀錄。點上方「＋ 新增使用紀錄」開始</p></div>`:`
      <div class="tw"><table>
        <thead><tr><th>服務項目</th><th>單次原價</th><th>次數</th><th>小計</th><th></th></tr></thead>
        <tbody>
          ${usedItems.map((it,i)=>`<tr>
            <td><input type="text" list="dl_priceList" value="${it.name||''}" placeholder="服務名稱" oninput="setRefundUsedItemFromName(${i},this.value)" style="width:100%;"></td>
            <td><input type="number" value="${it.price||0}" oninput="setRefundUsedItem(${i},'price',this.value)" style="width:100px;"> 元</td>
            <td><input type="number" value="${it.qty||1}" oninput="setRefundUsedItem(${i},'qty',this.value)" style="width:60px;"> 次</td>
            <td class="ag" style="color:var(--rose);font-weight:700;">$${fmt(toN(it.price)*toN(it.qty))}</td>
            <td><button class="bdel" onclick="rmRefundUsedItem(${i})">×</button></td>
          </tr>`).join('')}
          <tr style="background:var(--goldL);font-weight:700;">
            <td colspan="3">已使用金額合計（按原價）</td>
            <td class="ag" style="color:var(--goldDk);font-size:18px;">$${fmt(usedAmount)}</td>
            <td></td>
          </tr>
        </tbody>
      </table></div>
      <datalist id="dl_priceList">
        ${priceList.map(p=>`<option value="${p.name}" data-price="${p.price}">`).join('')}
      </datalist>`}
      <div class="tm" style="font-size:11px;margin-top:8px;color:var(--blu);">💡 服務原價可在「⚙️ 基本設定」→「💎 服務項目原價列表」設定，這裡會自動帶入</div>
    </div>
  </div>

  <!-- Step 3: 退費原因 -->
  <div class="card">
    <div class="card-hd"><span class="card-ttl">📋 Step 3：退費原因（決定手續費）</span></div>
    <div class="card-bd">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;">
        ${[
          {v:'cooling_off',t:'七日鑑賞期內、未使用',c:'var(--grn)',f:'0%（全額退）'},
          {v:'unused_full',t:'已簽約未使用（過鑑賞期）',c:'var(--blu)',f:'5%'},
          {v:'customer_change_mind',t:'客戶提前解約（已使用）',c:'var(--gold)',f:'10%'},
          {v:'customer_pregnant',t:'懷孕/重病等不可歸責',c:'var(--pur)',f:'0%'},
          {v:'studio_close',t:'工作室停業（可歸責）',c:'var(--rose)',f:'0%'},
        ].map(o=>`<label style="display:flex;align-items:center;gap:10px;cursor:pointer;padding:12px;background:${reason===o.v?o.c:'#fafafa'};color:${reason===o.v?'#fff':'var(--txt)'};border:2px solid ${o.c};border-radius:10px;font-size:13px;transition:all 0.15s;">
          <input type="radio" name="refundReason" ${reason===o.v?'checked':''} onchange="setRefundField('reason','${o.v}')" style="cursor:pointer;flex-shrink:0;accent-color:${o.c};">
          <div style="flex:1;">
            <div style="font-weight:700;">${o.t}</div>
            <div style="font-size:11px;opacity:0.85;">手續費：${o.f}</div>
          </div>
        </label>`).join('')}
      </div>
    </div>
  </div>

  <!-- 計算結果 -->
  <div class="card" style="background:linear-gradient(135deg,var(--goldL),var(--roseL));border:2px solid var(--gold);">
    <div class="card-hd" style="background:transparent;"><span class="card-ttl" style="color:var(--goldDk);">💰 退費計算結果</span></div>
    <div class="card-bd">
      <div style="background:#fff;padding:14px;border-radius:8px;font-family:monospace;font-size:13px;line-height:2;">
        <div>客人實付金額：<b>$${fmt(actual)}</b></div>
        <div>可使用金額（含優惠）：<b>$${fmt(usable)}</b></div>
        <div>實付/可用 比例：<b>${(ratio*100).toFixed(2)}%</b></div>
        <div style="border-top:1px dashed var(--bdr);margin:6px 0;"></div>
        <div>已使用金額（按原價）：<b style="color:var(--rose);">$${fmt(usedAmount)}</b></div>
        <div>剩餘可使用金額：<b>$${fmt(remainUsable)}</b></div>
        <div>剩餘實付對應金額：${fmt(remainUsable)} × ${ratio.toFixed(2)} = <b style="color:var(--blu);">$${fmt(remainActual)}</b></div>
        <div style="border-top:1px dashed var(--bdr);margin:6px 0;"></div>
        <div>退費原因：<b>${reason==='cooling_off'?'七日鑑賞期內':reason==='unused_full'?'已簽約未使用':reason==='customer_pregnant'?'不可歸責雙方':reason==='studio_close'?'工作室停業':'客戶提前解約'}</b></div>
        <div>解約手續費（${(feeRate*100).toFixed(0)}%）：<b style="color:var(--mut);">－$${fmt(fee)}</b></div>
        <div class="tm" style="font-size:11px;">${feeNote}</div>
      </div>
      <div style="background:linear-gradient(135deg,var(--gold),var(--rose));color:#fff;padding:18px;border-radius:10px;margin-top:14px;text-align:center;">
        <div style="font-size:13px;opacity:0.9;">應退還客人</div>
        <div style="font-size:42px;font-weight:700;">$${fmt(Math.max(0,refund))}</div>
        <div class="tm" style="color:#fff;opacity:0.9;font-size:11px;margin-top:4px;">退款期限：${reason==='cooling_off'?'15 天內':'30 天內'}（依消保法）</div>
      </div>

      <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-pur" style="flex:1;" onclick="printRefundReceipt()">🖨️ 列印退費計算單（給客人簽名）</button>
        <button class="btn btn-y" style="flex:1;" onclick="showRefundScript()">💬 看話術範本</button>
        <button class="btn btn-s" onclick="resetRefundCalc()">🔄 重新計算</button>
      </div>
    </div>
  </div>

  <!-- 法律依據 -->
  <div class="card" style="background:var(--bluL);border:1px solid var(--blu);">
    <div class="card-hd" style="background:transparent;"><span class="card-ttl" style="color:var(--blu);">📜 法律依據速查</span></div>
    <div class="card-bd" style="font-size:13px;line-height:1.8;">
      <div style="margin-bottom:10px;"><b>① 七日鑑賞期</b>：消保法第 19 條，自簽約日起 7 日內未使用得無條件解約，全額退費。</div>
      <div style="margin-bottom:10px;"><b>② 解約手續費上限</b>：消保法施行細則第 25 條，最高 10%。</div>
      <div style="margin-bottom:10px;"><b>③ 條件式贈與</b>：民法第 408、412 條，附條件贈與條件未成就（如未用完），贈與人得撤銷贈與。</div>
      <div style="margin-bottom:10px;"><b>④ 不可歸責雙方</b>：民法第 266 條，不可歸責雙方時，當事人雙方互免給付義務。</div>
      <div><b>⑤ 退款期限</b>：定型化契約規定 30 日內、鑑賞期解約 15 日內必須退款。</div>
    </div>
  </div>
  `;
}

// ─── REPORTS ───────────────────────────────────────────────
function pgReports(){
  const mos=Array.from({length:12},(_,i)=>i+1);
  const moData=mos.map(m=>({
    m,rev:getRevTotal(m),exp:getExpTotal(m),
    svc:getSvcTotal(m),prd:getPrdTotal(m),crs:getCrsTotal(m)
  }));
  const tRev=moData.reduce((s,m)=>s+m.rev,0);
  const tExp=moData.reduce((s,m)=>s+m.exp,0);
  const maxV=Math.max(...moData.map(m=>Math.max(m.rev,m.exp)),1);
  const tSvc=moData.reduce((s,m)=>s+m.svc,0);
  const tPrd=moData.reduce((s,m)=>s+m.prd,0);
  const tCrs=moData.reduce((s,m)=>s+m.crs,0);
  return`
  <div class="pg-ttl">📈 月報年報</div>
  <div class="pg-sub">${yr()}年 全年財務分析</div>
  <div class="sg sg4">
    <div class="sc rose"><div class="sl">年度總營收</div><div class="sv rose sm">$${fmt(tRev)}</div></div>
    <div class="sc red"><div class="sl">年度總支出</div><div class="sv red sm">$${fmt(tExp)}</div></div>
    <div class="sc ${tRev-tExp>=0?'grn':'red'}"><div class="sl">年度淨利</div><div class="sv sm ${tRev-tExp>=0?'grn':'red'}">$${fmt(tRev-tExp)}</div></div>
    <div class="sc gold"><div class="sl">年度毛利率</div><div class="sv gold sm">${tRev>0?Math.round((tRev-tExp)/tRev*100):0}%</div></div>
  </div>
  <div class="card">
    <div class="card-hd"><span class="card-ttl">📊 月度營收走勢</span></div>
    <div class="card-bd" style="overflow-x:auto;">
      <div style="min-width:600px;">
        ${moData.map(m=>{
          const rp=Math.round(m.rev/maxV*100),ep=Math.round(m.exp/maxV*100);
          return`<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
            <div style="width:36px;font-size:14px;color:var(--mut);text-align:right;">${m.m}月</div>
            <div style="flex:1;display:flex;flex-direction:column;gap:4px;">
              <div class="pb" style="height:13px;"><div class="pf" style="width:${rp}%;height:13px;background:var(--rose);"></div></div>
              <div class="pb" style="height:13px;"><div class="pf" style="width:${ep}%;height:13px;background:var(--red);"></div></div>
            </div>
            <div style="width:120px;font-size:13px;"><div class="ap">$${fmt(m.rev)}</div><div class="an">$${fmt(m.exp)}</div></div>
            <div style="width:90px;font-size:13px;font-weight:700;${m.rev-m.exp>=0?'color:var(--grn)':'color:var(--red)'};">$${fmt(m.rev-m.exp)}</div>
          </div>`;
        }).join('')}
        <div style="display:flex;gap:18px;margin-top:10px;font-size:13px;color:var(--mut);"><span>🌸 營收</span><span>🔴 支出</span><span>右側＝淨利</span></div>
      </div>
    </div>
  </div>
  <div class="sg sg2">
    <div class="card">
      <div class="card-hd"><span class="card-ttl">💰 年度收入結構</span></div>
      <div class="card-bd">
        ${tRev===0?'<div class="empty"><p>尚無收入記錄</p></div>':[
          {lbl:'🌸 服務收入',val:tSvc,color:'var(--rose)'},
          {lbl:'🧴 產品銷售',val:tPrd,color:'var(--gold)'},
          {lbl:'📚 課程收入',val:tCrs,color:'var(--pur)'},
        ].map(({lbl,val,color})=>`
          <div style="margin-bottom:16px;">
            <div class="plbl"><span>${lbl}</span><span style="font-weight:700;color:${color};">$${fmt(val)}（${tRev>0?Math.round(val/tRev*100):0}%）</span></div>
            <div class="pb" style="height:14px;"><div class="pf" style="width:${tRev>0?Math.round(val/tRev*100):0}%;height:14px;background:${color};"></div></div>
          </div>`).join('')}
      </div>
    </div>
    <div class="card">
      <div class="card-hd"><span class="card-ttl">📋 月度明細表</span></div>
      <div class="tw"><table>
        <thead><tr><th>月份</th><th>營收</th><th>支出</th><th>淨利</th><th>毛利率</th></tr></thead>
        <tbody>${moData.map(m=>`<tr>
          <td><b>${m.m}月</b></td>
          <td class="ap">$${fmt(m.rev)}</td>
          <td class="an">$${fmt(m.exp)}</td>
          <td class="${m.rev-m.exp>=0?'ap':'an'}">$${fmt(m.rev-m.exp)}</td>
          <td class="${m.rev>0&&(m.rev-m.exp)/m.rev>0?'ap':'an'}">${m.rev>0?Math.round((m.rev-m.exp)/m.rev*100):0}%</td>
        </tr>`).join('')}</tbody>
      </table></div>
    </div>
  </div>`;
}

// 全站搜尋邏輯
function globalSearch(q){
  const lcQ=q.toLowerCase();
  const matchAmount=parseFloat(q)>0?parseFloat(q):null;// 如果是純數字，也比對金額
  const matchText=(...fields)=>fields.some(f=>(f||'').toString().toLowerCase().includes(lcQ));
  const matchAmt=(amt)=>matchAmount!==null&&Math.abs(toN(amt)-matchAmount)<0.01;

  // 1. 搜尋銷售/收入
  const salesResult=(S.data.sales||[]).filter(s=>{
    return matchText(s.item,s.subNote,s.customer,s.staff,s.payMethod)||matchAmt(s.amount);
  }).slice(0,30);

  // 2. 搜尋支出
  const expResult=(S.data.expenses||[]).filter(e=>{
    return matchText(e.category,e.note,e.payMethod)||matchAmt(e.amount);
  }).slice(0,30);

  // 3. 搜尋進貨
  const purResult=(S.data.purchases||[]).filter(p=>{
    return matchText(p.productName,p.category,p.supplier,p.note)||matchAmt(p.totalCost)||matchAmt(p.unitCost);
  }).slice(0,30);

  // 4. 搜尋儲值
  const depResult=(S.data.deposits||[]).filter(d=>{
    return matchText(d.customer,d.note,d.payMethod)||matchAmt(d.amount)||matchAmt(d.actualReceived);
  }).slice(0,30);

  // 5. 搜尋客戶
  const custResult=(S.data.customers||[]).filter(c=>{
    return matchText(c.name,c.phone,c.note,c.birthday,c.source);
  }).slice(0,30);

  // 6. 搜尋產品
  const prodResult=(S.data.products||[]).filter(p=>{
    return matchText(p.name,p.category,p.supplier,p.series)||matchAmt(p.price)||matchAmt(p.cost);
  }).slice(0,30);

  // 7. 搜尋出貨耗用
  const stockResult=(S.data.stockOuts||[]).filter(s=>{
    return matchText(s.productName,s.customer,s.note,s.type)||matchAmt(s.totalCost);
  }).slice(0,30);

  // 8. 搜尋現金流
  const cfResult=(S.data.cashFlow||[]).filter(f=>{
    return matchText(f.cat,f.note)||matchAmt(f.amount)||matchAmt(Math.abs(f.amount));
  }).slice(0,30);

  return{
    sales:salesResult,
    expenses:expResult,
    purchases:purResult,
    deposits:depResult,
    customers:custResult,
    products:prodResult,
    stockOuts:stockResult,
    cashFlow:cfResult,
    totalCount:salesResult.length+expResult.length+purResult.length+depResult.length+custResult.length+prodResult.length+stockResult.length+cfResult.length
  };
}

window.saveSale=async()=>{
  const date=$('m_s0')?.value,amount=parseFloat($('m_s3')?.value)||0;
  if(!date||!amount){alert('請填日期和金額');return;}
  const d=new Date(date);
  await addSub('sales',{date,type:$('m_s1')?.value,item:$('m_s2')?.value||'',subNote:$('m_sNote')?.value||'',amount,payMethod:$('m_s4')?.value,staff:$('m_s5')?.value,customer:$('m_s6')?.value||'',month:d.getMonth()+1,year:d.getFullYear()});
  toast('✅ 收入已記帳');closeMod();
};
window.updSale=async(id)=>{
  const date=$('m_s0')?.value,amount=parseFloat($('m_s3')?.value)||0;
  if(!date||!amount){alert('請填日期和金額');return;}
  const d=new Date(date);
  const old=(S.data.sales||[]).find(x=>x.id===id)||{};
  const face=parseFloat($('m_sFace')?.value)||amount;
  const commPercent=parseFloat($('m_sComm')?.value);
  const commissionRate=isNaN(commPercent)?DEFAULT_COMMISSION_RATE:commPercent/100;
  const commissionBase=$('m_sCombase')?.value||'face';
  const updated={
    ...old,
    date,
    type:$('m_s1')?.value,
    item:$('m_s2')?.value||'',
    subNote:$('m_sNote')?.value||'',
    amount,
    payMethod:$('m_s4')?.value,
    staff:$('m_s5')?.value,
    customer:$('m_s6')?.value||'',
    commissionRate,
    commissionBase,
    month:d.getMonth()+1,year:d.getFullYear()
  };
  // 只有當原價面額 > 認列營收時才存（代表有公司吸收折讓）
  if(face>amount){
    updated.depositFaceAmount=face;
  }else if(face===amount){
    // 相等代表沒有折讓，移除欄位
    delete updated.depositFaceAmount;
  }else{
    updated.depositFaceAmount=face;
  }
  // 立即本地更新（避免 Firebase 同步延遲導致畫面顯示舊資料）
  const idx=(S.data.sales||[]).findIndex(x=>x.id===id);
  if(idx>=0){S.data.sales[idx]={...updated,id};}
  await setSub('sales',id,updated);
  toast('✅ 已更新');closeMod();
  render();
};
window.delSale=async id=>{
  if(!confirm('確認刪除？'))return;
  // 立即本地移除（避免延遲）
  S.data.sales=(S.data.sales||[]).filter(x=>x.id!==id);
  await delSub('sales',id);
  toast('已刪除');
  render();
};

window.addProductToCart=()=>{
  const sel=$('m_pd_pick');
  if(!sel||!sel.value)return;
  const opt=sel.options[sel.selectedIndex];
  const id=opt.value;
  const name=opt.dataset.name||opt.text.split('（')[0];
  const price=parseFloat(opt.dataset.price)||0;
  // 檢查是否已加過 → 數量 +1
  const existed=S.cart.find(it=>it.id===id&&!it.custom);

  else{S.cart.push({id,name,price,qty:1,custom:false,type:'product'});}

window.removeCartItem=(idx)=>{
  S.cart.splice(idx,1);
  renderCart();
};

window.updCartQty=(idx,delta)=>{
  if(!S.cart[idx])return;
  S.cart[idx].qty=Math.max(1,(S.cart[idx].qty||1)+delta);
  renderCart();
};

window.updCartField=(idx,field,value)=>{
  if(!S.cart[idx])return;
  if(field==='price'||field==='qty')value=parseFloat(value)||0;
  S.cart[idx][field]=value;
  // 只更新總額，不重繪整個購物車（避免 input 失焦）
  const total=S.cart.reduce((s,it)=>s+toN(it.price)*toN(it.qty),0);
  if($('m_pd_total'))$('m_pd_total').textContent='$'+fmt(total);
};

function renderCart(){
  const cart=$('m_pd_cart');
  if(!cart)return;
  if(S.cart.length===0){
    cart.innerHTML='<div class="tm" style="text-align:center;padding:14px;">尚無商品，請從上方選擇或新增</div>';
  }else{
    cart.innerHTML=S.cart.map((it,i)=>{
      const subtotal=toN(it.price)*toN(it.qty);
      if(it.custom){
        // 臨時產品 — 名稱與價格可編輯
        return`<div style="display:flex;gap:6px;align-items:center;background:var(--card);padding:8px;border-radius:6px;border:1px dashed var(--gold);">
          <span class="bdg gold" style="flex-shrink:0;">臨時</span>
          <input type="text" placeholder="商品名稱" value="${it.name}" oninput="updCartField(${i},'name',this.value)" style="flex:2;min-width:100px;padding:4px 8px;border:1px solid var(--bdr);border-radius:4px;">
          <input type="number" placeholder="單價" value="${it.price||''}" oninput="updCartField(${i},'price',this.value)" style="flex:1;width:80px;padding:4px 8px;border:1px solid var(--bdr);border-radius:4px;">
          <span style="white-space:nowrap;font-size:13px;">×</span>
          <input type="number" value="${it.qty}" min="1" oninput="updCartField(${i},'qty',this.value)" style="width:50px;padding:4px 8px;border:1px solid var(--bdr);border-radius:4px;">
          <span style="white-space:nowrap;font-weight:700;color:var(--gold);min-width:60px;text-align:right;">$${fmt(subtotal)}</span>
          <button class="bdel" onclick="removeCartItem(${i})">×</button>
        </div>`;
      }else{
        // 服務 / 正式產品
        const isService=it.type==='service';
        return`<div style="display:flex;gap:6px;align-items:center;background:var(--card);padding:8px;border-radius:6px;${isService?'border-left:3px solid var(--rose);':''}">
          ${isService?`<span class="bdg" style="background:var(--roseL);color:var(--rose);flex-shrink:0;">🌸 服務</span>`:`<span class="bdg gold" style="flex-shrink:0;">📦 產品</span>`}
          <span style="flex:2;min-width:100px;font-weight:700;">${it.name}</span>
          <input type="number" value="${it.price}" oninput="updCartField(${i},'price',this.value)" style="width:80px;padding:4px 8px;border:1px solid var(--bdr);border-radius:4px;" title="可改單價">
          <button class="btn btn-s btn-sm" onclick="updCartQty(${i},-1)" style="padding:2px 8px;">-</button>
          <span style="min-width:24px;text-align:center;font-weight:700;">${it.qty}</span>
          <button class="btn btn-p btn-sm" onclick="updCartQty(${i},1)" style="padding:2px 8px;">+</button>
          <span style="white-space:nowrap;font-weight:700;color:var(--gold);min-width:60px;text-align:right;">$${fmt(subtotal)}</span>
          <button class="bdel" onclick="removeCartItem(${i})">×</button>
        </div>`;
      }
    }).join('');
  }
  // 更新總額
  const total=S.cart.reduce((s,it)=>s+toN(it.price)*toN(it.qty),0);
  if($('m_pd_total'))$('m_pd_total').textContent='$'+fmt(total);
}

// 購物車結帳
window.saveCartOrder=async(continueInput)=>{
  try{
    if(S.cart.length===0){alert('購物車是空的，請先加入商品');return;}
    // 過濾掉空商品
    const items=S.cart.filter(it=>it.name&&toN(it.price)*toN(it.qty)>0);
    if(items.length===0){alert('購物車內所有商品都還沒填寫名稱或價格');return;}
    const date=$('m_pd0')?.value||today();
    const totalAmount=items.reduce((s,it)=>s+toN(it.price)*toN(it.qty),0);
    let customer=$('m_pd5')?.value||'';
    if(customer==='__new__')customer=$('m_pd5_new')?.value?.trim()||'';
    const payMethod=$('m_pd7')?.value||'';
    let depositOwner='';
    let depositFaceAmount=0;
    let realRevenueRate=1;
    if(payMethod==='儲值扣款'){
      if(!customer){alert('儲值扣款必須選擇客戶');return;}
      depositOwner=$('m_pd_owner')?.value||customer;
      const bal=getCustomerBalance(depositOwner);
      depositFaceAmount=totalAmount;
      if(bal<depositFaceAmount){
        const ownerLabel=depositOwner===customer?'此客戶':`${depositOwner}（共用儲值）`;
        if(!confirm(`⚠️ ${ownerLabel} 儲值餘額不足！\n餘額 $${fmt(bal)}　扣款 $${fmt(depositFaceAmount)}\n\n是否仍要記錄？`))return;
      }
      // 🎯 限定服務檢查：檢查購物車內所有服務項目是否都能用此儲值扣款
      const restrictedIssues=[];
      let totalAvailable=0;
      for(const it of items){
        if(it.type!=='service')continue;// 產品不受限定服務限制
        const check=checkDepositUsableForService(depositOwner,it.name);
        if(!check.ok){
          restrictedIssues.push(`• 「${it.name}」：${check.message}`);
        }
      }
      if(restrictedIssues.length>0){
        const msg=`⚠️ 此客戶的儲值有「服務限定」設定，以下服務無法用儲值扣款：\n\n${restrictedIssues.join('\n\n')}\n\n是否仍要強制扣款？\n（建議：取消後改用其他付款方式，或為這些服務另外建立通用儲值）`;
        if(!confirm(msg))return;
      }
      realRevenueRate=getCustomerDiscountRate(depositOwner);
    }
    const d=new Date(date);
    const note=$('m_pdNote')?.value||'';
    const staff=$('m_pd6')?.value||'';
    // 老師抽成設定
    const commPercent=parseFloat($('m_pd_comm')?.value);
    const commissionRate=isNaN(commPercent)?DEFAULT_COMMISSION_RATE:commPercent/100;
    const commissionBase=$('m_pd_combase')?.value||'face';
    // 為每件商品建立一筆 sales 記錄
    for(const it of items){
      const subtotal=toN(it.price)*toN(it.qty);
      const realRev=Math.round(subtotal*realRevenueRate);
      // 自動判斷服務/產品類型（從報價單帶入的有 type:'service'）
      const itemType=it.type==='service'?'service':'product';
      const saleData={
        date,type:itemType,item:it.name,
        subNote:note,
        amount:realRev,

window.savePurchase=async()=>{
  const date=$('m_p0')?.value;
  const pickedPid=$('m_pPick')?.value||'';
  const productName=$('m_p2')?.value?.trim();
  const category=$('m_pCat')?.value;
  const qty=parseFloat($('m_p3')?.value)||0;
  const unitCost=parseFloat($('m_p4')?.value)||0;
  let totalCost=parseFloat($('m_p5')?.value)||qty*unitCost;
  const sellPrice=parseFloat($('m_pPrice')?.value)||0;
  const series=$('m_pSeries')?.value?.trim()||'';
  if(!date||!qty){alert('請填日期和數量');return;}
  if(!pickedPid&&!productName){alert('請選擇現有產品或填寫產品名稱');return;}
  const supSel=$('m_p6')?.value;
  const supplier=supSel==='其他手動輸入廠商'?($('m_p6c')?.value||'').trim():supSel;
  // 優先：用 productId 直接找產品（避免名稱比對問題）
  let prod=null;
  if(pickedPid){
    prod=(S.data.products||[]).find(p=>p.id===pickedPid);
  }
  // 次選：用名稱+類別比對（兩邊 trim 並去除空白避免重複建立）
  if(!prod&&productName){
    const tName=productName.trim().replace(/[\u3000\s]+/g,'');
    prod=(S.data.products||[]).find(p=>(p.name||'').trim().replace(/[\u3000\s]+/g,'')===tName&&p.category===category);
  }
  let pid;
  if(!prod){
    pid=uid();
    const newProd={id:pid,name:productName.trim(),category,price:sellPrice,cost:unitCost,supplier,series};
    const prods=[...(S.data.products||[]),newProd];
    // 新產品：avgCost = 進貨單價，最低庫存預設 1
    const newInv=[...S.data.inventory,{productId:pid,qty,minQty:1,avgCost:unitCost,totalPurchaseCost:totalCost}];
    await saveMain({products:prods,inventory:newInv});
  }else{
    pid=prod.id;
    const inv=getInv(pid);
    const oldQty=toN(inv.qty);
    const oldAvg=toN(inv.avgCost)||toN(prod.cost)||0;
    // 加權平均：新均價 = (舊量×舊均價 + 新量×新單價) / 總量
    const newAvg=calculateNewAvgCost(oldQty,oldAvg,qty,unitCost);
    const newQty=oldQty+qty;
    const newTotalCost=toN(inv.totalPurchaseCost||0)+totalCost;
    const newInv=[...S.data.inventory.filter(i=>i.productId!==pid),
                  {productId:pid,qty:newQty,minQty:inv.minQty||1,avgCost:newAvg,totalPurchaseCost:newTotalCost}];
    // 順帶更新產品的 cost 為平均成本（顯示用）+ 補填空欄位
    const updProd={...prod,cost:newAvg};
    if(supplier&&!prod.supplier)updProd.supplier=supplier;
    if(series&&!prod.series)updProd.series=series;
    if(sellPrice>0&&!prod.price)updProd.price=sellPrice;
    const prods=(S.data.products||[]).map(p=>p.id===pid?updProd:p);
    await saveMain({inventory:newInv,products:prods});
  }
  const d=new Date(date);
  const recordName=prod?prod.name:productName.trim();
  // 付款狀態
  const paidStatus=document.querySelector('input[name="m_pPaid"]:checked')?.value||'paid';
  const payMethod=$('m_pPayMethod')?.value||'轉帳';
  const paid=paidStatus==='paid';
  // 建立進貨紀錄
  const purchaseId=uid();
  const purchaseData={
    id:purchaseId,
    date,productId:pid,productName:recordName,category,qty,unitCost,totalCost,
    supplier,series,
    paid,payMethod,paidDate:paid?date:null,
    note:$('m_p7')?.value||'',
    month:d.getMonth()+1,year:d.getFullYear()
  };
  await addSub('purchases',purchaseData);
  // 已付款 → 同步寫入支出 + 現金流
  if(paid){
    const expNote=`【進貨】${recordName} × ${qty}${supplier?'（'+supplier+'）':''}`;
    const expRef=await addSub('expenses',{
      date,category:'進貨成本',amount:totalCost,
      payMethod,note:expNote,
      fromPurchase:true,purchaseRefId:purchaseId,
      month:d.getMonth()+1,year:d.getFullYear()
    });
    await addSub('cashFlow',{
      date,amount:-totalCost,cat:'進貨支出',
      note:expNote+`（${payMethod}）`,
      fromPurchase:true,purchaseRefId:purchaseId,
      month:d.getMonth()+1,year:d.getFullYear()
    });
  }
  const finalAvg=getAvgCost(pid);
  toast(`✅ 進貨完成 ${qty} 個，平均成本更新為 $${fmt(finalAvg)}${paid?'（已記支出）':'（未付款，待結算）'}`);
  closeMod();
};

// ── 進貨：標記為已付款/取消已付款（統一在第 8420 行附近的新版實作）──
// 舊版函式已移除，避免雙重定義造成混亂

window.delPurchase=async id=>{
  try{
    const p=(S.data.purchases||[]).find(x=>x.id===id);
    if(!p){alert('找不到該筆進貨紀錄');return;}
    if(!confirm(`確認刪除「${p.productName||'此筆進貨'}」？\n\n會還原 ${p.qty||0} 個庫存${p.paid?'，並刪除對應的支出/現金流紀錄':''}`))return;
    // 還原庫存（容錯：沒有 productId 也不會卡住）
    if(p.productId){
      try{
        const inv=getInv(p.productId);
        const newQty=Math.max(0,toN(inv.qty)-toN(p.qty));
        const newInv=[...(S.data.inventory||[]).filter(i=>i.productId!==p.productId),{...inv,productId:p.productId,qty:newQty}];
        await saveMain({inventory:newInv});
      }catch(invErr){
        console.error('還原庫存失敗（將繼續刪除進貨）:',invErr);
      }
    }
    // 已付款 → 刪除對應支出/現金流
    if(p.paid){
      const exps=(S.data.expenses||[]).filter(e=>e.fromPurchase&&e.purchaseRefId===id);
      const flows=(S.data.cashFlow||[]).filter(f=>f.fromPurchase&&f.purchaseRefId===id);
      for(const e of exps){try{await delSub('expenses',e.id);}catch(err){console.error(err);}}
      for(const f of flows){try{await delSub('cashFlow',f.id);}catch(err){console.error(err);}}
    }
    await delSub('purchases',id);
    toast('✅ 已刪除進貨紀錄並還原庫存');
    render();
  }catch(err){
    console.error('刪除進貨失敗:',err);
    alert('刪除失敗：'+(err.message||err));
  }
};

window.saveStockOut=async()=>{
  try{
    const date=$('m_so0')?.value;
    const type=$('m_so1')?.value;
    const pid=$('m_so2')?.value;
    const qty=parseFloat($('m_so3')?.value)||0;
    if(!date||!type||!pid||qty<=0){alert('請填日期、類型、產品和數量');return;}
    const prod=(S.data.products||[]).find(p=>p.id===pid);
    if(!prod){alert('找不到產品');return;}
    const inv=getInv(pid);
    if(toN(inv.qty)<qty){
      if(!confirm(`⚠️ 庫存不足！\n目前庫存 ${inv.qty}，要出貨 ${qty}\n是否仍要扣除（會變負數）？`))return;
    }
    const customer=$('m_so_cust')?.value||'';
    const note=$('m_so4')?.value||'';
    const d=new Date(date);
    const cost=getStockOutCost(pid,qty);
    // 記錄出貨（只記錄成本歸屬，不寫入支出記帳，避免和進貨付款重複）
    await addSub('stockOuts',{
      date,type,
      productId:pid,
      productName:prod.name,
      qty,unitCost:getAvgCost(pid),
      totalCost:cost,
      customer,note,
      month:d.getMonth()+1,year:d.getFullYear()
    });
    // 扣庫存
    const newInv=[...S.data.inventory.filter(i=>i.productId!==pid),
                  {...inv,productId:pid,qty:toN(inv.qty)-qty}];
    await saveMain({inventory:newInv});
    // ❗ 不再寫入支出記帳！
    // 原因：進貨付款時已經記過支出（現金流出），出貨只是消耗已購買的庫存。
    // 出貨耗用的目的是「追蹤庫存」和「計算服務成本」，不應該重複記為支出。
    const typeLabels={sale:'客戶購買',self:'工作室自用',damage:'損耗報廢',gift:'贈送樣品',check:'盤點'};
    toast(`✅ ${typeLabels[type]||'出貨'} ${qty} 個，成本 $${fmt(cost)}（已扣庫存，不重複記支出）`);
    closeMod();
    render();
  }catch(err){
    console.error('saveStockOut 失敗:',err);
    alert('出貨失敗：'+(err.message||err));
  }
};
window.delStockOut=async id=>{
  const o=(S.data.stockOuts||[]).find(x=>x.id===id);
  if(!o)return;
  if(!confirm(`確認刪除這筆出貨紀錄？\n會還原 ${o.qty} 個庫存`))return;
  // 還原庫存

// ─── 簽名功能（Canvas）───────────────────
let _sigCanvas=null,_sigCtx=null,_sigDrawing=false,_sigHasContent=false;

window.initSignatureCanvas=()=>{
  const canvas=$('m_sign_canvas');
  if(!canvas)return;
  _sigCanvas=canvas;
  // 設定高解析度
  const dpr=window.devicePixelRatio||1;
  const rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr;
  canvas.height=rect.height*dpr;
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.lineWidth=2.5;
  ctx.lineCap='round';
  ctx.strokeStyle='#000';
  _sigCtx=ctx;
  _sigHasContent=false;

  function getPos(e){
    const rect=canvas.getBoundingClientRect();
    if(e.touches&&e.touches[0]){
      return{x:e.touches[0].clientX-rect.left,y:e.touches[0].clientY-rect.top};
    }
    return{x:e.clientX-rect.left,y:e.clientY-rect.top};
  }

  function start(e){
    e.preventDefault();
    _sigDrawing=true;
    const p=getPos(e);
    _sigCtx.beginPath();
    _sigCtx.moveTo(p.x,p.y);
  }
  function move(e){
    if(!_sigDrawing)return;
    e.preventDefault();
    const p=getPos(e);
    _sigCtx.lineTo(p.x,p.y);
    _sigCtx.stroke();
    _sigHasContent=true;
  }
  function end(e){
    e.preventDefault();
    _sigDrawing=false;
  }

  canvas.addEventListener('mousedown',start);
  canvas.addEventListener('mousemove',move);
  canvas.addEventListener('mouseup',end);
  canvas.addEventListener('mouseleave',end);
  canvas.addEventListener('touchstart',start,{passive:false});
  canvas.addEventListener('touchmove',move,{passive:false});
  canvas.addEventListener('touchend',end,{passive:false});
};

window.clearSignature=()=>{
  if(!_sigCanvas||!_sigCtx)return;
  _sigCtx.clearRect(0,0,_sigCanvas.width,_sigCanvas.height);
  _sigHasContent=false;
};

window.saveHealthQuestions=async()=>{
  try{
    const items=document.querySelectorAll('.hq_item');
    const qs=Array.from(items).map(el=>{
      const type=el.querySelector('.hqi_type')?.value||'text';
      const q={
        key:el.querySelector('.hqi_key')?.value||'q'+Date.now(),
        label:el.querySelector('.hqi_label')?.value?.trim()||'',
        type
      };
      if(type==='section'){
        // 章節只需要 label
        return q;
      }
      if(type==='declaration'){
        q.content=el.querySelector('.hqi_content')?.value||'';
        return q;
      }
      // 一般題目
      const ph=el.querySelector('.hqi_placeholder')?.value||'';
      if(ph)q.placeholder=ph;
      if(type==='radio'||type==='checkbox_group'){
        const opts=el.querySelector('.hqi_options')?.value||'';
        q.options=opts.split(',').map(s=>s.trim()).filter(Boolean);
      }
      return q;
    }).filter(q=>q.label);
    if(qs.length===0){alert('至少需要一題');return;}
    const settings={...(S.data.settings||{}),healthQuestions:qs};
    await saveMain({settings});
    toast('✅ 健康問卷已儲存');
    closeMod();
  }catch(err){console.error(err);alert('失敗：'+err.message);}
};

// 顯示健康問卷
window.showHealthForm=(id)=>{
  const r=(S.data.treatmentRecords||[]).find(x=>x.id===id);
  if(!r||!r.healthForm){alert('查無健康問卷資料');return;}
  // 用設定（或預設）對照題目來顯示完整 label
  const qs=S.data.settings?.healthQuestions||DEFAULT_HEALTH_QUESTIONS;
  const labelMap={};
  qs.forEach(q=>{if(q.key&&q.label)labelMap[q.key]=q.label;});
  // 依設定的順序顯示，方便閱讀
  let text='';
  let lastSection='';
  for(const q of qs){
    if(q.type==='section'){
      lastSection=q.label;
      text+=`\n━━━ ${q.label} ━━━\n`;
      continue;
    }
    if(q.type==='declaration')continue;
    const v=r.healthForm[q.key];
    if(v===undefined||v===null||v==='')continue;
    const display=Array.isArray(v)?v.join('、'):v;
    text+=`• ${q.label}：${display}\n`;
  }
  // 補上設定外的多餘 key
  const handledKeys=new Set(qs.filter(q=>q.key).map(q=>q.key));
  for(const [k,v] of Object.entries(r.healthForm)){
    if(handledKeys.has(k))continue;
    if(v===undefined||v===null||v==='')continue;
    const display=Array.isArray(v)?v.join('、'):v;
    text+=`• ${labelMap[k]||k}：${display}\n`;
  }
  alert('【首次建檔健康問卷】\n'+text+'\n填寫日期：'+(r.signedAt||r.date));
};

// 顯示服務專屬健康確認答案

window.showSkinCheck=(id)=>{
  const r=(S.data.treatmentRecords||[]).find(x=>x.id===id);
  if(!r||!r.skinCheck||Object.keys(r.skinCheck).length===0){alert('查無膚況確認紀錄');return;}
  const sc=r.skinCheck;
  let text='【今日身體狀況確認】\n';
  // 今天身體狀況
  if(sc.normal)text+='\n✓ 一切正常，與既有紀錄相同';
  else if(sc.changed){
    text+='\n⚠️ 有變化';
    if(sc.changeNote)text+='：'+sc.changeNote;
  }
  // 近兩週狀況
  const recent=[];
  if(sc.newDisease)recent.push('新的疾病/不適');
  if(sc.newMed)recent.push('新服用藥物');
  if(sc.beauty)recent.push('醫美療程');
  if(sc.injury)recent.push('受傷瘀青');
  if(sc.allClear)recent.push('以上皆無');
  if(recent.length>0)text+='\n\n近兩週狀況：\n• '+recent.join('\n• ');
  if(sc.supplement)text+='\n\n補充說明：'+sc.supplement;
  text+='\n\n填寫日期：'+(r.signedAt||r.date);
  alert(text);
};

window.showServiceHealth=(id)=>{
  const r=(S.data.treatmentRecords||[]).find(x=>x.id===id);
  if(!r||!r.serviceHealthAnswers){alert('查無資料');return;}
  // key 格式：svc_分類_題目key
  const grouped={};
  for(const [k,v] of Object.entries(r.serviceHealthAnswers)){
    const m=k.match(/^svc_([^_]+)_(.+)$/);
    if(m){
      const cat=m[1],qkey=m[2];
      if(!grouped[cat])grouped[cat]={};
      grouped[cat][qkey]=v;
    }
  }
  // 用 settings 裡的 label 對照
  const svcQs=S.data.settings?.serviceHealthQuestions||{};
  let text='【各服務專屬健康確認】\n';
  for(const [cat,answers] of Object.entries(grouped)){
    text+=`\n🔹 ${cat}\n`;
    const qs=svcQs[cat]||[];
    for(const [qkey,ans] of Object.entries(answers)){
      const q=qs.find(qq=>qq.key===qkey);
      const label=q?q.label:qkey;
      const ansShow=typeof ans==='boolean'?(ans?'是':'否'):(ans||'（未填）');
      text+=`• ${label}：${ansShow}\n`;
    }
  }
  text+='\n填寫日期：'+(r.signedAt||r.date);
  alert(text);
};

// 重新渲染後重新初始化簽名 canvas
function initSignatureCanvasInline(){
  const canvas=$('t_sign_canvas');
  if(!canvas)return;
  _sigCanvas=canvas;
  const dpr=window.devicePixelRatio||1;
  const rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr;
  canvas.height=rect.height*dpr;
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.lineWidth=2.5;
  ctx.lineCap='round';
  ctx.strokeStyle='#000';
  _sigCtx=ctx;
  _sigHasContent=false;
  if(S.treatment&&S.treatment.signature){
    const img=new Image();
    img.onload=()=>{ctx.drawImage(img,0,0,rect.width,rect.height);_sigHasContent=true;};
    img.src=S.treatment.signature;
  }
  function getPos(e){
    const r=canvas.getBoundingClientRect();
    if(e.touches&&e.touches[0])return{x:e.touches[0].clientX-r.left,y:e.touches[0].clientY-r.top};
    return{x:e.clientX-r.left,y:e.clientY-r.top};
  }
  function start(e){e.preventDefault();_sigDrawing=true;const p=getPos(e);_sigCtx.beginPath();_sigCtx.moveTo(p.x,p.y);}
  function move(e){if(!_sigDrawing)return;e.preventDefault();const p=getPos(e);_sigCtx.lineTo(p.x,p.y);_sigCtx.stroke();_sigHasContent=true;}
  function end(e){e.preventDefault();_sigDrawing=false;}
  canvas.addEventListener('mousedown',start);
  canvas.addEventListener('mousemove',move);
  canvas.addEventListener('mouseup',end);
  canvas.addEventListener('mouseleave',end);
  canvas.addEventListener('touchstart',start,{passive:false});
  canvas.addEventListener('touchmove',move,{passive:false});
  canvas.addEventListener('touchend',end,{passive:false});
}

// ── 完成療程：寫入銷售紀錄 + 療程紀錄 + 簽名 ──
window.finalizeTreatment=async()=>{
  try{
    const t=S.treatment;
    if(!t)return;
    if(!t.customer){alert('找不到客戶');return;}
    if(!t.agreed){alert('⚠️ 請勾選「已詳閱並同意上述條款」');return;}
    // 首次建檔需勾選健康聲明
    if(t.mode==='newCustomer'&&!t.healthAgreed){
      alert('⚠️ 首次建檔需勾選「健康狀況真實聲明」同意框');return;
    }
    // 如果有打開網路公開授權，但客戶沒勾同意 → 提示但不擋（讓老師決定）
    if(t.publishOptIn&&!t.publishAgreed){
      if(!confirm('⚠️ 您打開了「網路公開使用授權」但客戶尚未勾選同意。\n\n是否要繼續完成（不取得網路公開授權）？\n\n按「確定」=客戶不同意網路公開（僅服務內部使用）\n按「取消」=回去請客戶勾選'))return;
    }
    if(!_sigCanvas||!_sigHasContent){alert('⚠️ 請先簽名');return;}
    const dataURL=_sigCanvas.toDataURL('image/png');
    const studioName=S.data.settings?.studioName||'沐蜜美容工作室';
    const termsMap=S.data.settings?.termsMap||{};
    let termsSnapshot=termsMap['預設（通用）']||'';
    const svcNames=t.services.map(s=>s.name||'').join(' ');
    for(const k of Object.keys(termsMap)){
      if(k==='預設（通用）')continue;
      const kw=k.substring(0,2);
      if(svcNames.includes(kw)||svcNames.includes(k)){termsSnapshot=termsMap[k];break;}
    }
    const d=new Date(t.date);
    const month=d.getMonth()+1;
    const year=d.getFullYear();
    const totalServices=t.services.reduce((s,sv)=>s+toN(sv.price),0);
    const totalProducts=t.products.reduce((s,p)=>s+toN(p.price)*toN(p.qty||1),0);
    const totalAmount=totalServices+totalProducts;
    // 1. 自動建客戶（如果不存在）
    if(!(S.data.customers||[]).find(c=>(c.name||'').trim()===t.customer)){
      const customers=[...(S.data.customers||[]),{id:uid(),name:t.customer,phone:'',createdAt:today()}];
      await saveMain({customers});
    }
    // 2. 寫入銷售紀錄（每筆服務 + 每筆產品）
    const realRevenueRate=t.payMethod==='儲值扣款'?(getCustomerDiscountRate(t.customer)||1):1;
    for(const sv of t.services){
      const real=Math.round(toN(sv.price)*realRevenueRate);
      await addSub('sales',{
        date:t.date,type:'service',item:sv.name,
        amount:real,unitPrice:sv.price,qty:1,
        payMethod:t.payMethod,staff:t.staff,customer:t.customer,
        commissionRate:DEFAULT_COMMISSION_RATE,commissionBase:'face',
        month,year
      });
    }
    for(const p of t.products){
      const real=Math.round(toN(p.price)*toN(p.qty||1)*realRevenueRate);
      const saleId=await addSub('sales',{
        date:t.date,type:'product',item:p.name,
        amount:real,unitPrice:p.price,qty:p.qty||1,
        payMethod:t.payMethod,staff:t.staff,customer:t.customer,
        commissionRate:0,commissionBase:'face',
        month,year
      });
      // 扣庫存 + 建出貨紀錄
      if(p.productId){
        const inv=getInv(p.productId);
        const newQty=Math.max(0,toN(inv.qty)-toN(p.qty||1));
        const newInv=[...S.data.inventory.filter(i=>i.productId!==p.productId),{...inv,productId:p.productId,qty:newQty,minQty:inv.minQty||1}];
        await saveMain({inventory:newInv});
        try{
          await addSub('stockOuts',{
            date:t.date,type:'sale',
            productId:p.productId,productName:p.name,
            qty:p.qty||1,unitCost:getAvgCost(p.productId),
            totalCost:getStockOutCost(p.productId,p.qty||1),
            customer:t.customer,note:'療程結帳銷售',
            month,year
          });
        }catch(e){console.warn(e);}
      }
    }
    // 3. 處理儲值扣款
    if(t.payMethod==='儲值扣款'){
      // 暫時不額外處理 — 簡化：認列營收已套用折扣
    }
    // 4. 寫入療程紀錄（含簽名）
    const allProductsUsed=[];
    for(const sv of t.services){
      (sv.productsUsed||[]).forEach(pu=>allProductsUsed.push(pu));
    }
    t.products.forEach(p=>{
      if(p.productId)allProductsUsed.push({productId:p.productId,qty:p.qty||1,unit:'瓶'});
    });
    const treatRec={
      id:uid(),
      customer:t.customer,
      date:t.date,
      serviceName:t.services.map(s=>s.name).join('、')||'-',
      duration:t.services.reduce((s,sv)=>s+toN(sv.duration),0),
      staff:t.staff,
      skinCondition:t.skinCondition||'',
      productsUsed:allProductsUsed,
      feedback:t.feedback||'',
      nextSuggestion:t.nextSuggestion||'',
      signature:dataURL,
      signedAt:nowLocal(),
      agreed:true,
      agreedAt:new Date().toISOString(),
      termsSnapshot,
      studioSnapshot:studioName,
      // 影像紀錄說明（必告知）
      imageRecordDisclosed:true,
      // 網路公開授權
      publishAuthorized:t.publishOptIn&&t.publishAgreed?true:false,
      publishAuthorizedAt:t.publishOptIn&&t.publishAgreed?new Date().toISOString():null,
      // 膚況/身體狀況快速確認單
      skinCheck:t.skinCheck||null,
      // 各服務專屬健康確認答案
      serviceHealthAnswers:t.serviceHealthAnswers||null,
      // 首次建檔資料（如果有）
      isFirstVisit:t.mode==='newCustomer',
      healthForm:t.mode==='newCustomer'?(t.healthForm||{}):null,
      healthAgreed:t.mode==='newCustomer'?(t.healthAgreed===true):null,
      totalAmount,
      payMethod:t.payMethod,
      createdAt:new Date().toISOString()
    };
    const records=[...(S.data.treatmentRecords||[]),treatRec];
    await saveMain({treatmentRecords:records});
    toast(`✅ 療程完成！總額 $${fmt(totalAmount)}　感謝光臨 🌸`);
    // 5. 清空 treatment 狀態
    S.treatment=null;
    render();
  }catch(err){
    console.error('finalizeTreatment 失敗:',err);
    alert('失敗：'+(err.message||err));
  }
};

window.calcPricerLive=()=>{
  collectPricerItems();
  const commPercent=parseFloat($('m_pc_comm')?.value)||60;
  const commRate=commPercent/100;
  const targetMargin=parseFloat($('m_pc_target')?.value)||30;
  const targetRate=targetMargin/100;
  const fixed=parseFloat($('m_pc_fixed')?.value)||0;
  // 材料成本：用單位成本 × 用量
  const materialCost=S.modal.calcItems.reduce((s,it)=>s+Math.round(getUnitCost(it.productId)*toN(it.qty)),0);
  // 倒推：售價 = (材料 + 攤分) / (1 - 抽成 - 期望淨利)
  const denominator=1-commRate-targetRate;
  const suggestedPrice=denominator>0?Math.ceil((materialCost+fixed)/denominator/100)*100:0;
  // 模擬抽成、淨利
  const commission=Math.round(suggestedPrice*commRate);
  const netProfit=suggestedPrice-materialCost-commission-fixed;
  const actualMargin=suggestedPrice>0?Math.round(netProfit/suggestedPrice*100):0;
  const wrap=$('m_pc_result');
  if(!wrap)return;
  if(materialCost===0){
    wrap.innerHTML='<div class="tm" style="text-align:center;padding:14px;">請先新增材料</div>';
    return;
  }
  if(denominator<=0){
    wrap.innerHTML=`<div style="color:var(--red);text-align:center;padding:14px;">⚠️ 抽成率 ${commPercent}% + 期望淨利率 ${targetMargin}% = ${commPercent+targetMargin}% 已超過 100%，無法達成。請降低抽成或淨利目標</div>`;
    return;
  }
  wrap.innerHTML=`
    <div style="font-weight:700;font-size:18px;color:var(--pur);margin-bottom:10px;">📐 建議售價：$${fmt(suggestedPrice)}</div>
    <div class="tw"><table style="font-size:13px;">
      <tbody>
        <tr><td>📦 材料成本</td><td class="tm">${S.modal.calcItems.length} 項</td><td class="an">$${fmt(materialCost)}</td></tr>
        <tr><td>👩‍💼 老師抽成（${commPercent}%）</td><td class="tm">$${fmt(suggestedPrice)} × ${commPercent}%</td><td class="an">$${fmt(commission)}</td></tr>
        <tr><td>🏪 固定攤分</td><td class="tm">每筆攤分</td><td class="an">$${fmt(fixed)}</td></tr>
        <tr style="background:var(--bg2);font-weight:700;"><td>總成本</td><td></td><td class="an">$${fmt(materialCost+commission+fixed)}</td></tr>
        <tr style="background:var(--grnL);font-weight:700;"><td style="color:var(--grn);">公司淨利</td><td class="tm">${actualMargin}% 淨利率</td><td style="color:var(--grn);">$${fmt(netProfit)}</td></tr>
      </tbody>
    </table></div>
    <div class="tm" style="margin-top:8px;font-size:12px;">
      💡 公式：建議售價 = (材料 $${fmt(materialCost)} + 攤分 $${fmt(fixed)}) ÷ (1 - 抽成 ${commPercent}% - 淨利 ${targetMargin}%)
    </div>
  `;
};

    if(denominator<=0){alert('抽成 + 淨利目標已超過 100%');return;}
    const suggestedPrice=Math.ceil((materialCost+fixed)/denominator/100)*100;
    const card={
      id:uid(),
      name,
      duration:0,
      price:suggestedPrice,
      commissionRate:commRate,
      items:S.modal.calcItems.filter(it=>it.productId&&toN(it.qty)>0)
    };
    const cards=[...(S.data.serviceCosts||[]),card];
    await saveMain({serviceCosts:cards});
    toast(`✅ 已存為服務成本卡，建議售價 $${fmt(suggestedPrice)}`);
    closeMod();
  }catch(err){
    console.error('saveAsServiceCard 失敗:',err);
    alert('失敗：'+(err.message||err));
  }
};

// 整組進貨：自動計算各品項成本
window.recalcGroupCosts=()=>{
  if(!S.modal||S.modal.t!=='batchPurchase'||!S.modal.groupMode)return;
  const groupTotal=parseFloat($('m_bpGroupTotal')?.value)||0;
  const splitMode=$('m_bpSplitMode')?.value||'price';
  const rowEls=document.querySelectorAll('.batch-row');
  // 收集每列的數量、售價
  const items=Array.from(rowEls).map(el=>({
    qty:parseFloat(el.querySelector('.bp_qty')?.value)||0,
    price:parseFloat(el.querySelector('.bp_price')?.value)||0,
    el
  }));
  let hint='';
  if(groupTotal<=0){
    items.forEach(it=>{if(it.el.querySelector('.bp_unit'))it.el.querySelector('.bp_unit').value='';});
    hint='請先填整組總成本';
  }else if(splitMode==='even'){
    // 平均：總成本 / 總件數（含數量）
    const totalQty=items.reduce((s,it)=>s+it.qty,0);
    if(totalQty<=0){
      items.forEach(it=>{if(it.el.querySelector('.bp_unit'))it.el.querySelector('.bp_unit').value='';});
      hint='請先填數量';
    }else{
      const avgUnit=Math.round(groupTotal/totalQty*100)/100;
      items.forEach(it=>{if(it.el.querySelector('.bp_unit'))it.el.querySelector('.bp_unit').value=avgUnit;});
      const totalSale=items.reduce((s,it)=>s+it.qty*it.price,0);
      const margin=totalSale>0?Math.round((totalSale-groupTotal)/totalSale*100):0;
      hint=`平均單價 $${fmt(avgUnit)}/件 ｜ 預計售價總和 $${fmt(totalSale)} ｜ 整組毛利率 ${margin}%`;
    }
  }else{
    // 按售價比例
    const totalSale=items.reduce((s,it)=>s+it.qty*it.price,0);
    if(totalSale<=0){
      items.forEach(it=>{if(it.el.querySelector('.bp_unit'))it.el.querySelector('.bp_unit').value='';});
      hint='請先填各品項的售價';
    }else{
      let allocated=0;
      items.forEach((it,i)=>{
        if(it.qty<=0||it.price<=0){
          if(it.el.querySelector('.bp_unit'))it.el.querySelector('.bp_unit').value='';
          return;
        }
        const itemSaleTotal=it.qty*it.price;
        // 該品項分到的成本比例
        const allocatedCost=i===items.length-1?groupTotal-allocated:Math.round(itemSaleTotal/totalSale*groupTotal);
        const unitCost=Math.round(allocatedCost/it.qty*100)/100;
        if(it.el.querySelector('.bp_unit'))it.el.querySelector('.bp_unit').value=unitCost;
        allocated+=allocatedCost;
      });
      const margin=Math.round((totalSale-groupTotal)/totalSale*100);
      hint=`售價總和 $${fmt(totalSale)} ｜ 整組成本 $${fmt(groupTotal)} ｜ 整組毛利率 <b>${margin}%</b>`;
    }
  }
  if($('m_bpGroupHint'))$('m_bpGroupHint').innerHTML=hint;
};

window.saveBatchPurchase=async()=>{
  const date=$('m_bpDate')?.value||today();
  const supSel=$('m_bpSup')?.value;
  const supplier=supSel==='其他手動輸入廠商'?($('m_bpSupC')?.value||'').trim():supSel;
  collectBatchRows();
  const validRows=S.modal.rows.filter(r=>(r.productId||r.name)&&toN(r.qty)>0);
  if(validRows.length===0){alert('請至少填寫一筆有效資料（選擇現有產品或填寫名稱+數量）');return;}
  const isGroup=S.modal.groupMode||false;
  const groupTotal=parseFloat($('m_bpGroupTotal')?.value)||0;
  if(isGroup&&groupTotal<=0){alert('請填整組總成本');return;}
  // 整批付款狀態
  const paidStatus=document.querySelector('input[name="m_bpPaid"]:checked')?.value||'paid';
  const payMethod=$('m_bpPayMethod')?.value||'轉帳';
  const paid=paidStatus==='paid';
  const d=new Date(date);
  let count=0;
  let totalAllCost=0;
  let groupNote=isGroup?`整組 $${fmt(groupTotal)}`:'';
  for(const r of validRows){
    const qty=toN(r.qty);
    const unitCost=toN(r.unit);
    const sellPrice=toN(r.price);
    const totalCost=qty*unitCost;
    totalAllCost+=totalCost;
    // 優先：用 productId 直接找產品（避免名稱比對問題）
    let prod=null;
    if(r.productId){
      prod=(S.data.products||[]).find(p=>p.id===r.productId);
    }
    // 次選：用名稱+類別比對（兩邊 trim 並去除空白避免重複建立）
    if(!prod&&r.name){
      const tName=r.name.trim().replace(/[\u3000\s]+/g,'');
      prod=(S.data.products||[]).find(p=>(p.name||'').trim().replace(/[\u3000\s]+/g,'')===tName&&p.category===r.cat);
    }
    let pid;
    if(!prod){
      pid=uid();
      const newProd={id:pid,name:r.name.trim(),category:r.cat,price:sellPrice,cost:unitCost,supplier};
      S.data.products=[...(S.data.products||[]),newProd];
      S.data.inventory=[...S.data.inventory,{productId:pid,qty,minQty:1,avgCost:unitCost,totalPurchaseCost:totalCost}];
    }else{
      pid=prod.id;
      const inv=getInv(pid);
      const oldQty=toN(inv.qty);
      const oldAvg=toN(inv.avgCost)||toN(prod.cost)||0;
      const newAvg=calculateNewAvgCost(oldQty,oldAvg,qty,unitCost);
      const newTotalCost=toN(inv.totalPurchaseCost||0)+totalCost;
      S.data.inventory=[...S.data.inventory.filter(i=>i.productId!==pid),
                       {productId:pid,qty:oldQty+qty,minQty:inv.minQty||1,avgCost:newAvg,totalPurchaseCost:newTotalCost}];
      S.data.products=(S.data.products||[]).map(p=>p.id===pid?{
        ...p,cost:newAvg,
        supplier:p.supplier||supplier,
        price:p.price||sellPrice
      }:p);
    }
    const purchaseId=uid();
    // 名稱優先順序：選了現有產品時 → 用該產品名稱（避免下拉顯示 vs 儲存不一致）
    //              沒選現有產品時 → 用輸入框名稱（新建產品）
    const finalProductName=prod?(prod.name||''):(r.name?r.name.trim():'');
    const purchaseData={
      id:purchaseId,
      date,productId:pid,productName:finalProductName,
      category:r.cat,qty,unitCost,totalCost,supplier,
      paid,payMethod,paidDate:paid?date:null,
      note:groupNote,
      month:d.getMonth()+1,year:d.getFullYear()
    };
    await addSub('purchases',purchaseData);
    if(paid){
      const expNote=`【進貨】${purchaseData.productName} × ${qty}${supplier?'（'+supplier+'）':''}`;
      await addSub('expenses',{
        date,category:'進貨成本',amount:totalCost,
        payMethod,note:expNote,
        fromPurchase:true,purchaseRefId:purchaseId,
        month:d.getMonth()+1,year:d.getFullYear()
      });
      await addSub('cashFlow',{
        date,amount:-totalCost,cat:'進貨支出',
        note:expNote+`（${payMethod}）`,
        fromPurchase:true,purchaseRefId:purchaseId,
        month:d.getMonth()+1,year:d.getFullYear()
      });
    }
    count++;
  }
  await saveMain({products:S.data.products,inventory:S.data.inventory});
  toast(`✅ 已批次新增 ${count} 筆進貨，總成本 $${fmt(totalAllCost)}${paid?'（已記支出）':'（未付款，待結算）'}`);
  closeMod();
};

// ── 月度盤點：計算單筆差異 + 即時更新摘要 ──
window.calcStockDiff=(input)=>{
  const tr=input.closest('tr');
  if(!tr)return;
  const systemQty=parseFloat(input.dataset.systemqty)||0;
  const actual=input.value===''?null:parseFloat(input.value);
  const diffCell=tr.querySelector('.msc_diff');
  if(actual===null||isNaN(actual)){
    diffCell.textContent='-';
    diffCell.style.color='';
  }else{
    const diff=actual-systemQty;
    if(diff===0){
      diffCell.textContent='✓ 一致';
      diffCell.style.color='var(--grn)';
    }else if(diff>0){
      diffCell.textContent=`+${diff}`;
      diffCell.style.color='var(--blu)';
    }else{
      diffCell.textContent=`${diff}`;
      diffCell.style.color='var(--red)';
    }
  }
  // 更新摘要
  const allRows=document.querySelectorAll('.msc_actual');
  let filled=0,match=0,shortage=0,surplus=0,shortQty=0,surplusQty=0;
  allRows.forEach(el=>{
    if(el.value==='')return;
    filled++;
    const sys=parseFloat(el.dataset.systemqty)||0;
    const act=parseFloat(el.value)||0;
    const d=act-sys;
    if(d===0)match++;
    else if(d<0){shortage++;shortQty+=Math.abs(d);}
    else{surplus++;surplusQty+=d;}
  });
  const summary=$('m_msc_summary');
  const text=$('m_msc_summary_text');
  if(filled>0&&summary&&text){
    summary.style.display='block';
    let html=`已盤點 <b>${filled}</b> 項　`;
    if(match>0)html+=`<span style="color:var(--grn);">✓ ${match} 項一致</span>　`;
    if(shortage>0)html+=`<span style="color:var(--red);">▼ ${shortage} 項短少 (共 -${shortQty})</span>　`;
    if(surplus>0)html+=`<span style="color:var(--blu);">▲ ${surplus} 項盤盈 (共 +${surplusQty})</span>`;
    text.innerHTML=html;
  }else if(summary){
    summary.style.display='none';
  }
};

window.saveMonthStockCheck=async()=>{
  try{
    const date=$('m_msc_date')?.value;
    const by=$('m_msc_by')?.value||'';
    if(!date){alert('請選擇盤點日期');return;}
    const rows=document.querySelectorAll('tr[data-pid]');
    if(rows.length===0){alert('沒有可盤點的產品');return;}
    let updates=[];
    let stats={total:0,match:0,shortage:0,surplus:0,shortQty:0,surplusQty:0};
    rows.forEach(row=>{
      const pid=row.dataset.pid;
      const input=row.querySelector('.msc_actual');
      if(!input||input.value==='')return;
      const actual=parseFloat(input.value);
      if(isNaN(actual))return;
      const systemQty=parseFloat(input.dataset.systemqty)||0;
      const diff=actual-systemQty;
      stats.total++;
      if(diff===0)stats.match++;
      else if(diff<0){stats.shortage++;stats.shortQty+=Math.abs(diff);}
      else{stats.surplus++;stats.surplusQty+=diff;}
      updates.push({pid,actual,systemQty,diff});
    });
    if(updates.length===0){alert('請至少填寫一筆實際庫存');return;}
    let confirmMsg=`確認執行盤點？\n\n盤點日期：${date}\n盤點 ${updates.length} 項`;
    if(stats.match>0)confirmMsg+=`\n✓ ${stats.match} 項一致`;
    if(stats.shortage>0)confirmMsg+=`\n▼ ${stats.shortage} 項短少（共 -${stats.shortQty}）`;
    if(stats.surplus>0)confirmMsg+=`\n▲ ${stats.surplus} 項盤盈（共 +${stats.surplusQty}）`;
    confirmMsg+=`\n\n系統庫存將被覆蓋為實際盤點數量`;
    if(!confirm(confirmMsg))return;
    // 更新庫存 + 為差異建立 stockOuts 紀錄
    const newInv=[...(S.data.inventory||[])];
    const d=new Date(date);
    for(const u of updates){
      const idx=newInv.findIndex(i=>i.productId===u.pid);
      const old=idx>=0?newInv[idx]:{productId:u.pid,qty:0,minQty:1};
      const updated={...old,qty:u.actual};
      if(idx>=0)newInv[idx]=updated;
      else newInv.push(updated);
      // 為差異建立 stockOuts 紀錄（僅當有差異時）
      if(u.diff!==0){
        const prod=(S.data.products||[]).find(p=>p.id===u.pid);
        const type=u.diff<0?'damage':'gift';  // 短少→損耗、盤盈→其他（用 gift 暫代）
        const note=u.diff<0?`【月度盤點短少】${date}　應有 ${u.systemQty} → 實際 ${u.actual}`:`【月度盤點盤盈】${date}　應有 ${u.systemQty} → 實際 ${u.actual}`;
        try{
          await addSub('stockOuts',{
            date,
            type:'check',  // 盤點類型
            productId:u.pid,
            productName:prod?.name||'',
            qty:Math.abs(u.diff),
            unitCost:getAvgCost(u.pid),
            totalCost:Math.abs(u.diff)*getAvgCost(u.pid),
            note,
            checkBy:by,
            isShortage:u.diff<0,
            month:d.getMonth()+1,year:d.getFullYear()
          });
        }catch(e){console.warn('盤點紀錄失敗',e);}
      }
    }
    await saveMain({inventory:newInv});
    toast(`✅ 盤點完成 ${updates.length} 項　${date}`);
    closeMod();
  }catch(err){
    console.error('saveMonthStockCheck 失敗:',err);
    alert('失敗：'+(err.message||err));
  }
};

// 檢查孤兒現金流紀錄（儲值入帳但找不到對應的 deposits 紀錄）
window.findOrphanCashFlows=async()=>{
  const cashFlows=S.data.cashFlow||[];
  const deposits=S.data.deposits||[];
  const orphans=[];
  cashFlows.forEach(c=>{
    if(c.cat!=='儲值入帳')return;
    // 找對應的 deposit
    const noteCustomer=(c.note||'').split(' ')[0]; // 例如 "吃早餐 儲值面額..." → "吃早餐"
    const targetAmount=toN(c.amount);
    const found=deposits.find(d=>
      d.date===c.date&&
      toN(d.actualReceived||d.amount)===targetAmount&&
      ((d.customer||'').trim()===(noteCustomer||'').trim()||(c.note||'').includes(d.customer||''))
    );
    if(!found)orphans.push(c);
  });
  if(orphans.length===0){
    alert('✅ 沒有孤兒紀錄，現金流資料一致！');
    return;
  }
  const list=orphans.map(o=>`• ${o.date}　$${fmt(o.amount)}　${o.note||''}`).join('\n');
  if(!confirm(`找到 ${orphans.length} 筆孤兒紀錄（已刪除儲值但紀錄還在）：\n\n${list}\n\n是否一鍵清除？`))return;
  for(const o of orphans){await delSub('cashFlow',o.id);}
  toast(`✅ 已清除 ${orphans.length} 筆孤兒紀錄`);
  render();
};

window.confirmDeleteTestCustomer=async()=>{
  const name=$('m_delc')?.value?.trim();
  if(!name){alert('請輸入客戶名稱');return;}
  // 找出所有相關紀錄
  const sales=(S.data.sales||[]).filter(s=>(s.customer||'').trim()===name);
  const deposits=(S.data.deposits||[]).filter(d=>(d.customer||'').trim()===name);
  const records=(S.data.treatmentRecords||[]).filter(r=>(r.customer||'').trim()===name);
  const stockOuts=(S.data.stockOuts||[]).filter(s=>(s.customer||'').trim()===name);
  const cashFlows=(S.data.cashFlow||[]).filter(c=>(c.note||'').includes(name));
  const customer=(S.data.customers||[]).find(c=>(c.name||'').trim()===name);
  const total=sales.length+deposits.length+records.length+stockOuts.length+cashFlows.length+(customer?1:0);
  if(total===0){
    alert(`找不到客戶「${name}」的任何紀錄`);
    return;
  }
  const summary=`【找到以下紀錄】\n`+
    `• 銷售紀錄：${sales.length} 筆\n`+
    `• 儲值紀錄：${deposits.length} 筆\n`+
    `• 療程紀錄：${records.length} 筆\n`+
    `• 出貨耗用：${stockOuts.length} 筆\n`+
    `• 現金流：${cashFlows.length} 筆\n`+
    `• 客戶建檔：${customer?'1 筆':'0 筆'}\n\n`+
    `⚠️ 確認刪除「${name}」的全部 ${total} 筆紀錄嗎？\n此操作無法復原！`;
  if(!confirm(summary))return;
  // 開始刪除
  for(const s of sales)await delSub('sales',s.id);
  for(const d of deposits)await delSub('deposits',d.id);
  for(const s of stockOuts)await delSub('stockOuts',s.id);
  for(const c of cashFlows)await delSub('cashFlow',c.id);
  // treatmentRecords 是存在主文件中的
  if(records.length>0){
    const remaining=(S.data.treatmentRecords||[]).filter(r=>(r.customer||'').trim()!==name);

  }
  if(customer){
    const remaining=(S.data.customers||[]).filter(c=>(c.name||'').trim()!==name);
    await saveMain({customers:remaining});
  }
  toast(`✅ 已刪除「${name}」共 ${total} 筆紀錄`);
  closeMod();
  render();
};

// ─── 儲值資料健檢（全面掃描儲值資料一致性） ───
window.depositHealthCheck=async()=>{
  const deposits=S.data.deposits||[];
  const sales=S.data.sales||[];
  const customers=S.data.customers||[];
  const cashFlow=S.data.cashFlow||[];

  // 1. 基本數字
  const totalFaceAmount=deposits.reduce((s,d)=>s+toN(d.amount),0);
  const totalCashReceived=deposits.reduce((s,d)=>s+toN(d.actualReceived||d.amount),0);
  const totalDiscount=totalFaceAmount-totalCashReceived;

  // 2. 已使用的儲值（從 sales 統計）
  const depositSales=sales.filter(s=>s.payMethod==='儲值扣款');
  const totalUsed=depositSales.reduce((s,r)=>s+toN(r.depositFaceAmount||r.amount),0);

  // 3. 理論餘額 = 累計儲值 - 累計扣款
  const theoreticalBalance=totalFaceAmount-totalUsed;

  // 4. 系統顯示的負債餘額（透過每個客戶加總）
  const systemDisplayBalance=getTotalDepositLiability();

  // 5. 差異
  const diff=theoreticalBalance-systemDisplayBalance;

  // 6. 各客戶餘額明細
  const custBalances={};
  deposits.forEach(d=>{
    const name=(d.customer||'').trim();
    if(!name)return;
    custBalances[name]=(custBalances[name]||0)+toN(d.amount);
  });
  depositSales.forEach(s=>{
    const owner=((s.depositOwner||s.customer)||'').trim();
    if(!owner)return;
    custBalances[owner]=(custBalances[owner]||0)-toN(s.depositFaceAmount||s.amount);
  });

  // 7. 偵測問題
  const issues=[];

  // 問題 A：負餘額（扣超過儲值）
  const negativeBalances=Object.entries(custBalances).filter(([n,b])=>b<-1);// 容許 $1 誤差
  if(negativeBalances.length>0){
    issues.push({
      type:'negative',
      severity:'high',
      title:`${negativeBalances.length} 位客戶餘額為負`,
      detail:negativeBalances.map(([n,b])=>`• ${n}: $${fmt(b)}`).join('\n'),
      action:'這代表扣款超過儲值。請檢查是否誤扣，或補登儲值紀錄。'
    });
  }

  // 問題 B：無歸屬扣款（payMethod=儲值扣款 但無 customer 或 depositOwner）
  const orphanedSales=depositSales.filter(s=>{
    const owner=((s.depositOwner||s.customer)||'').trim();
    return !owner;
  });
  if(orphanedSales.length>0){
    issues.push({
      type:'orphan_sale',
      severity:'high',
      title:`${orphanedSales.length} 筆儲值扣款沒有歸屬客戶`,
      detail:orphanedSales.slice(0,5).map(s=>`• ${s.date} $${fmt(s.amount)} - ${s.serviceName||'未填'}`).join('\n')+(orphanedSales.length>5?`\n... 還有 ${orphanedSales.length-5} 筆`:''),
      action:'這些扣款沒有從任何客戶餘額扣，會造成系統負債餘額虛高。需要編輯這些銷售紀錄，指定客戶。'
    });
  }

  // 問題 C：儲值客戶不存在於客戶名單
  const depositCustomers=new Set(deposits.map(d=>(d.customer||'').trim()).filter(n=>n));
  const customerNames=new Set(customers.map(c=>(c.name||'').trim()).filter(n=>n));
  const ghostCustomers=Array.from(depositCustomers).filter(n=>!customerNames.has(n));
  if(ghostCustomers.length>0){
    issues.push({
      type:'ghost',
      severity:'low',
      title:`${ghostCustomers.length} 位儲值客戶未正式建檔`,
      detail:ghostCustomers.map(n=>`• ${n}`).join('\n'),
      action:'這些客戶有儲值但沒在「客戶管理」建檔。不影響餘額計算，建議到客戶管理頁正式建檔。'
    });
  }

  // 問題 D：deposit 缺 actualReceived（無法計算折扣率）
  const missingActual=deposits.filter(d=>!toN(d.actualReceived)&&toN(d.amount)>0);
  if(missingActual.length>0){
    issues.push({
      type:'missing_cash',
      severity:'medium',
      title:`${missingActual.length} 筆儲值未填「實收金額」`,
      detail:missingActual.slice(0,5).map(d=>`• ${d.date} ${d.customer} 面額 $${fmt(d.amount)}`).join('\n')+(missingActual.length>5?`\n... 還有 ${missingActual.length-5} 筆`:''),
      action:'未填實收金額會導致折扣率無法計算（預設 100% 無折扣）。請編輯這些紀錄補填。'
    });
  }

  // 問題 E：系統餘額 vs 理論餘額不一致
  if(Math.abs(diff)>1){
    issues.push({
      type:'balance_mismatch',
      severity:'high',
      title:`總負債餘額不一致（差 $${fmt(Math.abs(diff))}）`,
      detail:`理論餘額（總儲值面額 - 總使用面額）= $${fmt(theoreticalBalance)}\n系統顯示負債餘額 = $${fmt(systemDisplayBalance)}\n差距 = $${fmt(diff)}`,
      action:diff>0?'系統顯示餘額比理論少（可能有客戶被刪除但儲值還在計算中，或有歸屬錯誤）':'系統顯示餘額比理論多（可能有重複的儲值紀錄）'
    });
  }

  // 問題 F：儲值有對應的現金流嗎？
  const depositsWithoutFlow=deposits.filter(d=>{
    if(!toN(d.actualReceived))return false;// 沒實收金額不需要現金流
    const hasFlow=cashFlow.some(f=>f.depositRefId===d.id||(f.note||'').includes(`儲值-${d.customer}`));
    return !hasFlow;
  });
  if(depositsWithoutFlow.length>0&&depositsWithoutFlow.length<deposits.length){// 全部沒有就不是 bug
    issues.push({
      type:'no_cashflow',
      severity:'low',
      title:`${depositsWithoutFlow.length} 筆儲值沒有對應現金流紀錄`,
      detail:depositsWithoutFlow.slice(0,3).map(d=>`• ${d.date} ${d.customer} $${fmt(d.actualReceived)}`).join('\n'),
      action:'這些儲值收到的錢沒寫入現金流水帳，會影響現金流分析。可手動補登或從現金流頁面新增。'
    });
  }

  // 顯示報告
  const reportHTML=`<div class="mttl">🩺 儲值資料健檢報告</div>
    <div style="max-height:60vh;overflow-y:auto;padding:4px;">

      <!-- 一、總覽 -->
      <div style="background:linear-gradient(135deg,var(--goldL),#fff);padding:14px;border-radius:8px;margin-bottom:14px;">
        <div style="font-weight:700;color:var(--gold);margin-bottom:10px;font-size:15px;">📊 整體儲值狀況</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;font-size:13px;">
          <div style="background:#fff;padding:8px 10px;border-radius:6px;">
            <div class="tm" style="font-size:11px;">儲值筆數</div>
            <div style="font-weight:700;color:var(--gold);font-size:16px;">${deposits.length} 筆</div>
          </div>
          <div style="background:#fff;padding:8px 10px;border-radius:6px;">
            <div class="tm" style="font-size:11px;">累計儲值面額</div>
            <div style="font-weight:700;color:var(--rose);font-size:16px;">$${fmt(totalFaceAmount)}</div>
          </div>
          <div style="background:#fff;padding:8px 10px;border-radius:6px;">
            <div class="tm" style="font-size:11px;">累計實收現金</div>
            <div style="font-weight:700;color:var(--grn);font-size:16px;">$${fmt(totalCashReceived)}</div>
          </div>
          <div style="background:#fff;padding:8px 10px;border-radius:6px;">
            <div class="tm" style="font-size:11px;">累計折扣讓利</div>
            <div style="font-weight:700;color:var(--red);font-size:16px;">$${fmt(totalDiscount)}</div>
          </div>
          <div style="background:#fff;padding:8px 10px;border-radius:6px;">
            <div class="tm" style="font-size:11px;">已使用面額</div>
            <div style="font-weight:700;color:var(--blu);font-size:16px;">$${fmt(totalUsed)}</div>
          </div>
          <div style="background:#fff;padding:8px 10px;border-radius:6px;">
            <div class="tm" style="font-size:11px;">剩餘負債</div>
            <div style="font-weight:700;color:var(--pur);font-size:16px;">$${fmt(systemDisplayBalance)}</div>
          </div>
        </div>
        <div style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--bdr);font-size:12px;color:var(--mut);">
          理論餘額：$${fmt(theoreticalBalance)}（總儲值 $${fmt(totalFaceAmount)} - 已使用 $${fmt(totalUsed)}）<br>
          系統顯示：$${fmt(systemDisplayBalance)}<br>
          差距：${Math.abs(diff)<=1?'<b style="color:var(--grn);">✅ 一致</b>':`<b style="color:var(--red);">⚠️ $${fmt(Math.abs(diff))}</b>`}
        </div>
      </div>

      <!-- 二、客戶餘額明細 -->
      <div style="margin-bottom:14px;">
        <div style="font-weight:700;color:var(--pur);margin-bottom:8px;font-size:14px;">📋 各客戶儲值餘額明細</div>
        <div style="background:var(--bg2);border-radius:8px;padding:8px;">
          ${Object.entries(custBalances).filter(([n,b])=>b!==0).sort((a,b)=>b[1]-a[1]).map(([n,b])=>{
            const color=b<0?'var(--red)':b===0?'var(--mut)':'var(--gold)';
            return`<div style="display:flex;justify-content:space-between;padding:4px 8px;border-bottom:1px solid var(--bdr);font-size:13px;">
              <span>${n}</span>
              <b style="color:${color};">$${fmt(b)}</b>
            </div>`;
          }).join('')}
        </div>

window.findDuplicatePurchases=async()=>{
  const purchases=S.data.purchases||[];
  // 用「日期+產品名+金額+數量」做指紋，找出重複
  const groups={};
  purchases.forEach(p=>{
    const fp=`${p.date||''}_${(p.productName||'').trim()}_${p.qty||0}_${p.totalCost||0}`;
    if(!groups[fp])groups[fp]=[];
    groups[fp].push(p);
  });
  const dupGroups=Object.entries(groups).filter(([_,arr])=>arr.length>1);
  if(dupGroups.length===0){
    alert('✅ 沒有發現重複的進貨紀錄，資料是乾淨的！');

// 刪除單筆重複進貨（不還原庫存，因為已經是重複輸入的）
window.deleteDupePurchase=async(id)=>{
  if(!confirm('確認刪除這筆重複的進貨？\n\n注意：不會還原庫存（因為這是重複輸入的多餘紀錄，原本就不該存在）\n但會刪除對應的支出和現金流。'))return;
  const p=(S.data.purchases||[]).find(x=>x.id===id);
  if(!p)return;
  // 刪除對應的支出（如果有）
  if(p.expenseId){
    try{await delSub('expenses',p.expenseId);}catch(e){console.warn(e);}
  }
  const exps=(S.data.expenses||[]).filter(e=>(e.fromPurchase||e.fromPurchaseId)&&(e.purchaseRefId===id||e.fromPurchaseId===id));
  for(const e of exps){try{await delSub('expenses',e.id);}catch(err){console.warn(err);}}
  // 刪除對應的現金流（如果有）
  if(p.cashFlowId){
    try{await delSub('cashFlow',p.cashFlowId);}catch(e){console.warn(e);}
  }
  const flows=(S.data.cashFlow||[]).filter(f=>(f.fromPurchase||f.fromPurchaseId)&&(f.purchaseRefId===id||f.fromPurchaseId===id));
  for(const f of flows){try{await delSub('cashFlow',f.id);}catch(err){console.warn(err);}}
  // 還要扣減被多算的庫存
  if(p.productId){
    try{
      const inv=getInv(p.productId);
      const newQty=Math.max(0,toN(inv.qty)-toN(p.qty));
      const newInv=[...(S.data.inventory||[]).filter(i=>i.productId!==p.productId),{...inv,productId:p.productId,qty:newQty}];
      await saveMain({inventory:newInv});
    }catch(e){console.warn(e);}
  }
  // 刪除進貨紀錄本身
  await delSub('purchases',id);
  toast(`✅ 已刪除重複進貨，並扣減重複的庫存 ${p.qty} 個`);
  // 重新打開檢測報告
  setTimeout(()=>{findDuplicatePurchases();},500);
};

// 一鍵清除所有重複
window.cleanupAllDuplicatePurchases=async()=>{
  const purchases=S.data.purchases||[];
  const groups={};
  purchases.forEach(p=>{
    const fp=`${p.date||''}_${(p.productName||'').trim()}_${p.qty||0}_${p.totalCost||0}`;
    if(!groups[fp])groups[fp]=[];
    groups[fp].push(p);
  });
  const toDelete=[];
  Object.values(groups).forEach(arr=>{
    if(arr.length>1)toDelete.push(...arr.slice(1));// 保留第一筆
  });
  if(toDelete.length===0){alert('沒有需要清除的重複資料');return;}
  if(!confirm(`⚠️ 確認一鍵清除？\n\n將刪除 ${toDelete.length} 筆重複進貨，並：\n• 刪除對應的支出/現金流紀錄\n• 扣減重複多算的庫存\n\n此操作無法復原！`))return;
  // 統計庫存調整
  const invAdj={};
  for(const p of toDelete){
    if(p.productId){
      invAdj[p.productId]=(invAdj[p.productId]||0)+toN(p.qty);
    }
    // 刪除對應的支出
    if(p.expenseId){try{await delSub('expenses',p.expenseId);}catch(e){console.warn(e);}}
    const exps=(S.data.expenses||[]).filter(e=>(e.fromPurchase||e.fromPurchaseId)&&(e.purchaseRefId===p.id||e.fromPurchaseId===p.id));
    for(const e of exps){try{await delSub('expenses',e.id);}catch(err){console.warn(err);}}
    // 刪除對應的現金流
    if(p.cashFlowId){try{await delSub('cashFlow',p.cashFlowId);}catch(e){console.warn(e);}}
    const flows=(S.data.cashFlow||[]).filter(f=>(f.fromPurchase||f.fromPurchaseId)&&(f.purchaseRefId===p.id||f.fromPurchaseId===p.id));
    for(const f of flows){try{await delSub('cashFlow',f.id);}catch(err){console.warn(err);}}
    // 刪除進貨本身
    try{await delSub('purchases',p.id);}catch(e){console.warn(e);}
  }
  // 統一扣減庫存
  let newInv=[...(S.data.inventory||[])];
  Object.entries(invAdj).forEach(([pid,qty])=>{
    const inv=newInv.find(i=>i.productId===pid)||{productId:pid,qty:0};
    const newQty=Math.max(0,toN(inv.qty)-qty);
    newInv=newInv.filter(i=>i.productId!==pid);
    newInv.push({...inv,productId:pid,qty:newQty});
  });
  await saveMain({inventory:newInv});
  toast(`✅ 已清除 ${toDelete.length} 筆重複進貨並調整庫存`);
  closeMod();
  render();
};

// 一鍵修正所有名稱不一致的進貨紀錄
window.fixProductNameMismatches=async()=>{
  const purchases=S.data.purchases||[];
  const products=S.data.products||[];
  const toFix=[];
  purchases.forEach(p=>{
    if(!p.productId)return;
    const realProd=products.find(prod=>prod.id===p.productId);
    if(!realProd)return;
    const recordedName=(p.productName||'').trim();
    const realName=(realProd.name||'').trim();
    if(recordedName!==realName){
      toFix.push({purchase:p,realName,realProd});
    }
  });
  if(toFix.length===0){alert('沒有需要修正的');return;}
  if(!confirm(`確認一鍵修正 ${toFix.length} 筆進貨紀錄的產品名稱？\n\n會將每筆 productName 改為正確的產品名稱。\n庫存、支出、成本不受影響。`))return;
  for(const item of toFix){
    const p=item.purchase;
    try{
      await setSub('purchases',p.id,{...p,productName:item.realName,category:item.realProd.category||p.category});
      // 同時修正對應的支出記帳
      if(p.expenseId){
        const exp=(S.data.expenses||[]).find(e=>e.id===p.expenseId);
        if(exp){
          const newNote=`【進貨】${item.realName}　${p.supplier||''}　數量 ${p.qty||0}`;
          try{await setSub('expenses',p.expenseId,{...exp,note:newNote});}catch(e){console.warn(e);}
        }
      }
      // 同時修正對應的現金流
      if(p.cashFlowId){
        const flow=(S.data.cashFlow||[]).find(f=>f.id===p.cashFlowId);
        if(flow){
          const newNote=`【進貨】${item.realName} × ${p.qty||0}${p.supplier?'（'+p.supplier+'）':''}（${p.payMethod||p.paidMethod||''}）`;
          try{await setSub('cashFlow',p.cashFlowId,{...flow,note:newNote});}catch(e){console.warn(e);}
        }
      }
    }catch(err){console.warn(err);}
  }
  toast(`✅ 已修正 ${toFix.length} 筆進貨紀錄的產品名稱`);
  closeMod();
  render();
};

// ─── 現金水位健檢（公司應有現金分析）───
window.cashLevelHealthCheck=()=>{
  // 取得系統啟用日期（若無則用所有資料）
  const startDateStr=S.data.settings?.cashFlowStartDate||'';
  const startDate=startDateStr?new Date(startDateStr):null;
  const inRange=(dateStr)=>{
    if(!startDate)return true;
    if(!dateStr)return false;
    return new Date(dateStr)>=startDate;
  };
  const sales=(S.data.sales||[]).filter(s=>inRange(s.date));
  const expenses=(S.data.expenses||[]).filter(e=>inRange(e.date));
  const cashFlow=(S.data.cashFlow||[]).filter(c=>inRange(c.date));
  const deposits=(S.data.deposits||[]).filter(d=>inRange(d.date));

  const cashSales=sales.filter(s=>s.payMethod==='現金'||s.payMethod==='轉帳').reduce((s,r)=>s+toN(r.amount),0);
  const depositCash=deposits.reduce((s,d)=>s+toN(d.actualReceived||d.amount),0);
  const otherCashIn=cashFlow.filter(c=>toN(c.amount)>0&&!c.fromPurchase&&!c.depositRefId&&c.cat!=='儲值入帳').reduce((s,c)=>s+toN(c.amount),0);
  const totalCashIn=cashSales+depositCash+otherCashIn;
  const totalCashOut=expenses.reduce((s,e)=>s+toN(e.amount),0);
  const theoreticalBalance=totalCashIn-totalCashOut;
  const totalDepositLiability=getTotalDepositLiability?getTotalDepositLiability():0;

  const rentExp=expenses.filter(e=>e.category==='房租').reduce((s,e)=>s+toN(e.amount),0);
  const utilExp=expenses.filter(e=>e.category==='水電').reduce((s,e)=>s+toN(e.amount),0);
  let monthCount=1;
  if(startDate){
    const now=new Date();
    monthCount=Math.max(1,(now.getFullYear()-startDate.getFullYear())*12+now.getMonth()-startDate.getMonth()+1);
  }else{
    const allDates=[...sales,...expenses].map(x=>x.date).filter(d=>d);
    if(allDates.length>0){
      const dates=allDates.map(d=>new Date(d)).filter(d=>!isNaN(d));
      if(dates.length>0){
        const min=new Date(Math.min(...dates));
        const max=new Date(Math.max(...dates));
        monthCount=Math.max(1,(max.getFullYear()-min.getFullYear())*12+max.getMonth()-min.getMonth()+1);
      }
    }
  }
  const avgRent=monthCount>0?rentExp/monthCount:0;
  const avgUtil=monthCount>0?utilExp/monthCount:0;
  const monthlyFixed=avgRent+avgUtil;
  const minSafe=monthlyFixed*1;
  const warnSafe=monthlyFixed*3;
  const healthSafe=monthlyFixed*6;
  const finalMin=minSafe+totalDepositLiability;
  const finalWarn=warnSafe+totalDepositLiability;
  const finalHealth=healthSafe+totalDepositLiability;

  const html=`<div class="mttl">💰 沐蜜帳戶應有現金健檢</div>
    <div style="max-height:65vh;overflow-y:auto;padding:4px;">
      ${startDateStr?`<div style="background:var(--bluL);padding:10px 12px;border-radius:6px;margin-bottom:12px;font-size:12px;color:var(--blu);">
        📅 統計範圍：<b>${startDateStr}</b> 起算（${monthCount} 個月）— 已排除啟用前的舊資料
      </div>`:`<div style="background:#fef3c7;padding:10px 12px;border-radius:6px;margin-bottom:12px;font-size:12px;color:#92400e;">
        ⚠️ 尚未設定系統啟用日期，目前統計所有歷史資料（${monthCount} 個月）<br>
        建議到「🏦 現金流水帳」頁設定起算日（例如 2026-04-01）

// 收集 sharedWith 勾選結果
function collectSharedWith(){
  const checks=document.querySelectorAll('input[name="cu_share"]:checked');
  return Array.from(checks).map(c=>c.value);
}

// 雙向同步共用關係：A 把 B 加進來時，B 那邊也要把 A 加進來
// 名稱比對都用 trim 後的值
function syncSharedTwoWay(customers, myName, mySharedWith){
  const myNameT=(myName||'').trim();
  const mySharedT=new Set((mySharedWith||[]).map(n=>(n||'').trim()).filter(Boolean));
  return customers.map(c=>{
    const cNameT=(c.name||'').trim();
    if(cNameT===myNameT)return c;
    const cShared=Array.isArray(c.sharedWith)?[...c.sharedWith]:[];
    const cSharedT=cShared.map(n=>(n||'').trim());
    const has=cSharedT.includes(myNameT);
    if(mySharedT.has(cNameT)&&!has){
      cShared.push(myNameT);
      return{...c,sharedWith:cShared};
    }else if(!mySharedT.has(cNameT)&&has){
      return{...c,sharedWith:cShared.filter(n=>(n||'').trim()!==myNameT)};
    }
    return c;
  });
}

window.saveCustomer=async()=>{
  try{
    const name=$('m_cu0')?.value?.trim();
    if(!name){alert('請填客戶姓名');return;}
    // 用 trim 後的名稱比對，避免空白問題
    const dup=(S.data.customers||[]).find(c=>(c.name||'').trim()===name);
    if(dup){
      alert(`「${name}」已經建檔過了，請改用編輯功能`);return;
    }
    const sharedWithRaw=collectSharedWith();
    const sharedWith=Array.from(new Set(sharedWithRaw.map(n=>(n||'').trim()).filter(Boolean)));
    let customers=[...(S.data.customers||[])];
    // 主客戶
    customers.push({
      id:uid(),name,
      phone:$('m_cu1')?.value||'',
      birthday:$('m_cu2')?.value||'',
      source:$('m_cu3')?.value||'',
      note:$('m_cu4')?.value||'',
      sharedWith,
      createdAt:today()
    });
    // 自動為勾選的 ghost 共用成員建檔（用 trim 後比對）
    let autoCreated=0;
    for(const sName of sharedWith){
      if(!customers.find(c=>(c.name||'').trim()===sName)){
        customers.push({
          id:uid(),name:sName,
          phone:'',birthday:'',source:'',note:'(由共用儲值自動建檔)',
          sharedWith:[name],
          createdAt:today()
        });
        autoCreated++;
      }
    }
    // 雙向同步
    customers=syncSharedTwoWay(customers,name,sharedWith);
    await saveMain({customers});
    let msg=`✅ ${name} 已建檔`;
    if(sharedWith.length>0)msg+=`（與 ${sharedWith.length} 位共用儲值）`;
    if(autoCreated>0)msg+=`，自動建檔 ${autoCreated} 位共用成員`;
    toast(msg);
    closeMod();
  }catch(err){
    console.error('saveCustomer 失敗:',err);
    alert('建檔失敗：'+(err.message||err));
  }
};
