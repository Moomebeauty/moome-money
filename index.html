// 日期往後推 N 個月（自動處理月底，如 1/31 + 1月 = 2/28）
function addMonthsToDate(dateStr, months){
  const d = dateStr ? new Date(dateStr) : new Date();
  const targetMonth = d.getMonth() + months;
  const result = new Date(d.getFullYear(), targetMonth, d.getDate());
  // 若跨月造成日期溢位（如 1/31→3/3），回退到當月最後一天
  if(result.getMonth() !== ((targetMonth % 12) + 12) % 12){
    result.setDate(0);
  }
  const y = result.getFullYear();
  const m = String(result.getMonth()+1).padStart(2,'0');
  const dd = String(result.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}

let _syncStarted=false;
let _unsubList=[];
function startSync(){
  // 防止重複註冊監聽器（重複註冊會導致同一筆資料顯示成多筆）
  if(_syncStarted){return;}
  _syncStarted=true;
  setSyncing('syncing');
  const mainRef=doc(db,'studios',FID);
  const unsubMain=onSnapshot(mainRef,async snap=>{
    const d=snap.data()||{};
    S.data.services=d.services||[];
    S.data.products=d.products||[];
    S.data.suppliers=d.suppliers||[];
    S.data.staff=d.staff||[];
    S.data.inventory=d.inventory||[];
    S.data.settings=d.settings||{};
    S.data.assets=d.assets||[];
    S.data.equipment=d.equipment||[];  // 設備（每月折舊）
    S.data.serviceCosts=d.serviceCosts||[];
    S.data.trialPacks=d.trialPacks||[];
    S.data.passContracts=d.passContracts||[];
    S.data.pmuRecords=d.pmuRecords||[];
    S.data.studyNotes=d.studyNotes||[];
    S.data.noteFolders=d.noteFolders||[];
    S.data.mindNotes=d.mindNotes||[];
    S.data.treatmentRecords=d.treatmentRecords||[];  // 療程紀錄
    S.data.allocation=d.allocation||{risk:15,operation:20,study:15,invest:35,bonus:15,bigPurchaseLimit:30000,monthlyHouseFund:0};
    // 客戶資料：合併主文件和子集合（向下相容）
    if(Array.isArray(d.customers)&&d.customers.length>0){
      // 主文件有 customers → 以主文件為主
      S.data.customers=d.customers;
    }
    // 首次登入時，自動建立預設資料
    if(!d.initialized){
      await initDefaults();
    }
    setSyncing('synced');render();
  },()=>setSyncing('error'));
  _unsubList.push(unsubMain);

  ['sales','expenses','purchases','courses','courseStudents','cashFlow','houseFund','quarterReviews','coolingDecisions','advisorChats','deposits','stockOuts','learnGoals','appointments'].forEach(col=>{
    const unsub=onSnapshot(collection(db,'studios',FID,col),snap=>{
      S.data[col]=snap.docs.map(d=>({id:d.id,...d.data()}));
      render();
    });
    _unsubList.push(unsub);
  });
}

// 停止同步（登出時用，清掉所有監聽器）
function stopSync(){
  _unsubList.forEach(unsub=>{try{unsub();}catch(e){}});
  _unsubList=[];
  _syncStarted=false;
}

async function saveMain(data){setSyncing('syncing');try{await setDoc(doc(db,'studios',FID),data,{merge:true});setSyncing('synced');}catch(e){console.error(e);setSyncing('error');toast('儲存失敗');}}
async function addSub(col,data){
  // 不在這裡 push 本地，因為 onSnapshot 的 pendingWrites 已經會更新 S.data[col]
  setSyncing('syncing');
  try{
    const r=await addDoc(collection(db,'studios',FID,col),{...data,_at:Date.now()});
    setSyncing('synced');
    return r;
  }catch(e){console.error(e);setSyncing('error');toast('儲存失敗');}
}
async function setSub(col,id,data){
  if(!id){console.error('setSub 缺少 id，取消寫入避免產生重複',col,data);toast('更新失敗：缺少識別碼');return;}
  setSyncing('syncing');
  try{
    // 移除 data 裡的 id 欄位（避免混淆），一律用參數 id 當文件路徑
    const {id:_omit,...clean}=data;
    await setDoc(doc(db,'studios',FID,col,id),{...clean,_at:Date.now()});
    // 立即本地更新（避免 onSnapshot 延遲）
    if(!S.data[col])S.data[col]=[];
    const idx=S.data[col].findIndex(x=>x.id===id);
    if(idx>=0){S.data[col][idx]={...clean,id,_at:Date.now()};}
    else{S.data[col].push({...clean,id,_at:Date.now()});}
    setSyncing('synced');
  }catch(e){console.error(e);setSyncing('error');toast('儲存失敗');}
}
async function delSub(col,id){
  setSyncing('syncing');
  try{
    await deleteDoc(doc(db,'studios',FID,col,id));
    // 立即本地移除
    if(S.data[col])S.data[col]=S.data[col].filter(x=>x.id!==id);
    setSyncing('synced');
  }catch(e){console.error(e);setSyncing('error');toast('刪除失敗');}
}

// 步驟 2：選日期
function renderCBStep2(){
  const slots=S.data.appointmentSlots||{weekdays:[1,2,3,4,5,6],startTime:'10:00',endTime:'19:00',slotDuration:60,bufferMinutes:15,maxAdvanceDays:30,minAdvanceHours:2,closedDates:[]};
  const now=new Date();
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const dates=[];
  for(let i=0;i<=slots.maxAdvanceDays;i++){

// 步驟 3：選時段
function renderCBStep3(){
  const slots=S.data.appointmentSlots||{startTime:'10:00',endTime:'19:00',slotDuration:60,bufferMinutes:15,minAdvanceHours:2};
  const dur=CB.service.duration||slots.slotDuration||60;
  const buf=slots.bufferMinutes||0;
  // 產生所有可能時段
  const [sh,sm]=slots.startTime.split(':').map(Number);
  const [eh,em]=slots.endTime.split(':').map(Number);
  const startMin=sh*60+sm;
  const endMin=eh*60+em;
  const allSlots=[];
  for(let t=startMin;t+dur<=endMin;t+=slots.slotDuration){
    const hh=Math.floor(t/60),mm=t%60;
    allSlots.push(`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`);
  }
  // 過濾已被預約的時段
  const dateAppts=(S.data.appointments||[]).filter(a=>a.date===CB.date&&a.status!=='cancelled');
  // 過濾掉「現在 + 最小提前時數」之前的時段
  const now=new Date();
  const minHoursMs=(slots.minAdvanceHours||0)*60*60*1000;
  const minBookingTime=new Date(now.getTime()+minHoursMs);
  const availableSlots=allSlots.filter(slot=>{
    const [h,m]=slot.split(':').map(Number);
    const slotTime=new Date(`${CB.date}T${slot}:00`);
    if(slotTime<minBookingTime)return false;
    // 檢查是否衝突
    const slotStart=h*60+m;
    const slotEnd=slotStart+dur;
    for(const a of dateAppts){
      const [ah,am]=a.time.split(':').map(Number);
      const aStart=ah*60+am-buf;
      const aEnd=ah*60+am+(a.duration||60)+buf;
      if(slotStart<aEnd&&slotEnd>aStart)return false;
    }
    return true;
  });
  return`<div style="background:#fff;padding:24px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,0.06);">
    <button onclick="cbBack()" style="margin-bottom:16px;background:none;border:none;color:var(--mut);cursor:pointer;font-size:14px;">← 返回</button>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
      <div style="width:30px;height:30px;background:var(--rose);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;">3</div>
      <div style="font-weight:700;color:var(--roseDk);font-size:18px;">選擇時段</div>
    </div>
    <div style="background:var(--bg2);padding:10px;border-radius:8px;margin-bottom:14px;font-size:13px;color:var(--mut);">
      📅 ${CB.date}　🌸 ${CB.service.name}（${CB.service.duration} 分鐘）
    </div>
    ${availableSlots.length===0?'<div style="text-align:center;padding:30px;color:var(--mut);">😢 這天沒有可預約時段了，請換個日期試試</div>':`
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;">
      ${availableSlots.map(slot=>`<button onclick="cbSelectTime('${slot}')" style="padding:14px 6px;border:2px solid var(--bdr);border-radius:10px;background:#fff;cursor:pointer;font-weight:700;color:var(--txt);transition:all 0.2s;" onmouseover="this.style.borderColor='var(--rose)';this.style.background='#fff5f0';" onmouseout="this.style.borderColor='var(--bdr)';this.style.background='#fff';">
        ${slot}
      </button>`).join('')}
    </div>
    `}
  </div>`;
}

// 客戶預約流程函式
window.cbSelectService=(name,duration,price)=>{
  CB.service={name,duration,price};
  CB.step=2;
  renderCustomerBookingStep();
};
window.cbSelectDate=(date)=>{
  CB.date=date;
  CB.step=3;
  renderCustomerBookingStep();
};
window.cbSelectTime=(time)=>{
  CB.time=time;
  CB.step=4;
  renderCustomerBookingStep();
};
window.cbBack=()=>{
  if(CB.step>1)CB.step--;
  renderCustomerBookingStep();
};
window.cbReset=()=>{
  CB.step=1;CB.service=null;CB.date=null;CB.time=null;
  renderCustomerBookingStep();
};
window.cbSubmit=async()=>{
  const name=$('cb_name')?.value?.trim();
  const phone=$('cb_phone')?.value?.trim();
  const note=$('cb_note')?.value?.trim()||'';
  if(!name||!phone){alert('請填寫姓名和電話');return;}
  if(!/^[0-9\-\s]+$/.test(phone)){alert('請輸入正確的電話號碼');return;}
  try{
    await addSub('appointments',{
      date:CB.date,
      time:CB.time,
      customerName:name,
      phone:phone,
      serviceName:CB.service.name,
      duration:CB.service.duration,
      price:CB.service.price||0,
      status:'pending',
      note:note,
      source:'customer',  // 標記為客戶自主預約
      createdAt:new Date().toISOString()
    });
    CB.step=5;
    renderCustomerBookingStep();
  }catch(err){
    console.error('預約失敗',err);
    alert('預約失敗，請稍後再試或直接 LINE 聯絡：'+(err.message||err));
  }
};

function getSales(mo){const m=mo||S.month;return S.data.sales.filter(s=>s.month===m&&s.year===yr());}
function getExp(mo){const m=mo||S.month;return S.data.expenses.filter(e=>e.month===m&&e.year===yr());}
function getInv(pid){return S.data.inventory.find(i=>i.productId===pid)||{qty:0,minQty:5};}

// ── 加權平均成本（每次進貨自動更新）──
// 取得產品當前的加權平均成本（從 inventory.avgCost 讀，沒有就從 product.cost）
function getAvgCost(pid){
  const inv=getInv(pid);
  if(inv.avgCost!==undefined&&toN(inv.avgCost)>0)return toN(inv.avgCost);
  const p=(S.data.products||[]).find(x=>x.id===pid);
  return toN(p?.cost)||0;
}

// 進貨時更新加權平均成本
// newAvgCost = (現有量 × 現有平均成本 + 新進貨量 × 新單價) ÷ 總量
function calculateNewAvgCost(currentQty,currentAvg,addQty,addUnitCost){
  const cq=toN(currentQty),ca=toN(currentAvg),aq=toN(addQty),au=toN(addUnitCost);
  if(cq+aq===0)return au;
  return Math.round((cq*ca+aq*au)*100)/100;  // 保留 2 位小數
}

// 計算當期出貨成本（用平均成本）
function getStockOutCost(pid,qty){
  return Math.round(getAvgCost(pid)*toN(qty));
}

// 計算產品的有效庫存（進貨總量 - 出貨總量）
function getEffectiveQty(pid){
  const inv=getInv(pid);
  return toN(inv.qty);  // 實際以 inventory.qty 為準
}
function getSvcTotal(mo){return getSales(mo).filter(s=>s.type==='service').reduce((s,r)=>s+toN(r.amount),0);}
function getPrdTotal(mo){return getSales(mo).filter(s=>s.type==='product').reduce((s,r)=>s+toN(r.amount),0);}
function getCrsTotal(mo){return getSales(mo).filter(s=>s.type==='course').reduce((s,r)=>s+toN(r.amount),0);}
function getExpTotal(mo){return getExp(mo).reduce((s,e)=>s+toN(e.amount),0);}
function getRevTotal(mo){return getSales(mo).reduce((s,r)=>s+toN(r.amount),0);}

// ── 真實財務分析（含老師抽成、公司吸收的折讓）──
// 取得單筆銷售的真實財務指標
function getSaleFinancials(s){
  if(!s)return{realRevenue:0,faceAmount:0,commission:0,absorbed:0,companyNet:0};
  const realRevenue=toN(s.amount);  // 實際認列營收（已折扣後）
  // 抽成基準金額：優先用 depositFaceAmount（儲值扣款的原價面額）→ amount（實收）
  const faceAmount=toN(s.depositFaceAmount)||realRevenue;
  // 老師抽成率：每筆可自訂（commissionRate），否則用預設
  const rate=s.commissionRate!==undefined?toN(s.commissionRate):DEFAULT_COMMISSION_RATE;
  // 抽成基準：commissionBase 可指定 'face'（原價面額）或 'real'（實收）
  const base=s.commissionBase==='real'?realRevenue:faceAmount;
  const commission=Math.round(base*rate);
  // 公司吸收的折讓 = 原價面額 - 實際認列營收（如果有儲值折扣）
  const absorbed=Math.max(0,faceAmount-realRevenue);
  // 公司淨收（不含產品成本）= 實際營收 - 老師抽成
  const companyNet=realRevenue-commission;
  return{realRevenue,faceAmount,commission,absorbed,companyNet,rate,base};
}

// 月份的真實財務總計
function getMonthFinancials(mo){
  const sales=getSales(mo);
  let totalRev=0,totalFace=0,totalCommission=0,totalAbsorbed=0,totalCompanyNet=0;
  sales.forEach(s=>{
    const f=getSaleFinancials(s);
    totalRev+=f.realRevenue;
    totalFace+=f.faceAmount;
    totalCommission+=f.commission;
    totalAbsorbed+=f.absorbed;
    totalCompanyNet+=f.companyNet;
  });
  return{totalRev,totalFace,totalCommission,totalAbsorbed,totalCompanyNet,saleCount:sales.length};
}

// ── 客戶儲值相關計算 ──
// 客戶當前儲值餘額 = 累計儲值 - 累計儲值扣款消費
// ─── 客戶儲值與共用 ────────────────────────────────────
// 取得所有客戶名稱（含正式建檔 + 從銷售/儲值紀錄推出的 ghost 客戶）
function getAllCustomerNames(){
  const names=new Set();
  (S.data.customers||[]).forEach(c=>{if(c.name)names.add(c.name);});
  (S.data.sales||[]).forEach(s=>{if(s.customer)names.add(s.customer);});
  (S.data.deposits||[]).forEach(d=>{if(d.customer)names.add(d.customer);});
  return Array.from(names).sort();
}

// 取得某客戶的儲值池餘額（用「面額」計算）
// 入帳：deposits 的 amount（=面額/可消費額度）
// 扣款：sales 的 depositFaceAmount（儲值池實際扣的面額），fallback 用 amount（舊資料相容）
function getCustomerBalance(custName){
  if(!custName)return 0;
  const target=(custName||'').trim();
  const deposits=(S.data.deposits||[]).filter(d=>(d.customer||'').trim()===target).reduce((s,d)=>s+toN(d.amount),0);
  const usedDeposits=(S.data.sales||[]).filter(s=>{
    if(s.payMethod!=='儲值扣款')return false;
    const owner=((s.depositOwner||s.customer)||'').trim();
    return owner===target;
  }).reduce((s,r)=>s+toN(r.depositFaceAmount||r.amount),0);
  return deposits-usedDeposits;
}

// 🎯 取得客戶各筆儲值的明細與餘額（區分限定 vs 通用）
// 回傳：[{depositId, amount, used, balance, scope, allowedServices, monthlyLimit, ...}]
function getCustomerDepositDetails(custName){
  if(!custName)return[];
  const target=(custName||'').trim();
  // 取該客戶所有儲值，按日期排序（先進先出 FIFO）
  const deposits=(S.data.deposits||[])
    .filter(d=>(d.customer||'').trim()===target)
    .sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  // 取所有扣款（用 depositRefId 精確匹配；沒有的話按 FIFO 從通用儲值扣）
  const sales=(S.data.sales||[]).filter(s=>{
    if(s.payMethod!=='儲值扣款')return false;
    const owner=((s.depositOwner||s.customer)||'').trim();
    return owner===target;
  });
  // 用 FIFO 分配扣款到儲值（限定的優先扣自己服務的、通用的隨便扣）
  const result=deposits.map(d=>({
    depositId:d.id,date:d.date,
    amount:toN(d.amount),
    actualReceived:toN(d.actualReceived),
    used:0,
    scope:d.scope||'general',
    allowedServices:d.allowedServices||[],
    monthlyLimit:toN(d.monthlyLimit)||0,
    discountRate:toN(d.discountRate)||1,
    note:d.note||''
  }));
  // 對每筆銷售扣款，按 FIFO 從相符的儲值扣
  for(const s of sales){
    let need=toN(s.depositFaceAmount||s.amount);
    const itemName=(s.item||s.serviceName||'').trim();
    // 優先扣「指定到此筆銷售」的儲值（如果有 depositRefId）
    if(s.depositRefId){
      const r=result.find(x=>x.depositId===s.depositRefId);
      if(r){
        const ded=Math.min(need,r.amount-r.used);
        r.used+=ded;need-=ded;
      }
    }
    if(need<=0)continue;
    // 先扣限定服務的儲值（如果這筆銷售符合限定）
    for(const r of result){
      if(need<=0)break;
      if(r.scope!=='restricted')continue;
      const matchService=r.allowedServices.some(svc=>itemName.includes(svc)||svc.includes(itemName));
      if(!matchService)continue;
      const avail=r.amount-r.used;
      if(avail<=0)continue;
      const ded=Math.min(need,avail);
      r.used+=ded;need-=ded;
    }
    // 剩下的從通用儲值扣
    for(const r of result){
      if(need<=0)break;
      if(r.scope==='restricted')continue;
      const avail=r.amount-r.used;
      if(avail<=0)continue;
      const ded=Math.min(need,avail);
      r.used+=ded;need-=ded;
    }
  }
  // 計算餘額
  result.forEach(r=>{r.balance=r.amount-r.used;});
  return result;
}

// 🎯 檢查指定服務名稱是否可用某筆儲值扣款
// 回傳：{ok:boolean, availableBalance, message}
function checkDepositUsableForService(custName,serviceName){
  const details=getCustomerDepositDetails(custName);
  if(details.length===0)return{ok:false,availableBalance:0,message:'此客戶沒有任何儲值'};
  const svcName=(serviceName||'').trim();
  // 計算可用於此服務的總餘額
  let availableBalance=0;
  const restrictedMatch=[];
  const generalDeposits=[];
  details.forEach(d=>{
    if(d.balance<=0)return;
    if(d.scope==='restricted'){
      const match=d.allowedServices.some(svc=>svcName.includes(svc)||svc.includes(svcName));
      if(match){restrictedMatch.push(d);availableBalance+=d.balance;}
    }else{
      generalDeposits.push(d);availableBalance+=d.balance;
    }
  });
  // 完全沒有可用儲值
  if(availableBalance<=0){
    // 看是否有限定方案但服務不對
    const hasRestrictedOnly=details.some(d=>d.balance>0&&d.scope==='restricted');
    if(hasRestrictedOnly){
      const allowedList=details
        .filter(d=>d.balance>0&&d.scope==='restricted')
        .flatMap(d=>d.allowedServices)
        .filter((v,i,a)=>a.indexOf(v)===i);
      return{
        ok:false,availableBalance:0,
        message:`⚠️ 此客戶的儲值是「限定方案」，只能用於：${allowedList.join('、')}\n但目前服務是「${svcName||'未指定'}」，不在允許範圍內`
      };
    }
    return{ok:false,availableBalance:0,message:'⚠️ 此客戶儲值餘額為 0'};
  }
  return{ok:true,availableBalance,message:`可扣款 $${fmt(availableBalance)}（含 ${restrictedMatch.length} 筆限定+${generalDeposits.length} 筆通用）`};
}

// 取得客戶最後一筆儲值的折扣率
// 例如 deposits = {amount:22000, actualReceived:19800} → discountRate = 0.9
// 若無儲值或未填 actualReceived，回傳 1.0（不打折）
function getCustomerDiscountRate(custName){
  if(!custName)return 1;
  // 取該客戶+共用群組所有 deposits，按日期排序取最後一筆有 actualReceived 的
  const group=getSharedGroup(custName).map(n=>(n||'').trim());
  const deposits=(S.data.deposits||[])
    .filter(d=>group.includes((d.customer||'').trim()))
    .filter(d=>toN(d.actualReceived)>0&&toN(d.amount)>0)
    .sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  if(deposits.length===0)return 1;
  const latest=deposits[0];
  const rate=toN(latest.actualReceived)/toN(latest.amount);
  return rate>0&&rate<=1?rate:1;
}

// 取得共用儲值群組
function getSharedGroup(custName){
  if(!custName)return[custName];
  const target=(custName||'').trim();
  const customers=S.data.customers||[];
  const visited=new Set();
  const queue=[target];
  while(queue.length){
    const cur=queue.shift();
    if(visited.has(cur))continue;
    visited.add(cur);
    // 找到 cur 在 customers 裡的記錄（用 trim 比對）
    const me=customers.find(c=>(c.name||'').trim()===cur);
    if(me&&Array.isArray(me.sharedWith)){
      me.sharedWith.forEach(n=>{
        const tn=(n||'').trim();
        if(tn&&!visited.has(tn))queue.push(tn);
      });
    }
    // 別人 sharedWith 中包含 cur
    customers.forEach(c=>{
      if(Array.isArray(c.sharedWith)&&c.sharedWith.some(n=>(n||'').trim()===cur)){
        const cn=(c.name||'').trim();
        if(cn&&!visited.has(cn))queue.push(cn);
      }
    });
  }
  return Array.from(visited);
}

function getAvailableDepositPool(custName){
  const group=getSharedGroup(custName);
  return group.map(name=>({
    name,
    balance:getCustomerBalance(name),
    rate:getCustomerDiscountRate(name),
    isSelf:name===custName
  })).filter(x=>x.balance>0||x.isSelf).sort((a,b)=>{
    if(a.isSelf)return -1;
    if(b.isSelf)return 1;
    return b.balance-a.balance;
  });
}

function pgProfit(){
  const curQ=Math.ceil(S.month/3);
  // 季度資料
  const quarters=[1,2,3,4].map(q=>{
    const months=[(q-1)*3+1,(q-1)*3+2,(q-1)*3+3];
    const qRev=months.reduce((s,m)=>s+getRevTotal(m),0);
    const qExp=months.reduce((s,m)=>s+getExpTotal(m),0);
    const qSvc=months.reduce((s,m)=>s+getSvcTotal(m),0);
    const qPrd=months.reduce((s,m)=>s+getPrdTotal(m),0);
    const qCrs=months.reduce((s,m)=>s+getCrsTotal(m),0);
    return{q,months,rev:qRev,exp:qExp,profit:qRev-qExp,svc:qSvc,prd:qPrd,crs:qCrs};
  });
  // 當月深度分析
  const sales=getSales();
  const rev=getRevTotal();
  const profit=rev-getExpTotal();
  const svc=getSvcTotal();
  // 服務項目 ranking（按收入＋次數）
  const itemMap={};
  sales.filter(s=>s.type==='service').forEach(s=>{
    const item=s.item||'未分類';
    if(!itemMap[item])itemMap[item]={total:0,cnt:0,custs:new Set()};
    itemMap[item].total+=toN(s.amount);
    itemMap[item].cnt++;
    if(s.customer)itemMap[item].custs.add(s.customer);

  // 客戶分析

// ─── 進修回本計畫（讓老闆無腦執行）────────────────
// 計算單一進修目標的進度與行動建議
function analyzeLearnGoal(goal){
  const today=new Date();
  const startDate=new Date(goal.startDate);
  const endDate=new Date(goal.endDate);
  const totalDays=Math.max(1,Math.ceil((endDate-startDate)/(1000*60*60*24)));
  const elapsedDays=Math.max(0,Math.ceil((today-startDate)/(1000*60*60*24)));
  const remainingDays=Math.max(0,Math.ceil((endDate-today)/(1000*60*60*24)));
  const timeProgress=Math.min(100,Math.round(elapsedDays/totalDays*100));

  // 計算已賺金額（從 sales 中找符合該服務名稱的）
  const matchingSales=(S.data.sales||[]).filter(s=>{
    if(!s.date)return false;
    const d=new Date(s.date);
    if(d<startDate)return false;
    // 比對服務名稱（包含關鍵字即可）
    const itemName=(s.serviceName||s.item||'').toLowerCase();
    const keyword=(goal.serviceName||'').toLowerCase();
    return itemName.includes(keyword);
  });
  const earnedAmount=matchingSales.reduce((s,r)=>s+toN(r.amount),0);
  const earnedCount=matchingSales.length;
  const moneyProgress=Math.min(100,Math.round(earnedAmount/goal.targetAmount*100));

  // 需要的客數
  const totalNeeded=Math.ceil(goal.targetAmount/goal.avgPrice);
  const remainingNeeded=Math.max(0,totalNeeded-earnedCount);

  // 進度狀態判斷
  let status='on_track';// on_track / behind / ahead / completed
  if(moneyProgress>=100){status='completed';}
  else if(moneyProgress>=timeProgress){status='ahead';}
  else if(moneyProgress<timeProgress-15){status='behind';}

  // 計算需要的速度
  const remainingAmount=Math.max(0,goal.targetAmount-earnedAmount);
  const weeksLeft=Math.max(1,Math.ceil(remainingDays/7));
  const monthsLeft=Math.max(1,Math.ceil(remainingDays/30));
  const perWeek=Math.ceil(remainingAmount/weeksLeft/goal.avgPrice);
  const perMonth=Math.ceil(remainingAmount/monthsLeft/goal.avgPrice);

  return{
    ...goal,
    today,startDate,endDate,
    totalDays,elapsedDays,remainingDays,timeProgress,
    matchingSales,earnedAmount,earnedCount,moneyProgress,
    totalNeeded,remainingNeeded,remainingAmount,
    weeksLeft,monthsLeft,perWeek,perMonth,
    status,
  };
}

// ─── 營運診斷報告（系統自動分析）────────────────
function generateOperationsReport(mo,yrParam){
  const m=mo||S.month;
  const y=yrParam||yr();
  // 1. 取得本月與上月資料
  const sales=(S.data.sales||[]).filter(s=>s.month===m&&s.year===y);
  const expenses=(S.data.expenses||[]).filter(e=>e.month===m&&e.year===y);
  const cashFlow=(S.data.cashFlow||[]).filter(c=>c.month===m&&c.year===y);
  const deposits=(S.data.deposits||[]).filter(d=>d.month===m&&d.year===y);
  // 上月（用於對比）
  const lastM=m===1?12:m-1;
  const lastY=m===1?y-1:y;
  const lastSales=(S.data.sales||[]).filter(s=>s.month===lastM&&s.year===lastY);
  const lastExp=(S.data.expenses||[]).filter(e=>e.month===lastM&&e.year===lastY);

  // 2. 關鍵數字
  const revenue=sales.reduce((s,r)=>s+toN(r.amount),0);
  const totalExp=expenses.reduce((s,e)=>s+toN(e.amount),0);
  // 從支出中扣除薪資（避免和老師抽成重複），計算真實的「其他支出」
  const salaryExpCalc=expenses.filter(e=>e.category==='薪資').reduce((s,e)=>s+toN(e.amount),0);
  const expExcludingSalary=totalExp-salaryExpCalc;
  // 真實淨利 = 營收 - 其他支出（不含薪資，因為老師抽成已隱含在「公司分到的營收」之中）
  // 這裡為了一致：以支出記帳的薪資為準（你手動記的）
  const profit=revenue-totalExp;  // 認列損益（包含薪資）
  const realProfit=revenue-expExcludingSalary;  // 真實淨利（不含薪資，避免重複扣老師抽成）
  const lastRev=lastSales.reduce((s,r)=>s+toN(r.amount),0);
  const lastExpTotal=lastExp.reduce((s,e)=>s+toN(e.amount),0);
  const revGrowth=lastRev>0?Math.round((revenue-lastRev)/lastRev*100):null;

  // 3. 實際現金流入（排除儲值扣款）
  const cashIn=sales.filter(s=>s.payMethod!=='儲值扣款').reduce((s,r)=>s+toN(r.amount),0);
  const depositIn=deposits.reduce((s,d)=>s+toN(d.actualReceived||d.amount),0);
  const totalCashIn=cashIn+depositIn;

  // 4. 支出分類
  const expByCat={};
  expenses.forEach(e=>{expByCat[e.category]=(expByCat[e.category]||0)+toN(e.amount);});
  const salaryExp=expByCat['薪資']||0;
  const rentExp=expByCat['房租']||0;
  const utilityExp=expByCat['水電']||0;
  const marketingExp=expByCat['行銷廣告']||0;
  const purchaseExp=expByCat['進貨成本']||0;

  // 5. 健康指標計算
  const salaryRatio=revenue>0?salaryExp/revenue*100:0;
  const rentRatio=revenue>0?rentExp/revenue*100:0;
  const marketingRatio=revenue>0?marketingExp/revenue*100:0;
  const purchaseRatio=revenue>0?purchaseExp/revenue*100:0;
  const profitMargin=revenue>0?profit/revenue*100:0;

  // 6. 客戶分析
  const uniqueCustomers=new Set(sales.map(s=>s.customer).filter(c=>c)).size;
  const avgOrder=sales.length>0?revenue/sales.length:0;

  // 7. 損益兩平點計算（簡化版：以固定費用為基礎）
  const fixedCosts=rentExp+utilityExp;  // 房租水電視為相對固定
  const variableExpRatio=revenue>0?(salaryExp+purchaseExp+marketingExp)/revenue:0.6;
  const grossMarginRatio=1-variableExpRatio;
  const breakEven=grossMarginRatio>0?fixedCosts/grossMarginRatio:0;

  // 8. 健康燈號
  const lights={
    profit:profit>=0?'green':profit>-5000?'yellow':'red',
    salary:salaryRatio<45?'green':salaryRatio<55?'yellow':'red',
    marketing:marketingRatio>=5&&marketingRatio<=8?'green':marketingRatio<3?'yellow':marketingRatio>10?'yellow':'green',
    cashflow:totalCashIn>=totalExp?'green':totalCashIn>=totalExp*0.8?'yellow':'red',
  };

  // 9. 體質診斷
  const allGreen=Object.values(lights).every(l=>l==='green');
  const hasRed=Object.values(lights).some(l=>l==='red');
  const overallHealth=allGreen?'healthy':hasRed?'critical':'warning';

  return{
    m,y,revenue,totalExp,profit,profitMargin,revGrowth,
    cashIn,depositIn,totalCashIn,
    expByCat,salaryExp,rentExp,utilityExp,marketingExp,purchaseExp,
    salaryRatio,rentRatio,marketingRatio,purchaseRatio,
    uniqueCustomers,avgOrder,salesCount:sales.length,
    fixedCosts,breakEven,
    lights,overallHealth,
  };
}

function pgAppointments(){
  const allAppts=(S.data.appointments||[]).slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const today=new Date().toISOString().split('T')[0];
  const upcoming=allAppts.filter(a=>a.date>=today&&a.status!=='cancelled');
  const past=allAppts.filter(a=>a.date<today||a.status==='completed');
  const cancelled=allAppts.filter(a=>a.status==='cancelled');

  // 統計
  const todayAppts=upcoming.filter(a=>a.date===today);
  const tomorrow=new Date();tomorrow.setDate(tomorrow.getDate()+1);
  const tomorrowStr=tomorrow.toISOString().split('T')[0];
  const tomorrowAppts=upcoming.filter(a=>a.date===tomorrowStr);
  const thisWeekEnd=new Date();thisWeekEnd.setDate(thisWeekEnd.getDate()+7);

// ─── 🏷️ 產品價目表（客人問價時快速查閱）───
function pgPriceList(){
  const allProds=S.data.products||[];
  // 預設只顯示「保養品販售」（客人會買的），但可切換看全部
  const showAll=S.priceListShowAll||false;
  const kw=(S.priceListSearch||'').trim().toLowerCase();

  let prods=showAll?allProds:allProds.filter(p=>p.category==='保養品販售');
  // 搜尋過濾
  if(kw){
    prods=prods.filter(p=>
      (p.name||'').toLowerCase().includes(kw)||
      (p.series||'').toLowerCase().includes(kw)||
      (p.supplier||'').toLowerCase().includes(kw)
    );
  }
  // 依系列分組
  const groups={};
  prods.forEach(p=>{
    const ser=p.series||'其他';
    if(!groups[ser])groups[ser]=[];
    groups[ser].push(p);
  });
  Object.values(groups).forEach(g=>g.sort((a,b)=>(a.name||'').localeCompare(b.name||'','zh-Hant')));

  const noPriceCount=prods.filter(p=>toN(p.price)<=0&&!(p.specs||[]).some(s=>toN(s.price)>0)).length;

  return`
  <div class="pg-ttl">🏷️ 產品價目表</div>
  <div class="pg-sub">客人問價格時，這裡一秒查到</div>

  <!-- 搜尋列 -->
  <div style="position:sticky;top:0;z-index:10;background:var(--bg);padding:10px 0;margin-bottom:10px;">
    <input type="text" id="priceSearchInput" placeholder="🔍 輸入產品名稱、系列或廠商..."
      value="${S.priceListSearch||''}"
      oninput="doPriceSearch(this.value)"
      style="width:100%;padding:14px 16px;font-size:16px;border:2px solid var(--gold);border-radius:10px;outline:none;background:#fff;">
    <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center;">
      <button class="btn btn-sm ${!showAll?'btn-p':'btn-s'}" onclick="togglePriceListScope(false)">🧴 販售保養品</button>
      <button class="btn btn-sm ${showAll?'btn-p':'btn-s'}" onclick="togglePriceListScope(true)">📦 全部產品</button>
      <span class="tm" style="font-size:12px;margin-left:auto;">共 ${prods.length} 項</span>
    </div>
  </div>

  ${noPriceCount>0?`<div class="notice" style="background:#fef3c7;border-left-color:#d97706;color:#92400e;">
    ⚠️ 有 <b>${noPriceCount}</b> 個產品還沒設定售價（顯示為未定價）。到「🗂️ 庫存盤點」點產品可以編輯售價。
  </div>`:''}

  ${prods.length===0?`<div class="empty" style="padding:40px;">
    <div class="empty-ico">🏷️</div>
    <p>${kw?`找不到「${kw}」相關產品`:'還沒有產品資料'}</p>
    ${kw?`<div class="tm" style="font-size:13px;margin-top:8px;">試試其他關鍵字，或切換「全部產品」看看</div>`:''}
  </div>`:
  Object.entries(groups).sort((a,b)=>a[0].localeCompare(b[0],'zh-Hant')).map(([series,items])=>`
    <div class="card" style="margin-bottom:14px;">
      <div class="card-hd" style="background:linear-gradient(90deg,var(--goldL),transparent);">
        <span class="card-ttl">📦 ${series}</span>
        <span class="bdg gold">${items.length} 項</span>
      </div>
      <div class="card-bd" style="padding:0;">
        ${items.map(p=>{
          const inv=getInv(p.id);
          const hasStock=toN(inv.qty)>0;
          const price=toN(p.price);
          const specs=(p.specs||[]).filter(s=>s.label&&toN(s.price)>0);

          // 有多規格 → 顯示規格表，自動算省多少、打幾折
          if(specs.length>0){
            // 以「最小規格」當基準（specs 已依 units 排序）
            const base=specs[0];
            const baseUnitPrice=toN(base.price)/(toN(base.units)||1);  // 單支等價
            return`<div style="padding:16px;border-bottom:1px solid var(--bdr);">
              <div style="font-size:17px;font-weight:700;color:var(--txt);margin-bottom:2px;">${p.name}</div>
              <div class="tm" style="font-size:12px;margin-bottom:10px;">
                ${p.supplier?`🏪 ${p.supplier}`:''}
                ${hasStock?`　<span style="color:var(--grn);">✓ 有貨 ${inv.qty}</span>`:`　<span style="color:var(--red);">✗ 缺貨</span>`}
              </div>
              <div style="display:flex;flex-direction:column;gap:6px;">
                ${specs.map((sp,idx)=>{
                  const spPrice=toN(sp.price);
                  const spUnits=toN(sp.units)||1;
                  const fullPrice=baseUnitPrice*spUnits;   // 用最小規格單價換算的原價
                  const save=Math.round(fullPrice-spPrice);
                  const discount=fullPrice>0?Math.round(spPrice/fullPrice*100):100;
                  const isBase=idx===0;
                  const isBest=idx===specs.length-1&&specs.length>1;
                  return`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:${isBest?'linear-gradient(90deg,var(--goldL),transparent)':'var(--bg2)'};border-radius:8px;${isBest?'border:1px solid var(--gold);':''}">
                    <div style="flex:1;min-width:0;">
                      <span style="font-weight:700;font-size:15px;color:var(--txt);">${sp.label}</span>
                      ${!isBase&&save>0?`<div class="tm" style="font-size:12px;color:var(--grn);margin-top:2px;">省 $${fmt(save)}　約打 ${(discount/10).toFixed(1)} 折${isBest?'　🔥 最划算':''}</div>`:''}
                    </div>
                    <div style="font-size:20px;font-weight:900;color:var(--gold);white-space:nowrap;margin-left:10px;">$${fmt(spPrice)}</div>
                  </div>`;
                }).join('')}
              </div>
            </div>`;
          }

          // 沒有多規格 → 顯示單一售價（原本的樣子）
          return`<div style="display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--bdr);gap:12px;">
            <div style="flex:1;min-width:0;">
              <div style="font-size:16px;font-weight:700;color:var(--txt);line-height:1.4;">${p.name}</div>
              <div class="tm" style="font-size:12px;margin-top:4px;">
                ${p.supplier?`🏪 ${p.supplier}`:''}
                ${hasStock?`　<span style="color:var(--grn);">✓ 有貨 ${inv.qty}</span>`:`　<span style="color:var(--red);">✗ 缺貨</span>`}
              </div>
            </div>
            <div style="text-align:right;white-space:nowrap;">
              ${price>0?
                `<div style="font-size:22px;font-weight:900;color:var(--gold);">$${fmt(price)}</div>`:
                `<div style="font-size:14px;color:var(--mut);">未定價</div>`
              }
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>
  `).join('')}
  `;
}

function pgCustomers(){
  const customers=S.data.customers||[];
  // 從銷售紀錄自動補齊客戶（防止漏建）— 用 normalize 後的名稱比對
  const allNames=new Set(customers.map(c=>normalizeName(c.name)));
  const salesNames=new Set();
  (S.data.sales||[]).forEach(s=>{if(s.customer)salesNames.add((s.customer||'').trim());});
  (S.data.deposits||[]).forEach(d=>{if(d.customer)salesNames.add((d.customer||'').trim());});
  const ghostCustomers=Array.from(salesNames).filter(n=>n&&!allNames.has(normalizeName(n))).map(n=>({id:'ghost_'+n,name:n,phone:'',note:'',ghost:true}));
  const allCustomers=[...customers,...ghostCustomers];

  // 為每個客戶計算統計
  const customerStats=allCustomers.map(c=>{
    const h=getCustomerHistory(c.name);
    const balance=getCustomerBalance(c.name);
    const lastVisit=h.services.length>0?h.services[0].date:null;
    return{...c,...h,balance,lastVisit};
  }).sort((a,b)=>(b.lastVisit||'').localeCompare(a.lastVisit||''));

  const totalLiability=getTotalDepositLiability();
  const totalCustomers=allCustomers.length;

  // 若有選定客戶，顯示詳細資料
  if(S.selectedCustomer){
    const c=customerStats.find(x=>x.name===S.selectedCustomer);
    if(!c)return pgCustomersList(customerStats,totalLiability,totalCustomers);
    return pgCustomerDetail(c);
  }
  return pgCustomersList(customerStats,totalLiability,totalCustomers);
}

window.noteWrap=(i,mark)=>{
  const ta=$(`note_pt_${i}`);
  if(!ta)return;
  const start=ta.selectionStart,end=ta.selectionEnd;
  const val=ta.value;
  if(start===end){
    // 沒選字 → 提示
    toast('請先用手指選取要標示的文字，再點這個');
    return;
  }
  const selected=val.substring(start,end);
  const newVal=val.substring(0,start)+mark+selected+mark+val.substring(end);
  ta.value=newVal;
  S.modal.noteDraft.points[i].text=newVal;
  toast('✅ 已標示，儲存後就會變色');
};

window.diagnosePmu=()=>{
  const recs=S.data.pmuRecords||[];
  const custs=(S.data.customers||[]).map(c=>c.name);
  let msg=`【紋繡紀錄診斷】\n\n系統裡共有 ${recs.length} 筆紋繡紀錄。\n\n`;
  if(recs.length===0){
    msg+='⚠️ 一筆都沒有！\n\n可能原因：\n1. 走流程時沒按到最後的「✓ 完成並存檔」\n2. 存檔時網路中斷\n\n請重新走一次紋繡流程，確認最後有按「完成並存檔」，看到「紋繡完成」的畫面才算成功。';
  }else{
    msg+='存的紀錄：\n';
    recs.forEach((r,i)=>{
      const nameInCust=custs.includes(r.customer);
      msg+=`${i+1}. 客戶「${r.customer}」 ${r.serviceType||''} ${r.date||''}${r.consentSignature?' ✓有簽名':' ✗無簽名'}\n   ${nameInCust?'✓ 客戶檔案裡有這個名字':'⚠️ 客戶檔案裡沒有這個名字（名字對不上）'}\n`;
    });
    const mismatch=recs.filter(r=>!custs.includes(r.customer));
    if(mismatch.length>0){
      msg+=`\n⚠️ 有 ${mismatch.length} 筆的客戶名字，跟客戶檔案對不上（可能有空白或錯字），所以客戶頁看不到。\n\n要幫你自動修正嗎？（把紋繡紀錄的名字，補進客戶檔案）`;
      if(confirm(msg)){
        fixPmuCustomerNames();
        return;
      }
      return;
    }
  }
  alert(msg);
};

window.fixPmuCustomerNames=async()=>{
  const recs=S.data.pmuRecords||[];
  const custs=S.data.customers||[];
  const custNames=custs.map(c=>c.name);
  const toAdd=[];
  recs.forEach(r=>{
    const name=(r.customer||'').trim();
    if(name&&!custNames.includes(name)&&!toAdd.find(x=>x.name===name)){
      toAdd.push({id:uid(),name,phone:r.phone||'',createdAt:today()});
    }
  });
  if(toAdd.length===0){alert('沒有需要修正的');return;}
  // 同時把紋繡紀錄的 customer 去除頭尾空白
  const pmuRecords=recs.map(r=>({...r,customer:(r.customer||'').trim()}));
  await saveMain({customers:[...custs,...toAdd],pmuRecords});
  alert(`✅ 已修正！補了 ${toAdd.length} 個客戶進客戶檔案。\n\n現在去客戶管理應該看得到紋繡紀錄了。`);
  render();
};

window.depositPassContract=async(id)=>{
  const p=(S.data.passContracts||[]).find(x=>x.id===id);
  if(!p){alert('找不到合約');return;}
  if(p.deposited){alert('這筆已經入帳過了');return;}
  const perUse=p.perUse||(p.months>0?Math.round(p.price/p.months):p.price);
  if(!confirm(`確定為「${p.customer}」的 ${p.planName} 補入帳？\n\n金額 $${fmt(p.price)} 會：\n• 加進儲值餘額\n• 記進現金流收入\n\n每次除毛扣 $${fmt(perUse)}（${p.months}次）`))return;
  try{
    await finalizeDeposit({
      customer:p.customer,
      date:p.startDate,
      amount:p.price,
      actualReceived:p.price,
      payMethod:p.payMethod||'現金',
      note:`${p.planName}（補入帳，每次扣$${fmt(perUse)}，${p.months}次到期${p.endDate}）`,
      signature:p.signature,
      termsSnapshot:p.contractText,
      signed:true,
      scope:'restricted',
      allowedServices:['熱蠟除毛'],
      monthlyLimit:0
    });
    // 標記已入帳
    const passContracts=(S.data.passContracts||[]).map(x=>x.id===id?{...x,deposited:true,perUse}:x);
    await saveMain({passContracts});
    toast(`✅ 已為 ${p.customer} 補入帳 $${fmt(p.price)}`);
    render();
  }catch(e){alert('補入帳失敗：'+e.message);}
};

// ─── PURCHASE（進貨）─────────────────────────────────────
function pgPurchase(){
  const purchases=S.data.purchases.filter(p=>p.month===S.month&&p.year===yr()).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const total=purchases.reduce((s,p)=>s+toN(p.totalCost),0);
  // 兼容舊欄位（paidToExpense）和新欄位（paid）
  const isPaid=(p)=>p.paid||p.paidToExpense;
  const paidTotal=purchases.filter(isPaid).reduce((s,p)=>s+toN(p.totalCost),0);
  const unpaidTotal=total-paidTotal;
  return`
  <div class="pg-ttl">📦 進貨管理</div>
  <div class="pg-sub">進貨自動更新庫存與加權平均成本，已付款項自動寫入支出與現金流</div>
  ${moSel()}
  <div class="sg sg4">
    <div class="sc gold"><div class="sl">本月進貨筆數</div><div class="sv gold">${purchases.length}</div></div>
    <div class="sc red"><div class="sl">本月進貨成本</div><div class="sv red sm">$${fmt(total)}</div></div>
    <div class="sc grn"><div class="sl">已付款</div><div class="sv grn sm">$${fmt(paidTotal)}</div></div>
    <div class="sc"><div class="sl">廠商欠款（未付）</div><div class="sv sm" style="color:var(--gold);">$${fmt(unpaidTotal)}</div></div>
  </div>

  <div class="notice" style="background:var(--bluL);border-left-color:var(--blu);color:var(--blu);">
    💡 <b>進貨與支出的對應關係（現金基礎會計）：</b><br>
    ✓ 進貨時：自動更新庫存 + 加權平均成本（不算支出）<br>
    ✓ <b>付款時</b>：寫入支出記帳 + 現金流水帳（<u>支出記在「付款日」的月份，不是「進貨日」</u>）<br>
    ⏳ 例如：5/14 進貨手套，6/1 才轉帳付款 → 該筆支出會記在 <b>6 月</b>（因為錢是 6 月才流出）<br>
    💡 想看某筆進貨的支出在哪？看下面表格的「付款狀態」欄會顯示<b>實際付款日</b>。
  </div>

  <div class="sec-hd">
    <span class="sec-ttl">進貨記錄</span>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn btn-y btn-sm" onclick="openM('batchPurchase')">📦 批次輸入</button>
      <button class="btn btn-p btn-sm" onclick="openM('addPurchase')">＋ 單筆新增</button>
    </div>
  </div>

  <div class="card">
    <div class="tw"><table>
      <thead><tr><th>日期</th><th>產品</th><th>類別</th><th>數量</th><th>單價</th><th>總成本</th><th>供應商</th><th>備註</th><th>付款狀態</th><th></th></tr></thead>
      <tbody>${purchases.length===0?`<tr><td colspan="10"><div class="empty"><div class="empty-ico">📦</div><p>本月尚無進貨記錄</p></div></td></tr>`:
        purchases.map(p=>{
          const paid=isPaid(p);
          // 判斷支出歸屬月份是否跟進貨月份不同
          const purchaseMonth=p.date?p.date.substring(0,7):'';
          const payMonth=p.paidDate?p.paidDate.substring(0,7):'';
          const isDiffMonth=paid&&purchaseMonth&&payMonth&&purchaseMonth!==payMonth;
          return`<tr style="${paid?'background:var(--grnL);':''}">
          <td>${p.date||''}</td>
          <td><b>${p.productName||''}</b></td>
          <td><span class="bdg gold">${p.category||''}</span></td>
          <td>${p.qty}</td>
          <td class="tm">$${fmt(p.unitCost)}</td>
          <td class="an">$${fmt(p.totalCost)}</td>
          <td class="tm">${p.supplier||''}</td>
          <td class="tm">${p.note||''}</td>
          <td>${paid?
            `<div><span class="pill grn">✅ 已付款</span><div class="tm" style="margin-top:4px;font-size:11px;">${p.paidDate||''} ${p.payMethod||p.paidMethod||''}</div>${isDiffMonth?`<div style="font-size:10px;color:var(--gold);margin-top:2px;background:#fffbf0;padding:2px 4px;border-radius:3px;">⚠️ 支出記在 ${payMonth} 月</div>`:''}</div>`
            :`<button class="btn btn-g btn-sm" onclick="payPurchase('${p.id}')">✓ 標記已付款</button>`}</td>
          <td style="white-space:nowrap;">
            ${paid?`<button class="btn btn-s btn-sm" onclick="unpayPurchase('${p.id}')">取消付款</button>`:''}
            <button class="bdel" style="color:#aaa;" onclick="openM('editPurchase','${p.id}')">✏️</button>
            <button class="bdel" onclick="delPurchase('${p.id}')">×</button>
          </td>
        </tr>`;}).join('')}
      </tbody>
    </table></div>
  </div>`;
}

// ─── INVENTORY ─────────────────────────────────────────────
function pgInventory(){
  const prods=S.data.products||[];
  const cats=['全部',...PRODUCT_CATS];
  const curCat=cats[S.subTab]||'全部';
  const filtered=curCat==='全部'?prods:prods.filter(p=>p.category===curCat);
  const lowCount=prods.filter(p=>{const i=getInv(p.id);return toN(i.qty)<toN(i.minQty||1);}).length;
  const totalValue=prods.reduce((s,p)=>{const i=getInv(p.id);return s+toN(i.qty)*toN(getAvgCost(p.id));},0);
  const okCount=prods.filter(p=>{const i=getInv(p.id);return toN(i.qty)>=toN(i.minQty||1);}).length;

  // 所有分頁都依「廠商→系列→名稱」分組
  let groupedHTML='';
  if(filtered.length>0){
    const groups={};
    filtered.forEach(p=>{
      const sup=p.supplier||'未指定廠商';
      const ser=p.series||'未分系列';
      const k=`${sup}__${ser}`;
      if(!groups[k])groups[k]={supplier:sup,series:ser,items:[]};
      groups[k].items.push(p);
    });
    // 每組內依名稱排序
    Object.values(groups).forEach(g=>{
      g.items.sort((a,b)=>(a.name||'').localeCompare(b.name||'','zh-Hant'));
    });
    groupedHTML=Object.entries(groups).sort((a,b)=>{
      // 「未指定廠商」排到最後
      if(a[1].supplier==='未指定廠商'&&b[1].supplier!=='未指定廠商')return 1;

// ─── 設備折舊 ─────────────────────────────────────────────
function pgEquipment(){
  const eqs=S.data.equipment||[];
  // 計算當期折舊（按月線性折舊）
  const today_d=new Date();
  function calcDepreciation(eq){
    if(!eq.purchaseDate||!eq.years||toN(eq.years)<=0)return{monthly:0,accumulated:0,bookValue:toN(eq.cost)};
    const purDate=new Date(eq.purchaseDate);
    const months=Math.max(0,(today_d.getFullYear()-purDate.getFullYear())*12+(today_d.getMonth()-purDate.getMonth()));
    const totalMonths=toN(eq.years)*12;
    const monthlyDepre=toN(eq.cost)/totalMonths;
    const accumulated=Math.min(toN(eq.cost),Math.round(monthlyDepre*months));
    const bookValue=Math.max(0,toN(eq.cost)-accumulated);
    return{monthly:Math.round(monthlyDepre),accumulated,bookValue};
  }

  const totalCost=eqs.reduce((s,e)=>s+toN(e.cost),0);
  const totalBook=eqs.reduce((s,e)=>s+calcDepreciation(e).bookValue,0);
  const totalMonthly=eqs.reduce((s,e)=>s+calcDepreciation(e).monthly,0);

  return`
  <div class="pg-ttl">🛋️ 設備折舊</div>
  <div class="pg-sub">設備不算庫存（如美體趴枕、按摩床、蒸臉器），每月按使用年限折舊計算</div>

    例：$30,000 美體床 / 5 年使用年限 → 每月折舊 $500，每月計入「設備折舊費」（支出）

  <div class="sg sg3">
    <div class="sc gold"><div class="sl">設備總原值</div><div class="sv gold sm">$${fmt(totalCost)}</div><div class="ss">${eqs.length} 項設備</div></div>
    <div class="sc"><div class="sl">當前帳面價值</div><div class="sv sm" style="color:var(--blu);">$${fmt(totalBook)}</div><div class="ss">扣除累計折舊</div></div>
    <div class="sc red"><div class="sl">每月折舊費</div><div class="sv red sm">$${fmt(totalMonthly)}</div><div class="ss">計入每月支出</div></div>
  </div>

  <div class="sec-hd">
    <span class="sec-ttl">設備清單</span>
    <button class="btn btn-p btn-sm" onclick="openM('addEquipment')">＋ 新增設備</button>
  </div>

  <div class="card">
    <div class="tw"><table>
      <thead><tr><th>名稱</th><th>類別</th><th>購入日期</th><th>原值</th><th>使用年限</th><th>每月折舊</th><th>累計折舊</th><th>帳面價值</th><th>備註</th><th></th></tr></thead>
      <tbody>${eqs.length===0?`<tr><td colspan="10"><div class="empty"><div class="empty-ico">🛋️</div><p>尚未建立設備清單，例如美體床、蒸臉器、按摩椅等</p></div></td></tr>`:
        eqs.sort((a,b)=>(b.purchaseDate||'').localeCompare(a.purchaseDate||'')).map(e=>{
          const d=calcDepreciation(e);
          return`<tr>
            <td><b>${e.name||''}</b></td>
            <td><span class="bdg">${e.category||'其他'}</span></td>
            <td class="tm">${e.purchaseDate||''}</td>
            <td>$${fmt(e.cost)}</td>
            <td class="tm">${e.years||'-'} 年</td>
            <td class="an">$${fmt(d.monthly)}</td>

// 計算服務成本卡的財務數據
// ─── 計算單位成本（每 1g/1ml/1片的成本）──
// 邏輯：產品「整瓶/整盒」的進貨成本 ÷ 內含容量 = 單位成本
function getUnitCost(productId){
  const p=(S.data.products||[]).find(x=>x.id===productId);
  if(!p)return 0;
  const totalCost=getAvgCost(productId);  // 整瓶/整個的成本
  const capacity=toN(p.capacity);  // 內含容量（如 400ml）
  if(capacity>0)return totalCost/capacity;  // 每 1ml/1g 多少錢
  return totalCost;  // 沒填容量 → 整瓶當一個單位
}

// ── 標準成本（合約價）：用於定價，比較保守安全 ──
// 優先用手動填的 product.cost（＝跟廠商簽的合約價，如售價五折）
// 沒填的話，退回實際加權平均成本
function getStdCost(pid){
  const p=(S.data.products||[]).find(x=>x.id===pid);
  const std=toN(p?.cost);
  if(std>0)return std;
  return getAvgCost(pid);  // 沒填標準成本 → 用實際成本
}

// 標準成本的每單位（每 ml / 每 g）成本
function getStdUnitCost(productId){
  const p=(S.data.products||[]).find(x=>x.id===productId);
  if(!p)return 0;
  const totalCost=getStdCost(productId);
  const capacity=toN(p.capacity);
  if(capacity>0)return totalCost/capacity;
  return totalCost;
}

// 採購效益：標準成本 vs 實際成本的差（正數＝你買得比合約便宜）
function getPurchaseBenefit(pid){
  const std=getStdCost(pid);
  const act=getAvgCost(pid);
  if(std<=0||act<=0)return{diff:0,pct:0,hasBoth:false};
  const diff=std-act;
  const pct=Math.round(diff/std*1000)/10;
  return{diff,pct,std,act,hasBoth:true};
}

function calcServiceCardFinancials(card,fixedPerSvc,costMode){
  const products=S.data.products||[];
  // 成本模式：預設跟定價規劃器一致，用「標準成本（合約價）」
  const mode=costMode||S.cardCostMode||'std';
  const costFn=mode==='std'?getStdUnitCost:getUnitCost;
  // 材料成本：用「單位成本」× 用量（最後才四捨五入，避免累積誤差）
  const materialCostRaw=(card.items||[]).reduce((s,it)=>{
    return s+costFn(it.productId)*toN(it.qty);
  },0);
  const materialCost=Math.round(materialCostRaw*100)/100;
  const price=toN(card.price);
  const commRate=card.commissionRate!==undefined?toN(card.commissionRate):0.6;
  const commission=Math.round(price*commRate);
  // 固定攤分：優先順序
  // 1. 服務卡自訂金額（card.fixedOverride）
  // 2. 床位每小時成本 × 服務時長
  // 3. fallback fixedPerSvc（房租÷月服務數，舊邏輯）
  let fixed=0;
  let fixedSource='';
  if(card.fixedOverride!==undefined&&card.fixedOverride!==''){
    fixed=toN(card.fixedOverride);
    fixedSource='custom';
  }else if(toN(card.duration)>0){
    const hourlyRate=toN(S.data.settings?.bedHourlyRate);
    if(hourlyRate>0){
      fixed=Math.round(hourlyRate*toN(card.duration)/60);
      fixedSource='hourly';
    }else{
      fixed=toN(fixedPerSvc);
      fixedSource='fallback';
    }
  }else{
    fixed=toN(fixedPerSvc);
    fixedSource='fallback';
  }
  const totalCost=materialCost+commission+fixed;
  const companyNet=price-totalCost;
  const netMargin=price>0?Math.round(companyNet/price*100):0;
  const denominator30=1-commRate-0.30;
  const suggestedPrice30=denominator30>0?Math.ceil((materialCost+fixed)/denominator30/100)*100:0;
  const denominator20=1-commRate-0.20;
  const suggestedPrice20=denominator20>0?Math.ceil((materialCost+fixed)/denominator20/100)*100:0;
  return{materialCost,commission,fixed,fixedSource,totalCost,companyNet,netMargin,suggestedPrice30,suggestedPrice20};
}

      </label>

  <!-- 影像紀錄說明（必告知，依個資法不需特別同意但需告知）-->
  <div class="card" style="margin-bottom:14px;background:var(--bg2);">
    <div class="card-hd" style="background:transparent;"><span class="card-ttl" style="color:var(--mut);font-size:14px;">📷 服務紀錄影像說明</span></div>

      <div style="font-size:13px;line-height:1.7;color:var(--txt);">

        此影像紀錄屬於提供服務之必要範圍內利用，依《個人資料保護法》第19條第1項第2款「與當事人有契約或類似契約之關係」之規定，本工作室得於服務目的範圍內蒐集、處理及利用，<b>並僅作為內部紀錄與服務品質管理使用，絕不外流</b>。

        <b style="color:var(--rose);">未經同意絕不公開使用。</b><br><br>

// ───── 🎨 紋繡服務主畫面 ─────
function pgPmuView(t){
  // 完成畫面
  if(t.pmuSubmitted)return pmuDoneView(t);
  // 簽同意書階段（客人畫面，隱私隔離）
  if(t.pmuStage==='consent')return pmuConsentView(t);

  // 其他階段（你的操作畫面）：頂部有階段導覽
  const stages=[
    {id:'design',label:'① 眉型設計',icon:'✏️'},
    {id:'consent',label:'② 簽同意書',icon:'📜'},
    {id:'operation',label:'③ 操作紀錄',icon:'🎨'},
    {id:'finish',label:'④ 完成提醒',icon:'✅'}
  ];
  const nav=`
    <div style="display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;">
      ${stages.map(s=>{
        const active=t.pmuStage===s.id;
        const signed=s.id==='consent'&&t.consentSignature;
        return`<button onclick="pmuGoStage('${s.id}')" style="flex:1;min-width:80px;padding:10px 6px;border-radius:10px;border:2px solid ${active?'#9333ea':'var(--bdr)'};background:${active?'#f3e8ff':'#fff'};cursor:pointer;font-size:12px;font-weight:${active?'700':'400'};color:${active?'#9333ea':'var(--mut)'};">
          ${s.icon}<br>${s.label}${signed?' ✓':''}
        </button>`;
      }).join('')}
    </div>`;

  let body='';
  if(t.pmuStage==='design')body=pmuDesignStage(t);
  else if(t.pmuStage==='operation')body=pmuOperationStage(t);
  else if(t.pmuStage==='finish')body=pmuFinishStage(t);

  return`
  <button onclick="cancelPmu()" title="取消" style="position:fixed;top:14px;right:14px;z-index:100;background:rgba(255,255,255,0.6);border:1px solid var(--bdr);color:var(--mut);padding:6px 12px;border-radius:20px;font-size:11px;cursor:pointer;opacity:0.5;">離開</button>
  <div style="max-width:680px;margin:0 auto;padding:20px 16px 60px;">
    <div class="pg-ttl" style="color:#9333ea;">🎨 紋繡服務${t.customer?`：${t.customer}`:''}</div>
    ${nav}
    ${body}
  </div>`;
}

          </div>

window.pmuToggle=(field,val)=>{
  if(!S.treatment)return;
  if(!Array.isArray(S.treatment[field]))S.treatment[field]=[];
  const arr=S.treatment[field];
  const i=arr.indexOf(val);
  if(i>=0)arr.splice(i,1);else arr.push(val);
  if(window.event&&window.event.target){
    const el=window.event.target.closest('label')||window.event.target;
    const on=arr.includes(val);
    const color=field==='conditions'?'var(--red)':field==='allergies'?'var(--gold)':'var(--pur)';
    el.style.background=on?color:'var(--bg2)';
    el.style.color=on?'#fff':'var(--txt)';
    el.textContent=(on?'✓ ':'')+val;
  }
};

window.pmuSubmitConsent=()=>{
  const t=S.treatment;if(!t)return;

  if(!_sigCanvas||!_sigHasContent){alert('請簽名');return;}

  t.consentSignedAt=nowLocal();
  t.consentAgreed=true;

window.pmuPick=(field,val)=>{

// ── 紋繡完成存檔 ──
window.pmuSubmit=async()=>{
  const t=S.treatment;if(!t)return;
  pmuSaveInputs();
  if(!t.customer){alert('缺少客戶姓名');return;}
  if(!t.consentSignature){alert('還沒簽同意書');return;}

  const S2=S.data.settings||{};
  const touchupDays=toN(S2.pmuTouchupDays)||90;
  const touchupDate=addMonthsToDate(t.date,Math.round(touchupDays/30));
  const oneYearDate=addMonthsToDate(t.date,12);

  // 紋繡紀錄
  const record={
    id:uid(),
    customer:t.customer,phone:t.phone,lineId:t.lineId,
    birthday:t.birthday,address:t.address,email:t.email,
    isMinor:t.isMinor,guardianName:t.guardianName,
    date:t.date,staff:t.staff,serviceType:t.serviceType,
    designStyle:t.designStyle,expectation:t.expectation,designNote:t.designNote,
    conditions:t.conditions,conditionNote:t.conditionNote,
    allergies:t.allergies,allergyNote:t.allergyNote,source:t.source,
    startTime:t.startTime,endTime:t.endTime,
    numbCream:t.numbCream,numbTime:t.numbTime,
    tools:t.tools,pigments:t.pigments,operationNote:t.operationNote,
    consentSignature:t.consentSignature,consentSignedAt:t.consentSignedAt,
    cardSigned:t.cardSigned,carePackGiven:t.carePackGiven,
    aftercareGiven:t.aftercareGiven,photoAfterDone:t.photoAfterDone,
    touchupDate,oneYearDate,
    touchupDone:false,oneYearReminded:false,
    createdAt:nowLocal()
  };
  const pmuRecords=[...(S.data.pmuRecords||[]),record];

  let updates={pmuRecords};

  S.data.pmuRecords=pmuRecords;

// ── 下載同意書存證圖 ──
window.downloadPmuConsent=()=>{
  const r=S.lastPmuRecord;
  if(!r){alert('找不到紀錄');return;}
  const S2=S.data.settings||{};
  const terms=S2.pmuTerms||DEFAULT_PMU_TERMS;
  const notice=S2.pmuNotice||DEFAULT_PMU_NOTICE;
  const condStr=(r.conditions||[]).length>0?(r.conditions.join('、')+(r.conditionNote?'；'+r.conditionNote:'')):'無';
  const allergyStr=(r.allergies||[]).length>0?(r.allergies.join('、')+(r.allergyNote?'；'+r.allergyNote:'')):'無';
  // 組合完整文字
  const fullText=`【沐蜜美學・紋繡服務同意書】

顧客姓名：${r.customer}　電話：${r.phone||''}
服務項目：${r.serviceType}　日期：${r.date}
身體狀況：${condStr}
過敏史：${allergyStr}
${r.isMinor?`未成年，法定代理人：${r.guardianName||''}\n`:''}
${notice}

${terms.privacy}

${terms.serviceDesc}

${terms.consent}

${terms.media}

${terms.closing}

━━━━━━━━━━━━━━━━━━━
顧客簽名：（見下方）
簽署時間：${r.consentSignedAt}`;

  try{
    const lines=[];
    fullText.split('\n').forEach(para=>{
      if(para.length<=30)lines.push(para);
      else{for(let i=0;i<para.length;i+=30)lines.push(para.substring(i,i+30));}
    });
    const lineH=20,pad=36,headH=64,sigH=170,width=680;
    const height=headH+lines.length*lineH+sigH+pad*2;
    const canvas=document.createElement('canvas');
    const scale=2;canvas.width=width*scale;canvas.height=height*scale;
    const ctx=canvas.getContext('2d');ctx.scale(scale,scale);
    ctx.fillStyle='#faf5ff';ctx.fillRect(0,0,width,height);
    ctx.fillStyle='#9333ea';ctx.fillRect(0,0,width,headH);
    ctx.fillStyle='#fff';ctx.font='bold 20px "Noto Serif TC",serif';ctx.textAlign='center';
    ctx.fillText('沐蜜美學・紋繡服務同意書',width/2,40);
    ctx.fillStyle='#333';ctx.font='13px sans-serif';ctx.textAlign='left';
    let y=headH+pad;
    lines.forEach(l=>{ctx.fillText(l,pad,y);y+=lineH;});
    ctx.fillStyle='#666';ctx.font='13px sans-serif';
    ctx.fillText('顧客簽名：',pad,y+16);
    if(r.consentSignature){
      const img=new Image();
      img.onload=()=>{
        ctx.drawImage(img,pad+80,y,200,70);
        ctx.fillStyle='#999';ctx.font='11px sans-serif';
        ctx.fillText(`簽署時間：${r.consentSignedAt}`,pad,y+96);
        canvas.toBlob(blob=>{
          const url=URL.createObjectURL(blob);
          const a=document.createElement('a');
          a.href=url;a.download=`${r.customer}_紋繡同意書.png`;a.click();
          setTimeout(()=>URL.revokeObjectURL(url),1000);
        });
      };
      img.src=r.consentSignature;
    }
  }catch(e){alert('產生同意書圖失敗：'+e.message);}
};

// 渲染單一問卷題目（客戶填寫用）
function renderGuestQuestion(q,t){
  if(q.type==='section'){
    return`<div style="font-weight:700;color:var(--roseDk);font-size:15px;margin:18px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--roseL);">${q.label}</div>`;
  }
  const v=t.healthForm?.[q.key];
  if(q.type==='text'){
    return`<div class="fgrp" style="margin-bottom:10px;"><label>${q.label}</label>
      <input type="text" value="${(v||'').replace(/"/g,'&quot;')}" placeholder="${q.placeholder||''}" oninput="setGuestForm('${q.key}',this.value)"></div>`;
  }
  if(q.type==='textarea'){
    return`<div class="fgrp" style="margin-bottom:10px;"><label>${q.label}</label>
      <textarea rows="2" placeholder="${q.placeholder||''}" oninput="setGuestForm('${q.key}',this.value)">${v||''}</textarea></div>`;
  }
  if(q.type==='radio'){
    return`<div class="fgrp" style="margin-bottom:10px;"><label>${q.label}</label>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;">
        ${(q.options||[]).map(o=>`<label style="padding:8px 16px;background:${v===o?'var(--rose)':'var(--bg2)'};color:${v===o?'#fff':'var(--txt)'};border-radius:16px;cursor:pointer;font-size:14px;font-weight:${v===o?'700':'400'};" onclick="pickGuestRadio('${q.key}','${o.replace(/'/g,"\\'")}')">${o}</label>`).join('')}
      </div></div>`;
  }
  if(q.type==='checkbox_group'){
    const arr=Array.isArray(v)?v:[];
    return`<div class="fgrp" style="margin-bottom:10px;"><label>${q.label}</label>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;">
        ${(q.options||[]).map(o=>`<label style="padding:6px 12px;background:${arr.includes(o)?'var(--blu)':'var(--bg2)'};color:${arr.includes(o)?'#fff':'var(--txt)'};border-radius:16px;cursor:pointer;font-size:13px;">
          <input type="checkbox" style="display:none;" ${arr.includes(o)?'checked':''} onchange="toggleGuestCheck('${q.key}','${o.replace(/'/g,"\\'")}')">${o}</label>`).join('')}
      </div></div>`;
  }
  return'';
}

window.setGuestForm=(key,val)=>{
  if(!S.treatment)return;
  if(!S.treatment.healthForm)S.treatment.healthForm={};
  S.treatment.healthForm[key]=val;
};

// 老師選這次的服務類別（會帶出對應專屬確認題目）
window.toggleGuestServiceCat=(cat)=>{
  if(!S.treatment)return;
  // 重繪前先保住已填的名字電話
  const nm=$('g_name'),ph=$('g_phone');
  if(nm)S.treatment.guestName=nm.value;
  if(ph)S.treatment.guestPhone=ph.value;
  if(!S.treatment.guestServiceCats)S.treatment.guestServiceCats=[];
  const arr=S.treatment.guestServiceCats;
  const i=arr.indexOf(cat);
  if(i>=0)arr.splice(i,1);else arr.push(cat);
  const c=$('pg-content');if(c)c.innerHTML=renderPage();
  setTimeout(()=>{initSignatureCanvasInline('t_guest_sign_canvas');},100);
};

// 渲染單一「服務專屬確認」題目
function renderGuestServiceQuestion(cat,q,i,t){
  const key=`svc_${cat}_${q.key||i}`;
  const v=t.serviceHealthAnswers&&t.serviceHealthAnswers[key];
  if(q.type==='radio'){
    return`<div class="fgrp" style="margin-bottom:10px;"><label>${q.label}</label>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;">
        ${(q.options||['否','是']).map(o=>`<label style="padding:8px 16px;background:${v===o?'var(--rose)':'var(--bg2)'};color:${v===o?'#fff':'var(--txt)'};border-radius:16px;cursor:pointer;font-size:14px;font-weight:${v===o?'700':'400'};" onclick="pickGuestServiceAns('${key}','${o.replace(/'/g,"\\'")}')">${o}</label>`).join('')}
      </div></div>`;
  }
  if(q.type==='checkbox'||q.type==='checkbox_group'){
    const arr=Array.isArray(v)?v:[];
    return`<div class="fgrp" style="margin-bottom:10px;"><label>${q.label}</label>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;">
        ${(q.options||[]).map(o=>`<label style="padding:6px 12px;background:${arr.includes(o)?'var(--blu)':'var(--bg2)'};color:${arr.includes(o)?'#fff':'var(--txt)'};border-radius:16px;cursor:pointer;font-size:13px;" onclick="toggleGuestServiceCheck('${key}','${o.replace(/'/g,"\\'")}')">${o}</label>`).join('')}
      </div></div>`;
  }
  if(q.type==='textarea'){
    return`<div class="fgrp" style="margin-bottom:10px;"><label>${q.label}</label>
      <textarea rows="2" placeholder="${q.placeholder||''}" oninput="setGuestServiceAns('${key}',this.value)">${v||''}</textarea></div>`;
  }
  // text
  return`<div class="fgrp" style="margin-bottom:10px;"><label>${q.label}</label>
    <input type="text" value="${(v||'').replace(/"/g,'&quot;')}" placeholder="${q.placeholder||''}" oninput="setGuestServiceAns('${key}',this.value)"></div>`;
}

window.pickGuestServiceAns=(key,val)=>{
  if(!S.treatment)return;
  if(!S.treatment.serviceHealthAnswers)S.treatment.serviceHealthAnswers={};
  S.treatment.serviceHealthAnswers[key]=val;
  if(window.event&&window.event.target){
    const clicked=window.event.target.closest('label')||window.event.target;
    const group=clicked.parentElement;
    if(group){
      [...group.children].forEach(el=>{
        const isThis=el===clicked;
        el.style.background=isThis?'var(--rose)':'var(--bg2)';
        el.style.color=isThis?'#fff':'var(--txt)';
        el.style.fontWeight=isThis?'700':'400';
      });
    }
  }
};

window.setGuestServiceAns=(key,val)=>{
  if(!S.treatment)return;
  if(!S.treatment.serviceHealthAnswers)S.treatment.serviceHealthAnswers={};
  S.treatment.serviceHealthAnswers[key]=val;
};

window.toggleGuestServiceCheck=(key,opt)=>{
  if(!S.treatment)return;
  if(!S.treatment.serviceHealthAnswers)S.treatment.serviceHealthAnswers={};
  const arr=Array.isArray(S.treatment.serviceHealthAnswers[key])?S.treatment.serviceHealthAnswers[key]:[];
  const i=arr.indexOf(opt);
  if(i>=0)arr.splice(i,1);else arr.push(opt);
  S.treatment.serviceHealthAnswers[key]=arr;
  const selected=arr.includes(opt);
  if(window.event&&window.event.target){
    const el=window.event.target.closest('label')||window.event.target;
    el.style.background=selected?'var(--blu)':'var(--bg2)';
    el.style.color=selected?'#fff':'var(--txt)';
  }
};

window.pickGuestRadio=(key,val)=>{
  if(!S.treatment)return;
  if(!S.treatment.healthForm)S.treatment.healthForm={};
  S.treatment.healthForm[key]=val;
  // 局部更新同組選項外觀，不重繪整頁
  if(window.event&&window.event.target){
    const clicked=window.event.target.closest('label')||window.event.target;
    const group=clicked.parentElement;
    if(group){
      [...group.children].forEach(el=>{
        const isThis=el===clicked;
        el.style.background=isThis?'var(--rose)':'var(--bg2)';
        el.style.color=isThis?'#fff':'var(--txt)';
        el.style.fontWeight=isThis?'700':'400';
      });
    }
  }
};

window.toggleGuestCheck=(key,opt)=>{
  if(!S.treatment)return;
  if(!S.treatment.healthForm)S.treatment.healthForm={};
  const arr=Array.isArray(S.treatment.healthForm[key])?S.treatment.healthForm[key]:[];
  const i=arr.indexOf(opt);
  if(i>=0)arr.splice(i,1);else arr.push(opt);
  S.treatment.healthForm[key]=arr;
  // 只更新被點的那顆標籤外觀，不重繪整頁（避免名字/電話輸入被打斷）
  const selected=arr.includes(opt);
  if(window.event&&window.event.target){
    const el=window.event.target.closest('label')||window.event.target;
    el.style.background=selected?'var(--blu)':'var(--bg2)';
    el.style.color=selected?'#fff':'var(--txt)';
  }
};

window.cancelGuestIntake=()=>{
  if(confirm('確定取消？已填寫的內容不會儲存。'))
    switchTreatmentMode('staff');
};

window.submitGuestIntake=async()=>{
  const t=S.treatment;
  if(!t)return;
  const name=(t.guestName||$('g_name')?.value||'').trim();
  const phone=(t.guestPhone||$('g_phone')?.value||'').trim();
  if(!name){alert('請填寫您的稱呼／姓名');return;}
  if(!phone){alert('請填寫聯絡電話');return;}
  if(!t.healthAgreed&&!$('g_agree')?.checked){alert('請勾選「同意」才能完成');return;}
  if(!_sigCanvas||!_sigHasContent){alert('請簽名確認');return;}
  const signature=_sigCanvas.toDataURL('image/png');

  // 建客戶檔 + 存首次同意紀錄
  const custId=uid();
  const customers=[...(S.data.customers||[]),{
    id:custId,name,phone,
    createdAt:today(),
    healthForm:t.healthForm||{},
    serviceHealthAnswers:t.serviceHealthAnswers||{},
    serviceCats:t.guestServiceCats||[],
    healthAgreed:true,healthAgreedAt:new Date().toISOString(),
    agreedTerms:(t.guestServiceCats||[]),
    intakeSignature:signature
  }];
  await saveMain({customers});

  t.guestName=name;

  {key:'green',label:'一般重點',bg:'#f0fdf4',border:'#16a34a',text:'#15803d'},
  {key:'blue',label:'補充',bg:'#eff6ff',border:'#2563eb',text:'#1d4ed8'},
  {key:'purple',label:'技巧',bg:'#faf5ff',border:'#9333ea',text:'#7e22ce'},
  {key:'gray',label:'備註',bg:'#f9fafb',border:'#6b7280',text:'#4b5563'}
];
function noteColor(key){return NOTE_COLORS.find(c=>c.key===key)||NOTE_COLORS[5];}

// 內文重點標示：**字**→金色粗體、!!字!!→紅色粗體、__字__→底線
function renderNoteText(text){
  if(!text)return'';
  // 先跳脫 HTML 特殊字元，避免破版
  let s=text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  // !!字!! → 紅色粗體（超重點）
  s=s.replace(/!!([^!]+)!!/g,'<span style="color:#dc2626;font-weight:800;">$1</span>');
  // **字** → 金色粗體（重點）
  s=s.replace(/\*\*([^*]+)\*\*/g,'<span style="color:#b45309;font-weight:800;">$1</span>');
  // __字__ → 底線
  s=s.replace(/__([^_]+)__/g,'<span style="text-decoration:underline;text-decoration-color:#9333ea;text-decoration-thickness:2px;">$1</span>');
  return s;
}

function renderMindNode(node,depth){
  var col=noteColor(node.color);
  var hasChildren=(node.children||[]).length>0;
  var expanded=node.expanded;
  var indent=depth*18;
  var arrow=hasChildren?(expanded?'▼':'▶'):'　';
  var html='<div style="margin-left:'+indent+'px;margin-bottom:6px;">';
  html+='<div style="background:'+col.bg+';border-left:4px solid '+col.border+';border-radius:8px;padding:8px 10px;">';
  html+='<div style="display:flex;align-items:center;gap:6px;">';
  html+='<span onclick="mindToggle(\''+node.id+'\')" style="cursor:pointer;font-size:13px;color:'+col.text+';width:18px;flex-shrink:0;">'+arrow+'</span>';
  html+='<span onclick="mindToggle(\''+node.id+'\')" style="flex:1;font-weight:800;color:'+col.text+';font-size:15px;cursor:pointer;">🔑 '+(node.keyword||'（未命名）')+'</span>';
  html+='<button type="button" onclick="openM(\'editMindNode\',\''+node.id+'\')" style="border:none;background:none;cursor:pointer;font-size:13px;opacity:0.6;">✏️</button>';
  html+='<button type="button" onclick="mindAddChild(\''+node.id+'\')" style="border:none;background:'+col.border+';color:#fff;cursor:pointer;font-size:12px;border-radius:6px;padding:3px 8px;white-space:nowrap;">＋內</button>';
  html+='</div>';
  if(expanded&&node.detail){
    html+='<div style="margin-left:24px;margin-top:6px;font-size:14px;line-height:1.8;color:#333;white-space:pre-wrap;background:#fff;padding:8px 10px;border-radius:6px;">'+renderNoteText(node.detail)+'</div>';
  }
  html+='</div>';
  if(expanded&&hasChildren){
    html+='<div style="margin-top:6px;">';
    for(var i=0;i<node.children.length;i++){html+=renderMindNode(node.children[i],depth+1);}
    html+='</div>';
  }
  html+='</div>';
  return html;
}

function mindFind(nodes,id){
  for(var i=0;i<nodes.length;i++){
    if(nodes[i].id===id)return nodes[i];
    if(nodes[i].children){var f=mindFind(nodes[i].children,id);if(f)return f;}
  }
  return null;
}
function mindFindParentArr(nodes,id){
  for(var i=0;i<nodes.length;i++){
    if(nodes[i].id===id)return nodes;
    if(nodes[i].children){var f=mindFindParentArr(nodes[i].children,id);if(f)return f;}
  }
  return null;
}

window.mindAddRoot=function(){
  var roots=(S.data.mindNotes||[]).slice();
  var n={id:uid(),keyword:'',detail:'',color:'blue',expanded:true,children:[]};
  roots.push(n);

};

window.mindAddChild=function(parentId){
  var roots=JSON.parse(JSON.stringify(S.data.mindNotes||[]));
  var parent=mindFind(roots,parentId);
  if(!parent)return;
  if(!parent.children)parent.children=[];
  var child={id:uid(),keyword:'',detail:'',color:'green',expanded:true,children:[]};
  parent.children.push(child);
  parent.expanded=true;
  S.data.mindNotes=roots;
  saveMain({mindNotes:roots});
  openM('editMindNode',child.id);
};

window.mindToggle=function(id){
  var roots=JSON.parse(JSON.stringify(S.data.mindNotes||[]));
  var node=mindFind(roots,id);
  if(!node)return;
  node.expanded=!node.expanded;
  S.data.mindNotes=roots;
  saveMain({mindNotes:roots});
  var c=document.getElementById('pg-content');
  if(c)c.innerHTML=renderPage();
};

window.mindExpandAll=function(expand){
  var roots=JSON.parse(JSON.stringify(S.data.mindNotes||[]));
  function walk(nodes){for(var i=0;i<nodes.length;i++){nodes[i].expanded=expand;if(nodes[i].children)walk(nodes[i].children);}}
  walk(roots);
  S.data.mindNotes=roots;
  saveMain({mindNotes:roots});
  var c=document.getElementById('pg-content');
  if(c)c.innerHTML=renderPage();
};

window.mindDelNode=async function(id){
  var node=mindFind(S.data.mindNotes||[],id);
  var childCount=(node&&node.children)?node.children.length:0;
  if(!confirm('刪除「'+((node&&node.keyword)||'')+'」？'+(childCount>0?'\n⚠️ 底下的 '+childCount+' 個關鍵字也會一起刪除。':'')))return;
  var roots=JSON.parse(JSON.stringify(S.data.mindNotes||[]));
  var arr=mindFindParentArr(roots,id);
  if(arr){for(var i=0;i<arr.length;i++){if(arr[i].id===id){arr.splice(i,1);break;}}}
  S.data.mindNotes=roots;
  await saveMain({mindNotes:roots});
  closeMod();
  toast('已刪除');
  var c=document.getElementById('pg-content');
  if(c)c.innerHTML=renderPage();
};

window.saveMindNode=async function(id){
  var kwEl=document.getElementById('mind_keyword');
  var dtEl=document.getElementById('mind_detail');
  var kw=kwEl?kwEl.value.trim():'';
  var detail=dtEl?dtEl.value:'';
  var color=(S.modal&&S.modal.mindColor)||'blue';
  if(!kw){alert('請填關鍵字');return;}
  var roots=JSON.parse(JSON.stringify(S.data.mindNotes||[]));
  var node=mindFind(roots,id);
  if(!node){closeMod();return;}
  node.keyword=kw;node.detail=detail;node.color=color;
  S.data.mindNotes=roots;
  await saveMain({mindNotes:roots});
  toast('✅ 已儲存');
  closeMod();
  var c=document.getElementById('pg-content');
  if(c)c.innerHTML=renderPage();
};

// ─── CASHFLOW ──────────────────────────────────────────────
// 從各資料源派生所有現金流項目（不論寫入點，自動匯整）
function getDerivedCashFlows(){
  const flows=[];
  // 系統啟用日期（這之前的資料不納入現金流統計，避免歷史儲值汙染數字）
  const startDate=S.data.settings?.cashFlowStartDate||'';
  const beforeStart=(d)=>startDate&&d&&d<startDate;
  // 1. 銷售收入（排除儲值扣款，因為儲值扣款不是現金流入）
  (S.data.sales||[]).forEach(s=>{
    if(s.payMethod==='儲值扣款')return; // 儲值扣款不算現金流
    if(beforeStart(s.date))return; // 起算日之前不納入
    flows.push({
      id:'sale_'+s.id,
      date:s.date,
      amount:toN(s.amount),
      cat:s.type==='service'?'服務收入':s.type==='product'?'產品收入':'課程收入',
      payMethod:s.payMethod||'未填',
      note:`${s.item||''} ${s.customer?`(${s.customer})`:''} ${s.subNote?'- '+s.subNote:''}`.trim(),
      month:s.month,year:s.year,
      _derived:'sale',
      _refId:s.id
    });
  });
  // 2. 支出（排除已寫入 cashFlow 的進貨）
  (S.data.expenses||[]).forEach(e=>{
    if(beforeStart(e.date))return;
    flows.push({
      id:'exp_'+e.id,
      date:e.date,
      amount:-Math.abs(toN(e.amount)),
      cat:e.category||'其他支出',
      payMethod:e.payMethod||'未填',
      note:e.note||'',
      month:e.month,year:e.year,
      _derived:'expense',
      _refId:e.id
    });
  });
  // 3. 手動現金流項目 + 儲值入帳（保留現有 cashFlow 表中「非派生自 sales/expenses」的紀錄）
  (S.data.cashFlow||[]).forEach(c=>{
    // 跳過已從 expenses 派生的進貨支出（避免重複）
    if(c.fromPurchase)return;
    if(beforeStart(c.date))return;
    flows.push({
      id:c.id,
      date:c.date,
      amount:toN(c.amount),
      cat:c.cat||'其他',
      payMethod:c.payMethod||'',
      note:c.note||'',
      month:c.month,year:c.year,
      _derived:null  // null = 手動建立的
    });
  });
  return flows;
}
