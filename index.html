<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>🌸 沐蜜財務系統</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --rose:#C2747A;--roseDk:#9E5A60;--roseL:#F5E8EA;--roseMid:#E8C4C8;
  --gold:#C4A46B;--goldL:#F9F0E0;--goldDk:#8C6B3A;
  --grn:#5A8C6B;--grnL:#E8F5ED;--red:#C25A5A;--redL:#FAEAEA;
  --blu:#5A7AC2;--bluL:#E8EEFA;--pur:#8C5AC2;--purL:#F0E8FA;
  --brown:#6B4C3A;--txt:#2D1F1A;--mut:#7E6860;--bdr:#EAE0D8;
  --bg:#FDFAF8;--bg2:#F7F0EC;--bg3:#F0E8E2;--card:#FFFFFF;
  --shadow:0 2px 16px rgba(180,100,100,0.08);
  --shadow2:0 4px 32px rgba(180,100,100,0.14);
}
*{box-sizing:border-box;margin:0;padding:0;letter-spacing:0.04em;}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--txt);font-size:17px;min-height:100vh;line-height:1.65;}
h1,h2,h3{font-family:'Noto Serif TC',serif;letter-spacing:0.08em;}

/* ── LAYOUT ── */
.app{display:flex;min-height:100vh;}
.sidebar{width:220px;background:linear-gradient(180deg,var(--roseDk) 0%,var(--brown) 100%);padding:14px 0;flex-shrink:0;position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:100;}
.sb-item{display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer;transition:.2s;color:rgba(255,255,255,0.78);font-size:16px;border-left:4px solid transparent;letter-spacing:0.06em;}
.sb-item:hover{background:rgba(255,255,255,0.1);color:#fff;}
.sb-item.active{background:rgba(255,255,255,0.18);color:#fff;border-left-color:var(--gold);font-weight:700;}
.sb-item .ico{font-size:20px;width:26px;text-align:center;}

.main{margin-left:220px;flex:1;display:flex;flex-direction:column;}
/* 客戶簽名沉浸式模式：隱藏側邊欄、頂部欄，全螢幕展示 */
.app.customer-mode{background:linear-gradient(135deg,#fff5e6 0%,#fef3f4 100%);min-height:100vh;}
.main-full{margin-left:0;}
.content-customer{max-width:900px;margin:0 auto;padding:24px 20px;}
.topbar{background:var(--card);border-bottom:1px solid var(--bdr);padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:var(--shadow);}
.tb-ttl{font-family:'Noto Serif TC',serif;font-size:18px;font-weight:700;color:var(--roseDk);letter-spacing:0.08em;}
.tb-right{display:flex;align-items:center;gap:12px;}
.sync-dot{width:10px;height:10px;border-radius:50%;background:var(--grn);}
.sync-dot.syncing{background:var(--gold);animation:pulse 1s infinite;}
.sync-dot.error{background:var(--red);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.btn-out{background:none;border:1.5px solid var(--bdr);border-radius:8px;padding:7px 14px;font-size:14px;cursor:pointer;color:var(--mut);transition:.2s;letter-spacing:0.06em;}
.btn-out:hover{border-color:var(--rose);color:var(--roseDk);}

.content{padding:28px;flex:1;}
.pg-ttl{font-family:'Noto Serif TC',serif;font-size:28px;font-weight:900;color:var(--roseDk);margin-bottom:6px;letter-spacing:0.1em;}
.pg-sub{font-size:14px;color:var(--mut);margin-bottom:24px;letter-spacing:0.08em;}

/* ── CARDS ── */
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden;}
.card-hd{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--bdr);gap:12px;flex-wrap:wrap;}
.card-ttl{font-family:'Noto Serif TC',serif;font-size:17px;font-weight:700;color:var(--brown);letter-spacing:0.08em;}
.card-bd{padding:18px 20px;}

/* ── STAT GRID ── */
.sg{display:grid;gap:14px;margin-bottom:18px;}
.sg2{grid-template-columns:repeat(2,1fr);}
.sg3{grid-template-columns:repeat(3,1fr);}
.sg4{grid-template-columns:repeat(4,1fr);}
.sc{background:var(--card);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);border-top:3px solid var(--bdr);}
.sc.rose{border-top-color:var(--rose);}
.sc.grn{border-top-color:var(--grn);}
.sc.red{border-top-color:var(--red);}
.sc.gold{border-top-color:var(--gold);}
.sc.blu{border-top-color:var(--blu);}
.sc.pur{border-top-color:var(--pur);}
.sl{font-size:14px;color:var(--mut);margin-bottom:8px;font-weight:500;letter-spacing:0.06em;}
.sv{font-family:'Noto Serif TC',serif;font-size:26px;font-weight:700;color:var(--txt);letter-spacing:0.04em;}
.sv.sm{font-size:21px;}
.sv.rose{color:var(--rose);}
.sv.grn{color:var(--grn);}
.sv.red{color:var(--red);}
.sv.gold{color:var(--gold);}
.sv.blu{color:var(--blu);}
.ss{font-size:13px;color:var(--mut);margin-top:5px;letter-spacing:0.04em;}

/* ── TABLES ── */
.tw{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:15px;}
th{background:var(--bg2);padding:12px 14px;text-align:left;font-size:13px;font-weight:700;color:var(--mut);border-bottom:1px solid var(--bdr);white-space:nowrap;letter-spacing:0.08em;}
td{padding:13px 14px;border-bottom:1px solid var(--bdr);vertical-align:middle;letter-spacing:0.04em;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--bg);}

/* ── BADGES ── */
.bdg{display:inline-block;padding:3px 10px;border-radius:20px;font-size:13px;font-weight:600;background:var(--bg2);color:var(--mut);letter-spacing:0.04em;}
.bdg.rose{background:var(--roseL);color:var(--roseDk);}
.bdg.grn{background:var(--grnL);color:var(--grn);}
.bdg.red{background:var(--redL);color:var(--red);}
.bdg.gold{background:var(--goldL);color:var(--goldDk);}
.bdg.blu{background:var(--bluL);color:var(--blu);}
.bdg.pur{background:var(--purL);color:var(--pur);}
.pill{display:inline-block;padding:3px 12px;border-radius:20px;font-size:13px;font-weight:700;letter-spacing:0.06em;}
.pill.grn{background:var(--grnL);color:var(--grn);}
.pill.red{background:var(--redL);color:var(--red);}
.pill.gold{background:var(--goldL);color:var(--goldDk);}

/* ── BUTTONS ── */
.btn{border:none;border-radius:8px;padding:10px 18px;font-size:15px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;font-weight:600;transition:.2s;letter-spacing:0.08em;}
.btn-p{background:linear-gradient(135deg,var(--rose),var(--roseDk));color:#fff;}
.btn-p:hover{opacity:.9;transform:translateY(-1px);}
.btn-s{background:var(--bg2);color:var(--brown);border:1.5px solid var(--bdr);}
.btn-s:hover{border-color:var(--rose);color:var(--roseDk);}
.btn-g{background:linear-gradient(135deg,var(--grn),#3a6b4c);color:#fff;}
.btn-y{background:linear-gradient(135deg,var(--gold),var(--goldDk));color:#fff;}
.btn-pur{background:linear-gradient(135deg,var(--pur),#5A3A85);color:#fff;}
.btn-sm{padding:7px 14px;font-size:14px;}
.bdel{background:none;border:none;color:var(--mut);cursor:pointer;padding:5px 8px;border-radius:6px;font-size:18px;transition:.2s;}
.bdel:hover{background:var(--redL);color:var(--red);}

/* ── PROGRESS ── */
.pb{background:var(--bg2);border-radius:10px;overflow:hidden;}
.pf{border-radius:10px;transition:width .4s ease;background:linear-gradient(90deg,var(--rose),var(--gold));}
.plbl{display:flex;justify-content:space-between;font-size:14px;color:var(--mut);margin-bottom:7px;letter-spacing:0.04em;}

/* ── FORMS ── */
.fg{display:grid;gap:16px;}
.fg2{grid-template-columns:1fr 1fr;}
.fgrp{display:flex;flex-direction:column;gap:6px;}
.fgrp label{font-size:14px;font-weight:600;color:var(--brown);letter-spacing:0.06em;}
.fgrp input,.fgrp select,.fgrp textarea{
  border:1.5px solid var(--bdr);border-radius:8px;padding:11px 14px;font-size:15px;
  font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--txt);transition:.2s;width:100%;letter-spacing:0.04em;}
.fgrp input:focus,.fgrp select:focus,.fgrp textarea:focus{outline:none;border-color:var(--rose);background:#fff;}

/* ── MODAL ── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(45,31,26,0.5);z-index:1000;backdrop-filter:blur(4px);}
.modal-bg.open{display:flex;align-items:center;justify-content:center;}
.modal{background:var(--card);border-radius:18px;padding:30px;width:92%;max-width:600px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow2);}
.modal.lg{max-width:900px;}
.mttl{font-family:'Noto Serif TC',serif;font-size:20px;font-weight:700;color:var(--roseDk);margin-bottom:22px;letter-spacing:0.08em;}
.mbtns{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap;}

/* ── MISC ── */
.fb{display:flex;align-items:center;}
.fbb{display:flex;align-items:center;justify-content:space-between;}
.g8{gap:8px;}
.tm{color:var(--mut);font-size:14px;letter-spacing:0.04em;}
.ap{color:var(--grn);font-weight:600;}
.an{color:var(--red);font-weight:600;}
.ag{color:var(--gold);font-weight:600;}
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.sec-ttl{font-family:'Noto Serif TC',serif;font-size:18px;font-weight:700;color:var(--brown);letter-spacing:0.08em;}
.mo-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:18px;scrollbar-width:none;}
.mo-scroll::-webkit-scrollbar{display:none;}
.mo-btn{padding:8px 16px;border-radius:20px;border:1.5px solid var(--bdr);background:var(--card);font-size:14px;cursor:pointer;white-space:nowrap;transition:.2s;color:var(--mut);letter-spacing:0.06em;}
.mo-btn.active{background:var(--rose);border-color:var(--rose);color:#fff;font-weight:700;}
.tab-bar{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.tab-p{padding:9px 18px;border-radius:20px;border:1.5px solid var(--bdr);background:var(--card);font-size:14px;cursor:pointer;transition:.2s;color:var(--mut);font-weight:500;letter-spacing:0.06em;}
.tab-p.active{background:var(--rose);border-color:var(--rose);color:#fff;font-weight:700;}
.empty{text-align:center;padding:44px 20px;color:var(--mut);}
.empty-ico{font-size:44px;margin-bottom:14px;}
.tag{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:700;letter-spacing:0.04em;}
.tag-low{background:var(--redL);color:var(--red);}
.tag-ok{background:var(--grnL);color:var(--grn);}
.tag-warn{background:var(--goldL);color:var(--goldDk);}
.run-bal{font-weight:700;font-size:14px;}
.notice{background:var(--roseL);border-left:4px solid var(--rose);border-radius:8px;padding:12px 16px;font-size:14px;color:var(--roseDk);margin-bottom:18px;letter-spacing:0.04em;}
.batch-row{display:grid;grid-template-columns:1.4fr 0.8fr 0.8fr 1fr 1fr 0.4fr;gap:8px;align-items:end;padding:10px;border:1px solid var(--bdr);border-radius:10px;margin-bottom:8px;background:var(--bg);}
.batch-row .fgrp{gap:3px;}
.batch-row .fgrp label{font-size:12px;}
.batch-row .fgrp input,.batch-row .fgrp select{padding:8px 10px;font-size:14px;}
.bdel-row{background:var(--redL);color:var(--red);border:none;border-radius:8px;width:36px;height:36px;font-size:18px;cursor:pointer;align-self:end;}
.bdel-row:hover{background:var(--red);color:#fff;}

@media(max-width:768px){
  body{font-size:16px;}
  .sidebar{width:64px;}
  .sb-item span:last-child{display:none;}
  .sb-item{padding:14px;justify-content:center;}
  .main{margin-left:64px;}
  .sg4{grid-template-columns:repeat(2,1fr);}
  .sg3{grid-template-columns:1fr;}
  .sg2{grid-template-columns:1fr;}
  .fg2{grid-template-columns:1fr;}
  .batch-row{grid-template-columns:1fr 1fr;gap:6px;}
  .pg-ttl{font-size:24px;}
  .content{padding:18px;}
}
.toast{position:fixed;bottom:28px;right:28px;background:var(--brown);color:#fff;padding:14px 22px;border-radius:12px;font-size:15px;font-weight:600;z-index:9999;opacity:0;transform:translateY(10px);transition:.3s;pointer-events:none;letter-spacing:0.06em;}
.toast.show{opacity:1;transform:translateY(0);}
.pw-err{color:var(--red);font-size:14px;margin-top:10px;text-align:center;min-height:18px;letter-spacing:0.04em;}
</style>

function startSync(){
  setSyncing('syncing');
  const mainRef=doc(db,'studios',FID);
  onSnapshot(mainRef,async snap=>{
    const d=snap.data()||{};
    S.data.services=d.services||[];
    S.data.products=d.products||[];
    S.data.suppliers=d.suppliers||[];
    S.data.staff=d.staff||[];
    S.data.inventory=d.inventory||[];
    S.data.settings=d.settings||{};
    S.data.assets=d.assets||[];
    S.data.equipment=d.equipment||[];  // 設備（每月折舊）
    S.data.serviceCosts=d.serviceCosts||[];  // 服務成本卡
    S.data.treatmentRecords=d.treatmentRecords||[];  // 療程紀錄
    S.data.allocation=d.allocation||{risk:15,operation:20,study:15,invest:35,bonus:15,bigPurchaseLimit:30000,monthlyHouseFund:0};
    // 客戶資料：合併主文件和子集合（向下相容）
    if(Array.isArray(d.customers)&&d.customers.length>0){
      // 主文件有 customers → 以主文件為主
      S.data.customers=d.customers;
    }
    // 首次登入時，自動建立預設資料
    if(!d.initialized){
      await initDefaults();
    }
    setSyncing('synced');render();
  },()=>setSyncing('error'));

  ['sales','expenses','purchases','courses','courseStudents','cashFlow','houseFund','quarterReviews','coolingDecisions','advisorChats','deposits','stockOuts'].forEach(col=>{
    onSnapshot(collection(db,'studios',FID,col),snap=>{
      S.data[col]=snap.docs.map(d=>({id:d.id,...d.data()}));
      render();
    });
  });
}

// ── DATA HELPERS ───────────────────────────────────────────
function getSales(mo){const m=mo||S.month;return S.data.sales.filter(s=>s.month===m&&s.year===yr());}
function getExp(mo){const m=mo||S.month;return S.data.expenses.filter(e=>e.month===m&&e.year===yr());}
function getInv(pid){return S.data.inventory.find(i=>i.productId===pid)||{qty:0,minQty:5};}

// ── 加權平均成本（每次進貨自動更新）──
// 取得產品當前的加權平均成本（從 inventory.avgCost 讀，沒有就從 product.cost）
function getAvgCost(pid){
  const inv=getInv(pid);
  if(inv.avgCost!==undefined&&toN(inv.avgCost)>0)return toN(inv.avgCost);
  const p=(S.data.products||[]).find(x=>x.id===pid);
  return toN(p?.cost)||0;
}

// 進貨時更新加權平均成本
// newAvgCost = (現有量 × 現有平均成本 + 新進貨量 × 新單價) ÷ 總量
function calculateNewAvgCost(currentQty,currentAvg,addQty,addUnitCost){
  const cq=toN(currentQty),ca=toN(currentAvg),aq=toN(addQty),au=toN(addUnitCost);
  if(cq+aq===0)return au;
  return Math.round((cq*ca+aq*au)*100)/100;  // 保留 2 位小數
}

// 計算當期出貨成本（用平均成本）
function getStockOutCost(pid,qty){
  return Math.round(getAvgCost(pid)*toN(qty));
}

// 計算產品的有效庫存（進貨總量 - 出貨總量）
function getEffectiveQty(pid){
  const inv=getInv(pid);
  return toN(inv.qty);  // 實際以 inventory.qty 為準
}
function getSvcTotal(mo){return getSales(mo).filter(s=>s.type==='service').reduce((s,r)=>s+toN(r.amount),0);}
function getPrdTotal(mo){return getSales(mo).filter(s=>s.type==='product').reduce((s,r)=>s+toN(r.amount),0);}
function getCrsTotal(mo){return getSales(mo).filter(s=>s.type==='course').reduce((s,r)=>s+toN(r.amount),0);}
function getExpTotal(mo){return getExp(mo).reduce((s,e)=>s+toN(e.amount),0);}
function getRevTotal(mo){return getSales(mo).reduce((s,r)=>s+toN(r.amount),0);}

// ── 真實財務分析（含老師抽成、公司吸收的折讓）──
// 取得單筆銷售的真實財務指標
function getSaleFinancials(s){
  if(!s)return{realRevenue:0,faceAmount:0,commission:0,absorbed:0,companyNet:0};
  const realRevenue=toN(s.amount);  // 實際認列營收（已折扣後）
  // 抽成基準金額：優先用 depositFaceAmount（儲值扣款的原價面額）→ amount（實收）
  const faceAmount=toN(s.depositFaceAmount)||realRevenue;
  // 老師抽成率：每筆可自訂（commissionRate），否則用預設
  const rate=s.commissionRate!==undefined?toN(s.commissionRate):DEFAULT_COMMISSION_RATE;
  // 抽成基準：commissionBase 可指定 'face'（原價面額）或 'real'（實收）
  const base=s.commissionBase==='real'?realRevenue:faceAmount;
  const commission=Math.round(base*rate);
  // 公司吸收的折讓 = 原價面額 - 實際認列營收（如果有儲值折扣）
  const absorbed=Math.max(0,faceAmount-realRevenue);
  // 公司淨收（不含產品成本）= 實際營收 - 老師抽成
  const companyNet=realRevenue-commission;
  return{realRevenue,faceAmount,commission,absorbed,companyNet,rate,base};
}

// 月份的真實財務總計
function getMonthFinancials(mo){
  const sales=getSales(mo);
  let totalRev=0,totalFace=0,totalCommission=0,totalAbsorbed=0,totalCompanyNet=0;
  sales.forEach(s=>{
    const f=getSaleFinancials(s);
    totalRev+=f.realRevenue;
    totalFace+=f.faceAmount;
    totalCommission+=f.commission;
    totalAbsorbed+=f.absorbed;
    totalCompanyNet+=f.companyNet;
  });
  return{totalRev,totalFace,totalCommission,totalAbsorbed,totalCompanyNet,saleCount:sales.length};
}

// ── 客戶儲值相關計算 ──
// 客戶當前儲值餘額 = 累計儲值 - 累計儲值扣款消費
// ─── 客戶儲值與共用 ────────────────────────────────────
// 取得所有客戶名稱（含正式建檔 + 從銷售/儲值紀錄推出的 ghost 客戶）
function getAllCustomerNames(){
  const names=new Set();
  (S.data.customers||[]).forEach(c=>{if(c.name)names.add(c.name);});
  (S.data.sales||[]).forEach(s=>{if(s.customer)names.add(s.customer);});
  (S.data.deposits||[]).forEach(d=>{if(d.customer)names.add(d.customer);});
  return Array.from(names).sort();
}

// 取得某客戶的儲值池餘額（用「面額」計算）
// 入帳：deposits 的 amount（=面額/可消費額度）
// 扣款：sales 的 depositFaceAmount（儲值池實際扣的面額），fallback 用 amount（舊資料相容）
function getCustomerBalance(custName){
  if(!custName)return 0;
  const target=(custName||'').trim();
  const deposits=(S.data.deposits||[]).filter(d=>(d.customer||'').trim()===target).reduce((s,d)=>s+toN(d.amount),0);
  const usedDeposits=(S.data.sales||[]).filter(s=>{
    if(s.payMethod!=='儲值扣款')return false;
    const owner=((s.depositOwner||s.customer)||'').trim();
    return owner===target;
  }).reduce((s,r)=>s+toN(r.depositFaceAmount||r.amount),0);
  return deposits-usedDeposits;
}

// 取得客戶最後一筆儲值的折扣率
// 例如 deposits = {amount:22000, actualReceived:19800} → discountRate = 0.9
// 若無儲值或未填 actualReceived，回傳 1.0（不打折）
function getCustomerDiscountRate(custName){
  if(!custName)return 1;
  // 取該客戶+共用群組所有 deposits，按日期排序取最後一筆有 actualReceived 的
  const group=getSharedGroup(custName).map(n=>(n||'').trim());
  const deposits=(S.data.deposits||[])
    .filter(d=>group.includes((d.customer||'').trim()))
    .filter(d=>toN(d.actualReceived)>0&&toN(d.amount)>0)
    .sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  if(deposits.length===0)return 1;
  const latest=deposits[0];
  const rate=toN(latest.actualReceived)/toN(latest.amount);
  return rate>0&&rate<=1?rate:1;
}

// 取得共用儲值群組
function getSharedGroup(custName){
  if(!custName)return[custName];
  const target=(custName||'').trim();
  const customers=S.data.customers||[];
  const visited=new Set();
  const queue=[target];
  while(queue.length){
    const cur=queue.shift();
    if(visited.has(cur))continue;
    visited.add(cur);
    // 找到 cur 在 customers 裡的記錄（用 trim 比對）
    const me=customers.find(c=>(c.name||'').trim()===cur);
    if(me&&Array.isArray(me.sharedWith)){
      me.sharedWith.forEach(n=>{
        const tn=(n||'').trim();
        if(tn&&!visited.has(tn))queue.push(tn);
      });
    }
    // 別人 sharedWith 中包含 cur
    customers.forEach(c=>{
      if(Array.isArray(c.sharedWith)&&c.sharedWith.some(n=>(n||'').trim()===cur)){
        const cn=(c.name||'').trim();
        if(cn&&!visited.has(cn))queue.push(cn);
      }
    });
  }
  return Array.from(visited);
}

function getAvailableDepositPool(custName){
  const group=getSharedGroup(custName);
  return group.map(name=>({
    name,
    balance:getCustomerBalance(name),
    rate:getCustomerDiscountRate(name),
    isSelf:name===custName
  })).filter(x=>x.balance>0||x.isSelf).sort((a,b)=>{
    if(a.isSelf)return -1;
    if(b.isSelf)return 1;
    return b.balance-a.balance;
  });
}

// 公司總儲值負債（用面額計算 — 公司承諾要提供的服務金額）
function getTotalDepositLiability(){
  const allCustomers=new Set();
  (S.data.deposits||[]).forEach(d=>{if(d.customer)allCustomers.add(d.customer);});
  let total=0;
  allCustomers.forEach(c=>{total+=getCustomerBalance(c);});
  return total;
}

// 公司實際收到的總儲值現金（actualReceived 加總）
function getTotalDepositCash(){
  return (S.data.deposits||[]).reduce((s,d)=>s+toN(d.actualReceived||d.amount),0);
}

// 累計贈送額度（負債面額 - 實收現金 = 折扣總額）
function getTotalDepositDiscount(){
  const facetotal=(S.data.deposits||[]).reduce((s,d)=>s+toN(d.amount),0);
  const cashTotal=getTotalDepositCash();
  return facetotal-cashTotal;
}

function getCustomerHistory(custName){
  if(!custName)return{services:[],deposits:[],totalSpent:0,visitCount:0};
  const target=(custName||'').trim();
  const services=(S.data.sales||[]).filter(s=>(s.customer||'').trim()===target).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const deposits=(S.data.deposits||[]).filter(d=>(d.customer||'').trim()===target).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const usedByOthers=(S.data.sales||[]).filter(s=>s.payMethod==='儲值扣款'&&(s.depositOwner||'').trim()===target&&(s.customer||'').trim()!==target).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const totalSpent=services.reduce((s,r)=>s+toN(r.amount),0);
  const dates=new Set(services.map(s=>s.date));
  return{services,deposits,usedByOthers,totalSpent,visitCount:dates.size};
}

// ─── 獲利分析（季度＋月度深度分析）────────────────────
function pgProfit(){
  const curQ=Math.ceil(S.month/3);
  // 季度資料
  const quarters=[1,2,3,4].map(q=>{
    const months=[(q-1)*3+1,(q-1)*3+2,(q-1)*3+3];
    const qRev=months.reduce((s,m)=>s+getRevTotal(m),0);
    const qExp=months.reduce((s,m)=>s+getExpTotal(m),0);
    const qSvc=months.reduce((s,m)=>s+getSvcTotal(m),0);
    const qPrd=months.reduce((s,m)=>s+getPrdTotal(m),0);
    const qCrs=months.reduce((s,m)=>s+getCrsTotal(m),0);
    return{q,months,rev:qRev,exp:qExp,profit:qRev-qExp,svc:qSvc,prd:qPrd,crs:qCrs};
  });
  // 當月深度分析
  const sales=getSales();
  const rev=getRevTotal();
  const profit=rev-getExpTotal();
  const svc=getSvcTotal();
  // 服務項目 ranking（按收入＋次數）
  const itemMap={};
  sales.filter(s=>s.type==='service').forEach(s=>{
    const item=s.item||'未分類';
    if(!itemMap[item])itemMap[item]={total:0,cnt:0,custs:new Set()};
    itemMap[item].total+=toN(s.amount);
    itemMap[item].cnt++;
    if(s.customer)itemMap[item].custs.add(s.customer);
  });
  const itemList=Object.entries(itemMap).map(([k,v])=>({
    name:k,total:v.total,cnt:v.cnt,
    avg:Math.round(v.total/v.cnt),
    custCount:v.custs.size,
    pct:svc>0?Math.round(v.total/svc*100):0
  })).sort((a,b)=>b.total-a.total);
  // 客戶分析
  const customers={};
  sales.forEach(s=>{
    const c=(s.customer||'').trim();
    if(c){
      if(!customers[c])customers[c]={total:0,cnt:0};
      customers[c].total+=toN(s.amount);
      customers[c].cnt++;
    }
  });
  const customerList=Object.entries(customers).map(([k,v])=>({name:k,total:v.total,cnt:v.cnt})).sort((a,b)=>b.total-a.total);
  const totalCustomers=customerList.length;
  const repeatCustomers=customerList.filter(c=>c.cnt>1).length;
  const repeatRate=totalCustomers>0?Math.round(repeatCustomers/totalCustomers*100):0;
  const orderCount=sales.length;
  const avgOrder=orderCount>0?Math.round(rev/orderCount):0;

  return`
  <div class="pg-ttl">💎 獲利分析</div>
  <div class="pg-sub">${yr()}年 — 月度與季度獲利全貌</div>
  ${moSel()}

  <!-- 當月關鍵指標 -->
  <div class="sg sg4">
    <div class="sc rose">
      <div class="sl">💵 平均客單價</div>
      <div class="sv sm rose">$${fmt(avgOrder)}</div>
      <div class="ss">${orderCount} 筆訂單</div>
    </div>
    <div class="sc gold">
      <div class="sl">🔁 回客率</div>
      <div class="sv sm gold">${repeatRate}%</div>
      <div class="ss">${repeatCustomers} / ${totalCustomers}</div>
    </div>
    <div class="sc ${profit>=0?'grn':'red'}">
      <div class="sl">📈 淨利潤</div>
      <div class="sv sm ${profit>=0?'grn':'red'}">$${fmt(profit)}</div>
      <div class="ss">利潤率 ${rev>0?Math.round(profit/rev*100):0}%</div>
    </div>
    <div class="sc pur">
      <div class="sl">📅 當前季度</div>
      <div class="sv sm" style="color:var(--pur);">第 ${curQ} 季</div>
      <div class="ss">$${fmt(quarters[curQ-1].profit)} 淨利</div>
    </div>
  </div>

  <!-- 季度獲利檢視 -->
  <div class="card">
    <div class="card-hd"><span class="card-ttl">📅 ${yr()}年 四季獲利對比</span></div>
    <div class="card-bd">
      <div class="sg sg4">
        ${quarters.map(q=>{
          const isCur=q.q===curQ;
          return`<div style="border:2px solid ${isCur?'var(--rose)':'var(--bdr)'};border-radius:10px;padding:14px;background:${isCur?'var(--roseL)':'var(--card)'};">
            <div class="sl">第 ${q.q} 季 (${q.months[0]}-${q.months[2]}月)${isCur?' <span class="bdg rose">當前</span>':''}</div>
            <div style="margin-top:8px;">
              <div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0;"><span class="tm">營收</span><span class="ap">$${fmt(q.rev)}</span></div>

      <tbody>${itemList.length===0?`<tr><td colspan="7"><div class="empty"><p>本月尚無服務記錄</p></div></td></tr>`:
        itemList.map((it,i)=>{
          const medal=['🥇','🥈','🥉'][i]||`${i+1}`;
          return`<tr ${i<3?'style="background:var(--goldL);"':''}>

// 標準化姓名（去除前後空白、半形/全形空白）
function normalizeName(s){return(s||'').toString().trim().replace(/[\u3000\s]+/g,'');}

function pgCustomers(){
  const customers=S.data.customers||[];
  // 從銷售紀錄自動補齊客戶（防止漏建）— 用 normalize 後的名稱比對
  const allNames=new Set(customers.map(c=>normalizeName(c.name)));
  const salesNames=new Set();
  (S.data.sales||[]).forEach(s=>{if(s.customer)salesNames.add((s.customer||'').trim());});
  (S.data.deposits||[]).forEach(d=>{if(d.customer)salesNames.add((d.customer||'').trim());});
  const ghostCustomers=Array.from(salesNames).filter(n=>n&&!allNames.has(normalizeName(n))).map(n=>({id:'ghost_'+n,name:n,phone:'',note:'',ghost:true}));
  const allCustomers=[...customers,...ghostCustomers];

  // 為每個客戶計算統計
  const customerStats=allCustomers.map(c=>{
    const h=getCustomerHistory(c.name);
    const balance=getCustomerBalance(c.name);
    const lastVisit=h.services.length>0?h.services[0].date:null;
    return{...c,...h,balance,lastVisit};
  }).sort((a,b)=>(b.lastVisit||'').localeCompare(a.lastVisit||''));

  const totalLiability=getTotalDepositLiability();
  const totalCustomers=allCustomers.length;

  // 若有選定客戶，顯示詳細資料
  if(S.selectedCustomer){
    const c=customerStats.find(x=>x.name===S.selectedCustomer);
    if(!c)return pgCustomersList(customerStats,totalLiability,totalCustomers);
    return pgCustomerDetail(c);
  }
  return pgCustomersList(customerStats,totalLiability,totalCustomers);
}

// ─── PURCHASE（進貨）─────────────────────────────────────
function pgPurchase(){
  const purchases=S.data.purchases.filter(p=>p.month===S.month&&p.year===yr()).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const total=purchases.reduce((s,p)=>s+toN(p.totalCost),0);
  // 兼容舊欄位（paidToExpense）和新欄位（paid）
  const isPaid=(p)=>p.paid||p.paidToExpense;
  const paidTotal=purchases.filter(isPaid).reduce((s,p)=>s+toN(p.totalCost),0);
  const unpaidTotal=total-paidTotal;
  return`
  <div class="pg-ttl">📦 進貨管理</div>
  <div class="pg-sub">進貨自動更新庫存與加權平均成本，已付款項自動寫入支出與現金流</div>
  ${moSel()}
  <div class="sg sg4">
    <div class="sc gold"><div class="sl">本月進貨筆數</div><div class="sv gold">${purchases.length}</div></div>
    <div class="sc red"><div class="sl">本月進貨成本</div><div class="sv red sm">$${fmt(total)}</div></div>
    <div class="sc grn"><div class="sl">已付款</div><div class="sv grn sm">$${fmt(paidTotal)}</div></div>
    <div class="sc"><div class="sl">廠商欠款（未付）</div><div class="sv sm" style="color:var(--gold);">$${fmt(unpaidTotal)}</div></div>
  </div>

  <div class="notice" style="background:var(--bluL);border-left-color:var(--blu);color:var(--blu);">
    💡 <b>進貨自動連動：</b><br>
    ✓ 已付款進貨：自動更新庫存 + 加權平均成本 + 寫入支出記帳 + 寫入現金流水帳<br>
    ⏳ 未付款進貨（賒帳）：自動更新庫存 + 加權平均成本，但暫不記支出。月底結算後點「✓ 標記已付款」即可
  </div>

  <div class="sec-hd">
    <span class="sec-ttl">進貨記錄</span>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn btn-y btn-sm" onclick="openM('batchPurchase')">📦 批次輸入</button>
      <button class="btn btn-p btn-sm" onclick="openM('addPurchase')">＋ 單筆新增</button>
    </div>
  </div>

  <div class="card">
    <div class="tw"><table>
      <thead><tr><th>日期</th><th>產品</th><th>類別</th><th>數量</th><th>單價</th><th>總成本</th><th>供應商</th><th>備註</th><th>付款狀態</th><th></th></tr></thead>
      <tbody>${purchases.length===0?`<tr><td colspan="10"><div class="empty"><div class="empty-ico">📦</div><p>本月尚無進貨記錄</p></div></td></tr>`:
        purchases.map(p=>{
          const paid=isPaid(p);
          return`<tr style="${paid?'background:var(--grnL);':''}">
          <td>${p.date||''}</td>
          <td><b>${p.productName||''}</b></td>
          <td><span class="bdg gold">${p.category||''}</span></td>
          <td>${p.qty}</td>
          <td class="tm">$${fmt(p.unitCost)}</td>
          <td class="an">$${fmt(p.totalCost)}</td>
          <td class="tm">${p.supplier||''}</td>
          <td class="tm">${p.note||''}</td>
          <td>${paid?
            `<div><span class="pill grn">✅ 已付款</span><div class="tm" style="margin-top:4px;font-size:11px;">${p.paidDate||''} ${p.payMethod||p.paidMethod||''}</div></div>`
            :`<button class="btn btn-g btn-sm" onclick="payPurchase('${p.id}')">✓ 標記已付款</button>`}</td>
          <td style="white-space:nowrap;">
            ${paid?`<button class="btn btn-s btn-sm" onclick="unpayPurchase('${p.id}')">取消付款</button>`:''}
            <button class="bdel" style="color:#aaa;" onclick="openM('editPurchase','${p.id}')">✏️</button>
            <button class="bdel" onclick="delPurchase('${p.id}')">×</button>
          </td>
        </tr>`;}).join('')}
      </tbody>
    </table></div>
  </div>`;
}

// ─── INVENTORY ─────────────────────────────────────────────
function pgInventory(){
  const prods=S.data.products||[];
  const cats=['全部',...PRODUCT_CATS];
  const curCat=cats[S.subTab]||'全部';
  const filtered=curCat==='全部'?prods:prods.filter(p=>p.category===curCat);
  const lowCount=prods.filter(p=>{const i=getInv(p.id);return toN(i.qty)<toN(i.minQty||1);}).length;
  const totalValue=prods.reduce((s,p)=>{const i=getInv(p.id);return s+toN(i.qty)*toN(getAvgCost(p.id));},0);
  const okCount=prods.filter(p=>{const i=getInv(p.id);return toN(i.qty)>=toN(i.minQty||1);}).length;

  // 所有分頁都依「廠商→系列→名稱」分組
  let groupedHTML='';
  if(filtered.length>0){
    const groups={};
    filtered.forEach(p=>{
      const sup=p.supplier||'未指定廠商';
      const ser=p.series||'未分系列';
      const k=`${sup}__${ser}`;
      if(!groups[k])groups[k]={supplier:sup,series:ser,items:[]};
      groups[k].items.push(p);
    });
    // 每組內依名稱排序
    Object.values(groups).forEach(g=>{
      g.items.sort((a,b)=>(a.name||'').localeCompare(b.name||'','zh-Hant'));
    });
    groupedHTML=Object.entries(groups).sort((a,b)=>{
      // 「未指定廠商」排到最後
      if(a[1].supplier==='未指定廠商'&&b[1].supplier!=='未指定廠商')return 1;
      if(b[1].supplier==='未指定廠商'&&a[1].supplier!=='未指定廠商')return -1;
      if(a[1].supplier!==b[1].supplier)return a[1].supplier.localeCompare(b[1].supplier,'zh-Hant');
      return a[1].series.localeCompare(b[1].series,'zh-Hant');
    }).map(([k,g])=>{
      const groupValue=g.items.reduce((s,p)=>{const i=getInv(p.id);return s+toN(i.qty)*toN(getAvgCost(p.id));},0);
      const groupBg=g.supplier==='未指定廠商'?'var(--bg2)':'linear-gradient(90deg,var(--goldL),transparent)';
      return`<div class="card" style="margin-bottom:14px;">
        <div class="card-hd" style="background:${groupBg};">
          <span class="card-ttl">🏷️ ${g.supplier}　·　${g.series}</span>
          <span class="bdg gold">${g.items.length} 項　$${fmt(groupValue)}</span>
        </div>
        <div class="tw"><table>
          <thead><tr><th>產品</th>${curCat==='全部'?'<th>類別</th>':''}<th>售價</th><th>平均成本</th><th>毛利率</th><th>庫存</th><th>低量</th><th>狀態</th><th>庫存價值</th><th>調整</th><th></th></tr></thead>
          <tbody>${g.items.map(p=>{
            const inv=getInv(p.id);
            const qty=toN(inv.qty);
            const minQty=toN(inv.minQty||1);
            const avgCost=getAvgCost(p.id);
            const val=qty*avgCost;
            const margin=p.price>0?Math.round((p.price-avgCost)/p.price*100):0;
            const status=qty<=0?'<span class="tag tag-low">缺貨</span>':qty<minQty?'<span class="tag tag-warn">偏低</span>':'<span class="tag tag-ok">正常</span>';
            return`<tr style="${qty<minQty?'background:var(--redL);':''}">
              <td><b>${p.name}</b>${p.note?`<div class="tm">${p.note}</div>`:''}</td>
              ${curCat==='全部'?`<td><span class="bdg gold">${p.category||''}</span></td>`:''}
              <td><b style="color:var(--rose);">$${fmt(p.price||0)}</b></td>
              <td class="tm">$${fmt(avgCost)}</td>
              <td><span class="${margin>=50?'ap':margin>=30?'ag':'an'}">${margin}%</span></td>
              <td style="font-size:18px;font-weight:700;color:${qty<minQty?'var(--red)':'var(--grn)'};">${qty}</td>
              <td class="tm">${minQty}</td>
              <td>${status}</td>
              <td class="ag">$${fmt(val)}</td>
              <td>
                <div style="display:flex;align-items:center;gap:6px;">
                  <button class="btn btn-s btn-sm" onclick="adjInv('${p.id}',-1)">－</button>
                  <span style="font-weight:700;min-width:24px;text-align:center;">${qty}</span>
                  <button class="btn btn-p btn-sm" onclick="adjInv('${p.id}',1)">＋</button>
                </div>
              </td>
              <td style="white-space:nowrap;">
                <button class="bdel" style="color:#aaa;font-size:18px;padding:4px 8px;" onclick="openM('editProduct','${p.id}')" title="編輯產品">✏️</button>
                <button class="bdel" onclick="delProduct('${p.id}')" title="刪除">×</button>
              </td>
            </tr>`;
          }).join('')}</tbody>
        </table></div>
      </div>`;
    }).join('');
  }

  return`
  <div class="pg-ttl">🗂️ 庫存盤點</div>
  <div class="pg-sub">產品依「廠商 → 系列 → 名稱」自動分組排序，方便快速查找與盤點</div>
  <div class="sg sg4">
    <div class="sc"><div class="sl">產品總數</div><div class="sv">${prods.length}</div></div>
    <div class="sc red"><div class="sl">低庫存警示</div><div class="sv red">${lowCount}</div></div>
    <div class="sc gold"><div class="sl">庫存總價值</div><div class="sv gold sm">$${fmt(totalValue)}</div></div>
    <div class="sc grn"><div class="sl">正常庫存</div><div class="sv grn">${okCount}</div></div>
  </div>

  <div class="tab-bar">${cats.map((c,i)=>{
    const cnt=c==='全部'?prods.length:prods.filter(p=>p.category===c).length;
    return`<button class="tab-p${S.subTab===i?' active':''}" onclick="setT(${i})">${c}（${cnt}）</button>`;
  }).join('')}</div>

// ─── 設備折舊 ─────────────────────────────────────────────
function pgEquipment(){
  const eqs=S.data.equipment||[];
  // 計算當期折舊（按月線性折舊）
  const today_d=new Date();
  function calcDepreciation(eq){
    if(!eq.purchaseDate||!eq.years||toN(eq.years)<=0)return{monthly:0,accumulated:0,bookValue:toN(eq.cost)};
    const purDate=new Date(eq.purchaseDate);
    const months=Math.max(0,(today_d.getFullYear()-purDate.getFullYear())*12+(today_d.getMonth()-purDate.getMonth()));
    const totalMonths=toN(eq.years)*12;
    const monthlyDepre=toN(eq.cost)/totalMonths;
    const accumulated=Math.min(toN(eq.cost),Math.round(monthlyDepre*months));
    const bookValue=Math.max(0,toN(eq.cost)-accumulated);
    return{monthly:Math.round(monthlyDepre),accumulated,bookValue};
  }

  const totalCost=eqs.reduce((s,e)=>s+toN(e.cost),0);
  const totalBook=eqs.reduce((s,e)=>s+calcDepreciation(e).bookValue,0);
  const totalMonthly=eqs.reduce((s,e)=>s+calcDepreciation(e).monthly,0);

  return`
  <div class="pg-ttl">🛋️ 設備折舊</div>
  <div class="pg-sub">設備不算庫存（如美體趴枕、按摩床、蒸臉器），每月按使用年限折舊計算</div>

    <div class="sc red"><div class="sl">每月折舊費</div><div class="sv red sm">$${fmt(totalMonthly)}</div><div class="ss">計入每月支出</div></div>

  <div class="card">
    <div class="tw"><table>
      <thead><tr><th>名稱</th><th>類別</th><th>購入日期</th><th>原值</th><th>使用年限</th><th>每月折舊</th><th>累計折舊</th><th>帳面價值</th><th>備註</th><th></th></tr></thead>
      <tbody>${eqs.length===0?`<tr><td colspan="10"><div class="empty"><div class="empty-ico">🛋️</div><p>尚未建立設備清單，例如美體床、蒸臉器、按摩椅等</p></div></td></tr>`:

          const d=calcDepreciation(e);
          return`<tr>
            <td><b>${e.name||''}</b></td>

// 計算服務成本卡的財務數據
// ─── 計算單位成本（每 1g/1ml/1片的成本）──
// 邏輯：產品「整瓶/整盒」的進貨成本 ÷ 內含容量 = 單位成本
function getUnitCost(productId){
  const p=(S.data.products||[]).find(x=>x.id===productId);
  if(!p)return 0;
  const totalCost=getAvgCost(productId);  // 整瓶/整個的成本
  const capacity=toN(p.capacity);  // 內含容量（如 400ml）
  if(capacity>0)return totalCost/capacity;  // 每 1ml/1g 多少錢
  return totalCost;  // 沒填容量 → 整瓶當一個單位
}

function calcServiceCardFinancials(card,fixedPerSvc){
  const products=S.data.products||[];
  // 材料成本：用「單位成本」× 用量
  const materialCost=(card.items||[]).reduce((s,it)=>{
    const unitCost=getUnitCost(it.productId);
    return s+Math.round(unitCost*toN(it.qty));
  },0);
  const price=toN(card.price);
  const commRate=card.commissionRate!==undefined?toN(card.commissionRate):0.6;
  const commission=Math.round(price*commRate);
  // 固定攤分：優先順序
  // 1. 服務卡自訂金額（card.fixedOverride）
  // 2. 床位每小時成本 × 服務時長
  // 3. fallback fixedPerSvc（房租÷月服務數，舊邏輯）
  let fixed=0;
  let fixedSource='';
  if(card.fixedOverride!==undefined&&card.fixedOverride!==''){
    fixed=toN(card.fixedOverride);
    fixedSource='custom';
  }else if(toN(card.duration)>0){
    const hourlyRate=toN(S.data.settings?.bedHourlyRate);
    if(hourlyRate>0){
      fixed=Math.round(hourlyRate*toN(card.duration)/60);
      fixedSource='hourly';
    }else{
      fixed=toN(fixedPerSvc);
      fixedSource='fallback';
    }
  }else{
    fixed=toN(fixedPerSvc);
    fixedSource='fallback';
  }
  const totalCost=materialCost+commission+fixed;
  const companyNet=price-totalCost;
  const netMargin=price>0?Math.round(companyNet/price*100):0;
  const denominator30=1-commRate-0.30;
  const suggestedPrice30=denominator30>0?Math.ceil((materialCost+fixed)/denominator30/100)*100:0;
  const denominator20=1-commRate-0.20;
  const suggestedPrice20=denominator20>0?Math.ceil((materialCost+fixed)/denominator20/100)*100:0;
  return{materialCost,commission,fixed,fixedSource,totalCost,companyNet,netMargin,suggestedPrice30,suggestedPrice20};
}

// ───── 客戶顯示與簽名模式 ─────
function pgTreatmentCustomerView(t){
  const products=S.data.products||[];
  const studioName=S.data.settings?.studioName||'沐蜜美容工作室';
  const totalServices=t.services.reduce((s,sv)=>s+toN(sv.price),0);
  const totalProducts=t.products.reduce((s,p)=>s+toN(p.price)*toN(p.qty||1),0);
  const totalAmount=totalServices+totalProducts;
  // 找對應條款（根據第一個服務的類型）
  const termsMap=S.data.settings?.termsMap||{};
  let termContent=termsMap['預設（通用）']||'';
  if(t.services.length>0){
    // 嘗試匹配服務名稱中包含的關鍵字
    const svcNames=t.services.map(s=>s.name||'').join(' ');
    const candidates=Object.keys(termsMap).filter(k=>k!=='預設（通用）');
    for(const c of candidates){
      const keywords=c.split('（')[0]; // 「霧眉霧唇」
      const kw1=keywords.substring(0,2);
      if(svcNames.includes(kw1)||svcNames.includes(keywords)){
        termContent=termsMap[c];
        break;
      }
    }
  }
  if(!termContent){
    termContent=`【服務項目確認】
本人已知悉並同意接受以下服務內容，包含使用之產品與用量。

【健康聲明】
本人於接受服務前已主動告知工作室任何過敏史、皮膚狀況、健康問題。

【權益保障】
本人已了解此次服務之內容、效果與可能反應。如有不適會立即告知服務人員。

【個資同意】
本人同意工作室為服務目的紀錄此次療程內容。`;
  }
  return`
  <!-- 浮動返回按鈕（小且不顯眼，避免客戶不小心點到）-->
  <button onclick="switchTreatmentMode('staff')" title="返回老師模式" style="position:fixed;top:14px;right:14px;z-index:100;background:rgba(255,255,255,0.7);backdrop-filter:blur(8px);border:1px solid var(--bdr);color:var(--mut);padding:6px 10px;border-radius:20px;font-size:11px;cursor:pointer;opacity:0.5;transition:opacity 0.3s;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.5">
    ← 老師模式
  </button>

  <div style="background:linear-gradient(135deg,var(--rose) 0%,var(--gold) 100%);padding:24px;border-radius:14px;margin-bottom:14px;color:#fff;text-align:center;">
    <div style="font-size:14px;opacity:0.9;margin-bottom:4px;">${studioName}</div>
    <div style="font-size:28px;font-weight:700;">${t.customer||'尊敬的客戶'} 親愛的</div>
    <div style="font-size:14px;opacity:0.9;margin-top:6px;">${t.date}　·　負責老師：${t.staff}</div>
  </div>

  <!-- 服務內容 -->
  ${t.services.length>0?`<div class="card" style="margin-bottom:12px;">
    <div class="card-hd"><span class="card-ttl">🌸 為您安排的服務</span></div>
    <div class="card-bd" style="padding:0;">
      ${t.services.map(sv=>{
        const productsUsed=sv.productsUsed||[];
        return`<div style="padding:14px 16px;border-bottom:1px solid var(--bdr);">
          <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:6px;">
            <div>
              <div style="font-size:18px;font-weight:700;color:var(--rose);">${sv.name||''}</div>
              <div class="tm" style="font-size:12px;margin-top:2px;">${sv.duration?`時長 ${sv.duration} 分鐘`:''}</div>
            </div>
            <div style="font-size:18px;font-weight:700;color:var(--gold);">$${fmt(sv.price)}</div>
          </div>
          ${productsUsed.length>0?`<div style="margin-top:8px;padding:8px 10px;background:var(--purL);border-radius:6px;font-size:13px;">
            <b>📦 本次使用產品：</b>${productsUsed.map(pu=>{
              const p=products.find(x=>x.id===pu.productId);
              if(!p)return'';
              const cap=p.capacity?`（${p.capacity}${p.capacityUnit||''}）`:'';
              return`${p.name}${cap}${pu.qty?` ${pu.qty}${pu.unit||''}`:''}`;
            }).filter(Boolean).join('、')}
          </div>`:''}
        </div>`;
      }).join('')}
    </div>
  </div>`:''}

  <!-- 客戶當天狀況 -->
  ${t.skinCondition?`<div class="card" style="margin-bottom:12px;background:var(--bg2);">
    <div class="card-bd">
      <b>📋 服務前狀況：</b>${t.skinCondition}
    </div>
  </div>`:''}

  <!-- 產品 -->
  ${t.products.length>0?`<div class="card" style="margin-bottom:12px;">
    <div class="card-hd"><span class="card-ttl">🛍️ 您加購的產品</span></div>
    <div class="card-bd" style="padding:0;">
      ${t.products.map(p=>`<div style="display:flex;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--bdr);">
        <div><b>${p.name}</b><span class="tm" style="margin-left:8px;">× ${p.qty||1}</span></div>
        <div style="font-weight:700;color:var(--gold);">$${fmt(toN(p.price)*toN(p.qty||1))}</div>

  <!-- 總計 -->

    <div class="card-bd">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span style="font-size:16px;font-weight:700;">總計</span>
        <span style="font-size:32px;font-weight:700;color:var(--rose);">$${fmt(totalAmount)}</span>
      </div>
      <div class="tm" style="text-align:right;font-size:12px;margin-top:4px;">付款方式：${t.payMethod}</div>
    </div>
  </div>

  <!-- 膚況/身體狀況快速確認單 -->
  <div class="card" style="margin-bottom:14px;border-left:4px solid var(--gold);">
    <div class="card-hd" style="background:var(--goldL);"><span class="card-ttl" style="color:var(--goldDk);">🩺 今日身體狀況確認</span></div>
    <div class="card-bd">
      <div class="tm" style="font-size:12px;margin-bottom:10px;">請花一分鐘確認今日狀況，幫助我們提供更貼心的服務</div>

      <div style="margin-bottom:14px;">

// ─── STAFF ─────────────────────────────────────────────────
function pgStaff(){
  const staff=S.data.staff||[];
  const sales=getSales();
  // 統計每位老師：使用 getSaleFinancials 計算真實抽成
  const byStaff={};
  sales.forEach(s=>{
    const u=s.staff||'未分配';
    if(!byStaff[u])byStaff[u]={total:0,cnt:0,svc:0,prd:0,commission:0,absorbed:0,faceTotal:0,companyNet:0};
    const f=getSaleFinancials(s);
    byStaff[u].total+=f.realRevenue;
    byStaff[u].faceTotal+=f.faceAmount;
    byStaff[u].cnt++;
    byStaff[u].commission+=f.commission;
    byStaff[u].absorbed+=f.absorbed;
    byStaff[u].companyNet+=f.companyNet;
    if(s.type==='service')byStaff[u].svc+=f.realRevenue;
    if(s.type==='product')byStaff[u].prd+=f.realRevenue;
  });
  return`
  <div class="pg-ttl">👩‍💼 老師業績</div>
  <div class="pg-sub">本月各老師服務筆數、抽成（按原價面額計算）、公司吸收的折讓</div>
  ${moSel()}
  <div class="sg ${Object.keys(byStaff).length>0?'sg4':'sg2'}">
    ${Object.entries(byStaff).sort((a,b)=>b[1].commission-a[1].commission).map(([name,d])=>`
    <div class="sc rose">
      <div class="sl">${name}</div>
      <div class="sv rose sm">抽成 $${fmt(d.commission)}</div>
      <div class="ss">${d.cnt} 筆 ｜ 認列營收 $${fmt(d.total)}${d.absorbed>0?`<br>公司吸收折讓 $${fmt(d.absorbed)}`:''}</div>
    </div>`).join('')}
  </div>

  <div class="card">
    <div class="card-hd"><span class="card-ttl">📊 老師抽成明細（每筆訂單）</span></div>
    <div class="tw"><table>
      <thead><tr><th>日期</th><th>老師</th><th>項目</th><th>客戶</th><th>原價面額</th><th>實收</th><th>抽成率</th><th>抽成基準</th><th>抽成金額</th><th>公司吸收</th><th>公司淨收</th><th></th></tr></thead>
      <tbody>${sales.length===0?`<tr><td colspan="12"><div class="empty"><p>本月尚無銷售紀錄</p></div></td></tr>`:
        sales.sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(s=>{
          const f=getSaleFinancials(s);
          const baseLabel=f.base===f.faceAmount?'原價':'實收';
          return`<tr>
            <td class="tm">${s.date||''}</td>
            <td><b>${s.staff||''}</b></td>
            <td>${s.item||''}${s.subNote?`<div class="tm">${s.subNote}</div>`:''}</td>
            <td class="tm">${s.customer||''}</td>
            <td>$${fmt(f.faceAmount)}</td>
            <td>$${fmt(f.realRevenue)}</td>
            <td>${Math.round(f.rate*100)}%</td>
            <td><span class="bdg">${baseLabel}</span></td>
            <td class="ag">$${fmt(f.commission)}</td>
            <td class="${f.absorbed>0?'an':''}">${f.absorbed>0?`-$${fmt(f.absorbed)}`:'-'}</td>
            <td class="${f.companyNet>=0?'ap':'an'}">$${fmt(f.companyNet)}</td>
            <td><button class="bdel" style="color:#aaa;" onclick="openM('editSale','${s.id}')" title="編輯抽成">✏️</button></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table></div>
  </div>

  <div class="card">
    <div class="card-hd"><span class="card-ttl">👥 老師資料</span><button class="btn btn-p btn-sm" onclick="openM('addStaff')">＋ 新增老師</button></div>
    <div class="tw"><table>
      <thead><tr><th>姓名</th><th>職稱</th><th>本月服務數</th><th>本月認列營收</th><th>本月抽成</th><th>公司吸收折讓</th><th></th></tr></thead>
      <tbody>${staff.length===0?`<tr><td colspan="7"><div class="empty"><p>尚未建立老師資料</p></div></td></tr>`:
        staff.map(u=>{
          const d=byStaff[u.name]||{total:0,cnt:0,commission:0,absorbed:0};
          return`<tr>
            <td><b>${u.name}</b></td>
            <td><span class="bdg">${u.title||''}</span></td>
            <td>${d.cnt}</td>
            <td class="ap">$${fmt(d.total)}</td>
            <td class="ag">$${fmt(d.commission)}</td>
            <td class="${d.absorbed>0?'an':''}">${d.absorbed>0?`$${fmt(d.absorbed)}`:'-'}</td>
            <td><button class="bdel" onclick="delStaff('${u.id}')">×</button></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table></div>
  </div>`;
}

// ─── CASHFLOW ──────────────────────────────────────────────
function pgCashflow(){
  const entries=S.data.cashFlow.filter(e=>e.month===S.month&&e.year===yr()).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const allEntries=S.data.cashFlow.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const curY=yr(),curM=S.month;
  const prevBal=allEntries.filter(e=>e.year<curY||(e.year===curY&&e.month<curM)).reduce((s,e)=>s+toN(e.amount),0);
  let running=prevBal;
  const rows=entries.map(e=>{running+=toN(e.amount);return{...e,run:running};});
  const moBal=running;
  const mIn=entries.filter(e=>toN(e.amount)>0).reduce((s,e)=>s+toN(e.amount),0);
  const mOut=entries.filter(e=>toN(e.amount)<0).reduce((s,e)=>s+Math.abs(toN(e.amount)),0);
  return`
  <div class="pg-ttl">🏦 現金流水帳</div>
  <div class="pg-sub">工作室現金帳，隨時核對實際餘額</div>
  ${moSel()}
  <div class="sg sg4">
    <div class="sc"><div class="sl">上月結餘</div><div class="sv sm gold">$${fmt(prevBal)}</div></div>
    <div class="sc grn"><div class="sl">本月存入</div><div class="sv grn sm">$${fmt(mIn)}</div></div>
    <div class="sc red"><div class="sl">本月支出</div><div class="sv red sm">$${fmt(mOut)}</div></div>
    <div class="sc ${moBal>=0?'grn':'red'}">
      <div class="sl">本月結餘</div>
      <div class="sv sm ${moBal>=0?'grn':'red'}">$${fmt(moBal)}</div>
    </div>
  </div>
  <div class="card">
    <div class="card-hd">
      <span class="card-ttl">🏦 現金流明細</span>
      <button class="btn btn-p btn-sm" onclick="openM('addCF')">＋ 新增</button>
    </div>
    <div class="tw"><table>
      <thead><tr><th>日期</th><th>金額</th><th>類別</th><th>說明</th><th>累計餘額</th><th></th></tr></thead>
      <tbody>
        <tr style="background:var(--bg2);font-weight:700;">
          <td colspan="2" class="tm">📅 上月結餘</td>
          <td colspan="2"></td>
          <td style="font-weight:700;color:${prevBal>=0?'var(--grn)':'var(--red)'};">$${fmt(prevBal)}</td>
          <td></td>
        </tr>
        ${rows.length===0?`<tr><td colspan="6"><div class="empty"><div class="empty-ico">🏦</div><p>本月尚無記錄</p></div></td></tr>`:
          rows.map(r=>`<tr>
            <td>${r.date||''}</td>
            <td class="${toN(r.amount)>=0?'ap':'an'}">${toN(r.amount)>=0?'+':''}$${fmt(r.amount)}</td>
            <td><span class="bdg">${r.cat||''}</span></td>
            <td class="tm">${r.note||''}</td>
            <td class="run-bal" style="color:${r.run>=0?'var(--grn)':'var(--red)'};">$${fmt(r.run)}</td>
            <td style="white-space:nowrap;"><button class="bdel" style="color:#aaa;" onclick="openM('editCF','${r.id}')">✏️</button><button class="bdel" onclick="delCF('${r.id}')">×</button></td>
          </tr>`).join('')}
        <tr style="background:${moBal>=0?'var(--grnL)':'var(--redL)'};font-weight:700;border-top:2px solid var(--bdr);">
          <td colspan="2" class="tm">💰 本月結餘</td>
          <td class="tm">存入$${fmt(mIn)} / 支出$${fmt(mOut)}</td>
          <td></td>
          <td style="font-size:18px;font-weight:700;color:${moBal>=0?'var(--grn)':'var(--red)'};">$${fmt(moBal)}</td>
          <td></td>

// ─── REPORTS ───────────────────────────────────────────────
function pgReports(){
  const mos=Array.from({length:12},(_,i)=>i+1);
  const moData=mos.map(m=>({
    m,rev:getRevTotal(m),exp:getExpTotal(m),
    svc:getSvcTotal(m),prd:getPrdTotal(m),crs:getCrsTotal(m)
  }));
  const tRev=moData.reduce((s,m)=>s+m.rev,0);
  const tExp=moData.reduce((s,m)=>s+m.exp,0);
  const maxV=Math.max(...moData.map(m=>Math.max(m.rev,m.exp)),1);
  const tSvc=moData.reduce((s,m)=>s+m.svc,0);
  const tPrd=moData.reduce((s,m)=>s+m.prd,0);
  const tCrs=moData.reduce((s,m)=>s+m.crs,0);
  return`
  <div class="pg-ttl">📈 月報年報</div>
  <div class="pg-sub">${yr()}年 全年財務分析</div>
  <div class="sg sg4">
    <div class="sc rose"><div class="sl">年度總營收</div><div class="sv rose sm">$${fmt(tRev)}</div></div>
    <div class="sc red"><div class="sl">年度總支出</div><div class="sv red sm">$${fmt(tExp)}</div></div>
    <div class="sc ${tRev-tExp>=0?'grn':'red'}"><div class="sl">年度淨利</div><div class="sv sm ${tRev-tExp>=0?'grn':'red'}">$${fmt(tRev-tExp)}</div></div>
    <div class="sc gold"><div class="sl">年度毛利率</div><div class="sv gold sm">${tRev>0?Math.round((tRev-tExp)/tRev*100):0}%</div></div>
  </div>
  <div class="card">
    <div class="card-hd"><span class="card-ttl">📊 月度營收走勢</span></div>
    <div class="card-bd" style="overflow-x:auto;">
      <div style="min-width:600px;">
        ${moData.map(m=>{
          const rp=Math.round(m.rev/maxV*100),ep=Math.round(m.exp/maxV*100);
          return`<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
            <div style="width:36px;font-size:14px;color:var(--mut);text-align:right;">${m.m}月</div>
            <div style="flex:1;display:flex;flex-direction:column;gap:4px;">
              <div class="pb" style="height:13px;"><div class="pf" style="width:${rp}%;height:13px;background:var(--rose);"></div></div>
              <div class="pb" style="height:13px;"><div class="pf" style="width:${ep}%;height:13px;background:var(--red);"></div></div>
            </div>
            <div style="width:120px;font-size:13px;"><div class="ap">$${fmt(m.rev)}</div><div class="an">$${fmt(m.exp)}</div></div>
            <div style="width:90px;font-size:13px;font-weight:700;${m.rev-m.exp>=0?'color:var(--grn)':'color:var(--red)'};">$${fmt(m.rev-m.exp)}</div>
          </div>`;
        }).join('')}
        <div style="display:flex;gap:18px;margin-top:10px;font-size:13px;color:var(--mut);"><span>🌸 營收</span><span>🔴 支出</span><span>右側＝淨利</span></div>
      </div>
    </div>
  </div>
  <div class="sg sg2">
    <div class="card">
      <div class="card-hd"><span class="card-ttl">💰 年度收入結構</span></div>
      <div class="card-bd">
        ${tRev===0?'<div class="empty"><p>尚無收入記錄</p></div>':[
          {lbl:'🌸 服務收入',val:tSvc,color:'var(--rose)'},
          {lbl:'🧴 產品銷售',val:tPrd,color:'var(--gold)'},
          {lbl:'📚 課程收入',val:tCrs,color:'var(--pur)'},
        ].map(({lbl,val,color})=>`
          <div style="margin-bottom:16px;">
            <div class="plbl"><span>${lbl}</span><span style="font-weight:700;color:${color};">$${fmt(val)}（${tRev>0?Math.round(val/tRev*100):0}%）</span></div>
            <div class="pb" style="height:14px;"><div class="pf" style="width:${tRev>0?Math.round(val/tRev*100):0}%;height:14px;background:${color};"></div></div>
          </div>`).join('')}
      </div>
    </div>
    <div class="card">
      <div class="card-hd"><span class="card-ttl">📋 月度明細表</span></div>
      <div class="tw"><table>
        <thead><tr><th>月份</th><th>營收</th><th>支出</th><th>淨利</th><th>毛利率</th></tr></thead>
        <tbody>${moData.map(m=>`<tr>
          <td><b>${m.m}月</b></td>
          <td class="ap">$${fmt(m.rev)}</td>
          <td class="an">$${fmt(m.exp)}</td>
          <td class="${m.rev-m.exp>=0?'ap':'an'}">$${fmt(m.rev-m.exp)}</td>
          <td class="${m.rev>0&&(m.rev-m.exp)/m.rev>0?'ap':'an'}">${m.rev>0?Math.round((m.rev-m.exp)/m.rev*100):0}%</td>
        </tr>`).join('')}</tbody>
      </table></div>
    </div>
  </div>`;

// ─── SETTINGS（基本設定）────────────────────────────────────
function pgSettings(){
  const svcs=S.data.services||[];
  const prods=S.data.products||[];

window.saveSale=async()=>{
  const date=$('m_s0')?.value,amount=parseFloat($('m_s3')?.value)||0;
  if(!date||!amount){alert('請填日期和金額');return;}
  const d=new Date(date);
  await addSub('sales',{date,type:$('m_s1')?.value,item:$('m_s2')?.value||'',subNote:$('m_sNote')?.value||'',amount,payMethod:$('m_s4')?.value,staff:$('m_s5')?.value,customer:$('m_s6')?.value||'',month:d.getMonth()+1,year:d.getFullYear()});
  toast('✅ 收入已記帳');closeMod();
};
window.updSale=async(id)=>{
  const date=$('m_s0')?.value,amount=parseFloat($('m_s3')?.value)||0;
  if(!date||!amount){alert('請填日期和金額');return;}
  const d=new Date(date);
  const old=(S.data.sales||[]).find(x=>x.id===id)||{};
  const face=parseFloat($('m_sFace')?.value)||amount;
  const commPercent=parseFloat($('m_sComm')?.value);
  const commissionRate=isNaN(commPercent)?DEFAULT_COMMISSION_RATE:commPercent/100;
  const commissionBase=$('m_sCombase')?.value||'face';
  const updated={
    ...old,
    date,
    type:$('m_s1')?.value,
    item:$('m_s2')?.value||'',
    subNote:$('m_sNote')?.value||'',
    amount,
    payMethod:$('m_s4')?.value,
    staff:$('m_s5')?.value,
    customer:$('m_s6')?.value||'',
    commissionRate,
    commissionBase,
    month:d.getMonth()+1,year:d.getFullYear()
  };
  // 只有當原價面額 > 認列營收時才存（代表有公司吸收折讓）
  if(face>amount){
    updated.depositFaceAmount=face;
  }else if(face===amount){
    // 相等代表沒有折讓，移除欄位
    delete updated.depositFaceAmount;
  }else{
    updated.depositFaceAmount=face;
  }
  await setSub('sales',id,updated);
  toast('✅ 已更新');closeMod();
};
window.delSale=async id=>{if(!confirm('確認刪除？'))return;await delSub('sales',id);toast('已刪除');};

S.cart=S.cart||[];

window.addProductToCart=()=>{
  const sel=$('m_pd_pick');
  if(!sel||!sel.value)return;
  const opt=sel.options[sel.selectedIndex];
  const id=opt.value;
  const name=opt.dataset.name||opt.text.split('（')[0];

  // 檢查是否已加過 → 數量 +1
  const existed=S.cart.find(it=>it.id===id&&!it.custom);
  if(existed){existed.qty++;}
  else{S.cart.push({id,name,price,qty:1,custom:false,type:'product'});}

  renderCart();
};

window.addCustomProductRow=()=>{

};

window.removeCartItem=(idx)=>{
  S.cart.splice(idx,1);
  renderCart();
};

window.updCartQty=(idx,delta)=>{
  if(!S.cart[idx])return;
  S.cart[idx].qty=Math.max(1,(S.cart[idx].qty||1)+delta);

};

window.updCartField=(idx,field,value)=>{
  if(!S.cart[idx])return;
  if(field==='price'||field==='qty')value=parseFloat(value)||0;
  S.cart[idx][field]=value;
  // 只更新總額，不重繪整個購物車（避免 input 失焦）
  const total=S.cart.reduce((s,it)=>s+toN(it.price)*toN(it.qty),0);
  if($('m_pd_total'))$('m_pd_total').textContent='$'+fmt(total);
};

function renderCart(){

  if(!cart)return;
  if(S.cart.length===0){
    cart.innerHTML='<div class="tm" style="text-align:center;padding:14px;">尚無商品，請從上方選擇或新增</div>';
  }else{
    cart.innerHTML=S.cart.map((it,i)=>{
      const subtotal=toN(it.price)*toN(it.qty);
      if(it.custom){
        // 臨時產品 — 名稱與價格可編輯
        return`<div style="display:flex;gap:6px;align-items:center;background:var(--card);padding:8px;border-radius:6px;border:1px dashed var(--gold);">
          <span class="bdg gold" style="flex-shrink:0;">臨時</span>
          <input type="text" placeholder="商品名稱" value="${it.name}" oninput="updCartField(${i},'name',this.value)" style="flex:2;min-width:100px;padding:4px 8px;border:1px solid var(--bdr);border-radius:4px;">
          <input type="number" placeholder="單價" value="${it.price||''}" oninput="updCartField(${i},'price',this.value)" style="flex:1;width:80px;padding:4px 8px;border:1px solid var(--bdr);border-radius:4px;">
          <span style="white-space:nowrap;font-size:13px;">×</span>
          <input type="number" value="${it.qty}" min="1" oninput="updCartField(${i},'qty',this.value)" style="width:50px;padding:4px 8px;border:1px solid var(--bdr);border-radius:4px;">
          <span style="white-space:nowrap;font-weight:700;color:var(--gold);min-width:60px;text-align:right;">$${fmt(subtotal)}</span>
          <button class="bdel" onclick="removeCartItem(${i})">×</button>
        </div>`;
      }else{
        // 服務 / 正式產品
        const isService=it.type==='service';
        return`<div style="display:flex;gap:6px;align-items:center;background:var(--card);padding:8px;border-radius:6px;${isService?'border-left:3px solid var(--rose);':''}">
          ${isService?`<span class="bdg" style="background:var(--roseL);color:var(--rose);flex-shrink:0;">🌸 服務</span>`:`<span class="bdg gold" style="flex-shrink:0;">📦 產品</span>`}
          <span style="flex:2;min-width:100px;font-weight:700;">${it.name}</span>
          <input type="number" value="${it.price}" oninput="updCartField(${i},'price',this.value)" style="width:80px;padding:4px 8px;border:1px solid var(--bdr);border-radius:4px;" title="可改單價">
          <button class="btn btn-s btn-sm" onclick="updCartQty(${i},-1)" style="padding:2px 8px;">-</button>
          <span style="min-width:24px;text-align:center;font-weight:700;">${it.qty}</span>
          <button class="btn btn-p btn-sm" onclick="updCartQty(${i},1)" style="padding:2px 8px;">+</button>
          <span style="white-space:nowrap;font-weight:700;color:var(--gold);min-width:60px;text-align:right;">$${fmt(subtotal)}</span>
          <button class="bdel" onclick="removeCartItem(${i})">×</button>
        </div>`;
      }
    }).join('');
  }
  // 更新總額
  const total=S.cart.reduce((s,it)=>s+toN(it.price)*toN(it.qty),0);
  if($('m_pd_total'))$('m_pd_total').textContent='$'+fmt(total);

// 購物車結帳
window.saveCartOrder=async(continueInput)=>{
  try{
    if(S.cart.length===0){alert('購物車是空的，請先加入商品');return;}
    // 過濾掉空商品
    const items=S.cart.filter(it=>it.name&&toN(it.price)*toN(it.qty)>0);
    if(items.length===0){alert('購物車內所有商品都還沒填寫名稱或價格');return;}
    const date=$('m_pd0')?.value||today();
    const totalAmount=items.reduce((s,it)=>s+toN(it.price)*toN(it.qty),0);
    let customer=$('m_pd5')?.value||'';
    if(customer==='__new__')customer=$('m_pd5_new')?.value?.trim()||'';
    const payMethod=$('m_pd7')?.value||'';
    let depositOwner='';
    let depositFaceAmount=0;
    let realRevenueRate=1;
    if(payMethod==='儲值扣款'){
      if(!customer){alert('儲值扣款必須選擇客戶');return;}
      depositOwner=$('m_pd_owner')?.value||customer;
      const bal=getCustomerBalance(depositOwner);
      depositFaceAmount=totalAmount;
      if(bal<depositFaceAmount){
        const ownerLabel=depositOwner===customer?'此客戶':`${depositOwner}（共用儲值）`;
        if(!confirm(`⚠️ ${ownerLabel} 儲值餘額不足！\n餘額 $${fmt(bal)}　扣款 $${fmt(depositFaceAmount)}\n\n是否仍要記錄？`))return;
      }
      realRevenueRate=getCustomerDiscountRate(depositOwner);
    }
    const d=new Date(date);
    const note=$('m_pdNote')?.value||'';
    const staff=$('m_pd6')?.value||'';
    // 老師抽成設定
    const commPercent=parseFloat($('m_pd_comm')?.value);
    const commissionRate=isNaN(commPercent)?DEFAULT_COMMISSION_RATE:commPercent/100;
    const commissionBase=$('m_pd_combase')?.value||'face';
    // 為每件商品建立一筆 sales 記錄
    for(const it of items){
      const subtotal=toN(it.price)*toN(it.qty);
      const realRev=Math.round(subtotal*realRevenueRate);
      // 自動判斷服務/產品類型（從報價單帶入的有 type:'service'）
      const itemType=it.type==='service'?'service':'product';
      const saleData={
        date,type:itemType,item:it.name,
        subNote:note,
        amount:realRev,
        qty:it.qty,unitPrice:it.price,
        payMethod,staff,customer,
        commissionRate,commissionBase,
        month:d.getMonth()+1,year:d.getFullYear()
      };
      if(payMethod==='儲值扣款'&&depositOwner){
        saleData.depositOwner=depositOwner;
        saleData.depositFaceAmount=subtotal;
      }
      await addSub('sales',saleData);
      // 扣庫存（只有正式產品）
      if(!it.custom&&it.id){
        const inv=getInv(it.id);
        const newQty=Math.max(0,toN(inv.qty)-toN(it.qty));
        const newInv=[...S.data.inventory.filter(i=>i.productId!==it.id),{...inv,productId:it.id,qty:newQty,minQty:inv.minQty||1}];
        await saveMain({inventory:newInv});
        // 自動建立出貨紀錄
        try{
          await addSub('stockOuts',{
            date,type:'sale',
            productId:it.id,
            productName:it.name,
            qty:toN(it.qty),
            unitCost:getAvgCost(it.id),
            totalCost:getStockOutCost(it.id,it.qty),
            customer,
            note:'銷售開單',
            month:d.getMonth()+1,year:d.getFullYear()
          });
        }catch(e){console.warn('建立 stockOut 失敗',e);}
      }
    }
    // 自動建檔
    if(customer&&!(S.data.customers||[]).find(c=>(c.name||'').trim()===customer)){
      const customers=[...(S.data.customers||[]),{id:uid(),name:customer,phone:'',createdAt:today()}];
      await saveMain({customers});
    }
    const ownerHint=depositOwner&&depositOwner!==customer?`（從 ${depositOwner} 共用儲值扣款）`:'';
    const realTotal=Math.round(totalAmount*realRevenueRate);
    const discountHint=payMethod==='儲值扣款'&&realTotal!==totalAmount?`扣儲值 $${fmt(totalAmount)} → 認列營收 $${fmt(realTotal)}`:`$${fmt(realTotal)}`;

    toast(`✅ ${items.length} 件商品結帳完成 ${discountHint}${ownerHint}`);
    // 清空購物車
    S.cart=[];
    if(continueInput){
      ['m_pdNote'].forEach(id=>{if($(id))$(id).value='';});
      if($('m_pd5'))$('m_pd5').value='';
      if($('m_pd5_new')){$('m_pd5_new').value='';$('m_pd5_new').style.display='none';}

// ── Purchase 單筆 ──
window.savePurchase=async()=>{
  const date=$('m_p0')?.value;
  const pickedPid=$('m_pPick')?.value||'';
  const productName=$('m_p2')?.value?.trim();
  const category=$('m_pCat')?.value;
  const qty=parseFloat($('m_p3')?.value)||0;
  const unitCost=parseFloat($('m_p4')?.value)||0;
  let totalCost=parseFloat($('m_p5')?.value)||qty*unitCost;
  const sellPrice=parseFloat($('m_pPrice')?.value)||0;
  const series=$('m_pSeries')?.value?.trim()||'';
  if(!date||!qty){alert('請填日期和數量');return;}
  if(!pickedPid&&!productName){alert('請選擇現有產品或填寫產品名稱');return;}
  const supSel=$('m_p6')?.value;
  const supplier=supSel==='其他手動輸入廠商'?($('m_p6c')?.value||'').trim():supSel;
  // 優先：用 productId 直接找產品（避免名稱比對問題）
  let prod=null;
  if(pickedPid){
    prod=(S.data.products||[]).find(p=>p.id===pickedPid);
  }
  // 次選：用名稱+類別比對（兩邊 trim 並去除空白避免重複建立）
  if(!prod&&productName){
    const tName=productName.trim().replace(/[\u3000\s]+/g,'');
    prod=(S.data.products||[]).find(p=>(p.name||'').trim().replace(/[\u3000\s]+/g,'')===tName&&p.category===category);
  }
  let pid;
  if(!prod){
    pid=uid();
    const newProd={id:pid,name:productName.trim(),category,price:sellPrice,cost:unitCost,supplier,series};
    const prods=[...(S.data.products||[]),newProd];
    // 新產品：avgCost = 進貨單價，最低庫存預設 1
    const newInv=[...S.data.inventory,{productId:pid,qty,minQty:1,avgCost:unitCost,totalPurchaseCost:totalCost}];
    await saveMain({products:prods,inventory:newInv});
  }else{
    pid=prod.id;
    const inv=getInv(pid);
    const oldQty=toN(inv.qty);
    const oldAvg=toN(inv.avgCost)||toN(prod.cost)||0;
    // 加權平均：新均價 = (舊量×舊均價 + 新量×新單價) / 總量
    const newAvg=calculateNewAvgCost(oldQty,oldAvg,qty,unitCost);
    const newQty=oldQty+qty;
    const newTotalCost=toN(inv.totalPurchaseCost||0)+totalCost;
    const newInv=[...S.data.inventory.filter(i=>i.productId!==pid),
                  {productId:pid,qty:newQty,minQty:inv.minQty||1,avgCost:newAvg,totalPurchaseCost:newTotalCost}];
    // 順帶更新產品的 cost 為平均成本（顯示用）+ 補填空欄位
    const updProd={...prod,cost:newAvg};
    if(supplier&&!prod.supplier)updProd.supplier=supplier;
    if(series&&!prod.series)updProd.series=series;
    if(sellPrice>0&&!prod.price)updProd.price=sellPrice;
    const prods=(S.data.products||[]).map(p=>p.id===pid?updProd:p);
    await saveMain({inventory:newInv,products:prods});
  }
  const d=new Date(date);
  const recordName=prod?prod.name:productName.trim();
  // 付款狀態
  const paidStatus=document.querySelector('input[name="m_pPaid"]:checked')?.value||'paid';
  const payMethod=$('m_pPayMethod')?.value||'轉帳';
  const paid=paidStatus==='paid';
  // 建立進貨紀錄
  const purchaseId=uid();
  const purchaseData={
    id:purchaseId,
    date,productId:pid,productName:recordName,category,qty,unitCost,totalCost,
    supplier,series,
    paid,payMethod,paidDate:paid?date:null,
    note:$('m_p7')?.value||'',
    month:d.getMonth()+1,year:d.getFullYear()
  };
  await addSub('purchases',purchaseData);
  // 已付款 → 同步寫入支出 + 現金流
  if(paid){
    const expNote=`【進貨】${recordName} × ${qty}${supplier?'（'+supplier+'）':''}`;
    const expRef=await addSub('expenses',{
      date,category:'進貨成本',amount:totalCost,
      payMethod,note:expNote,
      fromPurchase:true,purchaseRefId:purchaseId,
      month:d.getMonth()+1,year:d.getFullYear()
    });
    await addSub('cashFlow',{
      date,amount:-totalCost,cat:'進貨支出',
      note:expNote+`（${payMethod}）`,
      fromPurchase:true,purchaseRefId:purchaseId,
      month:d.getMonth()+1,year:d.getFullYear()
    });
  }
  const finalAvg=getAvgCost(pid);
  toast(`✅ 進貨完成 ${qty} 個，平均成本更新為 $${fmt(finalAvg)}${paid?'（已記支出）':'（未付款，待結算）'}`);
  closeMod();
};

// ── 進貨：標記為已付款（補寫入支出/現金流）──
window.payPurchase=async(id)=>{
  const p=(S.data.purchases||[]).find(x=>x.id===id);
  if(!p)return;
  if(p.paid){alert('此筆已標記為已付款');return;}
  const today_d=today();
  const payMethod=p.payMethod||'轉帳';
  if(!confirm(`確認標記「${p.productName}」這筆進貨為已付款？\n\n金額 $${fmt(p.totalCost)}　付款方式：${payMethod}\n\n會自動寫入支出記帳與現金流水帳`))return;
  // 更新進貨紀錄
  await setSub('purchases',id,{...p,paid:true,paidDate:today_d});
  // 寫入支出
  const expNote=`【進貨】${p.productName} × ${p.qty}${p.supplier?'（'+p.supplier+'）':''}`;
  const d=new Date(today_d);
  await addSub('expenses',{
    date:today_d,category:'進貨成本',amount:p.totalCost,
    payMethod,note:expNote,
    fromPurchase:true,purchaseRefId:id,
    month:d.getMonth()+1,year:d.getFullYear()
  });
  await addSub('cashFlow',{
    date:today_d,amount:-p.totalCost,cat:'進貨支出',
    note:expNote+`（${payMethod}）`,
    fromPurchase:true,purchaseRefId:id,
    month:d.getMonth()+1,year:d.getFullYear()
  });
  toast(`✅ 已標記為已付款，並寫入支出 $${fmt(p.totalCost)}`);
};

// ── 進貨：取消已付款狀態（撤銷支出和現金流）──
window.unpayPurchase=async(id)=>{
  const p=(S.data.purchases||[]).find(x=>x.id===id);
  if(!p||!p.paid)return;
  if(!confirm(`確認取消「${p.productName}」的已付款狀態？\n\n會自動刪除對應的支出和現金流紀錄`))return;
  // 找到並刪除對應的支出和現金流
  const exps=(S.data.expenses||[]).filter(e=>e.fromPurchase&&e.purchaseRefId===id);
  const flows=(S.data.cashFlow||[]).filter(f=>f.fromPurchase&&f.purchaseRefId===id);
  for(const e of exps)await delSub('expenses',e.id);
  for(const f of flows)await delSub('cashFlow',f.id);
  await setSub('purchases',id,{...p,paid:false,paidDate:null});
  toast('已取消已付款狀態');
};

window.delPurchase=async id=>{
  const p=(S.data.purchases||[]).find(x=>x.id===id);
  if(!p)return;
  if(!confirm(`確認刪除「${p.productName}」這筆進貨？\n\n會還原 ${p.qty} 個庫存${p.paid?'，並刪除對應的支出/現金流紀錄':''}`))return;
  // 還原庫存（同時還原加權平均成本是複雜的，這裡簡化處理：只減去數量）
  if(p.productId){
    const inv=getInv(p.productId);
    const newQty=Math.max(0,toN(inv.qty)-toN(p.qty));
    const newInv=[...S.data.inventory.filter(i=>i.productId!==p.productId),{...inv,productId:p.productId,qty:newQty}];
    await saveMain({inventory:newInv});
  }
  // 已付款 → 刪除對應支出/現金流
  if(p.paid){
    const exps=(S.data.expenses||[]).filter(e=>e.fromPurchase&&e.purchaseRefId===id);
    const flows=(S.data.cashFlow||[]).filter(f=>f.fromPurchase&&f.purchaseRefId===id);
    for(const e of exps)await delSub('expenses',e.id);
    for(const f of flows)await delSub('cashFlow',f.id);
  }
  await delSub('purchases',id);
  toast('已刪除進貨紀錄並還原庫存');
};

// ─── 簽名功能（Canvas）───────────────────
let _sigCanvas=null,_sigCtx=null,_sigDrawing=false,_sigHasContent=false;

window.initSignatureCanvas=()=>{
  const canvas=$('m_sign_canvas');
  if(!canvas)return;
  _sigCanvas=canvas;
  // 設定高解析度
  const dpr=window.devicePixelRatio||1;
  const rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr;
  canvas.height=rect.height*dpr;
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.lineWidth=2.5;
  ctx.lineCap='round';
  ctx.strokeStyle='#000';
  _sigCtx=ctx;
  _sigHasContent=false;

  function getPos(e){
    const rect=canvas.getBoundingClientRect();
    if(e.touches&&e.touches[0]){
      return{x:e.touches[0].clientX-rect.left,y:e.touches[0].clientY-rect.top};
    }
    return{x:e.clientX-rect.left,y:e.clientY-rect.top};
  }

  function start(e){
    e.preventDefault();
    _sigDrawing=true;
    const p=getPos(e);
    _sigCtx.beginPath();
    _sigCtx.moveTo(p.x,p.y);
  }
  function move(e){
    if(!_sigDrawing)return;
    e.preventDefault();
    const p=getPos(e);
    _sigCtx.lineTo(p.x,p.y);
    _sigCtx.stroke();
    _sigHasContent=true;
  }
  function end(e){
    e.preventDefault();
    _sigDrawing=false;
  }

  canvas.addEventListener('mousedown',start);
  canvas.addEventListener('mousemove',move);
  canvas.addEventListener('mouseup',end);
  canvas.addEventListener('mouseleave',end);
  canvas.addEventListener('touchstart',start,{passive:false});
  canvas.addEventListener('touchmove',move,{passive:false});
  canvas.addEventListener('touchend',end,{passive:false});
};

window.clearSignature=()=>{
  if(!_sigCanvas||!_sigCtx)return;
  _sigCtx.clearRect(0,0,_sigCanvas.width,_sigCanvas.height);
  _sigHasContent=false;
};

window.saveHealthQuestions=async()=>{
  try{
    const items=document.querySelectorAll('.hq_item');
    const qs=Array.from(items).map(el=>{
      const type=el.querySelector('.hqi_type')?.value||'text';
      const q={
        key:el.querySelector('.hqi_key')?.value||'q'+Date.now(),
        label:el.querySelector('.hqi_label')?.value?.trim()||'',
        type
      };
      if(type==='section'){
        // 章節只需要 label
        return q;
      }
      if(type==='declaration'){
        q.content=el.querySelector('.hqi_content')?.value||'';
        return q;
      }
      // 一般題目
      const ph=el.querySelector('.hqi_placeholder')?.value||'';
      if(ph)q.placeholder=ph;
      if(type==='radio'||type==='checkbox_group'){
        const opts=el.querySelector('.hqi_options')?.value||'';
        q.options=opts.split(',').map(s=>s.trim()).filter(Boolean);
      }
      return q;
    }).filter(q=>q.label);
    if(qs.length===0){alert('至少需要一題');return;}
    const settings={...(S.data.settings||{}),healthQuestions:qs};
    await saveMain({settings});
    toast('✅ 健康問卷已儲存');
    closeMod();
  }catch(err){console.error(err);alert('失敗：'+err.message);}
};

// 顯示健康問卷
window.showHealthForm=(id)=>{
  const r=(S.data.treatmentRecords||[]).find(x=>x.id===id);
  if(!r||!r.healthForm){alert('查無健康問卷資料');return;}
  // 用設定（或預設）對照題目來顯示完整 label
  const qs=S.data.settings?.healthQuestions||DEFAULT_HEALTH_QUESTIONS;
  const labelMap={};
  qs.forEach(q=>{if(q.key&&q.label)labelMap[q.key]=q.label;});
  // 依設定的順序顯示，方便閱讀
  let text='';
  let lastSection='';
  for(const q of qs){
    if(q.type==='section'){
      lastSection=q.label;
      text+=`\n━━━ ${q.label} ━━━\n`;
      continue;
    }
    if(q.type==='declaration')continue;
    const v=r.healthForm[q.key];
    if(v===undefined||v===null||v==='')continue;
    const display=Array.isArray(v)?v.join('、'):v;
    text+=`• ${q.label}：${display}\n`;
  }
  // 補上設定外的多餘 key
  const handledKeys=new Set(qs.filter(q=>q.key).map(q=>q.key));
  for(const [k,v] of Object.entries(r.healthForm)){
    if(handledKeys.has(k))continue;
    if(v===undefined||v===null||v==='')continue;
    const display=Array.isArray(v)?v.join('、'):v;
    text+=`• ${labelMap[k]||k}：${display}\n`;
  }
  alert('【首次建檔健康問卷】\n'+text+'\n填寫日期：'+(r.signedAt||r.date));
};

// 顯示服務專屬健康確認答案
window.showServiceHealth=(id)=>{
  const r=(S.data.treatmentRecords||[]).find(x=>x.id===id);
  if(!r||!r.serviceHealthAnswers){alert('查無資料');return;}
  // key 格式：svc_分類_題目key
  const grouped={};
  for(const [k,v] of Object.entries(r.serviceHealthAnswers)){
    const m=k.match(/^svc_([^_]+)_(.+)$/);
    if(m){
      const cat=m[1],qkey=m[2];
      if(!grouped[cat])grouped[cat]={};
      grouped[cat][qkey]=v;
    }
  }
  // 用 settings 裡的 label 對照
  const svcQs=S.data.settings?.serviceHealthQuestions||{};
  let text='【各服務專屬健康確認】\n';
  for(const [cat,answers] of Object.entries(grouped)){
    text+=`\n🔹 ${cat}\n`;
    const qs=svcQs[cat]||[];
    for(const [qkey,ans] of Object.entries(answers)){
      const q=qs.find(qq=>qq.key===qkey);
      const label=q?q.label:qkey;
      const ansShow=typeof ans==='boolean'?(ans?'是':'否'):(ans||'（未填）');
      text+=`• ${label}：${ansShow}\n`;
    }
  }
  text+='\n填寫日期：'+(r.signedAt||r.date);
  alert(text);
};

// 重新渲染後重新初始化簽名 canvas
function initSignatureCanvasInline(){
  const canvas=$('t_sign_canvas');
  if(!canvas)return;
  _sigCanvas=canvas;
  const dpr=window.devicePixelRatio||1;
  const rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr;
  canvas.height=rect.height*dpr;
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.lineWidth=2.5;
  ctx.lineCap='round';
  ctx.strokeStyle='#000';
  _sigCtx=ctx;
  _sigHasContent=false;
  if(S.treatment&&S.treatment.signature){
    const img=new Image();
    img.onload=()=>{ctx.drawImage(img,0,0,rect.width,rect.height);_sigHasContent=true;};
    img.src=S.treatment.signature;
  }
  function getPos(e){
    const r=canvas.getBoundingClientRect();
    if(e.touches&&e.touches[0])return{x:e.touches[0].clientX-r.left,y:e.touches[0].clientY-r.top};
    return{x:e.clientX-r.left,y:e.clientY-r.top};
  }
  function start(e){e.preventDefault();_sigDrawing=true;const p=getPos(e);_sigCtx.beginPath();_sigCtx.moveTo(p.x,p.y);}
  function move(e){if(!_sigDrawing)return;e.preventDefault();const p=getPos(e);_sigCtx.lineTo(p.x,p.y);_sigCtx.stroke();_sigHasContent=true;}
  function end(e){e.preventDefault();_sigDrawing=false;}
  canvas.addEventListener('mousedown',start);
  canvas.addEventListener('mousemove',move);
  canvas.addEventListener('mouseup',end);
  canvas.addEventListener('mouseleave',end);
  canvas.addEventListener('touchstart',start,{passive:false});
  canvas.addEventListener('touchmove',move,{passive:false});
  canvas.addEventListener('touchend',end,{passive:false});
}
