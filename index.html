// 從各資料源派生所有現金流項目（不論寫入點，自動匯整）
function getDerivedCashFlows(){
  const flows=[];
  // 系統啟用日期（這之前的資料不納入現金流統計，避免歷史儲值汙染數字）
  const startDate=S.data.settings?.cashFlowStartDate||'';
  const beforeStart=(d)=>startDate&&d&&d<startDate;
  // 1. 銷售收入（排除儲值扣款，因為儲值扣款不是現金流入）
  (S.data.sales||[]).forEach(s=>{
    if(s.payMethod==='儲值扣款')return; // 儲值扣款不算現金流
    if(beforeStart(s.date))return; // 起算日之前不納入
    flows.push({
      id:'sale_'+s.id,
      date:s.date,
      amount:toN(s.amount),
      cat:s.type==='service'?'服務收入':s.type==='product'?'產品收入':'課程收入',
      payMethod:s.payMethod||'未填',
      note:`${s.item||''} ${s.customer?`(${s.customer})`:''} ${s.subNote?'- '+s.subNote:''}`.trim(),
      month:s.month,year:s.year,
      _derived:'sale',
      _refId:s.id
    });
  });
  // 2. 支出（排除已寫入 cashFlow 的進貨）
  (S.data.expenses||[]).forEach(e=>{
    if(beforeStart(e.date))return;
    flows.push({
      id:'exp_'+e.id,
      date:e.date,
      amount:-Math.abs(toN(e.amount)),
      cat:e.category||'其他支出',
      payMethod:e.payMethod||'未填',
      note:e.note||'',
      month:e.month,year:e.year,
      _derived:'expense',
      _refId:e.id
    });
  });
  // 3. 手動現金流項目 + 儲值入帳（保留現有 cashFlow 表中「非派生自 sales/expenses」的紀錄）
  (S.data.cashFlow||[]).forEach(c=>{
    // 跳過已從 expenses 派生的進貨支出（避免重複）
    if(c.fromPurchase)return;
    if(beforeStart(c.date))return;
    flows.push({
      id:c.id,
      date:c.date,
      amount:toN(c.amount),
      cat:c.cat||'其他',
      payMethod:c.payMethod||'',
      note:c.note||'',
      month:c.month,year:c.year,
      _derived:null  // null = 手動建立的
    });
  });
  return flows;
}

function pgCashflow(){
  const all=getDerivedCashFlows();
  const entries=all.filter(e=>e.month===S.month&&e.year===yr()).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const curY=yr(),curM=S.month;
  const prevBal=all.filter(e=>e.year<curY||(e.year===curY&&e.month<curM)).reduce((s,e)=>s+toN(e.amount),0);
  let running=prevBal;
  const rows=entries.map(e=>{running+=toN(e.amount);return{...e,run:running};});
  const moBal=running;
  const mIn=entries.filter(e=>toN(e.amount)>0).reduce((s,e)=>s+toN(e.amount),0);
  const mOut=entries.filter(e=>toN(e.amount)<0).reduce((s,e)=>s+Math.abs(toN(e.amount)),0);
  // 按付款方式分類統計
  const byPay={'現金':{in:0,out:0},'轉帳':{in:0,out:0},'儲值入帳':{in:0,out:0},'其他':{in:0,out:0}};
  entries.forEach(e=>{
    let key='其他';
    if(e.payMethod==='現金')key='現金';
    else if(e.payMethod==='轉帳')key='轉帳';
    else if(e.cat==='儲值入帳')key='儲值入帳';
    if(toN(e.amount)>0)byPay[key].in+=toN(e.amount);
    else byPay[key].out+=Math.abs(toN(e.amount));
  });
  // 篩選器
  const filter=S.cfFilter||'all';
  let filteredRows=rows;
  if(filter==='in')filteredRows=rows.filter(r=>toN(r.amount)>0);
  else if(filter==='out')filteredRows=rows.filter(r=>toN(r.amount)<0);
  else if(filter==='cash')filteredRows=rows.filter(r=>r.payMethod==='現金');
  else if(filter==='transfer')filteredRows=rows.filter(r=>r.payMethod==='轉帳');
  else if(filter==='deposit')filteredRows=rows.filter(r=>r.cat==='儲值入帳');
  return`
  <div class="pg-ttl">🏦 現金流帳目</div>
  <div class="pg-sub">工作室的生死線——維持店面生存、繳房租、發薪水的唯一依靠</div>

  ${(()=>{
    // ── 健康度儀表板 ──
    // 抓上個月結餘，判斷是否連續兩月負數
    const prevM=curM===1?12:curM-1;
    const prevY=curM===1?curY-1:curY;
    const prevMonthEntries=all.filter(e=>e.month===prevM&&e.year===prevY);
    const prevMonthIn=prevMonthEntries.filter(e=>toN(e.amount)>0).reduce((s,e)=>s+toN(e.amount),0);
    const prevMonthOut=prevMonthEntries.filter(e=>toN(e.amount)<0).reduce((s,e)=>s+Math.abs(toN(e.amount)),0);
    const prevMonthNet=prevMonthIn-prevMonthOut;
    const thisMonthNet=mIn-mOut;
    const twoMonthNeg=thisMonthNet<0&&prevMonthNet<0;
    // 儲值負債
    const liability=getTotalDepositLiability();
    // 儲值負債健康度：跟本月收入比，越低越好
    const liabilityRatio=mIn>0?liability/mIn:0;

    let statusColor,statusBg,statusIcon,statusText,statusAdvice;
    if(twoMonthNeg){
      statusColor='#dc2626';statusBg='#fef2f2';statusIcon='🚨';
      statusText='危險！連續兩個月結餘為負';
      statusAdvice='店裡正在吃老本！立刻停止大筆進貨，發動現金轉化活動（推儲值、促銷庫存）。';
    }else if(thisMonthNet<0){
      statusColor='#d97706';statusBg='#fffbeb';statusIcon='⚠️';
      statusText='注意：本月結餘為負';
      statusAdvice='這個月支出大於收入。檢查是不是進貨太多，或這個月客人太少。下個月要拉回正數。';
    }else{
      statusColor='#16a34a';statusBg='#f0fdf4';statusIcon='✅';
      statusText='健康：本月結餘為正';
      statusAdvice='現金流健康，繼續保持。結餘的錢記得分流：抽成進個人帳戶、公司留週轉金。';
    }

    return`
    <div style="background:${statusBg};border:2px solid ${statusColor};border-radius:14px;padding:18px;margin-bottom:16px;">
      <div style="font-size:19px;font-weight:800;color:${statusColor};margin-bottom:4px;">${statusIcon} ${statusText}</div>
      <div style="font-size:14px;color:var(--txt);line-height:1.7;">${statusAdvice}</div>
    </div>

        <div class="sl">💰 本月收入</div>
        <div class="sv grn sm">$${fmt(mIn)}</div>
        <div class="ss">現金+轉帳+儲值入帳</div>
      </div>
      <div class="sc red">
        <div class="sl">💸 本月支出</div>
        <div class="sv red sm">$${fmt(mOut)}</div>
        <div class="ss">現金+轉帳實支</div>
      </div>
      <div class="sc" style="border:2px solid ${thisMonthNet>=0?'#16a34a':'#dc2626'};">
        <div class="sl">📊 本月結餘</div>
        <div class="sv sm" style="color:${thisMonthNet>=0?'#16a34a':'#dc2626'};font-size:24px;">$${fmt(thisMonthNet)}</div>
        <div class="ss" style="color:${thisMonthNet>=0?'#16a34a':'#dc2626'};font-weight:700;">${thisMonthNet>=0?'✓ 正數（健康）':'✗ 負數（吃老本）'}</div>
      </div>
    </div>

    <!-- 上月對照 + 儲值負債 -->
    <div class="sg sg2" style="margin-bottom:16px;">
      <div class="sc">
        <div class="sl">上月結餘（對照）</div>
        <div class="sv sm" style="color:${prevMonthNet>=0?'#16a34a':'#dc2626'};">$${fmt(prevMonthNet)}</div>
        <div class="ss">${prevMonthNet>=0?'上月是正的':'⚠️ 上月也是負的'}</div>
      </div>
      <div class="sc" style="border-left:4px solid ${liabilityRatio>3?'#dc2626':liabilityRatio>1.5?'#d97706':'#16a34a'};">
        <div class="sl">💳 儲值負債餘額</div>
        <div class="sv sm" style="color:${liabilityRatio>3?'#dc2626':liabilityRatio>1.5?'#d97706':'#16a34a'};">$${fmt(liability)}</div>
        <div class="ss">${liabilityRatio>3?'⚠️ 偏高，工時債重':liabilityRatio>1.5?'留意消耗速度':'健康，持續消耗中'}</div>
      </div>
    </div>

    </div>
    `;
  })()}

  ${(()=>{

      </div>

    </div>`;
  })()}
  ${moSel()}
  <div class="sg sg4">
    <div class="sc"><div class="sl">上月結餘</div><div class="sv sm gold">$${fmt(prevBal)}</div></div>

// ─── 退費計算機（依消保法、定型化契約、單堂原價計算）───
function pgRefundCalculator(){
  const customers=getAllCustomerNames();
  const sel=S.refundCalc?.customer||'';
  // 從客戶儲值紀錄抓最新一筆有簽名的
  const cDeposits=sel?(S.data.deposits||[]).filter(d=>d.customer===sel):[];
  const latest=cDeposits.length>0?cDeposits[cDeposits.length-1]:null;
  // 預設值
  const actual=S.refundCalc?.actual||(latest?toN(latest.actualReceived):0);
  const usable=S.refundCalc?.usable||(latest?toN(latest.amount):0);
  // 服務原價列表
  const priceList=S.data.settings?.servicePriceList||DEFAULT_SERVICE_PRICES;
  // 已使用次數（手動輸入）
  const usedItems=S.refundCalc?.usedItems||[];
  // 計算
  const usedAmount=usedItems.reduce((s,it)=>s+toN(it.price)*toN(it.qty),0);
  const remainUsable=usable-usedAmount;
  const ratio=usable>0?actual/usable:1;
  const remainActual=Math.round(remainUsable*ratio);
  // 解約原因（影響手續費）
  const reason=S.refundCalc?.reason||'customer_change_mind';  // customer_change_mind / customer_pregnant / studio_close / cooling_off
  let feeRate=0.1;  // 預設 10%（消保法上限）
  let feeNote='';
  if(reason==='cooling_off'){feeRate=0;feeNote='七日鑑賞期內未使用，全額退費';}
  else if(reason==='studio_close'){feeRate=0;feeNote='可歸責於工作室，不扣手續費';}
  else if(reason==='customer_pregnant'){feeRate=0;feeNote='不可歸責雙方（懷孕/重病等），不扣手續費';}
  else if(reason==='unused_full'){feeRate=0.05;feeNote='未開始使用，扣 5% 手續費';}
  else{feeRate=0.1;feeNote='已開始使用，扣 10% 手續費';}
  const fee=Math.round((reason==='unused_full'?actual:remainActual)*feeRate);
  let refund=0;
  if(reason==='cooling_off')refund=actual;
  else if(reason==='unused_full')refund=actual-fee;
  else refund=remainActual-fee;
  return`
  <div class="pg-ttl">⚖️ 退費計算機（依消保法 + 定型化契約）</div>
  <div class="pg-sub">客人來退費時，先用這個算清楚，再給客人選擇</div>

  <div class="notice" style="background:var(--goldL);border-left-color:var(--gold);color:var(--goldDk);">
    🎯 <b>使用流程：</b><br>
    1. 選客戶、輸入儲值方案金額<br>
    2. 輸入客戶已使用的服務次數（按「服務項目原價」計算）<br>
    3. 選擇退費原因（影響手續費%）<br>
    4. 系統自動算出應退金額 → 列印給客人簽名
  </div>

  <!-- Step 1: 選客戶 + 方案 -->
  <div class="card">
    <div class="card-hd"><span class="card-ttl">📋 Step 1：客戶與儲值方案</span></div>
    <div class="card-bd">
      <div class="fg fg2">
        <div class="fgrp"><label>客戶</label>
          <select onchange="setRefundCustomer(this.value)">
            <option value="">— 請選擇 —</option>
            ${customers.map(n=>`<option value="${n}"${sel===n?' selected':''}>${n}</option>`).join('')}
          </select>
        </div>
        <div class="fgrp"><label>客人實付金額（退費比例計算基礎）*</label>
          <input type="number" value="${actual}" oninput="setRefundField('actual',this.value)" placeholder="例：19800">
        </div>
        <div class="fgrp"><label>可使用金額（含優惠）*</label>
          <input type="number" value="${usable}" oninput="setRefundField('usable',this.value)" placeholder="例：22000">
        </div>
        <div class="fgrp" style="background:var(--bg2);padding:10px;border-radius:8px;">
          <div class="tm" style="font-size:12px;">優惠金額（自動計算）</div>
          <div style="font-size:18px;font-weight:700;color:var(--rose);">$${fmt(usable-actual)}</div>
          <div class="tm" style="font-size:11px;">折扣率：${usable>0?Math.round((1-actual/usable)*100):0}%</div>
        </div>
      </div>
      ${latest?`<div class="tm" style="font-size:12px;color:var(--blu);margin-top:6px;">📌 已自動帶入最新一筆儲值紀錄（${latest.date}）</div>`:''}
    </div>
  </div>

  <!-- Step 2: 已使用服務 -->
  <div class="card">
    <div class="card-hd">
      <span class="card-ttl">📋 Step 2：客戶已使用的服務（按單次原價計算）</span>
      <button class="btn btn-y btn-sm" onclick="addRefundUsedItem()">＋ 新增使用紀錄</button>
    </div>
    <div class="card-bd">
      <div class="tm" style="margin-bottom:10px;font-size:12px;">⚠️ 重要：依定型化契約，已使用部分按「單次原價」計算，請逐項輸入</div>
      ${usedItems.length===0?`<div class="empty"><p>尚未新增使用紀錄。點上方「＋ 新增使用紀錄」開始</p></div>`:`
      <div class="tw"><table>
        <thead><tr><th>服務項目</th><th>單次原價</th><th>次數</th><th>小計</th><th></th></tr></thead>
        <tbody>
          ${usedItems.map((it,i)=>`<tr>
            <td><input type="text" list="dl_priceList" value="${it.name||''}" placeholder="服務名稱" oninput="setRefundUsedItemFromName(${i},this.value)" style="width:100%;"></td>
            <td><input type="number" value="${it.price||0}" oninput="setRefundUsedItem(${i},'price',this.value)" style="width:100px;"> 元</td>
            <td><input type="number" value="${it.qty||1}" oninput="setRefundUsedItem(${i},'qty',this.value)" style="width:60px;"> 次</td>
            <td class="ag" style="color:var(--rose);font-weight:700;">$${fmt(toN(it.price)*toN(it.qty))}</td>
            <td><button class="bdel" onclick="rmRefundUsedItem(${i})">×</button></td>
          </tr>`).join('')}
          <tr style="background:var(--goldL);font-weight:700;">
            <td colspan="3">已使用金額合計（按原價）</td>
            <td class="ag" style="color:var(--goldDk);font-size:18px;">$${fmt(usedAmount)}</td>
            <td></td>
          </tr>
        </tbody>
      </table></div>
      <datalist id="dl_priceList">
        ${priceList.map(p=>`<option value="${p.name}" data-price="${p.price}">`).join('')}
      </datalist>`}
      <div class="tm" style="font-size:11px;margin-top:8px;color:var(--blu);">💡 服務原價可在「⚙️ 基本設定」→「💎 服務項目原價列表」設定，這裡會自動帶入</div>
    </div>
  </div>

  <!-- Step 3: 退費原因 -->
  <div class="card">
    <div class="card-hd"><span class="card-ttl">📋 Step 3：退費原因（決定手續費）</span></div>
    <div class="card-bd">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;">
        ${[
          {v:'cooling_off',t:'七日鑑賞期內、未使用',c:'var(--grn)',f:'0%（全額退）'},
          {v:'unused_full',t:'已簽約未使用（過鑑賞期）',c:'var(--blu)',f:'5%'},
          {v:'customer_change_mind',t:'客戶提前解約（已使用）',c:'var(--gold)',f:'10%'},
          {v:'customer_pregnant',t:'懷孕/重病等不可歸責',c:'var(--pur)',f:'0%'},
          {v:'studio_close',t:'工作室停業（可歸責）',c:'var(--rose)',f:'0%'},
        ].map(o=>`<label style="display:flex;align-items:center;gap:10px;cursor:pointer;padding:12px;background:${reason===o.v?o.c:'#fafafa'};color:${reason===o.v?'#fff':'var(--txt)'};border:2px solid ${o.c};border-radius:10px;font-size:13px;transition:all 0.15s;">
          <input type="radio" name="refundReason" ${reason===o.v?'checked':''} onchange="setRefundField('reason','${o.v}')" style="cursor:pointer;flex-shrink:0;accent-color:${o.c};">
          <div style="flex:1;">
            <div style="font-weight:700;">${o.t}</div>
            <div style="font-size:11px;opacity:0.85;">手續費：${o.f}</div>
          </div>
        </label>`).join('')}
      </div>
    </div>
  </div>

  <!-- 計算結果 -->
  <div class="card" style="background:linear-gradient(135deg,var(--goldL),var(--roseL));border:2px solid var(--gold);">
    <div class="card-hd" style="background:transparent;"><span class="card-ttl" style="color:var(--goldDk);">💰 退費計算結果</span></div>
    <div class="card-bd">
      <div style="background:#fff;padding:14px;border-radius:8px;font-family:monospace;font-size:13px;line-height:2;">
        <div>客人實付金額：<b>$${fmt(actual)}</b></div>
        <div>可使用金額（含優惠）：<b>$${fmt(usable)}</b></div>
        <div>實付/可用 比例：<b>${(ratio*100).toFixed(2)}%</b></div>
        <div style="border-top:1px dashed var(--bdr);margin:6px 0;"></div>
        <div>已使用金額（按原價）：<b style="color:var(--rose);">$${fmt(usedAmount)}</b></div>
        <div>剩餘可使用金額：<b>$${fmt(remainUsable)}</b></div>
        <div>剩餘實付對應金額：${fmt(remainUsable)} × ${ratio.toFixed(2)} = <b style="color:var(--blu);">$${fmt(remainActual)}</b></div>
        <div style="border-top:1px dashed var(--bdr);margin:6px 0;"></div>
        <div>退費原因：<b>${reason==='cooling_off'?'七日鑑賞期內':reason==='unused_full'?'已簽約未使用':reason==='customer_pregnant'?'不可歸責雙方':reason==='studio_close'?'工作室停業':'客戶提前解約'}</b></div>
        <div>解約手續費（${(feeRate*100).toFixed(0)}%）：<b style="color:var(--mut);">－$${fmt(fee)}</b></div>

      <div style="background:linear-gradient(135deg,var(--gold),var(--rose));color:#fff;padding:18px;border-radius:10px;margin-top:14px;text-align:center;">

        <button class="btn btn-s" onclick="resetRefundCalc()">🔄 重新計算</button>
      </div>

  </div>

  <!-- 法律依據 -->
  <div class="card" style="background:var(--bluL);border:1px solid var(--blu);">
    <div class="card-hd" style="background:transparent;"><span class="card-ttl" style="color:var(--blu);">📜 法律依據速查</span></div>

      <div style="margin-bottom:10px;"><b>① 七日鑑賞期</b>：消保法第 19 條，自簽約日起 7 日內未使用得無條件解約，全額退費。</div>
      <div style="margin-bottom:10px;"><b>② 解約手續費上限</b>：消保法施行細則第 25 條，最高 10%。</div>
      <div style="margin-bottom:10px;"><b>③ 條件式贈與</b>：民法第 408、412 條，附條件贈與條件未成就（如未用完），贈與人得撤銷贈與。</div>
      <div style="margin-bottom:10px;"><b>④ 不可歸責雙方</b>：民法第 266 條，不可歸責雙方時，當事人雙方互免給付義務。</div>
      <div><b>⑤ 退款期限</b>：定型化契約規定 30 日內、鑑賞期解約 15 日內必須退款。</div>

// ─── REPORTS ───────────────────────────────────────────────
function pgReports(){
  const mos=Array.from({length:12},(_,i)=>i+1);
  const moData=mos.map(m=>({
    m,rev:getRevTotal(m),exp:getExpTotal(m),
    svc:getSvcTotal(m),prd:getPrdTotal(m),crs:getCrsTotal(m)
  }));
  const tRev=moData.reduce((s,m)=>s+m.rev,0);
  const tExp=moData.reduce((s,m)=>s+m.exp,0);
  const maxV=Math.max(...moData.map(m=>Math.max(m.rev,m.exp)),1);
  const tSvc=moData.reduce((s,m)=>s+m.svc,0);
  const tPrd=moData.reduce((s,m)=>s+m.prd,0);
  const tCrs=moData.reduce((s,m)=>s+m.crs,0);
  return`
  <div class="pg-ttl">📈 月報年報</div>
  <div class="pg-sub">${yr()}年 全年財務分析</div>
  <div class="sg sg4">

// 從品名自動判斷「性質」分群
function inferType(name){
  const n=(name||'').toString();
  const map=[['安瓶','安瓶'],['精華液','精華液'],['精華','精華液'],['面膜紙','面膜'],['凍膜','面膜'],['面膜','面膜'],
    ['乳霜','乳霜'],['面霜','乳霜'],['乳液','乳液'],['化妝水','化妝水'],['化粧水','化妝水'],['爽膚水','化妝水'],['保濕水','化妝水'],
    ['凝膠','凝膠'],['凝露','凝膠'],['精油','精油'],['按摩油','按摩油'],['卸妝','卸妝'],['潔面','潔顏'],['洗面','潔顏'],['潔顏','潔顏'],
    ['防曬','防曬'],['眼霜','眼霜'],['眼膜','眼膜'],['修護','修護霜'],
    ['色乳','色料'],['色膏','色料'],['色料','色料'],['色素','色料'],['麻膏','麻膏'],['麻藥','麻膏'],
    ['排針','針具'],['圓針','針具'],['針片','針具'],['針','針具'],
    ['棉片','棉材'],['棉棒','棉材'],['化妝棉','棉材'],['紗布','棉材'],['棉花','棉材'],
    ['手套','手套'],['口罩','口罩'],['保鮮膜','保鮮膜'],['刀片','刀片']];
  for(var i=0;i<map.length;i++){if(n.indexOf(map[i][0])>=0)return map[i][1];}
  return '';
}
function getCmpGroup(p){
  const g=(p.compareGroup||'').trim();if(g)return g;
  const inf=inferType(p.name);if(inf)return inf;
  return (p.category||'').trim()||'其他';
}
function pgCostCompare(){
  const prods=(S.data.products||[]);
  const q=(S.ccSearch||'').trim().toLowerCase();
  // 分群
  const groups={};
  prods.forEach(function(p){const g=getCmpGroup(p);(groups[g]=groups[g]||[]).push(p);});
  const groupNames=Object.keys(groups).sort(function(a,b){return groups[b].length-groups[a].length||a.localeCompare(b);});
  var html='<div class="pg-ttl">🆚 成本比價</div>';
  html+='<div class="pg-sub">同性質產品的成本一起比 — 進貨前挑成本最低的，利潤額自然變高</div>';
  html+='<div class="notice" style="background:#faf5ff;border-left-color:#9333ea;color:#7e22ce;font-size:13px;margin-bottom:14px;">💡 系統自動依品名分群。<b>有填「容量」的會自動算出「每 ml／每 g 成本」</b>做最公平的比價；沒填容量的，按旁邊「✏️容量」就能當場補上、立刻升級成每 ml 比價。分群不對按「群組」可改。</div>';
  html+='<div style="margin-bottom:14px;"><input type="text" placeholder="🔍 搜尋產品／群組" value="'+((S.ccSearch||'').replace(/"/g,'&quot;'))+'" oninput="ccDoSearch(this.value)" style="width:100%;padding:10px 14px;border:1px solid var(--bdr);border-radius:8px;"></div>';
  if(prods.length===0){return html+'<div class="empty" style="padding:40px;"><div class="empty-ico">🆚</div><p>還沒有產品。到「🗂️ 庫存盤點」新增產品後，這裡就會自動幫你分群比價。</p></div>';}

  var shown=0;
  groupNames.forEach(function(g){
    var items=groups[g];
    if(q){items=items.filter(function(p){return((p.name||'')+g).toLowerCase().includes(q);});}
    if(items.length===0)return;
    // 計算每個產品的成本（每個產品各自算每容量成本，不需全部都填）
    function fmtCost(v){return v>=100?fmt(Math.round(v)):(Math.round(v*100)/100);}
    var rows=items.map(function(p){
      const unitCost=getAvgCost(p.id);
      const cap=toN(p.capacity);const capUnit=p.capacityUnit||'';
      const capCost=(cap>0&&unitCost>0&&capUnit)?unitCost/cap:null;
      return{p:p,unitCost:unitCost,cap:cap,capUnit:capUnit,capCost:capCost,hasCost:unitCost>0};
    });
    // 找出這群最主要的容量單位（ml / g / 片…）
    var unitCount={};
    rows.forEach(function(r){if(r.capCost!=null){unitCount[r.capUnit]=(unitCount[r.capUnit]||0)+1;}});
    var dominantUnit='',best=0;
    Object.keys(unitCount).forEach(function(u){if(unitCount[u]>best){best=unitCount[u];dominantUnit=u;}});
    const hasAnyCap=dominantUnit!=='';
    function comparable(r){return r.capCost!=null&&r.capUnit===dominantUnit;}
    const compRows=rows.filter(comparable).slice().sort(function(a,b){return a.capCost-b.capCost;});
    const usePerCap=compRows.length>=2;
    // 排名清單（判斷最划算/最貴）
    var rankList,useMetric;
    if(usePerCap){rankList=compRows;useMetric='cap';}
    else{rankList=rows.filter(function(r){return r.hasCost;}).slice().sort(function(a,b){return a.unitCost-b.unitCost;});useMetric='unit';}
    const cheapest=rankList.length?(useMetric==='cap'?rankList[0].capCost:rankList[0].unitCost):0;
    const priciest=rankList.length?(useMetric==='cap'?rankList[rankList.length-1].capCost:rankList[rankList.length-1].unitCost):0;
    const savePct=priciest>0?Math.round((priciest-cheapest)/priciest*100):0;
    const missingCap=rows.filter(function(r){return r.hasCost&&r.capCost==null;}).length;
    // 顯示順序：可比的(每X成本低→高) → 其餘有成本的(單位成本低→高) → 無成本
    var displayRows;
    if(usePerCap){
      const others=rows.filter(function(r){return r.hasCost&&!comparable(r);}).sort(function(a,b){return a.unitCost-b.unitCost;});
      const noCost=rows.filter(function(r){return !r.hasCost;});
      displayRows=compRows.concat(others).concat(noCost);
    }else{
      const hc=rows.filter(function(r){return r.hasCost;}).sort(function(a,b){return a.unitCost-b.unitCost;});
      const noCost=rows.filter(function(r){return !r.hasCost;});
      displayRows=hc.concat(noCost);
    }

    html+='<div class="card" style="margin-bottom:14px;border:1px solid #e9d5f5;"><div class="card-hd" style="background:linear-gradient(135deg,#faf5ff,#fdf2f8);"><span class="card-ttl" style="color:#9333ea;">🏷️ '+g+'（'+items.length+' 項）</span>'+(usePerCap?'<span class="bdg" style="background:#dbeafe;color:#1e40af;">比每 '+dominantUnit+' 成本</span>':'<span class="bdg" style="background:#f3f4f6;color:#555;">比單位成本</span>')+'</div><div class="card-bd">';
    if(savePct>0&&rankList.length>=2){
      html+='<div class="notice" style="background:#f0fdf4;border-left-color:#16a34a;color:#166534;font-size:13px;margin-bottom:10px;">最貴的比最便宜的貴 <b>'+savePct+'%</b>。同性質優先用最划算的，成本就省下來了。</div>';
    }
    if(usePerCap&&missingCap>0){
      html+='<div class="notice" style="background:#fffbeb;border-left-color:#d97706;color:#92400e;font-size:12px;margin-bottom:10px;">還有 '+missingCap+' 項沒填容量（或單位不同），按「✏️容量」補上，就能一起比每 '+dominantUnit+' 成本。</div>';
    }else if(!usePerCap&&rows.filter(function(r){return r.hasCost;}).length>=2){
      html+='<div class="notice" style="background:#fffbeb;border-left-color:#d97706;color:#92400e;font-size:12px;margin-bottom:10px;">這群還沒有足夠的「容量」資料，目前比整瓶／整盒的單位成本。想比「每 ml 成本」更公平，按產品旁的「✏️容量」把容量填上（例如 10 ml）。</div>';
    }
    html+='<div class="tw"><table style="width:100%;border-collapse:collapse;font-size:13px;"><thead><tr style="border-bottom:2px solid #e9d5f5;"><th style="padding:7px 8px;text-align:left;">產品</th>'+(hasAnyCap?'<th style="padding:7px 8px;text-align:right;">每 '+dominantUnit+' 成本</th>':'')+'<th style="padding:7px 8px;text-align:right;">單位成本</th><th style="padding:7px 8px;text-align:right;">容量</th><th style="padding:7px 8px;"></th></tr></thead><tbody>';
    displayRows.forEach(function(r){
      const isCheap=rankList.length>0&&r===rankList[0];
      const isExp=rankList.length>=2&&r===rankList[rankList.length-1];
      const tag=isCheap?' <span class="bdg" style="background:#16a34a;color:#fff;font-size:11px;">✓ 最划算</span>':(isExp?' <span class="bdg" style="background:#fee2e2;color:#dc2626;font-size:11px;">最貴</span>':'');
      // 每X成本欄
      var capCell='';
      if(hasAnyCap){
        if(comparable(r)){
          const col=isCheap?'#16a34a':(isExp?'#dc2626':'#333');
          capCell='<td style="padding:7px 8px;text-align:right;font-weight:800;color:'+col+';">$'+fmtCost(r.capCost)+' /'+dominantUnit+'</td>';
        }else if(r.capCost!=null){
          capCell='<td style="padding:7px 8px;text-align:right;color:#666;">$'+fmtCost(r.capCost)+' /'+r.capUnit+'</td>';
        }else{
          capCell='<td style="padding:7px 8px;text-align:right;"><button class="btn btn-sm btn-y" style="font-size:11px;padding:3px 8px;" onclick="setProductCapacity(&quot;'+r.p.id+'&quot;)">✏️容量</button></td>';
        }
      }
      const unitCell=r.hasCost?('$'+fmt(r.unitCost)):'<span style="color:#999;">尚無成本</span>';
      const sizeCell=r.cap>0?(r.cap+(r.capUnit||'')):'<button class="btn btn-sm" style="font-size:11px;padding:2px 7px;color:#d97706;" onclick="setProductCapacity(&quot;'+r.p.id+'&quot;)">＋填</button>';
      html+='<tr style="border-bottom:1px solid #f1f5f9;'+(isCheap?'background:#f0fdf4;':'')+(r.hasCost?'':'opacity:0.65;')+'">'
        +'<td style="padding:7px 8px;"><b>'+(r.p.name||'')+'</b>'+(r.p.supplier?'<span class="tm" style="font-size:11px;"> · '+r.p.supplier+'</span>':'')+tag+'</td>'
        +capCell
        +'<td style="padding:7px 8px;text-align:right;">'+unitCell+'</td>'
        +'<td style="padding:7px 8px;text-align:right;color:#999;">'+sizeCell+'</td>'
        +'<td style="padding:7px 8px;text-align:right;white-space:nowrap;"><button class="btn btn-sm" style="font-size:11px;padding:3px 8px;" onclick="setCompareGroup(&quot;'+r.p.id+'&quot;)">群組</button></td>'
        +'</tr>';
    });
    html+='</tbody></table></div></div></div>';
    shown++;
  });
  if(shown===0)html+='<div class="empty" style="padding:30px;"><p>找不到符合的產品</p></div>';
  return html;
}
window.ccDoSearch=function(v){S.ccSearch=v;const c=$('pg-content');if(c)c.innerHTML=renderPage();};
window.setProductCapacity=async function(pid){
  const p=(S.data.products||[]).find(function(x){return x.id===pid;});
  if(!p)return;
  const cur=toN(p.capacity)>0?(toN(p.capacity)+' '+(p.capacityUnit||'')):'';
  const v=prompt('輸入「'+(p.name||'')+'」的容量與單位\n例如：10 ml、400 g、30 片、1 瓶\n（留空可清除）',cur);
  if(v===null)return;
  var capacity=0,unit='';
  const m=(v||'').trim().match(/^([\d.]+)\s*(.*)$/);
  if(m){capacity=parseFloat(m[1])||0;unit=(m[2]||'').trim();}
  const prods=(S.data.products||[]).map(function(x){return x.id===pid?Object.assign({},x,{capacity:capacity,capacityUnit:unit}):x;});
  S.data.products=prods;
  await saveMain({products:prods});
  toast('✅ 已更新容量'+(unit?'':'（提醒：要填單位如 ml 才能比每單位成本）'));
  render();
};
window.setCompareGroup=async function(pid){
  const p=(S.data.products||[]).find(function(x){return x.id===pid;});
  if(!p)return;
  const cur=(p.compareGroup||'').trim()||inferType(p.name)||'';
  const v=prompt('設定「'+(p.name||'')+'」的比價群組\n（相同群組的產品會一起比成本，例如：安瓶、精華液）',cur);
  if(v===null)return;
  const prods=(S.data.products||[]).map(function(x){return x.id===pid?Object.assign({},x,{compareGroup:v.trim()}):x;});
  S.data.products=prods;
  await saveMain({products:prods});
  toast('✅ 已更新比價群組');
  render();
};

function caseReadDOM(){

  ['customer','serviceType','date','staff','status',
   'preSkin','preBaseColor','preHairFlow','preBrowCond','preBone','preMuscle','preFaceAnalysis','preCustomerWish','preDesignIdea','prePredict',

  (d.followups||[]).forEach(function(f,i){

// 把紋繡紀錄(同意書流程)的設計/面診/操作內容，對應到案例欄位
function caseMapFromRecord(r){
  function fa(k){return (r.faceAnswers&&r.faceAnswers[k])||r[k]||'';}
  function asText(v){return Array.isArray(v)?v.join('、'):(v==null?'':String(v));}
  function lr(left,right){return [left?('左：'+asText(left)):'',right?('右：'+asText(right)):''].filter(Boolean).join('　');}
  const brow=[fa('leftBrow')?('左眉：'+asText(fa('leftBrow'))):'',fa('rightBrow')?('右眉：'+asText(fa('rightBrow'))):''].filter(Boolean).join('\n');
  // 毛流/肌肉/骨骼：優先用新的左右眉欄位，沒有再用舊的文字
  function withNote(base,note){return [base,note?('補充：'+note):''].filter(Boolean).join('　');}
  const hair=withNote(lr(r.hairFlowLeft,r.hairFlowRight)||asText(fa('hairFlow')),r.hairFlowNote);
  const bone=withNote(lr(r.boneLeft,r.boneRight)||asText(fa('boneDesc')),r.boneNote);
  const muscle=withNote(lr(r.muscleLeft,r.muscleRight)||asText(fa('muscleDesc')),r.muscleNote);
  const templeTxt=withNote(lr(r.templeLeft,r.templeRight)||asText(r.templeHollow),r.templeNote);
  const skin=[asText(r.skinType),asText(fa('skinDesc'))].filter(Boolean).join('　');
  const faceAna=[asText(fa('faceOther')),templeTxt?('太陽穴凹陷：'+templeTxt):''].filter(Boolean).join('\n');
  // 需求（化妝習慣/生活型態/痛點）併入客人期待
  const needs=[
    r.makeupHabit?('化妝習慣：'+asText(r.makeupHabit)):'',
    r.workFace?('工作型態：'+asText(r.workFace)):'',
    r.exerciseHabit?('運動/出油：'+asText(r.exerciseHabit)):'',
    (r.painPoints&&r.painPoints.length)?('痛點：'+asText(r.painPoints)+(r.painPointNote?('（'+r.painPointNote+'）'):'')):'',
    (r.motivations&&r.motivations.length)?('想做的原因：'+asText(r.motivations)):''
  ].filter(Boolean).join('\n');
  const wish=[asText(r.expectation),needs].filter(Boolean).join('\n');
  // 設計理念：風格 + 自訂 + 溝通紀錄
  const design=[
    r.styleChoice?('風格：'+asText(r.styleChoice)):(r.designStyle?('設計風格：'+asText(r.designStyle)):''),
    r.styleCustom?('自訂風格：'+asText(r.styleCustom)):'',
    r.designNote?asText(r.designNote):'',
    r.colorRecipe?('上色：'+r.colorRecipe+(r.colorNote?'（'+r.colorNote+'）':'')):'',
    [r.browHairTone?'毛色 '+r.browHairTone:'',r.hairTone?'髮色 '+r.hairTone:'',r.skinTone?'膚色 '+r.skinTone:''].filter(Boolean).join('、')
  ].filter(Boolean).join('\n');
  const numb=[asText(r.numbCream),asText(r.numbTime)].filter(Boolean).join('　');
  return{
    preBaseColor:asText(fa('baseColor')),
    preHairFlow:hair,
    preSkin:skin,
    preBone:bone,
    preMuscle:muscle,
    preBrowCond:brow,
    preFaceAnalysis:faceAna,
    preCustomerWish:wish,
    preDesignIdea:design,
    opTool:asText(r.tools),
    opPigment:asText(r.pigments),
    opNumb:numb,
    opNotes:asText(r.operationNote)
  };
}
window.caseFromPmuRecord=function(recId){
  const r=(S.data.pmuRecords||[]).find(function(x){return x.id===recId;});
  if(!r){toast('找不到紋繡紀錄');return;}
  const mapped=caseMapFromRecord(r);
  const existed=(S.data.pmuCases||[]).find(function(x){return x.pmuRecordId===recId;});
  if(existed){
    // 已經建過案例：把紋繡紀錄的內容補進「空白」欄位（不覆蓋你已填的），再打開
    const merged=Object.assign({},existed);
    var filled=0;
    Object.keys(mapped).forEach(function(k){if(!(String(merged[k]||'')).trim()&&(String(mapped[k]||'')).trim()){merged[k]=mapped[k];filled++;}});
    merged.updatedAt=today();
    S.caseDraft=JSON.parse(JSON.stringify(merged));
    S.caseEditId=existed.id;S.page='cases';
    setSub('pmuCases',existed.id,merged);
    toast(filled>0?('已從紋繡紀錄補入 '+filled+' 個欄位'):'已開啟案例（紋繡紀錄內容都已在案例內）');
    render();
    return;
  }
  caseNew(Object.assign({customer:(r.customer||'').trim(),serviceType:r.serviceType||'霧眉',date:r.date||today(),staff:r.staff||'于蜜',pmuRecordId:recId},mapped));
  toast('已帶入紋繡紀錄的設計與操作內容');
};
window.caseImportRecord=function(){
  caseReadDOM();
  const d=S.caseDraft;if(!d)return;
  if(!d.pmuRecordId){alert('這個案例沒有連結到紋繡紀錄，無法帶入。');return;}
  const r=(S.data.pmuRecords||[]).find(function(x){return x.id===d.pmuRecordId;});
  if(!r){alert('找不到連結的紋繡紀錄。');return;}
  const mapped=caseMapFromRecord(r);
  var filled=0;
  Object.keys(mapped).forEach(function(k){if(!(String(d[k]||'')).trim()&&(String(mapped[k]||'')).trim()){d[k]=mapped[k];filled++;}});
  toast(filled>0?('已帶入 '+filled+' 個欄位（記得按儲存）'):'沒有可帶入的空白欄位（已填的不會被覆蓋）');
  render();
};

window.caseSave=async function(){
  caseReadDOM();
  const d=S.caseDraft;if(!d)return;

function pfGet(){
  return Object.assign({myName:'于蜜',goalLabel:'第一筆收租房頭期款',goalAmount:0,ammoActual:0,log:[]},(S.data.settings&&S.data.settings.personalFinance)||{});
}
// 本月個人薪水（于蜜的抽成總和）
function myCommission(mo){
  const nm=pfGet().myName;
  return getSales(mo).filter(function(s){return(s.staff||'')===nm;}).reduce(function(t,s){return t+getSaleFinancials(s).commission;},0);
}
// 歷來累積個人抽成（跨所有月份年份）
function myCommissionAllTime(){
  const nm=pfGet().myName;
  return (S.data.sales||[]).filter(function(s){return(s.staff||'')===nm;}).reduce(function(t,s){return t+getSaleFinancials(s).commission;},0);
}
// 本月歸類在花費帳戶的個人開銷
function pfMonthSpent(){
  const pf=pfGet();const m=S.month,y=yr();
  return (pf.log||[]).filter(function(e){const d=new Date((e.date||'')+'T00:00:00');return d.getMonth()+1===m&&d.getFullYear()===y;}).reduce(function(t,e){return t+toN(e.amount);},0);
}

window.doSearch=(q)=>{

  if(!query){
    wrap.innerHTML=`<div class="empty" style="padding:30px;"><div class="empty-ico">🔍</div><p>輸入關鍵字開始搜尋</p></div>`;
    return;
  }
  const results=globalSearch(query);

};

// 全站搜尋邏輯
function globalSearch(q){
  const lcQ=q.toLowerCase();
  const matchAmount=parseFloat(q)>0?parseFloat(q):null;// 如果是純數字，也比對金額
  const matchText=(...fields)=>fields.some(f=>(f||'').toString().toLowerCase().includes(lcQ));
  const matchAmt=(amt)=>matchAmount!==null&&Math.abs(toN(amt)-matchAmount)<0.01;

  // 1. 搜尋銷售/收入
  const salesResult=(S.data.sales||[]).filter(s=>{
    return matchText(s.item,s.subNote,s.customer,s.staff,s.payMethod)||matchAmt(s.amount);
  }).slice(0,30);

  // 2. 搜尋支出
  const expResult=(S.data.expenses||[]).filter(e=>{
    return matchText(e.category,e.note,e.payMethod)||matchAmt(e.amount);
  }).slice(0,30);

  // 3. 搜尋進貨
  const purResult=(S.data.purchases||[]).filter(p=>{
    return matchText(p.productName,p.category,p.supplier,p.note)||matchAmt(p.totalCost)||matchAmt(p.unitCost);
  }).slice(0,30);

  // 4. 搜尋儲值
  const depResult=(S.data.deposits||[]).filter(d=>{
    return matchText(d.customer,d.note,d.payMethod)||matchAmt(d.amount)||matchAmt(d.actualReceived);
  }).slice(0,30);

  // 5. 搜尋客戶
  const custResult=(S.data.customers||[]).filter(c=>{
    return matchText(c.name,c.phone,c.note,c.birthday,c.source);
  }).slice(0,30);

  // 6. 搜尋產品
  const prodResult=(S.data.products||[]).filter(p=>{
    return matchText(p.name,p.category,p.supplier,p.series)||matchAmt(p.price)||matchAmt(p.cost);
  }).slice(0,30);

  // 7. 搜尋出貨耗用
  const stockResult=(S.data.stockOuts||[]).filter(s=>{
    return matchText(s.productName,s.customer,s.note,s.type)||matchAmt(s.totalCost);
  }).slice(0,30);

  // 8. 搜尋現金流
  const cfResult=(S.data.cashFlow||[]).filter(f=>{
    return matchText(f.cat,f.note)||matchAmt(f.amount)||matchAmt(Math.abs(f.amount));
  }).slice(0,30);

  return{
    sales:salesResult,
    expenses:expResult,
    purchases:purResult,
    deposits:depResult,
    customers:custResult,
    products:prodResult,
    stockOuts:stockResult,
    cashFlow:cfResult,
    totalCount:salesResult.length+expResult.length+purResult.length+depResult.length+custResult.length+prodResult.length+stockResult.length+cfResult.length
  };
}

  const hl=(text)=>{
    if(!text)return'';
    const t=text.toString();

    if(idx<0)return t;
    return t.substring(0,idx)+`<mark style="background:var(--gold);color:#fff;padding:0 2px;border-radius:2px;">${t.substring(idx,idx+q.length)}</mark>`+t.substring(idx+q.length);

  // 出貨耗用區塊
  if(r.stockOuts.length>0){
    const typeLabels={sale:'客戶購買',self:'工作室自用',damage:'損耗報廢',gift:'贈送樣品',check:'盤點'};

  if(r.cashFlow.length>0){

        🏦 現金流（${r.cashFlow.length} 筆）

  return html;

  toast('✅ 收入已記帳');closeMod();
};
window.updSale=async(id)=>{
  const date=$('m_s0')?.value,amount=parseFloat($('m_s3')?.value)||0;
  if(!date||!amount){alert('請填日期和金額');return;}
  const d=new Date(date);
  const old=(S.data.sales||[]).find(x=>x.id===id)||{};
  const face=parseFloat($('m_sFace')?.value)||amount;
  const commPercent=parseFloat($('m_sComm')?.value);
  const commissionRate=isNaN(commPercent)?DEFAULT_COMMISSION_RATE:commPercent/100;
  const commissionBase=$('m_sCombase')?.value||'face';
  const updated={
    ...old,
    date,
    type:$('m_s1')?.value,
    item:$('m_s2')?.value||'',
    subNote:$('m_sNote')?.value||'',
    amount,
    payMethod:$('m_s4')?.value,
    staff:$('m_s5')?.value,
    customer:$('m_s6')?.value||'',
    commissionRate,
    commissionBase,
    month:d.getMonth()+1,year:d.getFullYear()
  };
  // 只有當原價面額 > 認列營收時才存（代表有公司吸收折讓）
  if(face>amount){
    updated.depositFaceAmount=face;
  }else if(face===amount){
    // 相等代表沒有折讓，移除欄位
    delete updated.depositFaceAmount;
  }else{
    updated.depositFaceAmount=face;
  }
  // 立即本地更新（避免 Firebase 同步延遲導致畫面顯示舊資料）
  const idx=(S.data.sales||[]).findIndex(x=>x.id===id);
  if(idx>=0){S.data.sales[idx]={...updated,id};}
  await setSub('sales',id,updated);
  toast('✅ 已更新');closeMod();
  render();
};
window.delSale=async id=>{
  if(!confirm('確認刪除？'))return;
  // 立即本地移除（避免延遲）
  S.data.sales=(S.data.sales||[]).filter(x=>x.id!==id);
  await delSub('sales',id);
  toast('已刪除');
  render();
};

        return`<div style="display:flex;gap:6px;align-items:center;background:var(--card);padding:8px;border-radius:6px;${isService?'border-left:3px solid var(--rose);':''}">

    }).join('');

window.saveCartOrder=async(continueInput)=>{
  try{
    if(S.cart.length===0){alert('購物車是空的，請先加入商品');return;}
    // 過濾掉空商品
    const items=S.cart.filter(it=>it.name&&toN(it.qty)>0);
    if(items.length===0){alert('購物車是空的，或商品都還沒填名稱');return;}
    const date=$('m_pd0')?.value||today();
    const totalAmount=items.reduce((s,it)=>s+toN(it.price)*toN(it.qty),0);
    let customer=$('m_pd5')?.value?.trim()||'';
    const payMethod=$('m_pd7')?.value||'';
    let depositOwner='';
    let depositFaceAmount=0;
    let realRevenueRate=1;
    if(payMethod==='儲值扣款'){
      if(!customer){alert('儲值扣款必須選擇客戶');return;}
      depositOwner=$('m_pd_owner')?.value||customer;
      const bal=getCustomerBalance(depositOwner);
      depositFaceAmount=totalAmount;
      if(bal<depositFaceAmount){
        const ownerLabel=depositOwner===customer?'此客戶':`${depositOwner}（共用儲值）`;
        if(!confirm(`⚠️ ${ownerLabel} 儲值餘額不足！\n餘額 $${fmt(bal)}　扣款 $${fmt(depositFaceAmount)}\n\n是否仍要記錄？`))return;
      }
      // 🎯 限定服務檢查：檢查購物車內所有服務項目是否都能用此儲值扣款
      const restrictedIssues=[];
      let totalAvailable=0;
      for(const it of items){
        if(it.type!=='service')continue;// 產品不受限定服務限制
        const check=checkDepositUsableForService(depositOwner,it.name);
        if(!check.ok){
          restrictedIssues.push(`• 「${it.name}」：${check.message}`);
        }
      }
      if(restrictedIssues.length>0){
        const msg=`⚠️ 此客戶的儲值有「服務限定」設定，以下服務無法用儲值扣款：\n\n${restrictedIssues.join('\n\n')}\n\n是否仍要強制扣款？\n（建議：取消後改用其他付款方式，或為這些服務另外建立通用儲值）`;
        if(!confirm(msg))return;
      }
      realRevenueRate=getCustomerDiscountRate(depositOwner);
    }
    const d=new Date(date);
    const note=$('m_pdNote')?.value||'';
    const staff=$('m_pd6')?.value||'';
    // 老師抽成設定
    const commPercent=parseFloat($('m_pd_comm')?.value);
    const commissionRate=isNaN(commPercent)?DEFAULT_COMMISSION_RATE:commPercent/100;
    const commissionBase=$('m_pd_combase')?.value||'face';
    // 為每件商品建立一筆 sales 記錄
    for(const it of items){
      const subtotal=toN(it.price)*toN(it.qty);
      const realRev=Math.round(subtotal*realRevenueRate);
      // 自動判斷服務/產品類型（從報價單帶入的有 type:'service'）
      const itemType=it.type==='service'?'service':'product';
      const saleData={
        date,type:itemType,item:it.name,
        subNote:note,
        amount:realRev,
        qty:it.qty,unitPrice:it.price,
        payMethod,staff,customer,
        commissionRate,commissionBase,
        month:d.getMonth()+1,year:d.getFullYear()
      };
      if(payMethod==='儲值扣款'&&depositOwner){
        saleData.depositOwner=depositOwner;
        saleData.depositFaceAmount=subtotal;
      }
      await addSub('sales',saleData);
      // 扣庫存（只有正式產品）
      if(!it.custom&&it.id){
        const inv=getInv(it.id);
        const newQty=Math.max(0,toN(inv.qty)-toN(it.qty));
        const newInv=[...S.data.inventory.filter(i=>i.productId!==it.id),{...inv,productId:it.id,qty:newQty,minQty:inv.minQty||1}];
        await saveMain({inventory:newInv});
        // 自動建立出貨紀錄
        try{
          await addSub('stockOuts',{
            date,type:'sale',
            productId:it.id,
            productName:it.name,
            qty:toN(it.qty),
            unitCost:getAvgCost(it.id),
            totalCost:getStockOutCost(it.id,it.qty),
            customer,
            note:'銷售開單',
            month:d.getMonth()+1,year:d.getFullYear()
          });
        }catch(e){console.warn('建立 stockOut 失敗',e);}
      }
    }
    // 自動建檔
    if(customer&&!(S.data.customers||[]).find(c=>(c.name||'').trim()===customer)){
      const customers=[...(S.data.customers||[]),{id:uid(),name:customer,phone:'',createdAt:today()}];
      await saveMain({customers});
    }
    const ownerHint=depositOwner&&depositOwner!==customer?`（從 ${depositOwner} 共用儲值扣款）`:'';
    const realTotal=Math.round(totalAmount*realRevenueRate);
    const discountHint=payMethod==='儲值扣款'&&realTotal!==totalAmount?`扣儲值 $${fmt(totalAmount)} → 認列營收 $${fmt(realTotal)}`:`$${fmt(realTotal)}`;

    toast(`✅ ${items.length} 件商品結帳完成 ${discountHint}${ownerHint}`);
    // 清空購物車
    S.cart=[];
    if(continueInput){
      ['m_pdNote'].forEach(id=>{if($(id))$(id).value='';});
      if($('m_pd5'))$('m_pd5').value='';

      if($('m_pd_hint'))$('m_pd_hint').innerHTML='';
      if($('m_pd_owner_wrap'))$('m_pd_owner_wrap').style.display='none';
      renderCart();
    }else{
      const c=$('pg-content');if(c)c.innerHTML=renderPage();
    }
  }catch(err){
    console.error('saveCartOrder 失敗:',err);
    alert('結帳失敗：'+(err.message||err));
  }
};


window.saveOrder=async(type,continueInput)=>{
  try{
    if(type==='service'){
      const date=$('m_od0')?.value;
      const inputAmount=parseFloat($('m_od3')?.value)||0;  // 使用者輸入金額（=儲值池要扣的面額）
      if(!date){alert('請選擇日期');return;}
      if(inputAmount<0){alert('金額不能是負數');return;}
      // 金額 0 ＝ 免費／贈送（例：贈送補色）：允許開單，會進服務歷史、觸發關懷提醒，但不計營收也不抽成。
      // 防呆：金額 0 時付款方式須為「免費/贈送」，避免忘記收費而誤開 $0 單。

// ── Purchase 單筆 ──
window.savePurchase=async()=>{
  const date=$('m_p0')?.value;
  const pickedPid=$('m_pPick')?.value||'';
  const productName=$('m_p2')?.value?.trim();
  const category=$('m_pCat')?.value;
  const qty=parseFloat($('m_p3')?.value)||0;
  const unitCost=parseFloat($('m_p4')?.value)||0;
  let totalCost=parseFloat($('m_p5')?.value)||qty*unitCost;
  const sellPrice=parseFloat($('m_pPrice')?.value)||0;
  const series=$('m_pSeries')?.value?.trim()||'';
  if(!date||!qty){alert('請填日期和數量');return;}
  if(!pickedPid&&!productName){alert('請選擇現有產品或填寫產品名稱');return;}
  const supSel=$('m_p6')?.value;
  const supplier=supSel==='其他手動輸入廠商'?($('m_p6c')?.value||'').trim():supSel;
  // 優先：用 productId 直接找產品（避免名稱比對問題）
  let prod=null;
  if(pickedPid){
    prod=(S.data.products||[]).find(p=>p.id===pickedPid);
  }
  // 次選：用名稱+類別比對（兩邊 trim 並去除空白避免重複建立）
  if(!prod&&productName){
    const tName=productName.trim().replace(/[\u3000\s]+/g,'');
    prod=(S.data.products||[]).find(p=>(p.name||'').trim().replace(/[\u3000\s]+/g,'')===tName&&p.category===category);
  }
  let pid;
  if(!prod){
    pid=uid();
    const newProd={id:pid,name:productName.trim(),category,price:sellPrice,cost:unitCost,supplier,series};
    const prods=[...(S.data.products||[]),newProd];
    // 新產品：avgCost = 進貨單價，最低庫存預設 1
    const newInv=[...S.data.inventory,{productId:pid,qty,minQty:1,avgCost:unitCost,totalPurchaseCost:totalCost}];
    await saveMain({products:prods,inventory:newInv});
  }else{
    pid=prod.id;
    const inv=getInv(pid);
    const oldQty=toN(inv.qty);
    const oldAvg=toN(inv.avgCost)||toN(prod.cost)||0;
    // 加權平均：新均價 = (舊量×舊均價 + 新量×新單價) / 總量
    const newAvg=calculateNewAvgCost(oldQty,oldAvg,qty,unitCost);
    const newQty=oldQty+qty;
    const newTotalCost=toN(inv.totalPurchaseCost||0)+totalCost;
    const newInv=[...S.data.inventory.filter(i=>i.productId!==pid),
                  {productId:pid,qty:newQty,minQty:inv.minQty||1,avgCost:newAvg,totalPurchaseCost:newTotalCost}];
    // ⚠️ 不覆寫 prod.cost（那是「標準成本／合約價」，只有你手動改才會變）
    // 實際進貨成本存在 inventory.avgCost，兩者分開
    const updProd={...prod};
    if(!toN(prod.cost))updProd.cost=unitCost;  // 只有從沒填過標準成本時，才用首次進貨價當預設
    if(supplier&&!prod.supplier)updProd.supplier=supplier;
    if(series&&!prod.series)updProd.series=series;
    if(sellPrice>0&&!prod.price)updProd.price=sellPrice;
    const prods=(S.data.products||[]).map(p=>p.id===pid?updProd:p);
    await saveMain({inventory:newInv,products:prods});
  }
  const d=new Date(date);
  const recordName=prod?prod.name:productName.trim();
  // 付款狀態
  const paidStatus=document.querySelector('input[name="m_pPaid"]:checked')?.value||'paid';
  const payMethod=$('m_pPayMethod')?.value||'轉帳';
  const paid=paidStatus==='paid';
  // 建立進貨紀錄
  const purchaseId=uid();
  const purchaseData={
    id:purchaseId,
    date,productId:pid,productName:recordName,category,qty,unitCost,totalCost,
    supplier,series,
    paid,payMethod,paidDate:paid?date:null,
    note:$('m_p7')?.value||'',
    month:d.getMonth()+1,year:d.getFullYear()
  };
  await addSub('purchases',purchaseData);
  // 已付款 → 同步寫入支出 + 現金流
  if(paid){
    const expNote=`【進貨】${recordName} × ${qty}${supplier?'（'+supplier+'）':''}`;
    const expRef=await addSub('expenses',{
      date,category:'進貨成本',amount:totalCost,
      payMethod,note:expNote,
      fromPurchase:true,purchaseRefId:purchaseId,
      month:d.getMonth()+1,year:d.getFullYear()
    });
    await addSub('cashFlow',{
      date,amount:-totalCost,cat:'進貨支出',
      note:expNote+`（${payMethod}）`,
      fromPurchase:true,purchaseRefId:purchaseId,
      month:d.getMonth()+1,year:d.getFullYear()
    });
  }
  const finalAvg=getAvgCost(pid);
  toast(`✅ 進貨完成 ${qty} 個，平均成本更新為 $${fmt(finalAvg)}${paid?'（已記支出）':'（未付款，待結算）'}`);
  closeMod();
};

// ── 進貨：標記為已付款/取消已付款（統一在第 8420 行附近的新版實作）──
// 舊版函式已移除，避免雙重定義造成混亂

window.delPurchase=async id=>{
  try{
    const p=(S.data.purchases||[]).find(x=>x.id===id);
    if(!p){alert('找不到該筆進貨紀錄');return;}
    if(!confirm(`確認刪除「${p.productName||'此筆進貨'}」？\n\n會還原 ${p.qty||0} 個庫存${p.paid?'，並刪除對應的支出/現金流紀錄':''}`))return;
    // 還原庫存（容錯：沒有 productId 也不會卡住）
    if(p.productId){
      try{
        const inv=getInv(p.productId);
        const newQty=Math.max(0,toN(inv.qty)-toN(p.qty));
        const newInv=[...(S.data.inventory||[]).filter(i=>i.productId!==p.productId),{...inv,productId:p.productId,qty:newQty}];
        await saveMain({inventory:newInv});
      }catch(invErr){
        console.error('還原庫存失敗（將繼續刪除進貨）:',invErr);
      }
    }
    // 已付款 → 刪除對應支出/現金流
    if(p.paid){
      const exps=(S.data.expenses||[]).filter(e=>e.fromPurchase&&e.purchaseRefId===id);
      const flows=(S.data.cashFlow||[]).filter(f=>f.fromPurchase&&f.purchaseRefId===id);
      for(const e of exps){try{await delSub('expenses',e.id);}catch(err){console.error(err);}}
      for(const f of flows){try{await delSub('cashFlow',f.id);}catch(err){console.error(err);}}
    }
    await delSub('purchases',id);
    toast('✅ 已刪除進貨紀錄並還原庫存');
    render();
  }catch(err){
    console.error('刪除進貨失敗:',err);
    alert('刪除失敗：'+(err.message||err));
  }
};

window.saveStockOut=async()=>{
  try{
    const date=$('m_so0')?.value;
    const type=$('m_so1')?.value;
    const pid=$('m_so2')?.value;
    const qty=parseFloat($('m_so3')?.value)||0;
    if(!date||!type||!pid||qty<=0){alert('請填日期、類型、產品和數量');return;}
    const prod=(S.data.products||[]).find(p=>p.id===pid);
    if(!prod){alert('找不到產品');return;}
    const inv=getInv(pid);
    if(toN(inv.qty)<qty){
      if(!confirm(`⚠️ 庫存不足！\n目前庫存 ${inv.qty}，要出貨 ${qty}\n是否仍要扣除（會變負數）？`))return;
    }
    const customer=$('m_so_cust')?.value||'';
    const note=$('m_so4')?.value||'';
    const d=new Date(date);
    const cost=getStockOutCost(pid,qty);
    // 記錄出貨（只記錄成本歸屬，不寫入支出記帳，避免和進貨付款重複）
    await addSub('stockOuts',{
      date,type,
      productId:pid,
      productName:prod.name,
      qty,unitCost:getAvgCost(pid),
      totalCost:cost,
      customer,note,
      month:d.getMonth()+1,year:d.getFullYear()
    });
    // 扣庫存
    const newInv=[...S.data.inventory.filter(i=>i.productId!==pid),
                  {...inv,productId:pid,qty:toN(inv.qty)-qty}];
    await saveMain({inventory:newInv});
    // ❗ 不再寫入支出記帳！
    // 原因：進貨付款時已經記過支出（現金流出），出貨只是消耗已購買的庫存。
    // 出貨耗用的目的是「追蹤庫存」和「計算服務成本」，不應該重複記為支出。
    const typeLabels={sale:'客戶購買',self:'工作室自用',damage:'損耗報廢',gift:'贈送樣品',check:'盤點'};
    toast(`✅ ${typeLabels[type]||'出貨'} ${qty} 個，成本 $${fmt(cost)}（已扣庫存，不重複記支出）`);
    closeMod();
    render();
  }catch(err){
    console.error('saveStockOut 失敗:',err);
    alert('出貨失敗：'+(err.message||err));
  }
};
window.delStockOut=async id=>{
  const o=(S.data.stockOuts||[]).find(x=>x.id===id);
  if(!o)return;
  if(!confirm(`確認刪除這筆出貨紀錄？\n會還原 ${o.qty} 個庫存`))return;

  toast('已刪除並還原庫存');
};

// ─── 簽名功能（Canvas）───────────────────
let _sigCanvas=null,_sigCtx=null,_sigDrawing=false,_sigHasContent=false;

function initSignatureCanvasInline(canvasId){
  const canvas=$(canvasId||'t_sign_canvas')||$('t_guest_sign_canvas');
  if(!canvas)return;
  const rect=canvas.getBoundingClientRect();
  if(rect.width===0){setTimeout(function(){initSignatureCanvasInline(canvasId);},120);return;}
  _sigCanvas=canvas;
  const dpr=window.devicePixelRatio||1;
  canvas.width=rect.width*dpr;
  canvas.height=rect.height*dpr;
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.lineWidth=2.5;
  ctx.lineCap='round';
  ctx.strokeStyle='#000';
  _sigCtx=ctx;
  _sigHasContent=false;
  const existing=S.treatment&&(S.treatment.signature||S.treatment.consentSignature||S.treatment._sigTemp);
  if(existing){
    const img=new Image();
    img.onload=function(){ctx.drawImage(img,0,0,rect.width,rect.height);_sigHasContent=true;};
    img.src=existing;
  }
  function getPos(e){
    const r=canvas.getBoundingClientRect();
    if(e.touches&&e.touches[0])return{x:e.touches[0].clientX-r.left,y:e.touches[0].clientY-r.top};
    return{x:e.clientX-r.left,y:e.clientY-r.top};
  }
  function start(e){e.preventDefault();_sigDrawing=true;const p=getPos(e);_sigCtx.beginPath();_sigCtx.moveTo(p.x,p.y);}
  function move(e){if(!_sigDrawing)return;e.preventDefault();const p=getPos(e);_sigCtx.lineTo(p.x,p.y);_sigCtx.stroke();_sigHasContent=true;}
  function end(e){if(e&&e.preventDefault)e.preventDefault();_sigDrawing=false;}
  canvas.onmousedown=start;canvas.onmousemove=move;canvas.onmouseup=end;canvas.onmouseleave=end;
  canvas.ontouchstart=start;canvas.ontouchmove=move;canvas.ontouchend=end;
}

window.initSignatureCanvas=(canvasId)=>{
  const canvas=$(canvasId||'m_sign_canvas');
  if(!canvas)return;
  _sigCanvas=canvas;
  // 設定高解析度
  const dpr=window.devicePixelRatio||1;
  const rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr;
  canvas.height=rect.height*dpr;
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.lineWidth=2.5;
  ctx.lineCap='round';
  ctx.strokeStyle='#000';
  _sigCtx=ctx;
  _sigHasContent=false;

  function getPos(e){
    const rect=canvas.getBoundingClientRect();
    if(e.touches&&e.touches[0]){
      return{x:e.touches[0].clientX-rect.left,y:e.touches[0].clientY-rect.top};
    }
    return{x:e.clientX-rect.left,y:e.clientY-rect.top};
  }

  function start(e){
    e.preventDefault();
    _sigDrawing=true;
    const p=getPos(e);
    _sigCtx.beginPath();
    _sigCtx.moveTo(p.x,p.y);
  }
  function move(e){
    if(!_sigDrawing)return;
    e.preventDefault();
    const p=getPos(e);
    _sigCtx.lineTo(p.x,p.y);
    _sigCtx.stroke();
    _sigHasContent=true;
  }
  function end(e){
    e.preventDefault();
    _sigDrawing=false;
  }

  canvas.addEventListener('mousedown',start);
  canvas.addEventListener('mousemove',move);
  canvas.addEventListener('mouseup',end);
  canvas.addEventListener('mouseleave',end);
  canvas.addEventListener('touchstart',start,{passive:false});
  canvas.addEventListener('touchmove',move,{passive:false});
  canvas.addEventListener('touchend',end,{passive:false});
};

window.clearSignature=()=>{
  if(!_sigCanvas||!_sigCtx)return;
  _sigCtx.clearRect(0,0,_sigCanvas.width,_sigCanvas.height);
  _sigHasContent=false;
  if(S.treatment&&_sigCanvas.id==='t_guest_sign_canvas'){delete S.treatment._sigTemp;if(S.treatment.mode==='pmu'&&S.treatment.consentSignature){S.treatment.consentSignature=null;S.treatment.consentSignedAt='';}}
};

function renderServiceCardItem(it,idx,allProds){

  const unitCost=prod?getUnitCost(prod.id):0;
  const cost=Math.round(unitCost*toN(it.qty));
  const capacityHint=prod&&toN(prod.capacity)>0?`（${prod.capacity}${prod.capacityUnit||''}）`:'';
  return`<div class="sc_item" data-idx="${idx}" style="display:flex;gap:8px;align-items:flex-end;margin-bottom:6px;background:var(--card);padding:8px;border-radius:6px;">

          const pCapUnit=p.capacityUnit||'';
          const lbl=pCap>0?`${p.name}（$${fmt(Math.round(pUnit*100)/100)}/${pCapUnit}）`:`${p.name}（成本 $${fmt(pUnit)}）`;

window.saveHealthQuestions=async()=>{
  try{
    const items=document.querySelectorAll('.hq_item');
    const qs=Array.from(items).map(el=>{
      const type=el.querySelector('.hqi_type')?.value||'text';
      const q={
        key:el.querySelector('.hqi_key')?.value||'q'+Date.now(),
        label:el.querySelector('.hqi_label')?.value?.trim()||'',
        type
      };
      if(type==='section'){
        // 章節只需要 label
        return q;
      }
      if(type==='declaration'){
        q.content=el.querySelector('.hqi_content')?.value||'';
        return q;
      }
      // 一般題目
      const ph=el.querySelector('.hqi_placeholder')?.value||'';
      if(ph)q.placeholder=ph;
      if(type==='radio'||type==='checkbox_group'){
        const opts=el.querySelector('.hqi_options')?.value||'';
        q.options=opts.split(',').map(s=>s.trim()).filter(Boolean);
      }
      return q;
    }).filter(q=>q.label);
    if(qs.length===0){alert('至少需要一題');return;}
    const settings={...(S.data.settings||{}),healthQuestions:qs};
    await saveMain({settings});
    toast('✅ 健康問卷已儲存');
    closeMod();
  }catch(err){console.error(err);alert('失敗：'+err.message);}
};

// 顯示健康問卷
window.showHealthForm=(id)=>{
  const r=(S.data.treatmentRecords||[]).find(x=>x.id===id);
  if(!r||!r.healthForm){alert('查無健康問卷資料');return;}
  // 用設定（或預設）對照題目來顯示完整 label
  const qs=S.data.settings?.healthQuestions||DEFAULT_HEALTH_QUESTIONS;
  const labelMap={};
  qs.forEach(q=>{if(q.key&&q.label)labelMap[q.key]=q.label;});
  // 依設定的順序顯示，方便閱讀
  let text='';
  let lastSection='';
  for(const q of qs){
    if(q.type==='section'){
      lastSection=q.label;
      text+=`\n━━━ ${q.label} ━━━\n`;
      continue;
    }
    if(q.type==='declaration')continue;
    const v=r.healthForm[q.key];
    if(v===undefined||v===null||v==='')continue;
    const display=Array.isArray(v)?v.join('、'):v;
    text+=`• ${q.label}：${display}\n`;
  }
  // 補上設定外的多餘 key
  const handledKeys=new Set(qs.filter(q=>q.key).map(q=>q.key));
  for(const [k,v] of Object.entries(r.healthForm)){
    if(handledKeys.has(k))continue;
    if(v===undefined||v===null||v==='')continue;
    const display=Array.isArray(v)?v.join('、'):v;
    text+=`• ${labelMap[k]||k}：${display}\n`;
  }
  alert('【首次建檔健康問卷】\n'+text+'\n填寫日期：'+(r.signedAt||r.date));
};

window.showServiceHealth=(id)=>{
  const r=(S.data.treatmentRecords||[]).find(x=>x.id===id);
  if(!r||!r.serviceHealthAnswers){alert('查無資料');return;}
  // key 格式：svc_分類_題目key
  const grouped={};
  for(const [k,v] of Object.entries(r.serviceHealthAnswers)){
    const m=k.match(/^svc_([^_]+)_(.+)$/);
    if(m){
      const cat=m[1],qkey=m[2];
      if(!grouped[cat])grouped[cat]={};
      grouped[cat][qkey]=v;
    }
  }
  // 用 settings 裡的 label 對照
  const svcQs=S.data.settings?.serviceHealthQuestions||{};
  let text='【各服務專屬健康確認】\n';
  for(const [cat,answers] of Object.entries(grouped)){
    text+=`\n🔹 ${cat}\n`;
    const qs=svcQs[cat]||[];
    for(const [qkey,ans] of Object.entries(answers)){
      const q=qs.find(qq=>qq.key===qkey);
      const label=q?q.label:qkey;
      const ansShow=typeof ans==='boolean'?(ans?'是':'否'):(ans||'（未填）');
      text+=`• ${label}：${ansShow}\n`;
    }
  }
  text+='\n填寫日期：'+(r.signedAt||r.date);
  alert(text);
};

// 包期合約：下載圖
window.downloadPassContractImage=()=>{
  const c=S.lastPassContract;
  if(!c)return;
  try{
    const lines=c.contractText.split('\n');
    const lineHeight=22,padding=40,headerH=70,sigH=160,width=720;
    const textH=lines.length*lineHeight;
    const height=headerH+textH+sigH+padding*2;
    const canvas=document.createElement('canvas');
    const scale=2;
    canvas.width=width*scale;canvas.height=height*scale;
    const ctx=canvas.getContext('2d');
    ctx.scale(scale,scale);
    ctx.fillStyle='#eafff5';ctx.fillRect(0,0,width,height);
    ctx.fillStyle='#10b981';ctx.fillRect(0,0,width,headerH);
    ctx.fillStyle='#fff';
    ctx.font='bold 22px "Noto Serif TC",serif';
    ctx.textAlign='center';
    ctx.fillText('沐蜜美學・除毛吃到飽合約',width/2,44);
    ctx.fillStyle='#333';ctx.font='14px sans-serif';ctx.textAlign='left';
    let y=headerH+padding;
    lines.forEach(line=>{ctx.fillText(line.substring(0,44),padding,y);y+=lineHeight;});
    // 簽名
    ctx.fillStyle='#666';ctx.font='13px sans-serif';
    ctx.fillText('甲方簽名：',padding,y+20);
    if(c.signature){
      const img=new Image();
      img.onload=()=>{
        ctx.drawImage(img,padding+80,y,180,60);
        ctx.fillStyle='#999';ctx.font='11px sans-serif';
        ctx.fillText(`簽署時間：${c.signedAt||''}`,padding,y+90);
        finishPassDownload(canvas,c);
      };
      img.src=c.signature;
    }else{finishPassDownload(canvas,c);}
  }catch(e){alert('產生合約圖失敗：'+e.message);}
};
function finishPassDownload(canvas,c){
  canvas.toBlob(blob=>{
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=`${c.customer}_除毛吃到飽合約.png`;a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  });
}

// 產生填好的合約文字
function buildPassContractText(t){
  const endDate=addMonthsToDate(t.startDate,t.months);
  const tmpl=S.data.settings?.passTerms||DEFAULT_PASS_TERMS;
  return tmpl
    .replace(/\$\{customer\}/g,t.customer||'')
    .replace(/\$\{phone\}/g,t.phone||'')
    .replace(/\$\{planName\}/g,t.planName||'')
    .replace(/\$\{originalPrice\}/g,fmt(t.originalPrice||0))
    .replace(/\$\{price\}/g,fmt(t.price||0))
    .replace(/\$\{singlePrice\}/g,fmt(t.singlePrice||0))
    .replace(/\$\{months\}/g,t.months||6)
    .replace(/\$\{scope\}/g,t.scope||'')
    .replace(/\$\{startDate\}/g,t.startDate||'')
    .replace(/\$\{endDate\}/g,endDate)
    .replace(/\$\{payMethod\}/g,t.payMethod||'');
}

window.submitPassSign=async()=>{
  const t=S.treatment;
  if(!t)return;
  if(!t.passAgreed&&!$('ps_agree')?.checked){alert('請客人勾選同意合約');return;}
  if(!_sigCanvas||!_sigHasContent){alert('請客人簽名');return;}
  const signature=_sigCanvas.toDataURL('image/png');
  const endDate=addMonthsToDate(t.startDate,t.months);
  const contractText=buildPassContractText(t);

  // 存包期合約
  const perUse=t.months>0?Math.round(t.price/t.months):t.price;  // 每次扣款價（總額÷次數）
  const contract={
    id:uid(),
    customer:t.customer,phone:t.phone,
    planName:t.planName,months:t.months,
    originalPrice:t.originalPrice,price:t.price,singlePrice:t.singlePrice,
    perUse,                          // 每次除毛扣多少
    usedCount:0,                     // 已使用次數
    startDate:t.startDate,endDate,
    payMethod:t.payMethod,
    contractText,signature,
    signedAt:nowLocal(),
    status:'active'
  };
  const passContracts=[...(S.data.passContracts||[]),contract];

  // 若客戶不存在則建檔
  let updates={passContracts};
  if(t.customer&&!(S.data.customers||[]).find(c=>normalizeName(c.name)===normalizeName(t.customer))){
    updates.customers=[...(S.data.customers||[]),{id:uid(),name:t.customer,phone:t.phone||'',createdAt:today()}];
  }
  await saveMain(updates);

  // 💰 入帳：$13,400 進儲值餘額 + 現金流（用 finalizeDeposit 確保兩邊都正確）
  try{
    await finalizeDeposit({
      customer:t.customer,
      date:t.startDate,
      amount:t.price,              // 面額＝實收（除毛包期沒有額外贈送金額）

window.submitDepositSign=async()=>{
  const t=S.treatment;
  if(!t)return;
  if(!t.depositAgreed&&!$('ds_agree')?.checked){alert('請客人勾選同意契約內容');return;}
  if(!_sigCanvas||!_sigHasContent){alert('請客人簽名');return;}
  const signature=_sigCanvas.toDataURL('image/png');
  // 產生契約快照
  const termsTemplate=S.data.settings?.depositTerms||DEFAULT_DEPOSIT_TERMS;
  const bonus=(t.amount||0)-(t.actualReceived||0);
  const discountRate=t.amount?Math.round(t.actualReceived/t.amount*100):0;
  const usagePeriodStr=S.data.settings?.depositUsagePeriod||'無使用期限';
  const transferableStr=S.data.settings?.depositTransferable===true?'得轉讓予他人使用':'限本人使用，不可轉讓予他人';
  const termsSnapshot=termsTemplate
    .replace(/\$\{actualReceived\}/g,fmt(t.actualReceived||0))
    .replace(/\$\{amount\}/g,fmt(t.amount||0))
    .replace(/\$\{bonus\}/g,fmt(bonus))
    .replace(/\$\{discountRate\}/g,(100-discountRate).toString())
    .replace(/<usage_period>/g,usagePeriodStr)
    .replace(/<transferable>/g,transferableStr);

  await finalizeDeposit({
    customer:t.customer,
    date:t.date,
    amount:t.amount,
    actualReceived:t.actualReceived,
    payMethod:t.payMethod,
    note:'',
    signature,
    termsSnapshot,
    signed:true
  });

  // 存契約供下載
  S.lastDepositContract={
    customer:t.customer,date:t.date,
    actualReceived:t.actualReceived,amount:t.amount,
    termsSnapshot,signature,signedAt:nowLocal()
  };
  t.depositSubmitted=true;
  render();
};

window.calcSoloPricing=()=>{
  const box=$('m_sp_result');
  if(!box||!S.modal)return;
  const items=S.modal.spItems||[];
  const ratio=parseFloat($('m_sp_ratio')?.value)||8;
  const fixed=parseFloat($('m_sp_fixed')?.value)||0;
  const mode=S.modal.spCostMode||'std';
  S.modal.spRatio=ratio;
  S.modal.spFixed=fixed;

  // 1. 材料成本（依模式選用標準或實際）
  const costFn=mode==='std'?getStdUnitCost:getUnitCost;
  const materialCost=items.reduce((s,it)=>{
    if(!it.productId)return s;
    return s+costFn(it.productId)*toN(it.qty);
  },0);
  const matCost=Math.round(materialCost*100)/100;

  // 另一種成本，用來對照採購效益
  const otherFn=mode==='std'?getUnitCost:getStdUnitCost;
  const otherCost=Math.round(items.reduce((s,it)=>{
    if(!it.productId)return s;
    return s+otherFn(it.productId)*toN(it.qty);
  },0)*100)/100;

  if(matCost<=0){
    box.innerHTML=`<div class="empty" style="padding:20px;"><p class="tm">選好材料、填上用量後，這裡會自動算出建議售價</p></div>`;
    return;
  }

  // 2. 反推建議售價（材料佔 ratio%）
  const rawPrice=matCost/(ratio/100);
  const suggested=Math.ceil(rawPrice/100)*100;  // 進位到百元
  const grossProfit=suggested-matCost;
  const grossMargin=Math.round(grossProfit/suggested*1000)/10;
  const netProfit=suggested-matCost-fixed;
  const netMargin=Math.round(netProfit/suggested*1000)/10;

  // 採購效益：同樣售價下，用實際成本能多賺多少
  const benefit=mode==='std'?Math.round((matCost-otherCost)*100)/100:0;
  const realMargin=mode==='std'&&otherCost>0?Math.round((suggested-otherCost)/suggested*1000)/10:0;

  // 3. 儲值方案下的實際毛利
  const plans=[
    {name:'入門',actual:10000,face:11000},
    {name:'主力',actual:20000,face:23000},
    {name:'尊榮',actual:38000,face:45000},
  ];
  const planRows=plans.map(pl=>{
    const rate=pl.actual/pl.face;
    const received=Math.round(suggested*rate);
    const gp=received-matCost;
    const gm=received>0?Math.round(gp/received*1000)/10:0;
    const discount=Math.round(rate*1000)/10;
    return{...pl,rate,received,gp,gm,discount};
  });

  // 4. 未來請員工的預覽（抽成 60%）
  const empComm=Math.round(suggested*0.6);
  const empProfit=suggested-matCost-empComm-fixed;
  const empMargin=Math.round(empProfit/suggested*1000)/10;

  box.innerHTML=`
    <!-- 建議售價 -->
    <div style="background:linear-gradient(135deg,var(--goldL),#fff);padding:16px;border-radius:10px;border-left:4px solid var(--gold);margin-bottom:12px;">
      <div style="font-size:13px;color:var(--mut);margin-bottom:4px;">
        ${mode==='std'?'📋 標準成本':'🛒 實際成本'} $${matCost.toFixed(2)}　佔售價 ${ratio}%
      </div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;">
        <span style="font-size:15px;font-weight:700;color:var(--goldDk);">💰 建議售價</span>
        <span style="font-size:32px;font-weight:900;color:var(--gold);">$${fmt(suggested)}</span>
      </div>
      <div class="tm" style="font-size:12px;margin-top:6px;">精算值 $${Math.round(rawPrice)}，已進位到百元好報價</div>
    </div>

    ${mode==='std'&&benefit>0?`<div style="background:var(--grnL);padding:12px;border-radius:8px;border-left:4px solid var(--grn);margin-bottom:12px;">
      <div style="font-weight:700;color:var(--grn);font-size:14px;">🎯 你的採購效益</div>
      <div style="font-size:13px;line-height:1.8;margin-top:4px;color:var(--grn);">
        用合約價算，這堂課材料成本 $${matCost.toFixed(0)}<br>
        但你挑特價實際只花 <b>$${otherCost.toFixed(0)}</b>，每堂多賺 <b style="font-size:16px;">$${benefit.toFixed(0)}</b><br>
        <span style="font-size:12px;">→ 實際毛利率其實是 <b>${realMargin}%</b>（而不是 ${grossMargin}%）</span>
      </div>
      <div class="tm" style="font-size:11px;margin-top:6px;color:var(--grn);">
        💡 定價照合約價算是對的，這樣哪天沒特價你也不會虧。省下的就是你的本事錢。
      </div>
    </div>`:''}

    <!-- 這個價格的體質 -->
    <div class="sg sg3" style="margin-bottom:12px;">
      <div class="sc"><div class="sl">材料成本</div><div class="sv sm" style="color:var(--red);">$${matCost.toFixed(0)}</div></div>
      <div class="sc"><div class="sl">毛利</div><div class="sv sm" style="color:var(--grn);">$${fmt(Math.round(grossProfit))}</div></div>
      <div class="sc"><div class="sl">毛利率</div><div class="sv sm" style="color:${grossMargin>=90?'var(--grn)':grossMargin>=80?'var(--gold)':'var(--red)'};">${grossMargin}%</div></div>
    </div>
    ${grossMargin>=90?
      `<div class="notice" style="background:var(--grnL);border-left-color:var(--grn);color:var(--grn);font-size:13px;">✅ 毛利率 ${grossMargin}%，達到你的 90% 目標，體質健康</div>`:
      `<div class="notice" style="background:#fef3c7;border-left-color:#d97706;color:#92400e;font-size:13px;">⚠️ 毛利率 ${grossMargin}% 未達 90%。想拉高：把「目標材料佔比」調低，或換更省成本的產品</div>`}

    ${(()=>{
      // 🚀 Cardone 10X 定價判讀：看「利潤額」不只看「利潤率」
      const gp=Math.round(grossProfit);
      let verdict,vColor,vBg,vIcon,advice;

window.calcPricerLive=()=>{
  collectPricerItems();
  const commPercent=parseFloat($('m_pc_comm')?.value)||60;
  const commRate=commPercent/100;
  const targetMargin=parseFloat($('m_pc_target')?.value)||30;
  const targetRate=targetMargin/100;
  const fixed=parseFloat($('m_pc_fixed')?.value)||0;
  // 材料成本：用單位成本 × 用量
  const materialCost=S.modal.calcItems.reduce((s,it)=>s+Math.round(getUnitCost(it.productId)*toN(it.qty)),0);
  // 倒推：售價 = (材料 + 攤分) / (1 - 抽成 - 期望淨利)
  const denominator=1-commRate-targetRate;
  const suggestedPrice=denominator>0?Math.ceil((materialCost+fixed)/denominator/100)*100:0;
  // 模擬抽成、淨利
  const commission=Math.round(suggestedPrice*commRate);
  const netProfit=suggestedPrice-materialCost-commission-fixed;
  const actualMargin=suggestedPrice>0?Math.round(netProfit/suggestedPrice*100):0;
  const wrap=$('m_pc_result');
  if(!wrap)return;
  if(materialCost===0){
    wrap.innerHTML='<div class="tm" style="text-align:center;padding:14px;">請先新增材料</div>';
    return;
  }
  if(denominator<=0){
    wrap.innerHTML=`<div style="color:var(--red);text-align:center;padding:14px;">⚠️ 抽成率 ${commPercent}% + 期望淨利率 ${targetMargin}% = ${commPercent+targetMargin}% 已超過 100%，無法達成。請降低抽成或淨利目標</div>`;
    return;
  }
  wrap.innerHTML=`
    <div style="font-weight:700;font-size:18px;color:var(--pur);margin-bottom:10px;">📐 建議售價：$${fmt(suggestedPrice)}</div>
    <div class="tw"><table style="font-size:13px;">
      <tbody>
        <tr><td>📦 材料成本</td><td class="tm">${S.modal.calcItems.length} 項</td><td class="an">$${fmt(materialCost)}</td></tr>
        <tr><td>👩‍💼 老師抽成（${commPercent}%）</td><td class="tm">$${fmt(suggestedPrice)} × ${commPercent}%</td><td class="an">$${fmt(commission)}</td></tr>
        <tr><td>🏪 固定攤分</td><td class="tm">每筆攤分</td><td class="an">$${fmt(fixed)}</td></tr>
        <tr style="background:var(--bg2);font-weight:700;"><td>總成本</td><td></td><td class="an">$${fmt(materialCost+commission+fixed)}</td></tr>
        <tr style="background:var(--grnL);font-weight:700;"><td style="color:var(--grn);">公司淨利</td><td class="tm">${actualMargin}% 淨利率</td><td style="color:var(--grn);">$${fmt(netProfit)}</td></tr>
      </tbody>
    </table></div>
    <div class="tm" style="margin-top:8px;font-size:12px;">
      💡 公式：建議售價 = (材料 $${fmt(materialCost)} + 攤分 $${fmt(fixed)}) ÷ (1 - 抽成 ${commPercent}% - 淨利 ${targetMargin}%)
    </div>
  `;
};

// 🧹 清理重複的進貨紀錄（同一筆進貨變成兩行：一未付款一已付款）
window.cleanDuplicatePurchase=async()=>{
  const purchases=S.data.purchases||[];
  // 找重複：同產品+同日期+同金額+同數量，視為同一筆
  const seen={};
  const dups=[];
  purchases.forEach(p=>{
    const key=`${p.productName}|${p.date}|${p.totalCost}|${p.qty}`;
    if(!seen[key]){
      seen[key]=[p];
    }else{
      seen[key].push(p);
    }
  });
  // 每組若有多筆，保留「已付款」那筆（或第一筆），刪其餘
  Object.values(seen).forEach(list=>{
    if(list.length>1){
      // 優先保留已付款的
      const keep=list.find(x=>x.paid||x.paidToExpense)||list[0];
      list.forEach(x=>{if(x.id!==keep.id)dups.push(x);});
    }
  });

  if(dups.length===0){
    alert('✅ 沒有發現重複的進貨紀錄。');
    return;
  }
  const preview=dups.slice(0,10).map(p=>`• ${p.date} ${p.productName} $${fmt(p.totalCost)}（${p.paid?'已付款':'未付款'}）`).join('\n');
  if(!confirm(`發現 ${dups.length} 筆重複進貨（同產品/日期/金額）：\n\n${preview}${dups.length>10?'\n...':''}\n\n每組保留一筆（優先保留已付款的），刪除其餘重複。\n確定清理嗎？`))return;

  setSyncing&&setSyncing('syncing');
  let ok=0;
  for(const p of dups){
    try{
      // 刪重複進貨時，也刪掉它可能產生的重複支出/現金流
      const exps=(S.data.expenses||[]).filter(e=>e.fromPurchase&&(e.purchaseRefId===p.id||e.fromPurchaseId===p.id));
      const flows=(S.data.cashFlow||[]).filter(f=>f.fromPurchase&&(f.purchaseRefId===p.id||f.fromPurchaseId===p.id));
      for(const e of exps){try{await delSub('expenses',e.id);}catch(err){}}
      for(const f of flows){try{await delSub('cashFlow',f.id);}catch(err){}}
      await delSub('purchases',p.id);
      ok++;
    }catch(err){console.error(err);}
  }
  setSyncing&&setSyncing('synced');
  alert(`✅ 已清理 ${ok} 筆重複進貨，以及它們產生的重複支出/現金流。\n\n建議接著點「💰 重算加權平均成本」讓成本回正。`);
  render();
};

// 🧹 清理重複的進貨支出（同一筆進貨被記多次支出/現金流）
window.cleanDuplicatePurchaseExpense=async()=>{
  const exps=(S.data.expenses||[]).filter(e=>e.fromPurchase);
  const flows=(S.data.cashFlow||[]).filter(f=>f.fromPurchase);
  // 依 purchaseRefId 分組，找出同一筆進貨被記多次的
  const groupBy=(arr)=>{
    const g={};
    arr.forEach(x=>{
      const rid=x.purchaseRefId||x.fromPurchaseId||'no_ref';
      if(!g[rid])g[rid]=[];
      g[rid].push(x);
    });
    return g;
  };
  const expG=groupBy(exps),flowG=groupBy(flows);
  const dupExps=[],dupFlows=[];
  // 每組保留第一筆，其餘標為重複
  Object.values(expG).forEach(list=>{if(list.length>1)dupExps.push(...list.slice(1));});
  Object.values(flowG).forEach(list=>{if(list.length>1)dupFlows.push(...list.slice(1));});

  if(dupExps.length===0&&dupFlows.length===0){
    alert('✅ 沒有發現重複的進貨支出，帳目是乾淨的。');
    return;
  }
  const dupAmount=dupExps.reduce((s,e)=>s+toN(e.amount),0);
  const preview=dupExps.slice(0,8).map(e=>`• ${e.date} ${(e.note||'').substring(0,20)} $${fmt(e.amount)}`).join('\n');
  if(!confirm(`發現重複記帳：\n\n支出重複 ${dupExps.length} 筆（共 $${fmt(dupAmount)}）\n現金流重複 ${dupFlows.length} 筆\n\n${preview}${dupExps.length>8?'\n...':''}\n\n每組保留一筆、刪掉多餘的。確定清理嗎？\n（不會動到進貨紀錄本身）`))return;

  setSyncing&&setSyncing('syncing');
  let ok=0;
  for(const e of dupExps){try{await delSub('expenses',e.id);ok++;}catch(err){console.error(err);}}
  for(const f of dupFlows){try{await delSub('cashFlow',f.id);}catch(err){console.error(err);}}
  setSyncing&&setSyncing('synced');
  alert(`✅ 清理完成，刪除了 ${dupExps.length} 筆重複支出、${dupFlows.length} 筆重複現金流。\n\n進貨成本統計現在應該正確了。`);
  render();
};

window.payPurchase=async(id)=>{
  const p=(S.data.purchases||[]).find(x=>x.id===id);
  if(!p){toast('找不到進貨記錄');return;}
  if(p.paidToExpense||p.paid){toast('已付款過');return;}
  // 🛡️ 防重複：檢查這筆進貨是否已經有對應的支出紀錄（避免重複記帳）
  const existingExp=(S.data.expenses||[]).find(e=>e.fromPurchase&&(e.purchaseRefId===id||e.fromPurchaseId===id));
  if(existingExp){
    // 已經有支出紀錄了，只補標記進貨為已付款，不再新增

// 單筆進貨：選擇現有產品 → 自動填入名稱/類別/廠商/售價
// ═══ 產品名稱：打關鍵字自動跳出現有產品（進貨單筆／批次共用）═══
function prodAcNorm(s){return String(s||'').toLowerCase().replace(/[\s　·・\-_()（）]/g,'');}
function prodAcMatches(q){
  const prods=(S.data.products||[]);
  const qn=prodAcNorm(q);
  if(!qn)return prods.slice().sort((a,b)=>(a.name||'').localeCompare(b.name||'')).slice(0,60);
  const scored=[];
  prods.forEach(p=>{
    const name=prodAcNorm(p.name),other=prodAcNorm([p.series,p.supplier,p.category,(p.ingredients||[]).join('')].join(''));
    let s=-1;
    if(name.startsWith(qn))s=3;else if(name.includes(qn))s=2;else if(other.includes(qn))s=1;
    else{let i=0;for(const ch of qn){i=name.indexOf(ch,i);if(i<0)break;i++;}if(i>0)s=0.5;} // 跳字也能找到，例如「玻精」→ 玻尿酸精華
    if(s>=0)scored.push({p,s});
  });
  return scored.sort((a,b)=>b.s-a.s||(a.p.name||'').localeCompare(b.p.name||'')).slice(0,12).map(x=>x.p);
}
function prodAcHi(name,q){
  const n=String(name||''),qq=String(q||'').trim();
  if(!qq)return n.replace(/</g,'&lt;');
  const i=n.toLowerCase().indexOf(qq.toLowerCase());
  if(i<0)return n.replace(/</g,'&lt;');
  return n.slice(0,i).replace(/</g,'&lt;')+'<b style="background:#fde047;">'+n.slice(i,i+qq.length).replace(/</g,'&lt;')+'</b>'+n.slice(i+qq.length).replace(/</g,'&lt;');
}
function prodAcBox(inp){
  let box=inp.parentNode.querySelector('.prodac-box');
  if(!box){box=document.createElement('div');box.className='prodac-box';box.style.cssText='position:absolute;left:0;right:0;top:100%;z-index:60;background:#fff;border:1px solid #e5e7eb;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:280px;overflow-y:auto;margin-top:2px;';inp.parentNode.style.position='relative';inp.parentNode.appendChild(box);}
  return box;
}

function prodAcSelect(inp,mode){return mode==='single'?document.getElementById('m_pPick'):(inp.closest('.batch-row')||document).querySelector('.bp_prod');}

window.prodAcPick=function(inp,mode,i,noFocus){

  if(!noFocus){const next=mode==='single'?document.getElementById('m_p3'):(inp.closest('.batch-row')||document).querySelector('.bp_qty');if(next)setTimeout(()=>next.focus(),30);}

window.prodAcKey=function(e,inp,mode){
  // 中文輸入法（注音、拼音、手寫）選字時按的 Enter 不算數，避免誤選別的產品
  if(e.isComposing||e.keyCode===229||inp._composing)return;
  const box=inp.parentNode.querySelector('.prodac-box');
  if(!box||box.style.display==='none'||!inp._acList||!inp._acList.length)return;
  const items=box.querySelectorAll('[data-i]');
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    inp._acIdx=Math.max(0,Math.min(items.length-1,(inp._acIdx??-1)+(e.key==='ArrowDown'?1:-1)));
    items.forEach((el,i)=>el.style.background=i===inp._acIdx?'#ede9fe':'');
    items[inp._acIdx]&&items[inp._acIdx].scrollIntoView({block:'nearest'});
  }else if(e.key==='Enter'){
    e.preventDefault();
    // 只有用方向鍵明確選到某一項才算選取；否則只收起清單、保留你打的字
    if(inp._acIdx>=0)prodAcPick(inp,mode,inp._acIdx);
    else{box.style.display='none';prodAcBadge(inp,mode);}
  }else if(e.key==='Escape'){box.style.display='none';}
};

// 整組進貨：自動計算各品項成本
window.recalcGroupCosts=()=>{
  if(!S.modal||S.modal.t!=='batchPurchase'||!S.modal.groupMode)return;
  const groupTotal=parseFloat($('m_bpGroupTotal')?.value)||0;
  const splitMode=$('m_bpSplitMode')?.value||'price';
  const rowEls=document.querySelectorAll('.batch-row');
  // 收集每列的數量、售價
  const items=Array.from(rowEls).map(el=>({
    qty:parseFloat(el.querySelector('.bp_qty')?.value)||0,
    price:parseFloat(el.querySelector('.bp_price')?.value)||0,
    el
  }));
  let hint='';
  if(groupTotal<=0){
    items.forEach(it=>{if(it.el.querySelector('.bp_unit'))it.el.querySelector('.bp_unit').value='';});
    hint='請先填整組總成本';
  }else if(splitMode==='even'){
    // 平均：總成本 / 總件數（含數量）
    const totalQty=items.reduce((s,it)=>s+it.qty,0);
    if(totalQty<=0){
      items.forEach(it=>{if(it.el.querySelector('.bp_unit'))it.el.querySelector('.bp_unit').value='';});
      hint='請先填數量';
    }else{
      const avgUnit=Math.round(groupTotal/totalQty*100)/100;
      items.forEach(it=>{if(it.el.querySelector('.bp_unit'))it.el.querySelector('.bp_unit').value=avgUnit;});
      const totalSale=items.reduce((s,it)=>s+it.qty*it.price,0);
      const margin=totalSale>0?Math.round((totalSale-groupTotal)/totalSale*100):0;
      hint=`平均單價 $${fmt(avgUnit)}/件 ｜ 預計售價總和 $${fmt(totalSale)} ｜ 整組毛利率 ${margin}%`;
    }
  }else{
    // 按售價比例
    const totalSale=items.reduce((s,it)=>s+it.qty*it.price,0);
    if(totalSale<=0){
      items.forEach(it=>{if(it.el.querySelector('.bp_unit'))it.el.querySelector('.bp_unit').value='';});
      hint='請先填各品項的售價';
    }else{
      let allocated=0;
      items.forEach((it,i)=>{
        if(it.qty<=0||it.price<=0){
          if(it.el.querySelector('.bp_unit'))it.el.querySelector('.bp_unit').value='';
          return;
        }
        const itemSaleTotal=it.qty*it.price;
        // 該品項分到的成本比例
        const allocatedCost=i===items.length-1?groupTotal-allocated:Math.round(itemSaleTotal/totalSale*groupTotal);
        const unitCost=Math.round(allocatedCost/it.qty*100)/100;
        if(it.el.querySelector('.bp_unit'))it.el.querySelector('.bp_unit').value=unitCost;
        allocated+=allocatedCost;
      });
      const margin=Math.round((totalSale-groupTotal)/totalSale*100);
      hint=`售價總和 $${fmt(totalSale)} ｜ 整組成本 $${fmt(groupTotal)} ｜ 整組毛利率 <b>${margin}%</b>`;
    }
  }
  if($('m_bpGroupHint'))$('m_bpGroupHint').innerHTML=hint;
};

window.saveBatchPurchase=async()=>{
  const date=$('m_bpDate')?.value||today();
  const supSel=$('m_bpSup')?.value;
  const supplier=supSel==='其他手動輸入廠商'?($('m_bpSupC')?.value||'').trim():supSel;
  collectBatchRows();
  const validRows=S.modal.rows.filter(r=>(r.productId||r.name)&&toN(r.qty)>0);
  if(validRows.length===0){alert('請至少填寫一筆有效資料（選擇現有產品或填寫名稱+數量）');return;}
  const isGroup=S.modal.groupMode||false;
  const groupTotal=parseFloat($('m_bpGroupTotal')?.value)||0;
  if(isGroup&&groupTotal<=0){alert('請填整組總成本');return;}
  // 整批付款狀態
  const paidStatus=document.querySelector('input[name="m_bpPaid"]:checked')?.value||'paid';
  const payMethod=$('m_bpPayMethod')?.value||'轉帳';
  const paid=paidStatus==='paid';
  const d=new Date(date);
  let count=0;
  let totalAllCost=0;
  let groupNote=isGroup?`整組 $${fmt(groupTotal)}`:'';
  for(const r of validRows){
    const qty=toN(r.qty);
    const unitCost=toN(r.unit);
    const sellPrice=toN(r.price);
    const totalCost=qty*unitCost;
    totalAllCost+=totalCost;
    // 優先：用 productId 直接找產品（避免名稱比對問題）
    let prod=null;
    if(r.productId){
      prod=(S.data.products||[]).find(p=>p.id===r.productId);
    }
    // 次選：用名稱+類別比對（兩邊 trim 並去除空白避免重複建立）
    if(!prod&&r.name){
      const tName=r.name.trim().replace(/[\u3000\s]+/g,'');
      prod=(S.data.products||[]).find(p=>(p.name||'').trim().replace(/[\u3000\s]+/g,'')===tName&&p.category===r.cat);
    }
    let pid;
    if(!prod){
      pid=uid();
      const newProd={id:pid,name:r.name.trim(),category:r.cat,price:sellPrice,cost:unitCost,supplier};
      S.data.products=[...(S.data.products||[]),newProd];
      S.data.inventory=[...S.data.inventory,{productId:pid,qty,minQty:1,avgCost:unitCost,totalPurchaseCost:totalCost}];
    }else{
      pid=prod.id;
      const inv=getInv(pid);
      const oldQty=toN(inv.qty);
      const oldAvg=toN(inv.avgCost)||toN(prod.cost)||0;
      const newAvg=calculateNewAvgCost(oldQty,oldAvg,qty,unitCost);
      const newTotalCost=toN(inv.totalPurchaseCost||0)+totalCost;
      S.data.inventory=[...S.data.inventory.filter(i=>i.productId!==pid),
                       {productId:pid,qty:oldQty+qty,minQty:inv.minQty||1,avgCost:newAvg,totalPurchaseCost:newTotalCost}];
      S.data.products=(S.data.products||[]).map(p=>p.id===pid?{
        ...p,
        cost:toN(p.cost)>0?p.cost:unitCost,  // 標準成本鎖定，只有從沒填過才給預設
        supplier:p.supplier||supplier,
        price:p.price||sellPrice
      }:p);
    }
    const purchaseId=uid();
    // 名稱優先順序：選了現有產品時 → 用該產品名稱（避免下拉顯示 vs 儲存不一致）
    //              沒選現有產品時 → 用輸入框名稱（新建產品）
    const finalProductName=prod?(prod.name||''):(r.name?r.name.trim():'');
    const purchaseData={
      id:purchaseId,
